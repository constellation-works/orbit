# Default worktree garbage-collection routine [ORB-10374].
# Seeded disabled: operators must review and opt in before unattended deletion.
schemaVersion: 1
name: worktree-gc-orbit
description: >
  Hourly reclamation of worktrees whose associated task has settled to
  rejected, archived, or done.
enabled: true
hosts:
  - dk-server-1
trigger:
  cron: "*/35 * * * *"
  missed_run: skip
target: job:worktree_gc_pipeline
policy:
  timeout_minutes: 30
  overlap: forbid
