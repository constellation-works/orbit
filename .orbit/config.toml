[execution.env]
pass = [
    "HOME",
    "PATH",
    "CODEX_HOME",
    "TMPDIR",
    "USER",
    "__CF_USER_TEXT_ENCODING",
]

[execution.codex]
sandbox = "danger-full-access"

[workflow]
auto_ship = true
base_branch = "agent-main"
default_crew = "sol"
system_crew = "luna"

[crews.opus]
backend = "cli"
model = "claude-opus-5"
provider = "claude"

[crews.sonnet]
backend = "cli"
model = "claude-sonnet-5"
provider = "claude"

[crews.fable]
backend = "cli"
model = "claude-fable-5-1"
provider = "claude"

[crews.astra]
backend = "cli"
model = "gpt-6-astra"
provider = "codex"
effort = "medium"

[crews.sol]
backend = "cli"
model = "gpt-5.6-sol"
provider = "codex"

[crews.terra]
backend = "cli"
model = "gpt-5.6-terra"
provider = "codex"

[crews.luna]
backend = "cli"
model = "gpt-5.6-luna"
provider = "codex"
effort = "high"

[crews.grok]
backend = "cli"
model = "grok-4.6"
provider = "grok"

[crews.gemini-flash]
backend = "cli"
model = "gemini-3.8-flash-high"
provider = "antigravity"


[pr]
task_url_template = "https://orbit-cli.com/tasks/{task_id}"

[docs]
roots = ["docs/"]

[operation]
review_crew = "opus"
review_policy = "after-landing"
