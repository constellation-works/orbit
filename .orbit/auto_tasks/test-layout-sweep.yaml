schemaVersion: 1
name: test-layout-sweep
description: Weekly scan for inline `#[cfg(test)] mod tests { … }` blocks and other test_layout.md violations; groups them and files migration tasks
enabled: true
schedule:
  cron: 0 7 * * 2
template:
  title: Test layout sweep — file migration tasks for inline test blocks
  description: |
    Find every violation of the sibling `tests/` convention
    (`docs/design-patterns/test_layout.md`) across `crates/*/src`, group the
    violations into sensibly sized work units, and file one Orbit task per
    unit. This task files work; it does not perform the migrations itself.
    It may legitimately finish with no new tasks when the tree is clean or
    every violation is already covered by an open task.

    ## Discovery

    Three violation shapes, all defined in `test_layout.md`:

    1. **Inline block** — a source file under `crates/*/src` containing
       `#[cfg(test)]` followed by `mod tests {` (a brace, not a semicolon).
       Detect with `grep -rnE '^\s*mod tests \{' crates/*/src --include='*.rs'`
       and confirm the preceding non-blank line is `#[cfg(test)]`.
    2. **Nested per-source `tests/`** — a directory `<file>/tests/` that is a
       child of the module `<file>.rs` declares, rather than a sibling of it.
    3. **`*_tests.rs` sibling files** — any `crates/*/src/**/*_tests.rs`.

    For each inline block record: path, crate, the number of lines from
    `mod tests {` to the file's closing brace, and the enclosing module
    directory (the future `<parent>/tests/` home). Exclude `.orbit/`,
    `target/`, and crate-root `tests/` directories (those are integration
    tests and are correct as-is).

    ## Duplicate safety

    Before filing anything, list open Orbit tasks tagged
    `test-layout-migration` (statuses proposed, backlog, in-progress, review,
    blocked) with `orbit tool run orbit.task.list`. A file that already
    appears in an open task's `context_files` or description is covered; skip
    it and cite the covering task in the execution summary. Never file a
    second task for a file that is already covered.

    ## Grouping

    Group only the uncovered violations:

    - **Egregious** — inline block ≥ 300 lines: one task per file.
    - **Moderate** — 100–299 lines: one task per crate, at most 5 files each.
    - **Small** — < 100 lines: one batch task per crate, at most 12 files
      each. Files under 20 lines are still in scope; the convention's "smoke
      test" tolerance is for reading, not for permanent exemption.
    - Nested per-source `tests/` directories and `*_tests.rs` files: one task
      per module directory, regardless of size, since they need the fold-in
      recipe rather than the inline recipe.

    ## Filing

    For each group, `orbit tool run orbit.task.add` with:

    - `type: refactor`, `complexity` low for small batches, medium for
      moderate groups and egregious files under 600 lines, hard above that.
    - `tags: [test-layout-migration, tech-debt]`.
    - `context_files`: every source file in the group (`file:` selectors).
      Do not list the not-yet-existing `tests/` files.
    - A description that names each file with its inline-block line count,
      points to the **Migration recipe** section of
      `docs/design-patterns/test_layout.md`, and states the two hard rules:
      tests must import through `pub`/`pub(crate)`/`pub(super)` seams via
      `super::super::<module>::<item>`, and any visibility widened purely for
      test access must carry a comment saying so. The nested per-source
      `<file>/tests/` layout is forbidden as a destination.
    - Acceptance criteria: no `mod tests {` remains in the listed files;
      each listed file has a sibling `<parent>/tests/<stem>.rs` declared from
      `<parent>/tests/mod.rs`; `<parent>` declares `#[cfg(test)] mod tests;`
      exactly once; test count for the crate is unchanged or higher (compare
      `cargo test -p <crate> -- --list | wc -l` before and after);
      `cargo test -p <crate>` passes; `make ci-fast` passes.

    Tasks land in `proposed`; do not approve them.

    ## Handoff

    Persist an `execution_summary` listing every violation found (path,
    shape, line count), which open task already covers it, and each task
    filed with its ID and member files. A clean tree or a fully covered tree
    is a successful no-diff outcome when the scan evidence is persisted.
  acceptance_criteria:
  - Every crates/*/src file with an inline `#[cfg(test)] mod tests { … }` block, nested per-source tests/ directory, or *_tests.rs sibling is enumerated with its line count and enclosing module.
  - Open tasks tagged test-layout-migration were listed first, and no filed task overlaps a file already covered by an open task.
  - "Uncovered violations are grouped per the egregious/moderate/small rules and one task is filed per group with type refactor, the test-layout-migration tag, file: context selectors, and the acceptance criteria specified above."
  - The persisted execution_summary maps every violation to either a covering open task or a newly filed task ID.
  - A clean or fully covered tree is a successful no-diff outcome when the scan evidence is persisted.
  task_type: chore
  tags:
  - test-layout-sweep
  - tech-debt
  - no-diff-expected
  priority: low
  complexity: low
  crew: luna
  status: backlog
dedupe: skip_if_open
