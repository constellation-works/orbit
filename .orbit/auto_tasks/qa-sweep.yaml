schemaVersion: 1
name: qa-sweep
description: Hands-on validation of recent workspace changes
enabled: true
schedule:
  every_minutes: 120
template:
  title: Perform QA validation
  description: |
    Identify recent changes in this workspace and validate them hands-on. Build
    and run the changed software, then exercise the affected CLI, API, and
    feature paths as a user would; do not treat re-running the existing test
    suite as sufficient validation.

    When those paths include `orbit init` or `orbit workspace init` and you
    are inside the Cowork/agent-executor sandbox, `/` and `~/.orbit` are
    mounted read-only. Do not init against the real home Orbit root — that
    fails with EROFS. Put the Orbit root and any scratch git checkouts
    under `/tmp` and use:

        orbit --root /tmp/<scratch> init --non-interactive --host-name <name> --task-prefix <XXXX>
        orbit --root /tmp/<scratch> workspace init

    Root `init` hangs on stdin without `--non-interactive`. `workspace init`
    does not need that flag and does not prompt non-interactively in
    practice. Keep disposable Orbit roots and scratch checkouts under `/tmp`,
    but build in the worktree's gitignored `target/` (or another disk-backed
    path), naming the 14 GiB tmpfs and the ~11-14 GiB workspace target directory
    as the reason: building in `/tmp` exhausts the tmpfs and breaks the harness.
    `cargo clean` — not `rm -rf` — is the cleanup and an emptied `target/` is
    the expected end state.

    Similarly, in agent-executor sandboxes and linked job-run worktrees, the
    repository's managed `.git` mount is read-only by design and must not be
    worked around by chmod or host-side gitdir writes. In a job-run worktree,
    `git rm`, `git mv` and `git add` fail because `.git/worktrees/<id>/` is
    read-only. A tracked deletion is made with `rm <path>`, which `git status --short`
    still reports as `D <path>`. Other commands that write to `.git` fail as well
    (such as `git worktree add` or `git checkout --`).
    Instead:
    - To build an arbitrary baseline revision without writing `.git` or creating
      `.git/worktrees/*`, extract an archive to a scratch directory:
      `mkdir -p /tmp/base && git archive <sha> | tar -x -C /tmp/base`,
      then build there with a disk-backed `CARGO_TARGET_DIR` (such as
      `<worktree>/target/scratch-base`), keeping multi-gigabyte build output
      out of `/tmp`.
    - To revert a modified tracked file when `git checkout -- <path>` fails
      because it cannot acquire `index.lock`, restore it from the commit tree:
      `git show HEAD:<path> > <path>`.
    - Read-only inspection commands such as `git status --short` succeed with
      `GIT_OPTIONAL_LOCKS=0`.

    The session's granted `orbit.*` MCP tools run the machine's installed binary
    rather than the build under test; tool behavior at HEAD is validated with
    `<worktree>/target/debug/orbit tool run <tool.name>` against a scratch `/tmp`
    Orbit root, with MCP output treated as bookkeeping.

    A long build or test command's completion must be confirmed by a positive
    marker in its captured output (`test result:`, `Finished`, or the target's
    own final line), with its absence treated as "did not run" regardless of the
    reported exit status.

    Before filing anything, search open Orbit tasks tagged `qa-sweep`. For each
    real issue that is not already filed, create an Orbit task yourself through
    the Orbit MCP tools or the equivalent `orbit tool run orbit.task.add`
    command. Give it severity-appropriate priority, tag it `qa-sweep`, and put
    the relevant commits, observed evidence, and exact reproduction steps in
    its description. Skip duplicates.

    A non-duplicate failing test that blocks the repository's
    standard validation command must be filed as an Orbit task even when
    the failure is sandbox-specific, platform-specific, or otherwise
    environment-specific, including test-harness or portability defects.
    Do not leave such a breaking test in narrative-only output. Distinguish
    clearly between validation impact (the prescribed suite cannot complete)
    and production impact (whether the failure demonstrates a production
    defect). Include the failing command, the exact error, relevant
    environment evidence, and a scope assessment.

    Your narrative output is advisory; the tasks you create are the durable
    side-effect channel.
  acceptance_criteria:
  - Recent changes were exercised through their real user-facing paths.
  - Real, non-duplicate issues were filed as Orbit tasks with evidence and reproduction steps.
  - Non-duplicate failing tests that block the prescribed validation command were filed as Orbit tasks, with validation impact distinguished from production impact.
  task_type: chore
  tags:
  - qa-sweep
  - no-diff-expected
  priority: medium
  # The portable system lane is seeded per machine and compatibility-aliased
  # for configs written before that crew existed.
  crew: opus
  status: backlog
dedupe: skip_if_open
