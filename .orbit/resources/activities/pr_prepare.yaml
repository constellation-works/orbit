schemaVersion: 2
kind: Activity
metadata:
  name: pr_prepare
spec:
  type: deterministic
  description: >
    Validate a PR handoff and persist the exact pre-rewrite branch, base, and
    remote ref checkpoint used by later rebase and push steps.
  input_schema_json:
    type: object
    required: [job_run_id, workspace_path, completed_task_ids, base]
    properties:
      job_run_id:
        type: string
      completed_task_ids:
        type: array
        minItems: 1
        items:
          type: string
      base:
        type: string
      base_sync:
        type: string
        enum: [remote, local]
      workspace_path:
        type: string
  output_schema_json:
    type: object
    required:
      [phase, decision, head, head_sha, base, base_ref, base_sha,
       commits_behind, commits_ahead, sync_required]
    properties:
      phase:
        type: string
      decision:
        type: string
      head:
        type: string
      head_sha:
        type: string
      base:
        type: string
      base_ref:
        type: string
      base_sha:
        type: string
      remote_sha:
        type: [string, "null"]
      commits_behind:
        type: integer
      commits_ahead:
        type: integer
      sync_required:
        type: boolean
  action: pr_prepare
  config: {}
