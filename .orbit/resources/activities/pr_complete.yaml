schemaVersion: 2
kind: Activity
metadata:
  name: pr_complete
spec:
  type: deterministic
  description: >
    Carry a completion-authorized PR bundle from review to done: drive the open
    PR to merge through GitHub's own gates, verify it is actually merged, then
    apply the guarded review -> done transition. Branch protections and required
    checks are respected; no administrative bypass is available. A no-diff
    bundle completes without a PR.
  input_schema_json:
    type: object
    required: [job_run_id, completed_task_ids]
    properties:
      job_run_id:
        type: string
      completed_task_ids:
        type: array
        minItems: 1
        items:
          type: string
      workspace_path:
        type: string
      pr_number:
        type: string
      completion:
        const: done
      head:
        type: string
      published_head_sha:
        type: string
      base:
        type: string
      base_sync:
        enum: [local, remote]
      no_diff_expected:
        type: boolean
      max_wait_seconds:
        type: integer
        description: >
          Budget for waiting out required checks. Exceeding it fails the run
          with the tasks left in review.
      poll_interval_seconds:
        type: integer
      authorized_by:
        type: string
  output_schema_json:
    type: object
    required: [phase, completed_task_ids, skipped_task_ids]
    properties:
      phase:
        type: string
      no_diff_expected:
        type: boolean
      merge:
        type: object
        description: >
          What completion established about this bundle's delivery. A PR
          delivery carries delivery_evidence read at completion time: the
          merged pull request, the branches and head it merged, and the commit
          that landed. Absent evidence never authorizes the done transition.
        properties:
          delivery_evidence:
            type: object
            required: [pr_number, merge_commit]
            properties:
              pr_number:
                type: string
              merged_at:
                type: string
              # Null when the provider's answer omitted the field; a pinned
              # identity that cannot be read refuses completion rather than
              # reaching this output.
              head_ref:
                type: [string, "null"]
              base_ref:
                type: [string, "null"]
              head_sha:
                type: [string, "null"]
              merge_commit:
                type: string
      completed_task_ids:
        type: array
        items:
          type: string
      skipped_task_ids:
        type: array
        items:
          type: string
      authorization:
        type: string
  action: pr_complete
  config: {}
