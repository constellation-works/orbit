schemaVersion: 2
kind: Activity
metadata:
  name: apply_triage_dispositions
spec:
  type: deterministic
  description: >
    Apply the triage agent's per-task verdicts under deterministic bounds.
    Only task ids present in `candidates` (the listing produced by
    `list_triage_candidates` in the same run) can be touched; a re-backlog
    is honored only for the `environmental` classification and only while
    the durable re-backlog budget (`triage_rebacklogged` history events <
    `max_rebacklogs`) has room — on exhaustion the task takes the gave-up
    path (durable note + friction) and stays blocked. Every other
    classification records a `triage_diagnosis` history note and leaves the
    task blocked for a human decision. Each write re-checks that the task
    is still `blocked` and still coupled to the same run, so concurrent
    transitions (another triage run, a ship sweep, a human) turn the write
    into a skip instead of a double transition.
  input_schema_json:
    type: object
    required: [dispositions, candidates]
    properties:
      state_automation: {}
      dispositions:
        type: array
        items:
          type: object
          required: [task_id, classification, disposition, diagnosis]
          properties:
            task_id:
              type: string
            classification:
              type: string
            disposition:
              type: string
            diagnosis:
              type: string
            mitigation:
              type: string
      candidates:
        type: array
        items:
          type: object
          required: [task_id, run_id]
          properties:
            task_id:
              type: string
            run_id:
              type: string
      max_rebacklogs:
        type: number
        minimum: 0
        maximum: 10
  output_schema_json:
    type: object
    required: [results, rebacklogged_count, diagnosed_count, gave_up_count, skipped_count]
    properties:
      results:
        type: array
        items:
          type: object
          required: [task_id, action]
          properties:
            task_id:
              type: string
            action:
              type: string
              enum: [rebacklogged, diagnosed, gave_up, skipped]
            reason:
              oneOf:
                - type: string
                - type: "null"
      rebacklogged_count:
        type: number
      diagnosed_count:
        type: number
      gave_up_count:
        type: number
      skipped_count:
        type: number
  action: apply_triage_dispositions
  config: {}
