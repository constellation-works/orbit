schemaVersion: 2
kind: Activity
metadata:
  name: pr_open
spec:
  type: deterministic
  description: >
    Discover an existing pull request for a prepared branch or create it once.
    Commit, base synchronization, push, and task promotion are separate job
    checkpoints.
  input_schema_json:
    type: object
    properties:
      job_run_id:
        type: string
      task_id:
        type: string
      task_ids:
        type: array
        items:
          type: string
      completed_task_ids:
        type: array
        items:
          type: string
      base:
        type: string
      base_ref:
        type: string
      base_sha:
        type: string
      base_sync:
        type: string
        enum: [remote, local]
      landing_branch:
        type: string
        description: >
          The branch this work must ultimately land on. When it differs from
          `base`, the base is a stacked intermediate branch and pr_open refuses
          delivery once that branch has itself landed. Leave empty
          for ordinary delivery, where the base is the landing branch.
      base_obsolescence:
        type: string
        enum: [enforce, ignore]
      head:
        type: string
      workspace_path:
        type: string
      title:
        type: string
      body:
        type: string
  output_schema_json:
    type: object
    required: [phase, decision, pr_created, pr_reused, pr_number, base, head]
    properties:
      phase:
        type: string
      decision:
        type: string
      pr_created:
        type: boolean
      pr_reused:
        type: boolean
      pr_number:
        type: string
      pr_url:
        type: [string, "null"]
  action: pr_open
  config: {}
