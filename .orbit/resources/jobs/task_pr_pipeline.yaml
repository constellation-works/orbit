# Task bundle PR pipeline.
#
# Failure semantics:
# - `implement_bundle` runs one task at a time in the shared worktree.
# - If `implement_one` fails, earlier commits remain on the bundle branch.
# - While the run is still alive, tasks stay `in-progress`: a mid-bundle step
#   failure that the run recovers from does not block anything. Commit, branch
#   preparation, base synchronization, push, PR creation/reuse, and promotion
#   are independent durable steps, so recovery resumes at the failed phase.
# - When the run itself terminalizes before PR completion, its recoverable
#   candidate is published and the task is blocked for reconciliation. Once a
#   PR was published and the task promoted to review, a completion-stage merge
#   failure preserves that exact candidate and review state for a safe retry.
#
schemaVersion: 2
kind: Job
metadata:
  name: task_pr_pipeline
spec:
  state: enabled
  kind: workflow
  max_active_runs: 15
  # Preserve recoverable work after terminal failures while keeping the
  # original error authoritative. Completion-stage failures retain the
  # already-published PR instead of fabricating a conflict handoff.
  failure_activity: pr_failure_handoff
  default_input:
    task_ids: []
    base_branch: main
    base_sync: remote
    # ORB-10644: the branch this work must ultimately land on. Empty means the
    # base *is* the landing branch — the ordinary, non-stacked case, where the
    # obsolescence gate only checks that the base still exists on `origin`. A
    # dispatcher stacking onto an intermediate branch sets this to the real
    # landing branch so delivery fails closed once that branch has landed.
    landing_branch: ""
    # ORB-11187: `review` (default) ends the run at the PR handoff. `done` is
    # explicit per-invocation operator authorization to also merge the PR and
    # complete the tasks, which only happens after the merge is verified.
    completion: review
    # ORB-11242: the run-scoped crew restriction the auto-drain admitting this
    # run applied. Empty means unrestricted. This is the innermost carrier: the
    # agent activities below resolve their crew against this run input, so the
    # dispatch gate refuses a crew the window excluded before a provider starts.
    allowed_crews: []
    title: null
    body: null

  steps:
    - id: worktree
      target: activity:worktree_setup
      retry:
        max_attempts: 4
        initial_backoff_ms: 200
        backoff_cap_ms: 2000
        backoff_strategy: exponential
      default_input:
        task_ids: "{{ input.task_ids }}"
        base: "{{ input.base_branch }}"
        base_sync: "{{ input.base_sync }}"

    - id: implement_bundle
      loop:
        items: "{{ input.task_ids }}"
        max_iterations: 256
        steps:
          - id: implement_one
            recovery_activity: step_failure_recovery
            target: activity:agent_implement
            default_input:
              task_id: "{{ item }}"
              workspace_path: "{{ steps.worktree.output.workspace_path }}"
              repo_root: "{{ steps.worktree.output.workspace_path }}"

    - id: commit
      recovery_activity: step_failure_recovery
      target: activity:git_commit
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        scope: all
        # This pipeline rechecks accepted landing evidence at both handoffs.
        verify_already_landed: true
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        base_ref: "{{ steps.worktree.output.base_ref }}"
        base_sha: "{{ steps.worktree.output.base_sha }}"

    - id: prepare_branch
      when: "{{ steps.commit.output.skipped_no_diff_expected }} != true"
      recovery_activity: step_failure_recovery
      target: activity:pr_prepare
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        base: "{{ input.base_branch }}"
        base_sync: "{{ input.base_sync }}"
        completed_task_ids: "{{ input.task_ids }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"

    - id: sync_base
      when: "{{ steps.commit.output.skipped_no_diff_expected }} != true"
      # Only the typed unmerged-index conflict emitted by git_rebase may
      # dispatch this leaf. Other VCS failures preserve the original error and
      # fall through to the terminal candidate handoff without an agent.
      recovery_activity: pr_conflict_recovery
      target: activity:git_rebase
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        completed_task_ids: "{{ input.task_ids }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        head: "{{ steps.prepare_branch.output.head }}"
        head_sha: "{{ steps.prepare_branch.output.head_sha }}"
        base: "{{ steps.prepare_branch.output.base }}"
        base_ref: "{{ steps.prepare_branch.output.base_ref }}"
        base_sha: "{{ steps.prepare_branch.output.base_sha }}"
        remote_sha: "{{ steps.prepare_branch.output.remote_sha }}"
        commits_behind: "{{ steps.prepare_branch.output.commits_behind }}"
        sync_required: "{{ steps.prepare_branch.output.sync_required }}"

    # ORB-11333: the before-PR review gate sits after the final planned base
    # synchronization and before push/PR creation. `review_gate_admit` and
    # `review_gate_settle` always run so later steps can read their output;
    # they report `applies: false` under `none`, `after-landing`, and a
    # checked no-diff exemption. A non-pass verdict fails `review_gate_settle`
    # and the failure handoff preserves the candidate without opening a PR.
    - id: review_gate_admit
      target: activity:review_gate_admit
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        completed_task_ids: "{{ input.task_ids }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        base: "{{ input.base_branch }}"
        base_sync: "{{ input.base_sync }}"
        mode: pr
        skipped_no_diff_expected: "{{ steps.commit.output.skipped_no_diff_expected }}"

    - id: review
      when: "{{ steps.review_gate_admit.output.applies }} == true"
      target: activity:agent_review_repair
      default_input:
        task_id: "{{ steps.review_gate_admit.output.first_task_id }}"
        task_ids: "{{ input.task_ids }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        repo_root: "{{ steps.worktree.output.workspace_path }}"
        attempt_id: "{{ steps.review_gate_admit.output.attempt_id }}"
        manifest_artifact: "{{ steps.review_gate_admit.output.manifest_artifact }}"
        report_artifact: "{{ steps.review_gate_admit.output.report_artifact }}"
        crew: "{{ steps.review_gate_admit.output.reviewer.crew }}"
        remaining_seconds: "{{ steps.review_gate_admit.output.remaining.seconds }}"

    - id: review_gate_settle
      target: activity:review_gate_settle
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        completed_task_ids: "{{ input.task_ids }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        base: "{{ input.base_branch }}"
        base_sync: "{{ input.base_sync }}"
        admission: "{{ steps.review_gate_admit.output }}"

    - id: push
      when: "{{ steps.commit.output.skipped_no_diff_expected }} != true"
      recovery_activity: step_failure_recovery
      target: activity:git_push
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        completed_task_ids: "{{ input.task_ids }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        branch: "{{ steps.sync_base.output.head }}"
        base: "{{ steps.sync_base.output.base }}"
        base_ref: "{{ steps.sync_base.output.base_ref }}"
        rewrite_performed: "{{ steps.sync_base.output.rewritten }}"
        rewrite_head_before: "{{ steps.sync_base.output.head_sha_before }}"
        expected_remote_sha: "{{ steps.sync_base.output.remote_sha_before }}"

    - id: pr_open
      when: "{{ steps.commit.output.skipped_no_diff_expected }} != true"
      recovery_activity: step_failure_recovery
      target: activity:pr_open
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        completed_task_ids: "{{ input.task_ids }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        base: "{{ steps.sync_base.output.base }}"
        base_ref: "{{ steps.sync_base.output.base_ref }}"
        base_sha: "{{ steps.sync_base.output.base_sha }}"
        base_sync: "{{ input.base_sync }}"
        landing_branch: "{{ input.landing_branch }}"
        head: "{{ steps.sync_base.output.head }}"
        reviewed_head_sha: "{{ steps.review_gate_settle.output.reviewed_head_sha }}"
        reviewed_base_sha: "{{ steps.review_gate_settle.output.reviewed_base_sha }}"
        body: "{{ input.body }}"
        title: "{{ input.title }}"

    - id: promote_tasks
      when: "{{ steps.commit.output.skipped_no_diff_expected }} != true"
      recovery_activity: step_failure_recovery
      target: activity:pr_promote
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        completed_task_ids: "{{ input.task_ids }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        head: "{{ steps.sync_base.output.head }}"
        base: "{{ steps.sync_base.output.base }}"
        base_ref: "{{ steps.sync_base.output.base_ref }}"
        base_sha: "{{ steps.sync_base.output.base_sha }}"
        base_sync: "{{ input.base_sync }}"
        landing_branch: "{{ input.landing_branch }}"
        pr_number: "{{ steps.pr_open.output.pr_number }}"
        pr_url: "{{ steps.pr_open.output.pr_url }}"

    - id: promote_no_diff
      when: "{{ steps.commit.output.skipped_no_diff_expected }} == true"
      recovery_activity: step_failure_recovery
      target: activity:pr_promote
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        completed_task_ids: "{{ input.task_ids }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        no_diff_expected: true
        already_landed_checkpoint: "{{ steps.commit.output }}"

    - id: complete_pr
      when: "{{ input.completion }} == done && {{ steps.commit.output.skipped_no_diff_expected }} != true"
      # A DIRTY PR is repaired only after pr_complete reuses git_rebase to
      # prove real unmerged entries. Protection, review, check, auth, stale
      # ownership, and lease failures remain ineligible for agent recovery.
      recovery_activity: pr_conflict_recovery
      target: activity:pr_complete
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        completed_task_ids: "{{ input.task_ids }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        pr_number: "{{ steps.pr_open.output.pr_number }}"
        completion: "{{ input.completion }}"
        head: "{{ steps.sync_base.output.head }}"
        published_head_sha: "{{ steps.push.output.local_sha }}"
        reviewed_head_sha: "{{ steps.review_gate_settle.output.reviewed_head_sha }}"
        base: "{{ steps.sync_base.output.base }}"
        base_sync: "{{ input.base_sync }}"

    # A no-diff bundle delivered nothing to merge; its validation is the
    # delivery, so completion needs no PR. Verified already-landed retries
    # take this route with their full evidence checkpoint; they create no
    # new code delivery and do not acquire the side-effect-only task tag.
    - id: complete_no_diff
      when: "{{ input.completion }} == done && {{ steps.commit.output.skipped_no_diff_expected }} == true"
      recovery_activity: step_failure_recovery
      target: activity:pr_complete
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        completed_task_ids: "{{ input.task_ids }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        no_diff_expected: true
        already_landed_checkpoint: "{{ steps.commit.output }}"
