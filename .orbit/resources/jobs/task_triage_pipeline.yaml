# Failed-run triage pipeline [ORB-10129].
#
# Once a failed job run parks its coupled tasks in `blocked`
# (task_block_on_run_failure.rs, ORB-10127), this pipeline is the bounded
# automation that reads the failure, diagnoses it, and returns the task to
# the backlog when the cause was environmental rather than a genuine problem
# with the task. Everything that survives triage stays `blocked` — now with
# a diagnosis attached so the human decision is a 30-second read.
#
# Shape
# - `list_candidates` (deterministic): blocked tasks whose `job_run_id`
#   points at a failed/timeout/cancelled run. Human-blocked tasks are never
#   listed; tasks whose re-backlog budget is exhausted take the gave-up path
#   (durable note + friction) inside the listing.
# - `triage` (agent, reviewer role): classifies each failure and returns
#   dispositions as data. Its tool allowlist makes code edits, commits,
#   pushes, merges, PR approvals, and pipeline invocations structurally
#   impossible.
# - `apply_dispositions` (deterministic): the only lifecycle writer. Honors
#   `rebacklog` only for `environmental` classifications, only for listed
#   candidates, and only while the durable re-backlog budget
#   (`triage_rebacklogged` history events) has room.
#
# Empty-candidate behavior
# - `list_candidates` returns `candidates: []`; both downstream steps are
#   skipped via `when:` and the run succeeds — a clean no-op, same contract
#   as `task_auto_pipeline` on an empty backlog.
#
# Overlap safety
# - `max_active_runs: 1` makes triage single-flight, and the seeded routine
#   fires it with `policy.overlap: forbid`. `apply_dispositions` re-checks
#   task status and run coupling before each write, so even a racing sweep
#   or human transition cannot be double-applied.

schemaVersion: 2
kind: Job
metadata:
  name: task_triage_pipeline
spec:
  state: enabled
  kind: workflow
  max_active_runs: 1
  default_input:
    task_ids: []
    max_tasks: 20
    max_rebacklogs: 2
    state_automation: null

  steps:
    - id: list_candidates
      target: activity:list_triage_candidates
      default_input:
        state_automation: "{{ input.state_automation }}"
        task_ids: "{{ input.task_ids }}"
        max_tasks: "{{ input.max_tasks }}"
        max_rebacklogs: "{{ input.max_rebacklogs }}"

    - id: triage
      when: "{{ steps.list_candidates.output.candidate_count }} != 0"
      target: activity:triage_failed_runs
      default_input:
        candidates: "{{ steps.list_candidates.output.candidates }}"
        # Named directly so this definition states which crew triages, rather
        # than letting the reviewer label inherit a run crew. `orbit init`
        # seeds `[crews.system]` for whichever agent CLI it detects; a config
        # written before that crew existed resolves the name onto whichever
        # crew its `workflow.system_crew` names.
        crew: system

    - id: apply_dispositions
      when: "{{ steps.list_candidates.output.candidate_count }} != 0"
      target: activity:apply_triage_dispositions
      default_input:
        state_automation: "{{ steps.list_candidates.output.state_automation }}"
        dispositions: "{{ steps.triage.output.dispositions }}"
        candidates: "{{ steps.list_candidates.output.candidates }}"
        max_rebacklogs: "{{ input.max_rebacklogs }}"
