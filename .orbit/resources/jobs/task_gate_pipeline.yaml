# Task bundle gate pipeline.
#
# Admission control for "these must ship" bundles: wait until the bundle's
# context_files are not held by any in-flight task lock or active
# reservation, atomically reserve them, then dispatch to either
# `task_pr_pipeline` or `task_local_pipeline` via `invoke_and_wait`.
#
# Behavioral contract
# - `reserve_locks` refuses admission outright — before the first poll —
#   when a bundled task's `blocked_by` target is archived, rejected, or
#   dangling. Those edges can never reach `done`, so polling them to the
#   iteration ceiling only delays a failure by the full wait budget. The
#   loop is for edges that can still close.
# - `wait_for_window` polls by calling `reserve_locks` each iteration. The
#   reserve step is always executed (never skipped) so its output can be
#   referenced from `break_when` and from the post-loop starvation guard
#   without hitting the template engine's "no data recorded for step"
#   error on skipped-step output references.
# - On conflict, `sleep_if_conflict` backs off by `poll_interval_seconds`
#   before the next iteration; when `reserve.output.reserved` flips to
#   true the loop breaks.
# - `max_iterations: 120` is the structural ceiling. The actual wait
#   budget is enforced by `input.max_wait_seconds`, which the
#   `starvation_check` step surfaces via the `gate.starvation` audit
#   event when the loop exits without a reservation.
# - The child wait covers the longest supported implementation activity (3h)
#   plus a bounded delivery/review tail (1h). The default reservation TTL
#   intentionally covers that full child dispatch wait budget. Keep
#   `ttl_seconds >= dispatch_timeout_seconds` when overriding
#   these inputs; otherwise a second gate can reserve the same context before
#   the first child pipeline finishes.
# - The dispatched child pipeline runs while the reservation is still valid;
#   a fresh `orbit.task.locks.reserve` call from another bundle will either
#   wait or surface `task.locks.reserve.denied`. `invoke_and_wait` re-checks
#   worktree workflow admission immediately before child dispatch, because a
#   gate can sit in `wait_for_window` for its whole budget and the admission
#   that queued it is a snapshot, not standing approval (ORB-11305). Stale
#   `review` / `done` tasks return a succeeded no-op output so the reservation
#   can be released without launching a child run; a task a human withdrew
#   during the wait (`proposed`, `someday`, `archived`, `rejected`, `blocked`)
#   returns a non-succeeded output instead, so the reservation is still
#   released and the gate then fails naming the task and its status. After
#   `invoke_and_wait` returns a terminal child-run status,
#   `release_reservation` frees the reservation immediately before
#   `require_child_success` fails the gate on a non-succeeded child. TTL
#   remains the fallback for abandoned/crashed runs.
# - `dispatch_child` and `require_child_success` carry no `when:` of their
#   own: `starvation_check`'s `when: reserved == false` is the exact
#   complement, and `gate_starvation_fail` always errors, which halts the run
#   before these steps would otherwise be reached on that branch (ORB-11325).
#   That makes `dispatch_child` a step `release_reservation` may safely read
#   `steps.dispatch_child.output` from — see design doc §8.2 on why a
#   condition may only read the output of a step that always runs.

schemaVersion: 2
kind: Job
metadata:
  name: task_gate_pipeline
spec:
  state: enabled
  kind: workflow
  max_active_runs: 15
  default_input:
    task_ids: []
    mode: pr
    base_branch: main
    base_sync: remote
    # ORB-10644: forwarded to the child pipeline; empty means the base is the
    # landing branch.
    landing_branch: ""
    # ORB-11187: forwarded to the leaf pipeline unchanged.
    completion: review
    # ORB-12102: forwarded to the child pipeline, never pinned here. A gated
    # local run publishes nothing by default — `task_local_pipeline` gates its
    # `push` step on this value and defaults it to false — so a checkout with
    # no usable `origin` no longer fails a push it never asked for. A caller
    # that does want the child to publish passes `auto_push: true` to this job.
    auto_push: false
    # ORB-11242: opt-in, run-scoped crew restriction. Empty means unrestricted,
    # which is the behavior of every caller that does not pass it. Forwarded
    # unchanged so the leaf/epic jobs this run admits inherit the same window.
    allowed_crews: []
    max_wait_seconds: 3600
    poll_interval_seconds: 30
    ttl_seconds: 14400
    dispatch_timeout_seconds: 14400

  steps:
    - id: wait_for_window
      loop:
        max_iterations: 120
        break_when: "{{ steps.reserve.output.reserved }} == true"
        steps:
          - id: reserve
            target: activity:reserve_locks
            default_input:
              task_ids: "{{ input.task_ids }}"
              ttl_seconds: "{{ input.ttl_seconds }}"
          - id: sleep_if_conflict
            when: "{{ steps.reserve.output.reserved }} == false"
            target: activity:sleep
            default_input:
              seconds: "{{ input.poll_interval_seconds }}"

    - id: starvation_check
      when: "{{ steps.reserve.output.reserved }} == false"
      target: activity:gate_starvation_fail
      default_input:
        task_ids: "{{ input.task_ids }}"
        conflicts: "{{ steps.reserve.output.conflicts }}"
        waiting_on_deps: "{{ steps.reserve.output.waiting_on_deps }}"
        max_wait_seconds: "{{ input.max_wait_seconds }}"

    - id: dispatch_child
      target: activity:invoke_and_wait
      default_input:
        job_name: "task_{{ input.mode }}_pipeline"
        run_input:
          task_ids: "{{ input.task_ids }}"
          base_branch: "{{ input.base_branch }}"
          base_sync: "{{ input.base_sync }}"
          landing_branch: "{{ input.landing_branch }}"
          completion: "{{ input.completion }}"
          allowed_crews: "{{ input.allowed_crews }}"
          auto_push: "{{ input.auto_push }}"
        admission_task_ids: "{{ input.task_ids }}"
        admission_workflow: worktree_setup
        timeout_seconds: "{{ input.dispatch_timeout_seconds }}"

    - id: release_reservation
      when: "{{ steps.dispatch_child.output.status }} != timeout && {{ steps.dispatch_child.output.status }} != pending && {{ steps.dispatch_child.output.status }} != running"
      target: activity:release_locks
      default_input:
        reservation_id: "{{ steps.reserve.output.reservation_id }}"

    - id: require_child_success
      target: activity:pipeline_success_guard
      default_input:
        context: task_gate_pipeline child run
        result: "{{ steps.dispatch_child.output }}"
