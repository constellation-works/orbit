# Workspace-local unattended wrapper.
#
# Existing sweeps retain this stable job name while delegating the drain to the
# workspace sequencer. Waiting keeps this wrapper active for the full child
# run, so the routine's `overlap: forbid` covers leaf or epic dispatch.
#
# The window is chosen for that inheritance, not for the sequencer. The enabled
# `ship-sweep-orbit` routine fires every 30 minutes under `overlap: forbid`, and
# this wrapper blocks on its child, so any window it passes is a window the
# routine holds. 20 minutes drains continuously between fires while leaving 10
# minutes of slack for an in-flight child to finish past the deadline — a
# longer window here would silently start skipping fires. An operator who wants
# a multi-hour drain should run `orbit run auto --for 2h` directly and accept
# that it owns the sequencer's single active-run slot for that long.
schemaVersion: 2
kind: Job
metadata:
  name: workspace_ship_pipeline
spec:
  state: enabled
  kind: workflow
  max_active_runs: 1
  steps:
    - id: auto
      target: activity:invoke_and_wait
      default_input:
        job_name: workspace_auto_pipeline
        run_input:
          for_seconds: 1200
        timeout_seconds: 7200

    - id: require_auto_success
      target: activity:pipeline_success_guard
      default_input:
        context: workspace auto pipeline
        result: "{{ steps.auto.output }}"
