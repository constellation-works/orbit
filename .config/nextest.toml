nextest-version = { required = "0.9.48" }

[profile.default]
# Flag tests as slow at 5 seconds and terminate after at most 15 seconds.
# Using grace-period = "0s" ensures the termination bound is not extended by
# the default 10-second Unix SIGTERM grace period.
slow-timeout = { period = "5s", terminate-after = 3, grace-period = "0s" }
# Wait briefly for a test's own child cleanup, then fail on a leaked process.
leak-timeout = { period = "5s", result = "fail" }

# Tests that cannot share a thread with one another.
#
# Nextest already runs every test in its own process, and
# `orbit_common::test_env::ScopedEnv` guards the tests that touch ambient state.
# This group adds a further layer for tests whose mutation of process-global
# state reaches past their own process.
#
# Keep them narrow. The filters below name modules, not packages. The previous
# filter was `package(orbit-cli) | package(orbit-core)`, which pinned 2,351
# tests -- about 41% of the workspace -- to a single thread. That swept in every
# `orbit-cli` integration test, the slowest binaries in the tree and the ones
# with the least claim to a slot here: they never touch the parent process's
# environment, because they hand fixture state to the spawned `orbit` child
# through `Command::env` / `env_remove`
# (see CONTRIBUTING.md, "Safe Mutable CLI Fixtures").
[test-groups]
# Mutates process-global state: `std::env::set_var` / `remove_var` /
# `set_current_dir`, directly or through one of the shared env guards. A new
# test module that does any of that belongs in the matching filter below.
stateful-runtime = { max-threads = 1 }

# orbit-core unit tests that mutate the process environment or cwd.
[[profile.default.overrides]]
filter = 'package(orbit-core) & kind(lib) & test(/^(adapter::tool_host::tests::(command_tools|task_tools|workflow_tools)::|application::job::run::tests::(owner|reconcile)::|application::routines::tests::sweep::|application::search::tests::(global|types)::|bootstrap::tests::global_defaults::|runtime::task::tests::locks::|runtime::tests::(authorization|config_path|run_input)::|runtime::workspace::tests::claim::)/)'
test-group = 'stateful-runtime'

# A contract table performs several real CLI fixture lifecycles. Bound these
# process-heavy task fixtures independently of the host's CPU count so concurrent
# startup does not dominate their summed test time on shared drain hosts.
[test-groups.task-contracts]
max-threads = 4

[[profile.default.overrides]]
filter = 'package(orbit-cli) & binary(task)'
test-group = 'task-contracts'

# MCP includes long-lived server handover rows as well as short stdio calls;
# it needs more slots than the task tables to keep the critical path moving.
[test-groups.mcp-contracts]
max-threads = 8

[[profile.default.overrides]]
filter = 'package(orbit-cli) & binary(mcp)'
test-group = 'mcp-contracts'

# Explicit per-test duration overrides. Each override names a specific test
# identity or bounded contract table that genuinely requires more runtime,
# and carries a comment with the task ID tracking its optimization.

# [ORB-16106] Claimed-review sandbox bridge crosses broker and confined reviewer.
[[profile.default.overrides]]
filter = 'package(orbit-cli) & binary(tool) & test(=claimed_review_bridge_sandbox::claimed_review_artifacts_cross_the_broker_from_a_confined_reviewer)'
slow-timeout = { period = "5s", terminate-after = 12, grace-period = "0s" }

# [ORB-16114] Local-candidate binary updates and backup/rollback contract tables.
[[profile.default.overrides]]
filter = 'package(orbit-cli) & binary(process) & test(/^(update::local_candidate::(local_candidate_contracts_0|local_candidate_contracts_1))$/)'
slow-timeout = { period = "5s", terminate-after = 12, grace-period = "0s" }

# [ORB-16115] Multi-stage MCP server handover and executable replacement contracts.
[[profile.default.overrides]]
filter = 'package(orbit-cli) & binary(mcp) & test(/^(mcp_roundtrip::upgrade::(upgrade_admission_and_session_handover|a_replaced_drain_hands_its_run_to_the_installed_executable|a_replaced_mcp_server_hands_its_session_over_after_invalid_requests))$/)'
slow-timeout = { period = "5s", terminate-after = 12, grace-period = "0s" }

# [ORB-16116] Web server dashboard executable replacement and session handover.
[[profile.default.overrides]]
filter = 'package(orbit-cli) & binary(process) & test(=web_serve_handover::a_replaced_dashboard_execs_the_installed_executable_and_keeps_serving)'
slow-timeout = { period = "5s", terminate-after = 12, grace-period = "0s" }

# [ORB-16117] Process update flow and release integrity verification under concurrent load.
[[profile.default.overrides]]
filter = 'package(orbit-cli) & binary(process) & test(/^(update::flow::(update_flow_contracts_0|update_flow_contracts_1)|update::integrity::(release_integrity_contracts_1|release_integrity_contracts_2))$/)'
slow-timeout = { period = "5s", terminate-after = 12, grace-period = "0s" }
