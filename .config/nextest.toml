nextest-version = { required = "0.9.48" }

[profile.default]
# Individual integration fixtures use seconds-long process deadlines. Ten
# minutes per test leaves headroom while bounding a stuck child/test harness.
slow-timeout = { period = "5m", terminate-after = 2 }
# Wait briefly for a test's own child cleanup, then fail on a leaked process.
leak-timeout = { period = "5s", result = "fail" }

# Tests that cannot share a thread with one another.
#
# Nextest already runs every test in its own process, and
# `orbit_common::test_env::ScopedEnv` guards the tests that touch ambient state.
# This group adds a further layer for tests whose mutation of process-global
# state reaches past their own process.
#
# Keep them narrow. The filters below name modules, not packages. The previous
# filter was `package(orbit-cli) | package(orbit-core)`, which pinned 2,351
# tests -- about 41% of the workspace -- to a single thread. That swept in every
# `orbit-cli` integration test, the slowest binaries in the tree and the ones
# with the least claim to a slot here: they never touch the parent process's
# environment, because they hand fixture state to the spawned `orbit` child
# through `Command::env` / `env_remove`
# (see CONTRIBUTING.md, "Safe Mutable CLI Fixtures").
[test-groups]
# Mutates process-global state: `std::env::set_var` / `remove_var` /
# `set_current_dir`, directly or through one of the shared env guards. A new
# test module that does any of that belongs in the matching filter below.
stateful-runtime = { max-threads = 1 }

# orbit-core unit tests that mutate the process environment or cwd.
[[profile.default.overrides]]
filter = 'package(orbit-core) & kind(lib) & test(/^(adapter::tool_host::tests::(command_tools|task_tools|workflow_tools)::|application::job::run::tests::(owner|reconcile)::|application::routines::tests::sweep::|application::search::tests::(global|types)::|bootstrap::tests::global_defaults::|runtime::task::tests::locks::|runtime::tests::(authorization|config_path|run_input)::|runtime::workspace::tests::claim::)/)'
test-group = 'stateful-runtime'
