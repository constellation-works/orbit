nextest-version = { required = "0.9.91" }

[profile.default]
# Individual integration fixtures use seconds-long process deadlines. Ten
# minutes per test leaves headroom while bounding a stuck child/test harness.
slow-timeout = { period = "5m", terminate-after = 2 }
# Wait briefly for a test's own child cleanup, then fail on a leaked process.
leak-timeout = { period = "5s", result = "fail" }

# Tests that cannot share a thread with one another.
#
# Nextest already runs every test in its own process, and
# `orbit_common::test_env::ScopedEnv` guards the tests that touch ambient state.
# This group adds a further layer for tests whose mutation of process-global
# state reaches past their own process.
#
# Keep them narrow. The filters below name modules, not packages. The previous
# filter was `package(orbit-cli) | package(orbit-core)`, which pinned 2,351
# tests -- about 41% of the workspace -- to a single thread. That swept in every
# `orbit-cli` integration test, the slowest binaries in the tree and the ones
# with the least claim to a slot here: they never touch the parent process's
# environment, because they hand fixture state to the spawned `orbit` child
# through `Command::env` / `env_remove`
# (see CONTRIBUTING.md, "Safe Mutable CLI Fixtures").
[test-groups]
# Mutates process-global state: `std::env::set_var` / `remove_var` /
# `set_current_dir`, directly or through one of the shared env guards. A new
# test module that does any of that belongs in the matching filter below.
stateful-runtime = { max-threads = 1 }

# orbit-core unit tests that mutate the process environment or cwd.
[[profile.default.overrides]]
filter = 'package(orbit-core) & kind(lib) & test(/^(adapter::tool_host::tests::(command_tools|task_tools|workflow_tools)::|application::job::run::tests::(owner|reconcile)::|application::routines::tests::sweep::|application::search::tests::(global|types)::|bootstrap::tests::global_defaults::|runtime::task::tests::locks::|runtime::tests::(authorization|config_path|run_input)::|runtime::workspace::tests::claim::)/)'
test-group = 'stateful-runtime'

# A contract table performs several real CLI fixture lifecycles. Bound these
# process-heavy task fixtures independently of the host's CPU count so concurrent
# startup does not dominate their summed test time on shared drain hosts.
[test-groups.task-contracts]
max-threads = 4

[[profile.default.overrides]]
filter = 'package(orbit-cli) & binary(task)'
test-group = 'task-contracts'

# MCP includes long-lived server handover rows as well as short stdio calls;
# it needs more slots than the task tables to keep the critical path moving.
[test-groups.mcp-contracts]
max-threads = 8

[[profile.default.overrides]]
filter = 'package(orbit-cli) & binary(mcp)'
test-group = 'mcp-contracts'

# Check-job only. GitHub's ubuntu runner has 4 vCPUs and keeps every nextest
# slot busy, while about a fifth of slot time does not scale with CPU speed
# (timers, deadlines, child waits). Two extra slots overlap that wait.
# Inherits the default profile, including the group caps above. Local runs
# stay on default unless they pass --profile ci. retries stays 0.
[profile.ci]
test-threads = 6
retries = 0

# Start measured long carriers before the ordinary queue so their final rows
# do not leave the other slots idle at the end of a shard. The list names
# every test measured at 12 s or longer in the 2026-10-30 local profile
# (docs/design-patterns/test_strategy.md, seventh CI pass); refresh it from
# the shards' nextest-junit reports when a new long carrier appears.
# Priority changes scheduling only: count partitions, ignored applicability,
# isolation and the inherited group caps are unchanged. Keep this CI-only;
# local default runs retain their ordinary order. See the CI timing notes
# in test_strategy.md.
[[profile.ci.overrides]]
filter = '''
  (package(orbit-core) & binary(runtime) & (
    test(=task_delivery::source_repair::published_completion_scenarios) |
    test(=task_delivery::source_repair::publication::same_pr_publication_scenarios) |
    test(=task_delivery::source_repair::cancelled_source_repair_scenarios) |
    test(=task_delivery::source_repair::handoff_requeue::handoff_requeue_scenarios) |
    test(=origin_fetch_hold::worktree_setup_origin_outage_holds_backlog_and_fails_in_progress))) |
  (package(orbit-engine) & binary(engine) & (
    test(=pr_landing::validation_repairs_and_logs) |
    test(=pr_landing::ci_rerun::owner_retry_preserves_read_only_and_independent_candidate_routes) |
    test(=pr_landing::ci_rerun::bounded::bounded_nextest_retry_observes_results_and_never_resends_unknown_replies) |
    test(=pr_landing::ci_rerun::bounded::bounded_retry_keeps_refusal_boundaries) |
    test(=pr_landing::ci_rerun::dependency_adapter_refuses_incomplete_or_forged_evidence) |
    test(=pr_landing::ci_rerun::diagnostic::planner_refusal_journal_deduplicates_bounds_transitions_and_clears_on_recovery) |
    test(=pr_landing::absent_context::reserved_refresh_observes_lost_unapplied_and_pending_outcomes_without_another_write) |
    test(=pr_landing::absent_context::unsupported_or_unproven_emission_never_updates_or_repairs) |
    test(=pr_landing::auto_fix::auto_fix_checks_current_base_before_spending_a_repair) |
    test(=pr_landing::auto_fix::base_check_holds_never_dispatch_candidate_recovery))) |
  (package(orbit-cli) & binary(process) & test(=job_resume_detached::lifecycle::resume_lifecycle_contracts_0)) |
  (package(orbit-tools) & binary(tools) & test(=public_tool_surface::github_log_goldens::every_selected_window_hides_credential_fragments)) |
  (package(orbit-web) & binary(http_api) & test(=events::change_stream_notices_other_process_writes_and_resumes_after_reconnect))
'''
priority = 100

# Per-test durations for the slowest-test table in
# docs/design-patterns/test_strategy.md. Each CI shard uploads its report.
[profile.ci.junit]
path = "junit.xml"
