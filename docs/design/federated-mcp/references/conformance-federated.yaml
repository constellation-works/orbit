schema_version: 2
contract: orbit-mcp-federated
feature_status: Draft
last_updated: 2026-10-07
last_validated: 2026-10-07

source_of_truth:
  design: docs/design/federated-mcp/2_design.md
  prescriptive_contract: docs/design/federated-mcp/specs/federated-workspace-mcp.md
  destinations: crates/orbit-registry/src/hosts.rs (loaded by crates/orbit-mcp/src/federated/config.rs)
  mux_host: crates/orbit-mcp/src/federated/host.rs::FederatedMcpHost
  destination_capabilities: crates/orbit-mcp/src/federated/capability.rs
  serve_entry: crates/orbit-cli/src/command/mcp/command.rs
  client_registration: crates/orbit-cli/src/command/mcp/setup

launch:
  destinations_file: ~/.orbit/hosts.toml (written by `orbit host add`)
  legacy_destinations_file: ~/.orbit/mcp-destinations.toml, read only while it is the sole file; both present is host_file_conflict
  local_membership: implicit; the accepting machine is always included and needs no host entry
  missing_or_empty_destinations_file: valid local-only federated server
  explicit_local_row: legacy rows collapse to one in-process route for that machine_id; the host file refuses an entry for the local machine
  argv: orbit mcp serve --mode federated
  registration:
    command: orbit mcp init --federated
    removal: orbit mcp remove --federated
    server_id: orbit-federated
    coexistence_rule: preserve the v1 `orbit` client entry
  discovery: call federated orbit_workspace_list and copy a descriptor's selector
  workspace_call: pass the copied selector as the workspace argument

federated_namespace_exception:
  v1_invariant: one direct byte-transparent SSH stdio hop; no Orbit process relays onward
  exception: the federated mux inspects MCP calls and delivers them to the destination encoded in the host-qualified selector (in-process when that destination is the accepting machine; otherwise over SSH)
  scope: orbit mcp serve --mode federated only
  unchanged_v1_paths:
    - orbit mcp serve
    - orbit mcp serve --mode remote <ssh-host>
    - orbit mcp listen
  v1_conformance: docs/design/mcp-bridge/references/conformance-v1.yaml

routing:
  selector_source: copy selector from federated orbit_workspace_list
  selector_shape: hm_<machine_id>/ws_<workspace_id>
  delivery: one selected destination; no fallback or failover
  config_collision: duplicate machine_id fails startup as ambiguous_destination
  budgets:
    probe: bounds ssh setup, handshake, discovery, and tools/list
    routed_delivery: stamped when the tools/call request is written; independent of the probe budget
  errors:
    - unknown_selector
    - unreachable_destination
    - stale_route
    - unhealthy_checkout
    - tool_not_on_this_host
    - capability_refused
  post_dispatch:
    error: outcome_unknown
    when: the tools/call request was written and its answer never arrived
    rule: never unreachable_destination; not part of the precedence ladder

authority:
  destination_runs_logs_scheduler: execute
  owner_coordination_store: control_plane
  task_reads:
    tools:
      - orbit.task.list
      - orbit.task.show
    rule: owner-only; use the owner descriptor's selector
    replica_result: capability_refused
    id_only:
      tools: id-routed task tools (orbit.task.show, update, reject, delete, artifact.get, artifact.put, review_reset, reconcile_review)
      rule: no selector; delivered to the host the task id's prefix names, which resolves the id through its own task registry
      local_prefix: served in-process
      unregistered_prefix: unknown_task_prefix, no destination dialed
      unreachable_holder: owner_unreachable, never not_found and never a local mirror

honest_limitations:
  placement: none
  competing_owner_detection: none
  availability: bounded by the chosen destination
  task_reads_on_replicas: refused; the mux does not forward them to the owner
  replication: none
  implicit_failover: none

validation:
  config_and_selector:
    - crates/orbit-mcp/src/federated/tests/route.rs
    - crates/orbit-cli/tests/mcp/mcp_roundtrip.rs
  aggregate_list: crates/orbit-cli/tests/mcp/mcp_roundtrip.rs
  local_membership: crates/orbit-cli/tests/mcp/mcp_roundtrip.rs
  fail_closed_routes: crates/orbit-mcp/src/federated/tests/route.rs
  federated_serve: crates/orbit-cli/tests/mcp/mcp_roundtrip.rs
  capability_classes: crates/orbit-mcp/src/federated/tests/capability.rs
  id_only_task_routes:
    - crates/orbit-mcp/src/federated/tests/task_route.rs
    - crates/orbit-mcp/tests/boundary/task_route.rs
    - crates/orbit-cli/tests/workspace/host_routing.rs

task_references:
