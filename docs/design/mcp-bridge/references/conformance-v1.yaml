schema_version: 2
contract: orbit-mcp-v1
last_updated: 2026-08-15
last_validated: 2026-08-15

source_of_truth:
  exposed_tool_list:
    - crates/orbit-mcp/src/remote/surface.rs::canonical_mcp_tool_definitions
  composed_from:
    - crates/orbit-tools/src/registry.rs::canonical_builtin_mcp_tool_definitions
    - crates/orbit-mcp/src/remote/discovery.rs::discovery_tool_definitions
  protocol_kernel:
    - crates/orbit-mcp/src/lib.rs
    - crates/orbit-mcp/src/adapter
  accepting_server:
    - crates/orbit-cli/src/command/mcp/server.rs::ServerMcpHost
  authoritative_dispatch:
    - crates/orbit-core/src/command/tool/dispatch.rs

transport:
  local: stdio
  remote:
    mechanism: direct ssh stdio
    argv_shape: "ssh -T -- <ssh-host> orbit mcp serve --remote-caller-machine-id <audit-label>"
    implementation: crates/orbit-mcp/src/remote/proxy.rs
  socket:
    mechanism: tcp listener, one independent session per accepted connection
    argv_shape: "orbit mcp listen [ADDR] [--allow-non-loopback]"
    implementation: crates/orbit-mcp/src/listener.rs
    default_bind: loopback; a non-loopback bind is refused unless requested explicitly
    policy: transport only — no capability, placement, owner-routing, or checkout layer
  forbidden:
    - shared broker process
    - client-side frame parsing or rewriting
    - third-machine relay

authority:
  accepting_machine:
    - resolves workspace selectors against its own registry
    - opens the selected server-local runtime
    - performs domain and sandbox validation through Core
    - records every tools/call through one Core audit boundary
  caller:
    - selects an SSH destination or a listener address
    - forwards MCP bytes unchanged
    - may supply only audit metadata, never an authorization principal
  forbidden_client_preflight:
    - checkout ownership validation
    - placement or owner routing
    - capability filtering
    - authorization decisions

authorization:
  status: deferred
  v1_rule: SSH access is sufficient to reach the remote MCP process
  enforcement_owner_when_added: orbit-core
  capability_filtering: false

tool_definitions:
  metadata:
    - schema
    - scope
  scopes:
    global:
      - orbit.workspace.list
    workspace_required: all other advertised tools
  forbidden_metadata:
    - placement
    - allowed capabilities

audit_context:
  trace_id: generated once per MCP call
  caller_machine_id: opaque audit-only label; local fallback is host/local
  caller_ip: best-effort first field of SSH_CONNECTION for SSH sessions, or the accepted peer address for listener sessions
  process_machine_id: derived from the accepting machine registry
  process_host_id: derived from the accepting machine registry
  transport: local or ssh-mcp; a listener session is local and is distinguished by caller_ip

workspace_selection:
  accepted_sources:
    - tool input workspace field
    - MCP initialize metadata
  resolution_owner: accepting server
  missing_selector: fail clearly for workspace-scoped tools
  global_tools:
    - orbit.workspace.list
  discovery_projection:
    include: active logical workspaces with a checkout registered on the accepting machine
    owner_machine_id_filter: false

unknown_tool_calls:
  name: preserve the raw unadvertised wire name
  dispatch: Core global in-process audit seam
  result: tool_not_found
  audit_status: denied
  audit_rows: exactly one
  workspace_id: null

validation:
  exact_tool_snapshot: crates/orbit-cli/tests/snapshots/mcp_tools_list.json
  protocol_roundtrip: crates/orbit-mcp/tests/boundary/mcp_wire_roundtrip.rs
  production_roundtrip: crates/orbit-cli/tests/mcp/mcp_roundtrip.rs
  remote_proxy: crates/orbit-mcp/src/remote/tests/proxy.rs
  listener_bind_policy: crates/orbit-mcp/src/tests/listener.rs
  listener_roundtrip: crates/orbit-mcp/tests/boundary/mcp_wire_roundtrip.rs
  server_identity: crates/orbit-mcp/src/remote/tests/identity.rs
  discovery: crates/orbit-mcp/src/remote/tests/discovery.rs
  unknown_call_audit: crates/orbit-cli/tests/mcp/mcp_roundtrip.rs
