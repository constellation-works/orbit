name: Website checks

on:
  pull_request:
    paths:
      - "CHANGELOG.md"
      - "website/**"
      - ".github/workflows/website-check.yml"
  push:
    branches:
      - main
    paths:
      - "CHANGELOG.md"
      - "website/**"
      - ".github/workflows/website-check.yml"
  workflow_dispatch:

permissions: {}

jobs:
  # Read live state before allocating build runners; the PR event can be stale.
  pr-state:
    name: Live PR state
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read
    outputs:
      state: ${{ steps.state.outputs.state }}
    steps:
      - name: Read live PR state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_STATE: ${{ github.event.pull_request.state }}
          EVENT_MERGED: ${{ github.event.pull_request.merged }}
          RETRY_DELAY_SECONDS: "5"
        shell: bash
        run: |
          # Fail-soft: see ci.yml Live PR state. Retry bounded times, then
          # fall back to the pull_request event payload; only validated
          # key=value lines are appended to $GITHUB_OUTPUT, and an
          # unusable event payload yields state=unknown (not open).
          state=""
          attempt=1
          while [ "$attempt" -le 3 ] && [ -z "$state" ]; do
            if response="$(gh api --method GET "repos/{owner}/{repo}/pulls/${PR_NUMBER}" 2>/dev/null)"; then
              if parsed="$(jq -er 'if .merged == true then "merged" elif .state == "open" or .state == "closed" then .state else error("Unexpected pull request state") end' <<<"$response" 2>/dev/null)" && [ -n "$parsed" ]; then
                state="$parsed"
              fi
            fi
            if [ -z "$state" ] && [ "$attempt" -lt 3 ]; then
              sleep "$((RETRY_DELAY_SECONDS * attempt))" || true
            fi
            attempt=$((attempt + 1))
          done
          if [ -z "$state" ]; then
            if [ "${EVENT_MERGED:-}" = "true" ]; then
              state="merged"
            elif [ "${EVENT_STATE:-}" = "open" ] || [ "${EVENT_STATE:-}" = "closed" ]; then
              state="$EVENT_STATE"
            else
              state="unknown"
            fi
            echo "::warning title=Live PR state::gh api failed after 3 attempts; falling back to the pull_request event payload (state=$state)"
          fi
          printf 'state=%s\n' "$state" >> "$GITHUB_OUTPUT"

  check:
    needs: pr-state
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.pr-state.outputs.state == 'open') }}
    name: Check and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Astro 7.4 requires this floor; exclude older runner-cached Node 22 patches.
          node-version: "^22.23.4"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check website
        run: npm run check

      - name: Build website
        run: npm run build

      - name: Test security.txt validator
        run: npm run test:security-txt

      - name: Validate security.txt
        run: |
          npm run validate:security-txt -- public/.well-known/security.txt
          npm run validate:security-txt -- dist/.well-known/security.txt

      - name: Check transport-security policy
        run: |
          set -euo pipefail
          test -f dist/_headers
          # ORB-11461 / e2454bcb0: Cloudflare emits the policy with indentation.
          grep -E '^[[:space:]]*Strict-Transport-Security: max-age=31536000$' dist/_headers
