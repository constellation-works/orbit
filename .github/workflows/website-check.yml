name: Website checks

on:
  pull_request:
    paths:
      - "CHANGELOG.md"
      - "website/**"
      - ".github/workflows/website-check.yml"
  push:
    branches:
      - main
    paths:
      - "CHANGELOG.md"
      - "website/**"
      - ".github/workflows/website-check.yml"
  workflow_dispatch:

permissions: {}

jobs:
  # Best-effort live read: only a live closed/merged state skips build jobs.
  # Unknown state admits CI; the queued PR event can be stale in either direction.
  pr-state:
    name: Live PR state
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read
    outputs:
      state: ${{ steps.state.outputs.state }}
      changed_files: ${{ steps.state.outputs.changed_files }}
    steps:
      - name: Read live PR state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if outputs="$(gh api --method GET 'repos/{owner}/{repo}/pulls/${{ github.event.pull_request.number }}' --jq '
            (if .merged == true then "state=merged"
              elif .state == "open" or .state == "closed" then "state=" + .state
              else error("Unexpected pull request state") end),
            (if (.changed_files | type) == "number"
              then "changed_files=" + (.changed_files | tostring)
              else "changed_files=" end)
          ')" && [ -n "$outputs" ]; then
            printf '%s\n' "$outputs" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' 'state=unknown' 'changed_files=' >> "$GITHUB_OUTPUT"
            echo "::warning::Live PR state unavailable; continuing CI without a live state."
          fi

  check:
    needs: pr-state
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || (needs.pr-state.outputs.state == 'open' || needs.pr-state.outputs.state == 'unknown')) }}
    name: Check and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Astro 7.4 requires this floor; exclude older runner-cached Node 22 patches.
          node-version: "^22.23.4"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check website
        run: npm run check

      - name: Build website
        run: npm run build

      - name: Test security.txt validator
        run: npm run test:security-txt

      - name: Validate security.txt
        run: |
          npm run validate:security-txt -- public/.well-known/security.txt
          npm run validate:security-txt -- dist/.well-known/security.txt

      - name: Check transport-security policy
        run: |
          set -euo pipefail
          test -f dist/_headers
          # ORB-11461 / e2454bcb0: Cloudflare emits the policy with indentation.
          grep -E '^[[:space:]]*Strict-Transport-Security: max-age=31536000$' dist/_headers
