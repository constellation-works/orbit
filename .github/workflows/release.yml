name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build ${{ matrix.slug }}
    runs-on: ${{ matrix.runs_on }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: darwin-arm64
            target: aarch64-apple-darwin
            runs_on: macos-15
            cli: true
            cli_asset: orbit-aarch64-apple-darwin.tar.gz
          - slug: darwin-x86_64
            target: x86_64-apple-darwin
            runs_on: macos-15-intel
            cli: true
            cli_asset: orbit-x86_64-apple-darwin.tar.gz
          # Linux CLI builds on ubuntu-22.04 (glibc 2.35) to keep the CLI's
          # runtime compatibility floor low for older distros.
          - slug: linux-x86_64-cli
            target: x86_64-unknown-linux-gnu
            runs_on: ubuntu-22.04
            cli: true
            cli_asset: orbit-x86_64-unknown-linux-gnu.tar.gz
          - slug: linux-arm64-cli
            target: aarch64-unknown-linux-gnu
            runs_on: ubuntu-22.04-arm
            cli: true
            cli_asset: orbit-aarch64-unknown-linux-gnu.tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # Rust 1.98.1
        with:
          toolchain: "1.98.1"
          components: clippy, rustfmt
          targets: ${{ matrix.target }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.slug }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ matrix.slug }}-cargo-release-
            ${{ runner.os }}-${{ runner.arch }}-cargo-release-

      - name: Build release binary
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.cli }}" = "true" ]; then
            cargo build -p orbit-cli --release --locked --target "${{ matrix.target }}"
            "./target/${{ matrix.target }}/release/orbit" --version
          fi

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "${{ matrix.cli }}" = "true" ]; then
            tar -czf "dist/${{ matrix.cli_asset }}" -C "target/${{ matrix.target }}/release" orbit
          fi
          ls -lh dist

      - name: Upload packaged artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.slug }}
          path: dist/*
          if-no-files-found: error

  build-bundled-bwrap:
    # Static Bubblewrap for Linux hosts whose own bwrap is missing or lacks
    # --bind-fd (docs/runbooks/linux-sandbox.md). Built natively per
    # architecture inside a digest-pinned Alpine image, so the result is musl
    # and fully static; scripts/build-bundled-bwrap.sh pins the sources. The
    # build runs through `docker run` rather than a job container because
    # JavaScript actions cannot run inside an Alpine container on arm64.
    name: Build bundled Bubblewrap ${{ matrix.arch }}
    runs-on: ${{ matrix.runs_on }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs_on: ubuntu-24.04
            publishes_sources: true
          - arch: aarch64
            runs_on: ubuntu-24.04-arm
            publishes_sources: false
    env:
      BUILD_IMAGE: alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build static Bubblewrap
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -e OWNER="$(id -u):$(id -g)" \
            -v "$PWD:/src" -w /src \
            "$BUILD_IMAGE" \
            sh -euc '
              apk add --no-cache build-base curl linux-headers meson pkgconf tar xz
              sh scripts/build-bundled-bwrap.sh dist
              chown -R "$OWNER" dist
            '
          if [ "${{ matrix.publishes_sources }}" != "true" ]; then
            # Sources, notice and recipe are identical across architectures;
            # one build publishes them.
            rm -f dist/*.tar.xz dist/orbit-bwrap-NOTICE.txt dist/orbit-bwrap-build.sh
          fi
          cat "dist/orbit-bwrap-${{ matrix.arch }}-linux.buildinfo"
          ls -lh dist

      - name: Upload bundled Bubblewrap
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bwrap-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  build-desktop:
    # Desktop app bundles (desktop/, a separate Cargo workspace). Opt-in with
    # the ORBIT_DESKTOP_RELEASE repository variable, because the macOS bundle
    # needs Apple Developer ID secrets the repository may not have yet. The CLI
    # release never waits on these jobs; publish-desktop attaches the bundles
    # to the release afterwards.
    name: Build desktop ${{ matrix.slug }}
    if: ${{ vars.ORBIT_DESKTOP_RELEASE == 'true' }}
    runs-on: ${{ matrix.runs_on }}
    # First-time notarization of a new app can take hours on Apple's side.
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: macos-universal
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            runs_on: macos-15
            bundles: app,dmg
          # ubuntu-22.04 keeps the bundles' glibc floor at 2.35, as for the CLI.
          - slug: linux-x86_64
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            runs_on: ubuntu-22.04
            bundles: deb,appimage
          - slug: linux-arm64
            target: aarch64-unknown-linux-gnu
            rust_targets: aarch64-unknown-linux-gnu
            runs_on: ubuntu-22.04-arm
            bundles: deb,appimage
    env:
      TARGET: ${{ matrix.target }}
      BUNDLES: ${{ matrix.bundles }}
      # Keep in step with desktop.yml.
      TAURI_CLI_VERSION: 2.12.3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # Rust 1.98.1
        with:
          toolchain: "1.98.1"
          targets: ${{ matrix.rust_targets }}

      - name: Install webview build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            libxdo-dev libssl-dev patchelf file

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop
          key: release-${{ matrix.slug }}
          cache-bin: "false"

      - name: Check desktop version matches the tag
        shell: bash
        run: |
          set -euo pipefail
          desktop_version="$(awk -F'"' '/^version[[:space:]]*=/ { print $2; exit }' desktop/Cargo.toml)"
          if [ "v$desktop_version" != "$GITHUB_REF_NAME" ]; then
            echo "desktop/Cargo.toml version $desktop_version does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Check Apple signing secrets
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # A release never ships an unsigned or unnotarized macOS app.
          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
            APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              echo "missing Actions secret: $name (see desktop/README.md#one-time-setup)" >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Install Tauri CLI
        shell: bash
        run: cargo install tauri-cli --version "$TAURI_CLI_VERSION" --locked

      - name: Build signed and notarized macOS bundle
        if: runner.os == 'macOS'
        working-directory: desktop
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: cargo tauri build --ci --target "$TARGET" --bundles "$BUNDLES" -- --locked

      - name: Build Linux bundles
        if: runner.os == 'Linux'
        working-directory: desktop
        shell: bash
        run: cargo tauri build --ci --target "$TARGET" --bundles "$BUNDLES" -- --locked

      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app="desktop/target/$TARGET/release/bundle/macos/Orbit.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
          find "$app/Contents/MacOS" -type f -perm -u+x -print0 |
            while IFS= read -r -d '' binary; do
              archs="$(lipo -archs "$binary")"
              echo "$binary: $archs"
              case " $archs " in *" x86_64 "*) ;; *) exit 1 ;; esac
              case " $archs " in *" arm64 "*) ;; *) exit 1 ;; esac
            done

      - name: Package desktop assets
        shell: bash
        run: |
          set -euo pipefail
          bundle="desktop/target/$TARGET/release/bundle"
          # Exactly one bundle per format, renamed to a stable,
          # version-free name like the CLI tarballs.
          take() {
            local pattern="$1" asset="$2" matches
            shopt -s nullglob
            # shellcheck disable=SC2206
            matches=($pattern)
            shopt -u nullglob
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "expected exactly one $pattern, found ${#matches[@]}" >&2
              exit 1
            fi
            cp "${matches[0]}" "dist/$asset"
          }
          mkdir -p dist
          if [ "$RUNNER_OS" = macOS ]; then
            take "$bundle/dmg/*.dmg" "orbit-desktop-$TARGET.dmg"
          else
            take "$bundle/deb/*.deb" "orbit-desktop-$TARGET.deb"
            take "$bundle/appimage/*.AppImage" "orbit-desktop-$TARGET.AppImage"
            dpkg-deb --info "dist/orbit-desktop-$TARGET.deb"
          fi
          ls -lh dist

      - name: Upload desktop artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.slug }}
          path: dist/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    needs: [build-release, build-bundled-bwrap]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      darwin_arm_asset: ${{ steps.metadata.outputs.darwin_arm_asset }}
      darwin_arm_sha: ${{ steps.metadata.outputs.darwin_arm_sha }}
      darwin_intel_asset: ${{ steps.metadata.outputs.darwin_intel_asset }}
      darwin_intel_sha: ${{ steps.metadata.outputs.darwin_intel_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download packaged artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          ls -lh dist
          (
            cd dist
            expected_assets=(
              orbit-aarch64-apple-darwin.tar.gz
              orbit-aarch64-unknown-linux-gnu.tar.gz
              orbit-x86_64-apple-darwin.tar.gz
              orbit-x86_64-unknown-linux-gnu.tar.gz
              orbit-bwrap-x86_64-linux
              orbit-bwrap-x86_64-linux.buildinfo
              orbit-bwrap-aarch64-linux
              orbit-bwrap-aarch64-linux.buildinfo
              orbit-bwrap-NOTICE.txt
              orbit-bwrap-build.sh
            )
            for asset in "${expected_assets[@]}"; do
              [ -f "$asset" ] || {
                echo "missing release asset: $asset" >&2
                exit 1
              }
            done
            # The exact Bubblewrap and libcap sources the bundled binaries
            # were built from; their versions live in the build recipe.
            source_assets=(bubblewrap-*.tar.xz libcap-*.tar.xz)
            for asset in "${source_assets[@]}"; do
              [ -f "$asset" ] || {
                echo "missing bundled Bubblewrap source: $asset" >&2
                exit 1
              }
            done
            sha256sum "${expected_assets[@]}" "${source_assets[@]}" | sort -k 2 > orbit-checksums.txt
          )
          cat dist/orbit-checksums.txt

      - name: Sign checksums
        shell: bash
        env:
          ORBIT_RELEASE_SIGNING_KEY_PEM: ${{ secrets.ORBIT_RELEASE_SIGNING_KEY_PEM }}
        run: |
          set -euo pipefail
          if [ -z "${ORBIT_RELEASE_SIGNING_KEY_PEM:-}" ]; then
            echo "ORBIT_RELEASE_SIGNING_KEY_PEM must contain the private key matching npm/release-signing.pub" >&2
            exit 1
          fi

          signing_key="$(mktemp)"
          trap 'rm -f "$signing_key"' EXIT
          printf '%s\n' "$ORBIT_RELEASE_SIGNING_KEY_PEM" > "$signing_key"
          chmod 600 "$signing_key"

          openssl dgst -sha256 \
            -sign "$signing_key" \
            -out dist/orbit-checksums.txt.sig \
            dist/orbit-checksums.txt
          openssl dgst -sha256 \
            -verify npm/release-signing.pub \
            -signature dist/orbit-checksums.txt.sig \
            dist/orbit-checksums.txt

      - name: Capture release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "tag must be a vMAJOR.MINOR.PATCH release tag with an optional prerelease suffix" >&2
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi
          DARWIN_ARM_ASSET="orbit-aarch64-apple-darwin.tar.gz"
          DARWIN_INTEL_ASSET="orbit-x86_64-apple-darwin.tar.gz"
          DARWIN_ARM_SHA="$(awk '$2 == "'"$DARWIN_ARM_ASSET"'" { print $1 }' dist/orbit-checksums.txt)"
          DARWIN_INTEL_SHA="$(awk '$2 == "'"$DARWIN_INTEL_ASSET"'" { print $1 }' dist/orbit-checksums.txt)"

          [ -n "$DARWIN_ARM_SHA" ]
          [ -n "$DARWIN_INTEL_SHA" ]

          {
            echo "version=$VERSION"
            echo "prerelease=$PRERELEASE"
            echo "darwin_arm_asset=$DARWIN_ARM_ASSET"
            echo "darwin_arm_sha=$DARWIN_ARM_SHA"
            echo "darwin_intel_asset=$DARWIN_INTEL_ASSET"
            echo "darwin_intel_sha=$DARWIN_INTEL_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: ${{ steps.metadata.outputs.prerelease }}
          files: |
            dist/orbit-aarch64-apple-darwin.tar.gz
            dist/orbit-aarch64-unknown-linux-gnu.tar.gz
            dist/orbit-x86_64-apple-darwin.tar.gz
            dist/orbit-x86_64-unknown-linux-gnu.tar.gz
            dist/orbit-bwrap-*
            dist/bubblewrap-*.tar.xz
            dist/libcap-*.tar.xz
            dist/orbit-checksums.txt
            dist/orbit-checksums.txt.sig
          generate_release_notes: true

  publish-desktop:
    # Attaches the desktop bundles to the release publish-release created,
    # with their own signed checksum manifest, so a desktop failure never
    # holds back the CLI assets. Re-running it after a fix adds the missing
    # assets; `gh release upload` without --clobber never overwrites one.
    name: Attach desktop bundles
    needs: [publish-release, build-desktop]
    if: ${{ vars.ORBIT_DESKTOP_RELEASE == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download desktop artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true

      - name: Generate desktop checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          expected_assets=(
            orbit-desktop-universal-apple-darwin.dmg
            orbit-desktop-x86_64-unknown-linux-gnu.deb
            orbit-desktop-x86_64-unknown-linux-gnu.AppImage
            orbit-desktop-aarch64-unknown-linux-gnu.deb
            orbit-desktop-aarch64-unknown-linux-gnu.AppImage
          )
          for asset in "${expected_assets[@]}"; do
            [ -f "$asset" ] || {
              echo "missing desktop asset: $asset" >&2
              exit 1
            }
          done
          # Asset names carry no version. The app's update check reads this
          # signed file to tie the bundles to this tag (desktop/README.md#auto-update).
          printf '%s\n' "${GITHUB_REF_NAME#v}" > orbit-desktop-version.txt
          expected_assets+=(orbit-desktop-version.txt)
          sha256sum "${expected_assets[@]}" | sort -k 2 > orbit-desktop-checksums.txt
          cat orbit-desktop-checksums.txt

      - name: Sign desktop checksums
        shell: bash
        env:
          ORBIT_RELEASE_SIGNING_KEY_PEM: ${{ secrets.ORBIT_RELEASE_SIGNING_KEY_PEM }}
        run: |
          set -euo pipefail
          if [ -z "${ORBIT_RELEASE_SIGNING_KEY_PEM:-}" ]; then
            echo "ORBIT_RELEASE_SIGNING_KEY_PEM must contain the private key matching npm/release-signing.pub" >&2
            exit 1
          fi

          signing_key="$(mktemp)"
          trap 'rm -f "$signing_key"' EXIT
          printf '%s\n' "$ORBIT_RELEASE_SIGNING_KEY_PEM" > "$signing_key"
          chmod 600 "$signing_key"

          openssl dgst -sha256 \
            -sign "$signing_key" \
            -out dist/orbit-desktop-checksums.txt.sig \
            dist/orbit-desktop-checksums.txt
          openssl dgst -sha256 \
            -verify npm/release-signing.pub \
            -signature dist/orbit-desktop-checksums.txt.sig \
            dist/orbit-desktop-checksums.txt

      - name: Attach to the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            dist/orbit-desktop-*

  bump-homebrew-tap:
    name: Update Homebrew tap
    needs: publish-release
    if: ${{ needs.publish-release.outputs.prerelease == 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout tap repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: constellation-works/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          persist-credentials: false
          path: tap

      - name: Update formula
        shell: bash
        env:
          VERSION: ${{ needs.publish-release.outputs.version }}
          ARM_ASSET: ${{ needs.publish-release.outputs.darwin_arm_asset }}
          ARM_SHA: ${{ needs.publish-release.outputs.darwin_arm_sha }}
          INTEL_ASSET: ${{ needs.publish-release.outputs.darwin_intel_asset }}
          INTEL_SHA: ${{ needs.publish-release.outputs.darwin_intel_sha }}
        run: |
          set -euo pipefail
          # These values become Ruby literals as well as shell data.
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          for asset in "$ARM_ASSET" "$INTEL_ASSET"; do
            [[ "$asset" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]
          done
          for sha in "$ARM_SHA" "$INTEL_SHA"; do
            [[ "$sha" =~ ^[0-9a-fA-F]{64}$ ]]
          done
          BASE_URL="https://github.com/constellation-works/orbit/releases/download/v${VERSION}"
          FORMULA="tap/Formula/orbit.rb"

          mkdir -p tap/Formula
          cat > "$FORMULA" <<RUBY
          class Orbit < Formula
            desc "Local-first agentic workflow engine for agent-driven software delivery"
            homepage "https://github.com/constellation-works/orbit"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "${BASE_URL}/${ARM_ASSET}"
                sha256 "${ARM_SHA}"
              end

              on_intel do
                url "${BASE_URL}/${INTEL_ASSET}"
                sha256 "${INTEL_SHA}"
              end
            end

            def install
              odie "Orbit Homebrew releases currently support macOS only. Use install.sh on Linux." if OS.linux?
              bin.install "orbit"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/orbit --version")
            end
          end
          RUBY

          cat "$FORMULA"

      - name: Commit and push tap update
        shell: bash
        env:
          VERSION: ${{ needs.publish-release.outputs.version }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add Formula/orbit.rb

          if git diff --cached --quiet; then
            echo "Formula already up to date."
            exit 0
          fi

          git commit -m "orbit v${VERSION}"
          # Authenticate this command only; leave no credential in tap/.git.
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TAP_GITHUB_TOKEN" | base64 | tr -d '\n')" \
            git push

  smoke-install-macos:
    name: Smoke test installer on macOS arm64
    needs: publish-release
    runs-on: macos-15
    steps:
      - name: Run installer
        shell: bash
        env:
          INSTALL_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/install.sh
        run: |
          set -euo pipefail
          INSTALL_DIR="$RUNNER_TEMP/orbit/bin"
          curl -sSfL "$INSTALL_URL" | ORBIT_INSTALL_DIR="$INSTALL_DIR" ORBIT_VERSION="${GITHUB_REF_NAME}" sh
          export PATH="$INSTALL_DIR:$PATH"
          orbit --version
          orbit search --help

  smoke-install-ubuntu:
    name: Smoke test installer on Ubuntu 24.04
    needs: publish-release
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
    steps:
      - name: Install prerequisites
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates curl openssl tar

      - name: Run installer
        shell: bash
        env:
          INSTALL_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/install.sh
          # The container runs the installer as root with no unprivileged Orbit
          # user, which is the image-build case: the image owns the sandbox
          # packages, so the installer leaves them alone.
          ORBIT_SKIP_HOST_PREREQUISITES: "1"
        run: |
          set -euo pipefail
          INSTALL_DIR="/tmp/orbit/bin"
          curl -sSfL "$INSTALL_URL" | ORBIT_INSTALL_DIR="$INSTALL_DIR" ORBIT_VERSION="${GITHUB_REF_NAME}" sh
          export PATH="$INSTALL_DIR:$PATH"
          orbit --version
          orbit search --help

  smoke-install-ubuntu-2204-bundled-bwrap:
    # The installer installs the signed bundled Bubblewrap only when no capable
    # host wrapper exists and no package manager can supply one. The runner is
    # not that host: Ubuntu 22.04's apt Bubblewrap (0.6.1) supports --bind-fd,
    # so a plain install uses the host wrapper and never reaches the bundled
    # path. Pinning the package away does not work either: a failed
    # `apt-get install` aborts the installer before the fallback. So this job
    # removes Bubblewrap and hides apt-get to reach the no-package-manager
    # branch, then checks the bundled binary is installed and passes the
    # unprivileged capability probe. The Ubuntu 24.04 smoke installs the binary
    # for image builds with host prerequisites skipped; no native release smoke
    # covers host-package preparation.
    name: Smoke test bundled Bubblewrap on Ubuntu 22.04
    needs: publish-release
    runs-on: ubuntu-22.04
    steps:
      - name: Remove host Bubblewrap and package manager
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get remove --purge --yes bubblewrap
          sudo mv /usr/bin/apt-get /usr/bin/apt-get.disabled
          for path in /usr/bin/bwrap /usr/bin/apt-get /usr/bin/dnf /usr/bin/dnf5 /usr/bin/pacman /usr/bin/zypper; do
            if [ -e "$path" ]; then
              echo "::error::$path still exists; the installer would not take the bundled Bubblewrap path"
              exit 1
            fi
          done

      - name: Run installer
        shell: bash
        env:
          INSTALL_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/install.sh
        run: |
          set -euo pipefail
          INSTALL_DIR="$RUNNER_TEMP/orbit/bin"
          curl -sSfL "$INSTALL_URL" | ORBIT_INSTALL_DIR="$INSTALL_DIR" ORBIT_VERSION="${GITHUB_REF_NAME}" sh 2>&1 | tee "$RUNNER_TEMP/install.log"
          # `ready` is reported only after the unprivileged capability probe
          # passes on the wrapper named here.
          grep -E "Linux sandbox: ready .* with the bundled Bubblewrap .* at /usr/local/libexec/orbit/bwrap; installed from this Orbit release" "$RUNNER_TEMP/install.log"
          test "$(stat -c '%U:%G %a' /usr/local/libexec/orbit/bwrap)" = "root:root 755"
          /usr/local/libexec/orbit/bwrap --version
          # A fresh probe finds the installed bundled binary and needs no changes.
          "$INSTALL_DIR/orbit" init --host-prerequisites-only --non-interactive 2>&1 | tee "$RUNNER_TEMP/reprobe.log"
          grep -E "Linux sandbox: ready .* with the bundled Bubblewrap .* at /usr/local/libexec/orbit/bwrap; no host changes needed" "$RUNNER_TEMP/reprobe.log"
