name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build ${{ matrix.slug }}
    runs-on: ${{ matrix.runs_on }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS builds both binaries on one runner — no glibc constraint.
          - slug: darwin-arm64
            target: aarch64-apple-darwin
            runs_on: macos-15
            cli: true
            companion: true
            cli_asset: orbit-aarch64-apple-darwin.tar.gz
            companion_asset: orbit-search-companion-macos-aarch64
          # Intel macOS: CLI only. ort-sys (rc.12) has no ONNX Runtime
          # prebuilt for x86_64-apple-darwin, so the companion can't link
          # here; semantic search is unsupported on Intel macs.
          - slug: darwin-x86_64
            target: x86_64-apple-darwin
            runs_on: macos-15-intel
            cli: true
            companion: false
            cli_asset: orbit-x86_64-apple-darwin.tar.gz
          # Linux CLI builds on ubuntu-22.04 (glibc 2.35) to keep the CLI's
          # runtime compatibility floor low for older distros.
          - slug: linux-x86_64-cli
            target: x86_64-unknown-linux-gnu
            runs_on: ubuntu-22.04
            cli: true
            companion: false
            cli_asset: orbit-x86_64-unknown-linux-gnu.tar.gz
          - slug: linux-arm64-cli
            target: aarch64-unknown-linux-gnu
            runs_on: ubuntu-22.04-arm
            cli: true
            companion: false
            cli_asset: orbit-aarch64-unknown-linux-gnu.tar.gz
          # Linux companion builds on ubuntu-24.04 (glibc 2.39): the prebuilt
          # ONNX Runtime that orbit-search-companion links references glibc
          # 2.38+ symbols (__isoc23_*) absent on 22.04. The companion already
          # requires glibc 2.38+ at runtime regardless of build host.
          - slug: linux-x86_64-companion
            target: x86_64-unknown-linux-gnu
            runs_on: ubuntu-24.04
            cli: false
            companion: true
            companion_asset: orbit-search-companion-linux-x86_64
          - slug: linux-arm64-companion
            target: aarch64-unknown-linux-gnu
            runs_on: ubuntu-24.04-arm
            cli: false
            companion: true
            companion_asset: orbit-search-companion-linux-aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2026-05-07)
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.slug }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ matrix.slug }}-cargo-release-
            ${{ runner.os }}-${{ runner.arch }}-cargo-release-

      - name: Build release binary
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.cli }}" = "true" ]; then
            cargo build -p orbit-cli --release --locked --target "${{ matrix.target }}"
            "./target/${{ matrix.target }}/release/orbit" --version
          fi
          if [ "${{ matrix.companion }}" = "true" ]; then
            cargo build -p orbit-search --features companion --bin orbit-search-companion --release --locked --target "${{ matrix.target }}"
            "./target/${{ matrix.target }}/release/orbit-search-companion" --version-info
          fi

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "${{ matrix.cli }}" = "true" ]; then
            tar -czf "dist/${{ matrix.cli_asset }}" -C "target/${{ matrix.target }}/release" orbit
          fi
          if [ "${{ matrix.companion }}" = "true" ]; then
            cp "target/${{ matrix.target }}/release/orbit-search-companion" "dist/${{ matrix.companion_asset }}"
            chmod 755 "dist/${{ matrix.companion_asset }}"
          fi
          ls -lh dist

      - name: Upload packaged artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.slug }}
          path: dist/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      darwin_arm_asset: ${{ steps.metadata.outputs.darwin_arm_asset }}
      darwin_arm_sha: ${{ steps.metadata.outputs.darwin_arm_sha }}
      darwin_intel_asset: ${{ steps.metadata.outputs.darwin_intel_asset }}
      darwin_intel_sha: ${{ steps.metadata.outputs.darwin_intel_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download packaged artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          ls -lh dist
          (
            cd dist
            expected_assets=(
              orbit-aarch64-apple-darwin.tar.gz
              orbit-aarch64-unknown-linux-gnu.tar.gz
              orbit-x86_64-apple-darwin.tar.gz
              orbit-x86_64-unknown-linux-gnu.tar.gz
              orbit-search-companion-macos-aarch64
              orbit-search-companion-linux-aarch64
              orbit-search-companion-linux-x86_64
            )
            for asset in "${expected_assets[@]}"; do
              [ -f "$asset" ] || {
                echo "missing release asset: $asset" >&2
                exit 1
              }
            done
            sha256sum "${expected_assets[@]}" | sort -k 2 > orbit-checksums.txt
          )
          cat dist/orbit-checksums.txt

      - name: Sign checksums
        shell: bash
        env:
          ORBIT_RELEASE_SIGNING_KEY_PEM: ${{ secrets.ORBIT_RELEASE_SIGNING_KEY_PEM }}
        run: |
          set -euo pipefail
          if [ -z "${ORBIT_RELEASE_SIGNING_KEY_PEM:-}" ]; then
            echo "ORBIT_RELEASE_SIGNING_KEY_PEM must contain the private key matching npm/release-signing.pub" >&2
            exit 1
          fi

          signing_key="$(mktemp)"
          trap 'rm -f "$signing_key"' EXIT
          printf '%s\n' "$ORBIT_RELEASE_SIGNING_KEY_PEM" > "$signing_key"
          chmod 600 "$signing_key"

          openssl dgst -sha256 \
            -sign "$signing_key" \
            -out dist/orbit-checksums.txt.sig \
            dist/orbit-checksums.txt
          openssl dgst -sha256 \
            -verify npm/release-signing.pub \
            -signature dist/orbit-checksums.txt.sig \
            dist/orbit-checksums.txt

      - name: Capture release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          DARWIN_ARM_ASSET="orbit-aarch64-apple-darwin.tar.gz"
          DARWIN_INTEL_ASSET="orbit-x86_64-apple-darwin.tar.gz"
          DARWIN_ARM_SHA="$(awk '$2 == "'"$DARWIN_ARM_ASSET"'" { print $1 }' dist/orbit-checksums.txt)"
          DARWIN_INTEL_SHA="$(awk '$2 == "'"$DARWIN_INTEL_ASSET"'" { print $1 }' dist/orbit-checksums.txt)"

          [ -n "$DARWIN_ARM_SHA" ]
          [ -n "$DARWIN_INTEL_SHA" ]

          {
            echo "version=$VERSION"
            echo "darwin_arm_asset=$DARWIN_ARM_ASSET"
            echo "darwin_arm_sha=$DARWIN_ARM_SHA"
            echo "darwin_intel_asset=$DARWIN_INTEL_ASSET"
            echo "darwin_intel_sha=$DARWIN_INTEL_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            dist/orbit-aarch64-apple-darwin.tar.gz
            dist/orbit-aarch64-unknown-linux-gnu.tar.gz
            dist/orbit-x86_64-apple-darwin.tar.gz
            dist/orbit-x86_64-unknown-linux-gnu.tar.gz
            dist/orbit-search-companion-macos-aarch64
            dist/orbit-search-companion-linux-aarch64
            dist/orbit-search-companion-linux-x86_64
            dist/orbit-checksums.txt
            dist/orbit-checksums.txt.sig
          generate_release_notes: true

  cursor-marketplace-followup:
    # Visible reminder only; does not publish the Cursor catalog and must not
    # block GitHub Release, Homebrew, or installer smokes. Acknowledgements
    # land on agent-main after the tag, so a re-run can observe the receipt
    # without moving the immutable release tag.
    name: Cursor marketplace follow-up
    needs: publish-release
    if: ${{ !cancelled() && needs.publish-release.result == 'success' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent-main

      - name: Remind maintainer to update the Cursor listing
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/cursor-marketplace-followup.sh --version "${GITHUB_REF_NAME#v}"

  bump-homebrew-tap:
    name: Update Homebrew tap
    needs: publish-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout tap repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: constellation-works/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: tap

      - name: Update formula
        shell: bash
        run: |
          VERSION="${{ needs.publish-release.outputs.version }}"
          ARM_ASSET="${{ needs.publish-release.outputs.darwin_arm_asset }}"
          ARM_SHA="${{ needs.publish-release.outputs.darwin_arm_sha }}"
          INTEL_ASSET="${{ needs.publish-release.outputs.darwin_intel_asset }}"
          INTEL_SHA="${{ needs.publish-release.outputs.darwin_intel_sha }}"
          BASE_URL="https://github.com/constellation-works/orbit/releases/download/v${VERSION}"
          FORMULA="tap/Formula/orbit.rb"

          mkdir -p tap/Formula
          cat > "$FORMULA" <<RUBY
          class Orbit < Formula
            desc "Local-first agentic workflow engine for agent-driven software delivery"
            homepage "https://github.com/constellation-works/orbit"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "${BASE_URL}/${ARM_ASSET}"
                sha256 "${ARM_SHA}"
              end

              on_intel do
                url "${BASE_URL}/${INTEL_ASSET}"
                sha256 "${INTEL_SHA}"
              end
            end

            def install
              odie "Orbit Homebrew releases currently support macOS only. Use install.sh on Linux." if OS.linux?
              bin.install "orbit"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/orbit --version")
            end
          end
          RUBY

          cat "$FORMULA"

      - name: Commit and push tap update
        shell: bash
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add Formula/orbit.rb

          if git diff --cached --quiet; then
            echo "Formula already up to date."
            exit 0
          fi

          git commit -m "orbit v${{ needs.publish-release.outputs.version }}"
          git push

  smoke-install-macos:
    name: Smoke test installer on macOS arm64
    needs: publish-release
    runs-on: macos-15
    steps:
      - name: Run installer
        shell: bash
        env:
          INSTALL_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/install.sh
        run: |
          set -euo pipefail
          INSTALL_DIR="$RUNNER_TEMP/orbit/bin"
          curl -sSfL "$INSTALL_URL" | ORBIT_INSTALL_DIR="$INSTALL_DIR" ORBIT_VERSION="${GITHUB_REF_NAME}" sh
          export PATH="$INSTALL_DIR:$PATH"
          orbit --version
          SMOKE_ROOT="$(mktemp -d)"
          export HOME="$SMOKE_ROOT/home"
          export XDG_CACHE_HOME="$SMOKE_ROOT/cache"
          WORKSPACE_DIR="$SMOKE_ROOT/workspace"
          mkdir -p "$HOME" "$XDG_CACHE_HOME" "$WORKSPACE_DIR"
          cd "$WORKSPACE_DIR"
          orbit semantic install --json
          test -x "$HOME/.orbit/embed/bin/orbit-search-companion-macos-aarch64"
          test -f "$HOME/.orbit/embed/models/bge-small/orbit-model.json"

  smoke-install-ubuntu:
    name: Smoke test installer on Ubuntu 24.04
    needs: publish-release
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
    steps:
      - name: Install prerequisites
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates curl openssl tar

      - name: Run installer
        shell: bash
        env:
          INSTALL_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/install.sh
        run: |
          set -euo pipefail
          INSTALL_DIR="/tmp/orbit/bin"
          curl -sSfL "$INSTALL_URL" | ORBIT_INSTALL_DIR="$INSTALL_DIR" ORBIT_VERSION="${GITHUB_REF_NAME}" sh
          export PATH="$INSTALL_DIR:$PATH"
          orbit --version
          SMOKE_ROOT="$(mktemp -d)"
          export HOME="$SMOKE_ROOT/home"
          export XDG_CACHE_HOME="$SMOKE_ROOT/cache"
          WORKSPACE_DIR="$SMOKE_ROOT/workspace"
          mkdir -p "$HOME" "$XDG_CACHE_HOME" "$WORKSPACE_DIR"
          cd "$WORKSPACE_DIR"
          orbit semantic install --json
          test -x "$HOME/.orbit/embed/bin/orbit-search-companion-linux-x86_64"
          test -f "$HOME/.orbit/embed/models/bge-small/orbit-model.json"
