name: Website

on:
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  push:
    branches:
      - main
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check website
        run: npm run check

      - name: Build website
        run: npm run build

      - name: Validate security.txt
        run: |
          npm run validate:security-txt -- public/.well-known/security.txt
          npm run validate:security-txt -- dist/.well-known/security.txt

      - name: Check transport-security policy
        run: |
          set -euo pipefail
          test -f dist/_headers
          # ORB-11461 / e2454bcb0: Cloudflare emits the policy with indentation.
          grep -E '^[[:space:]]*Strict-Transport-Security: max-age=31536000$' dist/_headers

      - name: Attach publication provenance
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          SOURCE_REVISION: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';

          const metadata = {
            schemaVersion: 1,
            sourceRevision: process.env.SOURCE_REVISION,
            sourceRef: process.env.SOURCE_REF,
            runUrl: process.env.SOURCE_RUN_URL,
          };
          await writeFile('dist/deployment.json', `${JSON.stringify(metadata, null, 2)}\n`);
          NODE

      - name: Upload static site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: website-${{ github.sha }}
          path: website/dist
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to Cloudflare Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: website-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download static site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: website-${{ github.sha }}
          path: website/dist

      - name: Resolve existing Pages project
        id: target
        env:
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$PAGES_PROJECT" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "Set production environment variable CLOUDFLARE_PAGES_PROJECT to the existing Pages project serving orbit-cli.com" >&2
            exit 1
          fi
          printf 'project=%s\n' "$PAGES_PROJECT" >> "$GITHUB_OUTPUT"

      - name: Deploy static site
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          workingDirectory: website
          wranglerVersion: "4.129.0"
          command: pages deploy dist --project-name=${{ steps.target.outputs.project }} --branch=main --commit-hash=${{ github.sha }}

      - name: Verify deployment and custom domain
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          EXPECTED_REVISION: ${{ github.sha }}
          PUBLIC_URL: https://orbit-cli.com
        shell: bash
        run: |
          set -euo pipefail

          verify_site() {
            local base_url="${1%/}"
            local homepage
            local metadata

            for _ in {1..12}; do
              homepage="$(curl --fail --silent --show-error --max-time 20 "$base_url/")" || true
              metadata="$(curl --fail --silent --show-error "$base_url/deployment.json")" || true
              if grep -Fq 'Run coding agents as tracked, reviewable tasks.' <<<"$homepage" \
                && grep -Fq 'Other delivery modes' <<<"$homepage" \
                && curl --fail --silent --show-error --max-time 20 \
                  "$base_url/getting-started/install/" >/dev/null \
                && METADATA="$metadata" node --input-type=module --eval \
                  "const metadata = JSON.parse(process.env.METADATA ?? '{}'); if (metadata.sourceRevision !== process.env.EXPECTED_REVISION) process.exit(1);"
              then
                return 0
              fi
              sleep 5
            done

            echo "expected homepage, setup explorer, install route, and source revision did not reach $base_url" >&2
            return 1
          }

          test -n "$DEPLOYMENT_URL"
          verify_site "$DEPLOYMENT_URL"
          verify_site "$PUBLIC_URL"

          verify_security_txt() {
            local base_url="${1%/}"
            local body
            local headers
            local status

            body="$(mktemp)"
            headers="$(mktemp)"
            status="$(curl --silent --show-error --max-time 20 \
              --dump-header "$headers" --output "$body" --write-out '%{http_code}' \
              "$base_url/.well-known/security.txt")"
            test "$status" = 200
            grep -Eiq '^content-type:[[:space:]]*text/plain(?:;|$)' "$headers"
            node website/scripts/validate-security-txt.mjs "$body"
            rm -f "$body" "$headers"
          }

          verify_security_txt "$DEPLOYMENT_URL"
          verify_security_txt "$PUBLIC_URL"

          verify_hsts() {
            local url="$1"
            local expected_status="$2"
            local headers
            local status

            headers="$(mktemp)"
            status="$(curl --silent --show-error --max-time 20 \
              --dump-header "$headers" --output /dev/null --write-out '%{http_code}' "$url")"
            test "$status" = "$expected_status"
            grep -Eiq '^strict-transport-security:[[:space:]]*max-age=31536000[[:space:]]*$' "$headers"
            rm -f "$headers"
          }

          verify_http_redirect() {
            local headers
            local status

            headers="$(mktemp)"
            status="$(curl --silent --show-error --max-time 20 \
              --dump-header "$headers" --output /dev/null --write-out '%{http_code}' http://orbit-cli.com/)"
            test "$status" -ge 301
            test "$status" -le 399
            grep -Eiq '^location:[[:space:]]*https://orbit-cli\.com/' "$headers"
            rm -f "$headers"
          }

          verify_hsts "$PUBLIC_URL/" 200
          verify_hsts "$PUBLIC_URL/getting-started/install/" 200
          verify_hsts "$PUBLIC_URL/hsts-verification-missing-route" 404
          verify_http_redirect
