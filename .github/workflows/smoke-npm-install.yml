name: smoke-npm-install

# Exercises the published @orbit-tools/cli@latest npm proxy and the GitHub
# Release binary it downloads. Catches registry/release drift and failures in
# the postinstall-to-MCP chain.

on:
  schedule:
    # Mondays 12:00 UTC. Cheap weekly heartbeat that fails loudly if a
    # release ever leaves the chain in a broken state.
    - cron: "0 12 * * 1"
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag to verify (for example, v0.14.0)"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Validate MCP Registry metadata
        shell: bash
        run: |
          set -euo pipefail
          archive="$(mktemp)"
          trap 'rm -f "$archive"' EXIT
          curl -LsSf "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" -o "$archive"
          tar xzf "$archive" mcp-publisher
          ./mcp-publisher validate server.json

      - name: Run npm install smoke
        shell: bash
        env:
          SMOKE_NPM_INSTALL_TAG: ${{ inputs.tag || '' }}
        run: ./scripts/smoke-npm-install.sh
