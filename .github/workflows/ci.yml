name: CI

on:
  push:
    branches: [main, agent-main]
  pull_request:
  workflow_dispatch:

# Superseded PR heads must not compete with their replacement. Pushes share
# one group per branch without cancellation, as in ci-macos.yml: one run
# executes and one waits, and a newer push replaces the waiting run. Scope
# narrowing must account for an untested previous tip (see the scope job).
# A workflow_dispatch run falls through to the per-run group below, so a
# deploy-candidate dispatch for a chosen SHA is never queued behind, replaced
# or cancelled by later agent-main pushes (see docs/DEVELOPMENT.md, Hosted CI).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && format('push-{0}', github.ref) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # ENOSPC controls for ephemeral runners. Disk admission below measures
  # the current image rather than assuming an old image's free space. Incremental
  # artifacts roughly double target/ and are useless on ephemeral runners;
  # debuginfo is the single biggest target-size lever. Coverage runs in
  # coverage.yml with its own line tables, and nothing in these jobs reads
  # debuginfo: panic locations are compiled in without it, and no job sets
  # RUST_BACKTRACE. Dropping line tables from the dev and test profiles (deps
  # included) shrinks the largest test binary by about 45% and cut the
  # workspace suites' CPU time by about a fifth in a local comparison. Both
  # profiles change so dev- and test-profile units keep one setting.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # Symbol tables and names occupied 103 MiB of the 268 MiB CLI without
  # debuginfo. Strip them to reduce archive packing, transfer and extraction
  # on the critical path. Tests keep their compiled-in names and panic locations;
  # coverage and release builds use their own workflows and profile settings.
  CARGO_PROFILE_DEV_STRIP: "symbols"
  CARGO_PROFILE_TEST_STRIP: "symbols"
  # [ORB-11390] The protected SSH process-metadata regression may self-skip in
  # restricted local/agent sandboxes, but ubuntu-latest must exercise it.
  ORBIT_REQUIRE_PROTECTED_SSH_REGRESSION: "1"
  NEXTEST_VERSION: 0.9.136
  # Parallel nextest jobs: the partition guard, each shard's partition and the
  # Check job's wait read this value; the literal "Test shard k/N" jobs must
  # match it (scripts/test-pr-state-workflows.py).
  NEXTEST_SHARDS: "3"
  # Twelve count partitions run on twelve test runners. The build runner
  # publishes the archive, then proves exact-once coverage and runs doctests;
  # it no longer delays a partition behind that post-upload work. Literal
  # "Test shard k/N" names and the agent-main ruleset remain unchanged.
  # [ORB-21420] Replaying two full runs' logged test durations, a sixth
  # partition cut the slowest partition's summed test time by 27-30%
  # (docs/design-patterns/test_strategy.md).
  # Full-run partition 2 spent 144 s on 501 tests, with 859.8 summed test
  # seconds and a 58.8 s longest case (run 42757620515). Four more runners
  # target that CPU-bound tail and add four downloads of the same archive.
  NEXTEST_PARTITIONS: "12"
  # The nextest transfer travels as this many artifacts, which each shard
  # downloads in parallel. One stream from the artifact store ran at 3-10 MB/s
  # on some runners (153 s for 448 MB); the "Upload nextest archive part k/N"
  # steps must match it (scripts/test-pr-state-workflows.py).
  NEXTEST_ARCHIVE_PARTS: "4"
  NEXTEST_LINUX_SHA256: a098eed56f2dd88c7fdca1e554a6b99fa1ffbd2a7a1c41b865700112981f6f52
  CARGO_DENY_VERSION: 0.19.9
  CARGO_DENY_LINUX_SHA256: f1f8eedc2a3ac297c540873f93785d4104b102c0079506b2a6b3221b7ec956af
  # [ORB-13017] The uv-locked Python plugin fixture runs its backend through
  # uv. Keep in sync with UV_VERSION in ci-macos.yml.
  UV_VERSION: 0.11.28
  UV_LINUX_SHA256: e490a6464492183c5d4534a5527fb4440f7f2bb2f228162ad7e4afe076dc0224
  # [ORB-16349] Same pinned-tarball convention as the tools above. The digest is
  # the SHA-256 of the release asset, computed locally from its download.
  RIPGREP_VERSION: 14.1.1
  RIPGREP_LINUX_SHA256: 4cf9f2741e6c465ffdb7c26f38056a59e2a2544b51f7cc128ef28337eeae4d8e
  # Keep in sync with [workspace.package] rust-version in Cargo.toml.
  MSRV: "1.89"

jobs:
  # Read live state before allocating build runners; the PR event can be stale.
  pr-state:
    name: Live PR state
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read
    outputs:
      state: ${{ steps.state.outputs.state }}
    steps:
      - name: Read live PR state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh api --method GET 'repos/{owner}/{repo}/pulls/${{ github.event.pull_request.number }}' --jq '
            if .merged == true then "state=merged"
            elif .state == "open" or .state == "closed" then "state=" + .state
            else error("Unexpected pull request state") end
          ' >> "$GITHUB_OUTPUT"

  # Narrows the run before allocating build runners (scripts/ci-change-scope.sh).
  # `docs`: every changed path is Markdown outside crates/ and plugin/, so only
  # `Docs guards` runs; a push also requires a successful completed full check
  # on its BEFORE commit, since that commit's pending run may be replaced.
  # `affected:<crate>,...`: a PR whose changed paths sit in crates/ (Markdown
  # aside); every job runs, but the test build archives only those crates.
  # `skip`: a push whose tree is exactly a merged PR head that already passed
  # `Check / Clippy / Test` on every crate, so nothing reruns. The build and
  # test jobs then report as skipped under their unchanged check names, which
  # required checks and Orbit's landing treat as passing. The job never fails
  # and an empty mode admits the full run, so a scope error costs a full run,
  # never a skipped gate.
  scope:
    needs: pr-state
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.pr-state.outputs.state == 'open') }}
    name: Change scope
    runs-on: ubuntu-latest
    timeout-minutes: 3
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
    steps:
      # The classification reads only the GitHub API, so check out the run's
      # own commit (a PR's merge ref): it always carries this workflow's
      # script, even for a PR branch cut before the script existed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Classify the change
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
        run: scripts/ci-change-scope.sh

  # A docs-only change still runs the file and metadata repository guards
  # (doc links and indexes, the skill mirror and history-note checks):
  # `ci-guardrails.sh --static` needs no Rust build and no network.
  docs:
    needs: [pr-state, scope]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.pr-state.outputs.state == 'open') && needs.scope.outputs.mode == 'docs' }}
    name: Docs guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # Orchestration follows the workflow revision; candidate checks stay at the PR head.
      - &workflow-ci
        name: Check out workflow CI helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          path: .orbit/tmp/workflow-ci
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/ci-await-jobs.py
            /scripts/ci-download-verified.sh
            /scripts/ci-repack-nextest.py
            /scripts/ci-probe-bubblewrap.sh

      - name: Restore ripgrep archive cache
        id: ripgrep-tool-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tool-cache/ripgrep-${{ env.RIPGREP_VERSION }}-${{ env.RIPGREP_LINUX_SHA256 }}/archive
          key: orbit-tool-ripgrep-${{ runner.os }}-linux-x86_64-${{ env.RIPGREP_VERSION }}-${{ env.RIPGREP_LINUX_SHA256 }}
      - name: Install ripgrep
        run: |
          set -euo pipefail
          cargo_bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          mkdir -p .orbit/tmp
          download_dir="$(mktemp -d .orbit/tmp/tool-download.XXXXXX)"
          trap 'python3 -c "import shutil, sys; shutil.rmtree(sys.argv[1])" "$download_dir"' EXIT
          archive="$download_dir/archive"
          mkdir -p "$cargo_bin"
          .orbit/tmp/workflow-ci/scripts/ci-download-verified.sh "https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/ripgrep-${RIPGREP_VERSION}-x86_64-unknown-linux-musl.tar.gz" "$RIPGREP_LINUX_SHA256" "$archive" --cache-file ".tool-cache/ripgrep-${RIPGREP_VERSION}-${RIPGREP_LINUX_SHA256}/archive"
          tar zxf "$archive" --strip-components=1 -C "$cargo_bin" "ripgrep-${RIPGREP_VERSION}-x86_64-unknown-linux-musl/rg"
          rg --version | awk -v expected="${RIPGREP_VERSION}" '{print} $1 == "ripgrep" && $2 == expected {ok=1} END {exit !ok}'

      - name: Save ripgrep archive cache
        if: ${{ github.event_name == 'push' && steps.ripgrep-tool-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tool-cache/ripgrep-${{ env.RIPGREP_VERSION }}-${{ env.RIPGREP_LINUX_SHA256 }}/archive
          key: orbit-tool-ripgrep-${{ runner.os }}-linux-x86_64-${{ env.RIPGREP_VERSION }}-${{ env.RIPGREP_LINUX_SHA256 }}
      - name: Run static repository guards
        run: ./scripts/ci-guardrails.sh --static

  # [ORB-10010] MSRV floor: `rust-version` in [workspace.package] (Cargo.toml).
  # Evidence for 1.89: edition 2024 requires >= 1.85, the highest
  # `rust-version` declared by any dependency in the locked graph is 1.88
  # (time, cookie_store, ort), and workspace code uses the file-locking API
  # (`File::unlock`, stabilized 1.89). This job pins that floor so a future
  # dep bump or new language-feature use that raises the true MSRV fails
  # loudly here instead of silently breaking builds on older toolchains.
  msrv:
    needs: [pr-state, scope]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.pr-state.outputs.state == 'open') && needs.scope.outputs.mode != 'docs' && needs.scope.outputs.mode != 'skip' }}
    name: MSRV (cargo check on pinned minimum)
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Observed ~1 minute; allows cold cache and runner variance.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On pull_request, use the PR head SHA: not the branch name
          # GitHub deletes on merge, and not github.sha (the ephemeral
          # merge commit). On push, use github.sha directly so a run that
          # sat queued still builds and reports on the commit that
          # triggered it, not whatever the branch points to once it starts.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # MSRV 1.89
        with:
          toolchain: "1.89"

      # [DANI-10428] rust-cache keys on the rustc version, so this 1.89 check
      # cache can never collide with the pinned-toolchain jobs; it prunes stale
      # registry/target entries before saving instead of growing to the cap.
      # Pull requests restore only; pushes to main and agent-main save.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust-${{ hashFiles('Cargo.toml') }}
          save-if: ${{ github.event_name == 'push' }}

      - name: Check workspace on MSRV toolchain
        run: |
          set -euo pipefail
          rustc +${MSRV} --version | grep -F "${MSRV}"
          cargo +${MSRV} check --workspace --locked

  # [ORB-16695] The test gate is split across runners. "Test build" compiles
  # the workspace tests once and archives them (on an `affected:` PR, only the
  # affected crates' build set); NEXTEST_SHARDS "Test shard" jobs run nextest
  # from that archive, one count partition each, in parallel, as do the "Test
  # extra partition" and "Test partition 2" and 6–12 jobs. On an
  # `affected:` PR every partition runs only
  # the affected and always-run crates' tests (ALWAYS_RUN in
  # scripts/ci-test-affected.py). [ORB-20394] "CI guardrails" runs the
  # repository guards and self-tests on its own runner beside the build. "Check
  # / Clippy / Test" runs formatting, production Clippy, documentation, an
  # Apple-target type-check and the supply-chain gate, then waits for the
  # build, every shard and both guardrails jobs. It is the job the 400-second
  # budget measures. The type-check does not add a job or a required check.
  ci:
    needs: [pr-state, scope]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.pr-state.outputs.state == 'open') && needs.scope.outputs.mode != 'docs' && needs.scope.outputs.mode != 'skip' }}
    name: Check / Clippy / Test
    runs-on: ubuntu-latest
    timeout-minutes: 45 # Budget is 400 s p90 over pull request runs (docs/design-patterns/test_strategy.md); allows cold builds, slower test hosts and runner queue wait.
    permissions:
      contents: read
      # Read this run's job states while awaiting the test jobs.
      actions: read
    env:
      # Production Clippy and documentation chain through clippy-driver, which
      # sccache cannot cache, as in the test build.
      ORBIT_COMPILER_CACHE: "0"
    steps:
      # Hosted Ubuntu 24.04 measurements: 86 GiB initially free, 112 GiB
      # after tool cleanup, 99 GiB after cache restore/build/tests. Admit
      # only with 32 GiB free (>2x that 13 GiB growth plus reserve); retain
      # cleanup for smaller images and fail if it cannot reach the minimum.
      - name: Admit runner disk space
        run: |
          set -euo pipefail
          started=$SECONDS
          minimum_kib=$((32 * 1024 * 1024))
          available_kib() { df -Pk / | awk 'NR == 2 {print $4}'; }
          echo "runner=${RUNNER_NAME} image=${ImageOS:-unknown}/${ImageVersion:-unknown}"
          echo "Disk before admission:"
          df -h /
          if (( $(available_kib) < minimum_kib )); then
            for path in /usr/local/lib/android /usr/share/dotnet /opt/ghc \
              /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
              /usr/local/share/boost /usr/local/share/powershell /usr/share/swift; do
              sudo rm -rf "$path"
              if (( $(available_kib) >= minimum_kib )); then
                break
              fi
            done
          else
            echo "Cleanup unnecessary: at least 32 GiB available"
          fi
          free_kib="$(available_kib)"
          echo "disk_admission_seconds=$((SECONDS - started)) free_kib=$free_kib minimum_kib=$minimum_kib"
          df -h /
          if (( free_kib < minimum_kib )); then
            echo "::error title=Insufficient runner disk::Need at least 32 GiB free before cache restore and compilation"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On pull_request, use the PR head SHA: not the branch name
          # GitHub deletes on merge, and not github.sha (the ephemeral
          # merge commit). On push, use github.sha directly so a run that
          # sat queued still builds and reports on the commit that
          # triggered it, not whatever the branch points to once it starts.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - *workflow-ci

      # Capture trusted source before any candidate command can persist
      # executable/import search paths for a later action checkout.
      - name: Check out dependency evidence producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          path: .orbit/tmp/dependency-producer
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # Rust 1.98.1
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
          targets: aarch64-apple-darwin

      # [DANI-10428] Rust 1.98.1 dependency cache. rust-cache prunes target/
      # to dependency artifacts and the registry to crates Cargo.lock still
      # references before saving, so the archive stays far below the 10 GB
      # repo cap instead of evicting every other entry; `shared-key` names the
      # toolchain rather than the job. The Check job checks and documents
      # dependencies the test build never compiles, including the
      # aarch64-apple-darwin units of the Apple-target type-check, so it
      # keeps its own entry.
      # Dependencies stay valid when a test fails, so save on failure too.
      # Pull requests restore only; pushes to main and agent-main save.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        id: rust-cache
        with:
          prefix-key: v1-rust-${{ hashFiles('Cargo.toml') }}
          shared-key: rust-1.98.1-checks
          cache-on-failure: true
          save-if: ${{ github.event_name == 'push' }}

      - name: Restore cargo-deny archive cache
        id: cargo-deny-tool-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tool-cache/cargo-deny-${{ env.CARGO_DENY_VERSION }}-${{ env.CARGO_DENY_LINUX_SHA256 }}/archive
          key: orbit-tool-cargo-deny-${{ runner.os }}-linux-x86_64-${{ env.CARGO_DENY_VERSION }}-${{ env.CARGO_DENY_LINUX_SHA256 }}
      - name: Install cargo-deny
        run: |
          set -euo pipefail
          cargo_bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          mkdir -p .orbit/tmp
          download_dir="$(mktemp -d .orbit/tmp/tool-download.XXXXXX)"
          trap 'python3 -c "import shutil, sys; shutil.rmtree(sys.argv[1])" "$download_dir"' EXIT
          archive="$download_dir/archive"
          mkdir -p "$cargo_bin"
          .orbit/tmp/workflow-ci/scripts/ci-download-verified.sh "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz" "$CARGO_DENY_LINUX_SHA256" "$archive" --cache-file ".tool-cache/cargo-deny-${CARGO_DENY_VERSION}-${CARGO_DENY_LINUX_SHA256}/archive"
          tar zxf "$archive" --strip-components=1 -C "$cargo_bin" "cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny"
          cargo deny --version | awk -v expected="${CARGO_DENY_VERSION}" '{print} $1 == "cargo-deny" && $2 == expected {ok=1} END {exit !ok}'

      - name: Save cargo-deny archive cache
        if: ${{ github.event_name == 'push' && steps.cargo-deny-tool-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tool-cache/cargo-deny-${{ env.CARGO_DENY_VERSION }}-${{ env.CARGO_DENY_LINUX_SHA256 }}/archive
          key: orbit-tool-cargo-deny-${{ runner.os }}-linux-x86_64-${{ env.CARGO_DENY_VERSION }}-${{ env.CARGO_DENY_LINUX_SHA256 }}
      - name: Report build inputs
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          echo "tested_head=$(git rev-parse HEAD) runner=${RUNNER_NAME} image=${ImageOS:-unknown}/${ImageVersion:-unknown} cache_hit=${CACHE_HIT}"
          rustc --version
          df -Pk /
          du -sk target "${CARGO_HOME:-$HOME/.cargo}/registry" 2>/dev/null || true

      - name: Run format, Clippy, documentation, Apple-target type-check and supply-chain checks
        run: |
          set -euo pipefail
          TIMEFORMAT='checks_seconds=%R'
          time ./scripts/ci-guardrails.sh --checks

      # The Check job finishes only after the test build, every shard, the
      # partition jobs and the CI guardrails job, so its elapsed time is
      # the whole gate's wall time (the 400-second p90 budget in
      # docs/design-patterns/test_strategy.md) and
      # its conclusion is the gate's result. A failed or skipped test job
      # fails it at once, and a partition-guard failure after the archive
      # upload fails the test build. A named job absent from the run fails
      # it at once instead of waiting out the timeout.
      # Dependency evidence executes from one complete trusted base tree,
      # including any repository helpers the producer imports.
      - name: Await the test build and nextest shards
        working-directory: .orbit/tmp/dependency-producer
        # Absolute interpreter and isolated startup precede any inherited
        # shell hooks or Python imports. The trusted workflow owns this
        # language-specific implementation of the generic source contract.
        shell: /usr/bin/python3 -I {0}
        env:
          GH_TOKEN: ${{ github.token }}
          ORBIT_DEPENDENCY_JOB_NAME: Check / Clippy / Test
          ORBIT_DEPENDENCY_STEP: Await the test build and nextest shards
          ORBIT_DEPENDENCY_PRODUCER: scripts/ci-await-jobs.py
          ORBIT_DEPENDENCY_PRODUCER_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          ORBIT_DEPENDENCY_EXECUTION: isolated-source-v1
          # Step binding overrides GITHUB_ENV; keep equal to the workflow's
          # shard count (the executable partition fixture checks agreement).
          NEXTEST_SHARDS: "3"
        run: |
          import hashlib
          import os
          import subprocess
          import sys
          import tempfile

          allowed = ("GH_TOKEN", "GITHUB_REPOSITORY", "GITHUB_RUN_ID",
                     "GITHUB_RUN_ATTEMPT", "GITHUB_SHA", "GITHUB_JOB",
                     "GITHUB_WORKFLOW_REF", "ORBIT_DEPENDENCY_JOB_NAME",
                     "ORBIT_DEPENDENCY_STEP", "ORBIT_DEPENDENCY_PRODUCER",
                     "ORBIT_DEPENDENCY_PRODUCER_SHA", "ORBIT_DEPENDENCY_EXECUTION",
                     "NEXTEST_SHARDS")
          clean = {key: os.environ[key] for key in allowed if key in os.environ}
          os.environ.clear()
          os.environ.update(clean, PATH="/usr/bin:/bin", GH_HOST="github.com")
          # No candidate gh aliases/config, proxy, Python, shell, git or
          # executable-search environment reaches the producer or its gh.
          with tempfile.TemporaryDirectory(prefix="orbit-ci-producer-") as config:
              os.environ["GH_CONFIG_DIR"] = config
              # Earlier job steps share the workspace and could have
              # overwritten the trusted checkout. Re-establish the actual
              # producer bytes from the isolated base checkout after the
              # last candidate-controlled operation, before executing them.
              producer = os.environ["ORBIT_DEPENDENCY_PRODUCER"]
              expected_base = os.environ["ORBIT_DEPENDENCY_PRODUCER_SHA"]
              os.environ["GIT_CONFIG_GLOBAL"] = "/dev/null"
              os.environ["GIT_CONFIG_SYSTEM"] = "/dev/null"
              for key in [key for key in os.environ if key.startswith("GIT_")
                          and key not in ("GIT_CONFIG_GLOBAL", "GIT_CONFIG_SYSTEM")]:
                  del os.environ[key]

              def object_id(kind, data):
                  header = f"{kind} {len(data)}\0".encode()
                  return hashlib.sha1(header + data).hexdigest()

              def verified_object(kind, oid):
                  completed = subprocess.run(
                      ["/usr/bin/git", "--no-replace-objects", "cat-file", kind, oid],
                      capture_output=True, timeout=10, check=False)
                  if completed.returncode != 0 or object_id(kind, completed.stdout) != oid:
                      raise SystemExit("producer source object differs from its trusted identity")
                  return completed.stdout

              # Resolve only hash-verified objects from the immutable event
              # base, never mutable HEAD, refs, filters or object filenames.
              commit = verified_object("commit", expected_base)
              tree = commit.split(b"\n", 1)[0].removeprefix(b"tree ").decode("ascii")
              parts = producer.split("/")
              for index, part in enumerate(parts):
                  entries = verified_object("tree", tree)
                  while entries:
                      metadata, separator, rest = entries.partition(b"\0")
                      if not separator or len(rest) < 20:
                          raise SystemExit("producer source tree is malformed")
                      mode, name = metadata.split(b" ", 1)
                      oid, entries = rest[:20].hex(), rest[20:]
                      if name == part.encode():
                          expected_mode = (b"100644", b"100755") if index == len(parts) - 1 else (b"40000",)
                          if mode not in expected_mode:
                              raise SystemExit("producer source path has an unexpected type")
                          tree = oid
                          break
                  else:
                      raise SystemExit("producer is absent from its trusted source")
              with open(producer, "rb") as helper:
                  producer_bytes = helper.read()
              if object_id("blob", producer_bytes) != tree:
                  raise SystemExit("producer helper differs from its trusted source")
              sys.argv = [producer, "--job", "Test build"]
              for shard in range(1, int(os.environ["NEXTEST_SHARDS"]) + 1):
                  sys.argv += ["--job", f"Test shard {shard}/{os.environ['NEXTEST_SHARDS']}"]
              sys.argv += ["--job", "Test extra partition", "--job", "Test partition 2",
                           "--job", "Test partition 6", "--job", "Test partition 7",
                           "--job", "Test partition 8", "--job", "Test partition 9",
                           "--job", "Test partition 10", "--job", "Test partition 11",
                           "--job", "Test partition 12", "--job", "CI guardrails",
                           "--job", "CI QA guardrails"]
              exec(compile(producer_bytes, producer, "exec"),
                   {"__name__": "__main__", "__file__": producer,
                    "__package__": "", "__spec__": None, "__cached__": None,
                    "__loader__": None})

      # [ORB-10126] Confirm disk headroom survived the workspace build/test.
      - name: Report disk usage
        if: always()
        run: |
          df -Pk /
          du -sk target "${CARGO_HOME:-$HOME/.cargo}/registry" 2>/dev/null || true

      # CI runners report bounded provenance only. The host-owned
      # `ci_failure_sweep_pipeline` queries GitHub and is the sole authority
      # that may create durable Orbit remediation tasks. [ORB-11383]
      - &report-ci-failure
        name: Report CI failure for host sweep
        if: failure()
        env:
          WORKFLOW: ${{ format('{0}', github.workflow) }}
          EVENT: ${{ format('{0}', github.event_name) }}
          JOB: ${{ format('{0}', github.job) }}
          REF: ${{ format('{0}', github.ref_name) }}
          EVENT_SHA: ${{ format('{0}', github.sha) }}
          PR_HEAD_SHA: ${{ format('{0}', github.event.pull_request.head.sha) }}
          RUN_ID: ${{ format('{0}', github.run_id) }}
          RUN_ATTEMPT: ${{ format('{0}', github.run_attempt) }}
        run: |
          # This step must never change the job conclusion. `github.sha` can
          # be a PR merge SHA, so retain it separately from both the PR head
          # and the commit the runner actually checked out.
          set +e
          tested_sha="unavailable"
          if command -v git >/dev/null 2>&1; then
            candidate="$(git rev-parse HEAD 2>/dev/null)"
            if [ -n "$candidate" ]; then
              tested_sha="$candidate"
            fi
          fi
          run_url="${GITHUB_SERVER_URL:-}/${GITHUB_REPOSITORY:-}/actions/runs/${RUN_ID:-}"
          printf '%s\n' \
            "CI failure reported for host-owned ci_failure_sweep_pipeline; durable filing happens only on the Orbit host." \
            "workflow=${WORKFLOW:-} event=${EVENT:-} job=${JOB:-} ref=${REF:-}" \
            "run_id=${RUN_ID:-} run_attempt=${RUN_ATTEMPT:-} run_url=${run_url}" \
            "event_sha=${EVENT_SHA:-} pr_head_sha=${PR_HEAD_SHA:-} tested_sha=${tested_sha}"
          exit 0

  # [ORB-20394] Repository guards and self-tests (ci-guardrails.sh --guards-core),
  # on their own runner beside the test build instead of in series before the
  # Check job's wait. They build no workspace target. Check / Clippy / Test
  # awaits this job, so a guard failure still fails the required check.
  guardrails:
    needs: [pr-state, scope]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.pr-state.outputs.state == 'open') && needs.scope.outputs.mode != 'docs' && needs.scope.outputs.mode != 'skip' }}
    name: CI guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # A failed sccache server compiles locally instead of failing the build.
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      ORBIT_COMPILER_CACHE_REQUIRE_NS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          # Body-history completeness needs every first-parent asset revision,
          # and pull request self-test selection diffs against the base.
          fetch-depth: 0

      - *workflow-ci

      - name: Check bundled auto-task body history
        run: |
          scripts/require-python.sh --yaml
          python3 scripts/update-auto-task-body-history.py --check

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # Rust 1.98.1
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy

      # Guards read Cargo metadata and a few self-tests drive small Cargo
      # targets, so this job keeps its own small registry and target entry.
      # Pull requests restore only; pushes to main and agent-main save.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust-${{ hashFiles('Cargo.toml') }}
          shared-key: rust-1.98.1-guards
          cache-on-failure: true
          save-if: ${{ github.event_name == 'push' }}

      # The live enabled-cache namespace regression in the guardrails
      # (ORBIT_COMPILER_CACHE_REQUIRE_NS) needs a real sccache, installed and
      # verified by the existing pinned installer. With it installed, the
      # wrapper is enabled for this job's compiles too, each through a fresh
      # runner-local cache: nothing is restored or saved across runs. An
      # install failure turns the wrapper off and the regression reports
      # itself not applicable.
      - name: Install sccache for the compiler-cache namespace regression
        id: compiler-setup
        run: |
          set -euo pipefail
          started=$(date +%s)
          mkdir -p .orbit/tmp
          install_log=$(mktemp .orbit/tmp/compiler-install.XXXXXX)
          export TMPDIR="$PWD/.orbit/tmp"
          cache_bin="$HOME/.orbit/cache/bin/sccache"
          ready=false
          if timeout 60s scripts/compiler-cache.sh setup --install >"$install_log" 2>&1 \
            && timeout 10s "$cache_bin" --version >>"$install_log" 2>&1; then
            ready=true
          else
            echo '::warning::sccache install failed; using ordinary rustc'
          fi
          sed -n '1,40p' "$install_log"
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" = false ]; then
            echo 'ORBIT_COMPILER_CACHE=0' >> "$GITHUB_ENV"
          fi
          echo "ORBIT_COMPILER_CACHE_BIN=$cache_bin" >> "$GITHUB_ENV"
          echo "compiler_cache_setup_seconds=$(($(date +%s) - started)) ready=$ready"

      # The guardrail scripts shell out to ripgrep; the ubuntu-latest runner
      # image no longer ships it, and a missing `rg` makes
      # check-error-translation.sh read empty search results as "translator
      # missing" (false failures on every crate). [ORB-10021]
      # [ORB-16349] Pinned and checksum-verified like the other tools, instead
      # of an unpinned apt install.
      - name: Restore ripgrep archive cache
        id: ripgrep-tool-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tool-cache/ripgrep-${{ env.RIPGREP_VERSION }}-${{ env.RIPGREP_LINUX_SHA256 }}/archive
          key: orbit-tool-ripgrep-${{ runner.os }}-linux-x86_64-${{ env.RIPGREP_VERSION }}-${{ env.RIPGREP_LINUX_SHA256 }}
      - name: Install ripgrep
        run: |
          set -euo pipefail
          cargo_bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          mkdir -p .orbit/tmp
          download_dir="$(mktemp -d .orbit/tmp/tool-download.XXXXXX)"
          trap 'python3 -c "import shutil, sys; shutil.rmtree(sys.argv[1])" "$download_dir"' EXIT
          archive="$download_dir/archive"
          mkdir -p "$cargo_bin"
          .orbit/tmp/workflow-ci/scripts/ci-download-verified.sh "https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/ripgrep-${RIPGREP_VERSION}-x86_64-unknown-linux-musl.tar.gz" "$RIPGREP_LINUX_SHA256" "$archive" --cache-file ".tool-cache/ripgrep-${RIPGREP_VERSION}-${RIPGREP_LINUX_SHA256}/archive"
          tar zxf "$archive" --strip-components=1 -C "$cargo_bin" "ripgrep-${RIPGREP_VERSION}-x86_64-unknown-linux-musl/rg"
          rg --version | awk -v expected="${RIPGREP_VERSION}" '{print} $1 == "ripgrep" && $2 == expected {ok=1} END {exit !ok}'

      - name: Save ripgrep archive cache
        if: ${{ github.event_name == 'push' && steps.ripgrep-tool-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tool-cache/ripgrep-${{ env.RIPGREP_VERSION }}-${{ env.RIPGREP_LINUX_SHA256 }}/archive
          key: orbit-tool-ripgrep-${{ runner.os }}-linux-x86_64-${{ env.RIPGREP_VERSION }}-${{ env.RIPGREP_LINUX_SHA256 }}

      # Ubuntu 24.04 can restrict unprivileged user namespaces through AppArmor.
      # Probe the trusted Bubblewrap first, preparing signed packages if needed.
      # Here the live compiler-cache namespace self-test needs it
      # (ORBIT_COMPILER_CACHE_REQUIRE_NS); in the shard jobs, the probe-gated
      # portable tests. This may add apt package setup and AppArmor loading
      # before the guardrails; a setup failure therefore preempts their output.
      # The shards show successful nextest output immediately, increasing log
      # volume so the live assertions are visible. The profile is ephemeral,
      # and the global user-namespace controls are never changed.
      #
      # Every phase is bounded and reports its start and elapsed seconds as it
      # runs: a hosted-runner `apt-get update` once went silent for 45 minutes
      # until the job was cancelled and `Check / Clippy / Test` hit the
      # ci-await timeout. A stall now fails here with `Bubblewrap unavailable`
      # naming the phase. Only a transient apt failure (a lock, a fetch failure
      # or a timeout) is retried, once, after `dpkg --configure -a` finishes any
      # unpack the killed attempt left interrupted; a probe that fails or hangs
      # is never retried. The step budget (480 s)
      # sits inside timeout-minutes, which sits far inside the 2400 s ci-await
      # window. [ORB-20643]
      - &bubblewrap-probe
        name: Prepare and probe Bubblewrap for the Linux boundary tests
        timeout-minutes: 10
        run: bash .orbit/tmp/workflow-ci/scripts/ci-probe-bubblewrap.sh

      - name: Run CI guardrails
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pull requests run the self-tests whose inputs changed against the
          # base; a push runs every self-test.
          CI_SELF_TESTS: ${{ github.event_name == 'pull_request' && 'changed' || 'all' }}
          CI_TEST_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          TIMEFORMAT='guardrails_seconds=%R'
          time ./scripts/ci-guardrails.sh --guards-core

      # CI runners report bounded provenance only. The host-owned
      # `ci_failure_sweep_pipeline` queries GitHub and is the sole authority
      # that may create durable Orbit remediation tasks. [ORB-11383]
      - *report-ci-failure

  # The QA process fixture was the guard pool's longest member (386 s in
  # run 42757620515). Give it a separate standard runner so it and the
  # dependency-direction suite do not contend for the same four CPUs.
  # Check awaits both jobs, including failures. This adds one runner per full
  # or affected run, with no additional workspace build or archive download.
  guardrails-qa:
    needs: [pr-state, scope]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.pr-state.outputs.state == 'open') && needs.scope.outputs.mode != 'docs' && needs.scope.outputs.mode != 'skip' }}
    name: CI QA guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          # Use the same base and complete history as the core guardrails job.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # Rust 1.98.1
        with:
          toolchain: "1.98.1"

      - name: Run CI QA guardrails
        env:
          CI_SELF_TESTS: ${{ github.event_name == 'pull_request' && 'changed' || 'all' }}
          CI_TEST_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          TIMEFORMAT='qa_guardrails_seconds=%R'
          time ./scripts/ci-guardrails.sh --guards-qa

      # CI runners report bounded provenance only. The host-owned
      # `ci_failure_sweep_pipeline` queries GitHub and is the sole authority
      # that may create durable Orbit remediation tasks. [ORB-11383]
      - *report-ci-failure

  test-build:
    needs: [pr-state, scope]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.pr-state.outputs.state == 'open') && needs.scope.outputs.mode != 'docs' && needs.scope.outputs.mode != 'skip' }}
    name: Test build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The repository's rustc wrapper (.cargo/config.toml) execs rustc
      # directly. Every unit this job compiles is a workspace member chained
      # through clippy-driver, which sccache cannot cache, and rust-cache
      # restores every dependency, so a compiler-object cache had no work
      # (docs/runbooks/compiler-cache.md#ordinary-linux-ci).
      ORBIT_COMPILER_CACHE: "0"
    steps:
      - name: Admit runner disk space
        run: |
          set -euo pipefail
          started=$SECONDS
          minimum_kib=$((32 * 1024 * 1024))
          available_kib() { df -Pk / | awk 'NR == 2 {print $4}'; }
          echo "runner=${RUNNER_NAME} image=${ImageOS:-unknown}/${ImageVersion:-unknown}"
          echo "Disk before admission:"
          df -h /
          if (( $(available_kib) < minimum_kib )); then
            for path in /usr/local/lib/android /usr/share/dotnet /opt/ghc \
              /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
              /usr/local/share/boost /usr/local/share/powershell /usr/share/swift; do
              sudo rm -rf "$path"
              if (( $(available_kib) >= minimum_kib )); then
                break
              fi
            done
          else
            echo "Cleanup unnecessary: at least 32 GiB available"
          fi
          free_kib="$(available_kib)"
          echo "disk_admission_seconds=$((SECONDS - started)) free_kib=$free_kib minimum_kib=$minimum_kib"
          df -h /
          if (( free_kib < minimum_kib )); then
            echo "::error title=Insufficient runner disk::Need at least 32 GiB free before cache restore and compilation"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On pull_request, use the PR head SHA: not the branch name
          # GitHub deletes on merge, and not github.sha (the ephemeral
          # merge commit). On push, use github.sha directly so a run that
          # sat queued still builds and reports on the commit that
          # triggered it, not whatever the branch points to once it starts.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - *workflow-ci

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # Rust 1.98.1
        with:
          toolchain: "1.98.1"
          components: clippy

      # [DANI-10428] Rust 1.98.1 build cache. rust-cache prunes target/
      # to dependency artifacts and the registry to crates Cargo.lock still
      # references before saving, so the archive stays far below the 10 GB
      # repo cap instead of evicting every other entry; `shared-key` names the
      # toolchain rather than the job, so any 1.98.1 job that needs the same
      # dependency artifacts restores this entry.
      # Dependencies stay valid when a test fails, so save on failure too.
      # Pull requests restore only; pushes to main and agent-main save. The
      # entry holds every dependency the workspace test build links; caching
      # workspace members as well would rebuild most of them on most PRs
      # (docs/runbooks/compiler-cache.md#ordinary-linux-ci).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        id: rust-cache
        with:
          prefix-key: v1-rust-${{ hashFiles('Cargo.toml') }}
          shared-key: rust-1.98.1
          cache-on-failure: true
          save-if: ${{ github.event_name == 'push' }}

      # Each public pinned download retries transient responses until its 60s
      # deadline is spent; there is no fixed attempt count. Attempt diagnostics
      # and backoff remain part of the test gate's elapsed time (including
      # failed setup and post actions).
      - name: Restore cargo-nextest archive cache
        id: nextest-tool-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tool-cache/cargo-nextest-${{ env.NEXTEST_VERSION }}-${{ env.NEXTEST_LINUX_SHA256 }}/archive
          key: orbit-tool-cargo-nextest-${{ runner.os }}-linux-x86_64-${{ env.NEXTEST_VERSION }}-${{ env.NEXTEST_LINUX_SHA256 }}
      - name: Install cargo-nextest
        run: |
          set -euo pipefail
          cargo_bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          mkdir -p .orbit/tmp
          download_dir="$(mktemp -d .orbit/tmp/tool-download.XXXXXX)"
          trap 'python3 -c "import shutil, sys; shutil.rmtree(sys.argv[1])" "$download_dir"' EXIT
          archive="$download_dir/archive"
          mkdir -p "$cargo_bin"
          .orbit/tmp/workflow-ci/scripts/ci-download-verified.sh "https://get.nexte.st/${NEXTEST_VERSION}/linux" "$NEXTEST_LINUX_SHA256" "$archive" --cache-file ".tool-cache/cargo-nextest-${NEXTEST_VERSION}-${NEXTEST_LINUX_SHA256}/archive"
          tar zxf "$archive" -C "$cargo_bin"
          cargo nextest --version | awk -v expected="${NEXTEST_VERSION}" '{print} $1 == "cargo-nextest" && $2 == expected {ok=1} END {exit !ok}'

      - name: Save cargo-nextest archive cache
        if: ${{ github.event_name == 'push' && steps.nextest-tool-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tool-cache/cargo-nextest-${{ env.NEXTEST_VERSION }}-${{ env.NEXTEST_LINUX_SHA256 }}/archive
          key: orbit-tool-cargo-nextest-${{ runner.os }}-linux-x86_64-${{ env.NEXTEST_VERSION }}-${{ env.NEXTEST_LINUX_SHA256 }}
      - name: Report build inputs
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          echo "tested_head=$(git rev-parse HEAD) runner=${RUNNER_NAME} image=${ImageOS:-unknown}/${ImageVersion:-unknown} cache_hit=${CACHE_HIT} cpus=$(nproc) cpu_model=$(awk -F': ' '/^model name/ {gsub(/ /, "_", $2); print $2; exit}' /proc/cpuinfo)"
          rustc --version
          df -Pk /
          du -sk target "${CARGO_HOME:-$HOME/.cargo}/registry" 2>/dev/null || true

      # One folded workspace test build (all-targets Clippy lint included),
      # archived with the `orbit` binary the CLI fixtures execute. An
      # `affected:` scope narrows both (scripts/ci-guardrails.sh).
      - name: Build and archive workspace tests
        env:
          CI_TEST_SCOPE: ${{ needs.scope.outputs.mode }}
        run: |
          set -euo pipefail
          TIMEFORMAT='test_build_seconds=%R'
          time ./scripts/ci-guardrails.sh --test-archive "$RUNNER_TEMP/nextest-archive.tar.zst"
          ls -l "$RUNNER_TEMP/nextest-archive.tar.zst"

      # Repeated linked executables extend beyond nextest's default 2 MiB
      # compression window. Use a larger window only for transfer, split into
      # NEXTEST_ARCHIVE_PARTS byte ranges; the original archive remains here
      # for the partition proof below.
      - name: Pack nextest archive for transfer
        run: python3 .orbit/tmp/workflow-ci/scripts/ci-repack-nextest.py pack "$RUNNER_TEMP/nextest-archive.tar.zst" "$RUNNER_TEMP/nextest-transfer.tar.zst" --parts "$NEXTEST_ARCHIVE_PARTS"

      # The transfer is already zstd-compressed. The steps run in order and
      # the shards start once the last one has succeeded and every part is
      # listed, so keep its name in step with their wait.
      - name: Upload nextest archive part 1/4
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextest-archive-1
          path: ${{ runner.temp }}/nextest-transfer.tar.zst.1
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload nextest archive part 2/4
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextest-archive-2
          path: ${{ runner.temp }}/nextest-transfer.tar.zst.2
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload nextest archive part 3/4
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextest-archive-3
          path: ${{ runner.temp }}/nextest-transfer.tar.zst.3
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload nextest archive part 4/4
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextest-archive-4
          path: ${{ runner.temp }}/nextest-transfer.tar.zst.4
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      # Lists the uploaded archive once whole and once per count partition,
      # from one extraction, and fails unless the partitions cover every
      # test exactly once. It runs
      # after the upload, beside the shards rather than ahead of them, and a
      # failure here fails this job and so the Check job's wait.
      - name: Prove the shards cover every test
        env:
          CI_TEST_SCOPE: ${{ needs.scope.outputs.mode }}
        run: ./scripts/ci-guardrails.sh --test-partitions "$RUNNER_TEMP/nextest-archive.tar.zst"

      # Reuse the folded build's linked libraries, instead of rebuilding them
      # in Check after its metadata-only production Clippy. The shards can
      # already run, and Check awaits this job's conclusion as well as theirs.
      - name: Run workspace doctests
        if: ${{ !cancelled() }}
        # A PR head can predate the workflow's new guard CLI mode. Use its
        # existing folded-build wrapper directly, with the same Cargo command.
        run: |
          set -euo pipefail
          TIMEFORMAT='doctests_seconds=%R'
          time ./scripts/with-test-build-lint.sh cargo test --no-fail-fast --workspace --doc

      # Cargo's unit timings identify compilation bottlenecks without hiding
      # them inside the macOS-filter helper's captured Cargo output.
      - name: Upload test build timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-build-timings
          path: target/cargo-timings/
          if-no-files-found: warn
          retention-days: 14

      - name: Report disk usage
        if: always()
        run: |
          df -Pk /
          du -sk target "${CARGO_HOME:-$HOME/.cargo}/registry" 2>/dev/null || true

  # One job per nextest shard. Orbit's PR-landing recovery certifies each
  # job a rerun after a failed Live PR state replays as a fresh required
  # check (crates/orbit-engine .../workflow_dependency.rs). That needs a
  # literal name, no matrix, and the same pr-state gate as the other jobs,
  # so each shard waits for the test build itself instead of `needs:` it,
  # setting up while the build runs. The jobs share one step list; the
  # count matches NEXTEST_SHARDS (scripts/test-pr-state-workflows.py).
  # SHARD names the job (its JUnit report and the shard-1 sandbox gate);
  # PARTITION is the count partition it runs. "Test extra partition" runs
  # partition 5 and each "Test partition k" job runs partition k (2, 6–12),
  # so the shard jobs run partitions 1, 3 and 4 of NEXTEST_PARTITIONS.
  # agent-main's ruleset requires these exact names: renaming a shard, or
  # changing NEXTEST_SHARDS, needs the same ruleset change before merge.
  test-1:
    needs: [pr-state, scope]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.pr-state.outputs.state == 'open') && needs.scope.outputs.mode != 'docs' && needs.scope.outputs.mode != 'skip' }}
    name: Test shard 1/3
    runs-on: ubuntu-latest
    # The wait for the test build counts against this budget.
    timeout-minutes: 45
    permissions:
      contents: read
      # The test build's job state, read through the jobs API.
      actions: read
    env:
      SHARD: "1"
      PARTITION: "1"
    steps: &test-shard-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On pull_request, use the PR head SHA: not the branch name
          # GitHub deletes on merge, and not github.sha (the ephemeral
          # merge commit). On push, use github.sha directly so a run that
          # sat queued still builds and reports on the commit that
          # triggered it, not whatever the branch points to once it starts.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - *workflow-ci

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # Rust 1.98.1
        with:
          toolchain: "1.98.1"

      - name: Restore cargo-nextest archive cache
        id: nextest-tool-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tool-cache/cargo-nextest-${{ env.NEXTEST_VERSION }}-${{ env.NEXTEST_LINUX_SHA256 }}/archive
          key: orbit-tool-cargo-nextest-${{ runner.os }}-linux-x86_64-${{ env.NEXTEST_VERSION }}-${{ env.NEXTEST_LINUX_SHA256 }}
      - name: Install cargo-nextest
        run: |
          set -euo pipefail
          cargo_bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          mkdir -p .orbit/tmp
          download_dir="$(mktemp -d .orbit/tmp/tool-download.XXXXXX)"
          trap 'python3 -c "import shutil, sys; shutil.rmtree(sys.argv[1])" "$download_dir"' EXIT
          archive="$download_dir/archive"
          mkdir -p "$cargo_bin"
          .orbit/tmp/workflow-ci/scripts/ci-download-verified.sh "https://get.nexte.st/${NEXTEST_VERSION}/linux" "$NEXTEST_LINUX_SHA256" "$archive" --cache-file ".tool-cache/cargo-nextest-${NEXTEST_VERSION}-${NEXTEST_LINUX_SHA256}/archive"
          tar zxf "$archive" -C "$cargo_bin"
          cargo nextest --version | awk -v expected="${NEXTEST_VERSION}" '{print} $1 == "cargo-nextest" && $2 == expected {ok=1} END {exit !ok}'

      - name: Save cargo-nextest archive cache
        if: ${{ github.event_name == 'push' && steps.nextest-tool-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tool-cache/cargo-nextest-${{ env.NEXTEST_VERSION }}-${{ env.NEXTEST_LINUX_SHA256 }}/archive
          key: orbit-tool-cargo-nextest-${{ runner.os }}-linux-x86_64-${{ env.NEXTEST_VERSION }}-${{ env.NEXTEST_LINUX_SHA256 }}
      - name: Restore ripgrep archive cache
        id: ripgrep-tool-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tool-cache/ripgrep-${{ env.RIPGREP_VERSION }}-${{ env.RIPGREP_LINUX_SHA256 }}/archive
          key: orbit-tool-ripgrep-${{ runner.os }}-linux-x86_64-${{ env.RIPGREP_VERSION }}-${{ env.RIPGREP_LINUX_SHA256 }}
      - name: Install ripgrep
        run: |
          set -euo pipefail
          cargo_bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          mkdir -p .orbit/tmp
          download_dir="$(mktemp -d .orbit/tmp/tool-download.XXXXXX)"
          trap 'python3 -c "import shutil, sys; shutil.rmtree(sys.argv[1])" "$download_dir"' EXIT
          archive="$download_dir/archive"
          mkdir -p "$cargo_bin"
          .orbit/tmp/workflow-ci/scripts/ci-download-verified.sh "https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/ripgrep-${RIPGREP_VERSION}-x86_64-unknown-linux-musl.tar.gz" "$RIPGREP_LINUX_SHA256" "$archive" --cache-file ".tool-cache/ripgrep-${RIPGREP_VERSION}-${RIPGREP_LINUX_SHA256}/archive"
          tar zxf "$archive" --strip-components=1 -C "$cargo_bin" "ripgrep-${RIPGREP_VERSION}-x86_64-unknown-linux-musl/rg"
          rg --version | awk -v expected="${RIPGREP_VERSION}" '{print} $1 == "ripgrep" && $2 == expected {ok=1} END {exit !ok}'

      - name: Save ripgrep archive cache
        if: ${{ github.event_name == 'push' && steps.ripgrep-tool-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tool-cache/ripgrep-${{ env.RIPGREP_VERSION }}-${{ env.RIPGREP_LINUX_SHA256 }}/archive
          key: orbit-tool-ripgrep-${{ runner.os }}-linux-x86_64-${{ env.RIPGREP_VERSION }}-${{ env.RIPGREP_LINUX_SHA256 }}

      # [ORB-13017] Same pinned-tarball convention as nextest. Only the uv
      # binary comes from the network; the plugin fixture's dependency is a
      # wheel inside the fixture, so the test itself never reaches PyPI.
      - name: Restore uv archive cache
        id: uv-tool-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tool-cache/uv-${{ env.UV_VERSION }}-${{ env.UV_LINUX_SHA256 }}/archive
          key: orbit-tool-uv-${{ runner.os }}-linux-x86_64-${{ env.UV_VERSION }}-${{ env.UV_LINUX_SHA256 }}
      - name: Install uv
        run: |
          set -euo pipefail
          cargo_bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          mkdir -p .orbit/tmp
          download_dir="$(mktemp -d .orbit/tmp/tool-download.XXXXXX)"
          trap 'python3 -c "import shutil, sys; shutil.rmtree(sys.argv[1])" "$download_dir"' EXIT
          archive="$download_dir/archive"
          mkdir -p "$cargo_bin"
          .orbit/tmp/workflow-ci/scripts/ci-download-verified.sh "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz" "$UV_LINUX_SHA256" "$archive" --cache-file ".tool-cache/uv-${UV_VERSION}-${UV_LINUX_SHA256}/archive"
          tar zxf "$archive" --strip-components=1 -C "$cargo_bin" uv-x86_64-unknown-linux-gnu/uv
          uv --version | awk -v expected="${UV_VERSION}" '{print} $1 == "uv" && $2 == expected {ok=1} END {exit !ok}'

      - name: Save uv archive cache
        if: ${{ github.event_name == 'push' && steps.uv-tool-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tool-cache/uv-${{ env.UV_VERSION }}-${{ env.UV_LINUX_SHA256 }}/archive
          key: orbit-tool-uv-${{ runner.os }}-linux-x86_64-${{ env.UV_VERSION }}-${{ env.UV_LINUX_SHA256 }}
      - *bubblewrap-probe

      # The archive exists once the test build's last upload step has succeeded
      # and every part is listed. The partition guard after the upload runs
      # beside the shards. A build that fails before the upload, or a Test
      # build job that was never created, fails this shard at once.
      - name: Await the nextest archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 .orbit/tmp/workflow-ci/scripts/ci-await-jobs.py
          --job "Test build"
          --step "Upload nextest archive part 4/4"
          --artifact nextest-archive-1
          --artifact nextest-archive-2
          --artifact nextest-archive-3
          --artifact nextest-archive-4

      # A pattern downloads every matching artifact concurrently, one stream
      # each, and verifies each artifact's digest. Retry a transient
      # GetSignedArtifactURL failure (ECONNRESET) at most twice more. The last
      # attempt has no continue-on-error, so a shard that never gets the
      # archive fails before nextest runs.
      - name: Download nextest archive
        id: nextest-archive-download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nextest-archive-*
          merge-multiple: true
          path: ${{ runner.temp }}

      - name: Download nextest archive attempt 2
        id: nextest-archive-download-2
        if: ${{ steps.nextest-archive-download.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nextest-archive-*
          merge-multiple: true
          path: ${{ runner.temp }}

      - name: Download nextest archive attempt 3
        if: ${{ steps.nextest-archive-download.outcome == 'failure' && steps.nextest-archive-download-2.outcome == 'failure' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nextest-archive-*
          merge-multiple: true
          path: ${{ runner.temp }}

      # Native nextest decoders cap their history below the transfer window.
      # Re-encode the identical tar stream from every part in order (a missing
      # part fails); leave safe extraction to nextest.
      - name: Restore native nextest archive
        run: python3 .orbit/tmp/workflow-ci/scripts/ci-repack-nextest.py unpack "$RUNNER_TEMP/nextest-transfer.tar.zst" "$RUNNER_TEMP/nextest-archive.tar.zst" --parts "$NEXTEST_ARCHIVE_PARTS"

      # The archive extracts to target/ under this checkout, the path the test
      # build compiled against, so `env!("CARGO_BIN_EXE_orbit")` and fixture
      # paths resolve as they did there. Profile ci raises test-threads above
      # the 4-vCPU runner default. The sampler prints one cpu-util line and
      # keeps nextest's exit status. An affected-crates archive can leave a
      # partition empty, which passes; the full archive cannot (the test
      # build's partition guard fails on an empty shard).
      - name: Run nextest shard
        env:
          CI_TEST_SCOPE: ${{ needs.scope.outputs.mode }}
        run: |
          set -euo pipefail
          # An `affected:` PR runs only its affected and always-run crates'
          # tests; the archive's feature anchors are built, not tested. The
          # partition guard lists the same filter.
          filter=()
          if [[ "$CI_TEST_SCOPE" == affected:* ]]; then
            crates="${CI_TEST_SCOPE#affected:}"
            filter=(-E "package(${crates//,/) | package(})")
          fi
          TIMEFORMAT='nextest_shard_seconds=%R'
          time ./scripts/cpu-utilisation.sh --label nextest -- \
            cargo nextest run --profile ci --no-fail-fast --success-output immediate \
            --archive-file "$RUNNER_TEMP/nextest-archive.tar.zst" \
            --workspace-remap "$PWD" --extract-to "$PWD" --extract-overwrite \
            --partition "count:$PARTITION/$NEXTEST_PARTITIONS" --no-tests pass \
            ${filter[@]+"${filter[@]}"}

      # Per-test durations for the slowest-test table in test_strategy.md.
      - name: Upload nextest timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextest-junit-${{ env.SHARD }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 14

      # [ORB-10009] Linux counterpart of ci-macos.yml's enforcement leg: an
      # explicit, named gate for orbit-policy's evaluation matrix (incl. the
      # ORB-00418 symlink-resolution tests), orbit-tools' runtime
      # fs-enforcement integration tests (the only enforcement layer on Linux
      # — there is no kernel sandbox), and orbit-exec's Linux fail-closed
      # contract tests. The live Bubblewrap boundary tests are ignored in the
      # portable suite, then selected explicitly here: an ubuntu-latest runner
      # without working user namespaces fails this named gate (their probe
      # asserts availability) instead of reporting those tests as passed after
      # an early return.
      # [DANI-10428] This used to be a separate job that compiled the three
      # crates under `cargo test -p` feature resolution — a second build of
      # the same crates. The nextest filterset below selects them out of the
      # test build's `--workspace --lib --bins --tests` archive, so the gate
      # costs no compile. It runs once, in the first shard.
      # [ORB-16349] The shards already ran every non-ignored test in these
      # packages, so the portable selection is not re-run here. The gate
      # asserts with `cargo nextest list` that it still selects at least one
      # test, so a retired or renamed package cannot pass on an empty selection.
      # [ORB-12881] The ignored leg selects orbit-exec's Linux sandbox
      # integration binary (`linux_sandbox::`), which needs a host with working
      # Bubblewrap namespaces. It runs over the same artifact set as the list
      # above it so neither leg triggers a rebuild. Both legs read the shard's
      # extraction of the archive (target/nextest/*-metadata.json) instead of
      # extracting the archive twice more. nextest exits 4 when its
      # filterset matches nothing, so a refactor that retires or renames these
      # tests fails the gate instead of passing on an empty selection; never
      # add `--no-tests` here.
      # The uv-locked Python plugin fixture runs in the portable suite above:
      # the pinned uv binary is installed before the shard runs.
      # A prior failure in this job (including Bubblewrap preparation or the
      # shard itself) skips this gate; if this step is missing, it did not
      # pass. `--profile ci` matches the shards: more test threads than the
      # 4-vCPU default, with the same named group caps.
      # An affected-crates run without orbit-exec skips it: neither the
      # sandbox code nor its dependencies changed.
      - name: Linux sandbox/policy enforcement gate
        if: ${{ env.SHARD == '1' && (!contains(needs.scope.outputs.mode, ':') || contains(needs.scope.outputs.mode, 'orbit-exec')) }}
        run: |
          set -euo pipefail
          reuse=(--binaries-metadata target/nextest/binaries-metadata.json
            --cargo-metadata target/nextest/cargo-metadata.json
            --workspace-remap "$PWD" --target-dir-remap "$PWD/target")
          # Count matches by filter-match: test-count is the total for the target set.
          selected=$(cargo nextest list "${reuse[@]}" \
            -E 'package(orbit-exec) | package(orbit-policy) | package(orbit-tools)' \
            --message-format json |
            jq '[."rust-suites"[].testcases[] | select(."filter-match".status == "matches")] | length')
          if [[ "$selected" -eq 0 ]]; then
            echo "Linux sandbox/policy enforcement gate: the portable filterset selects no tests" >&2
            exit 1
          fi
          cargo nextest run --profile ci --no-fail-fast "${reuse[@]}" \
            --run-ignored only \
            -E 'package(orbit-exec) & binary(sandbox) & test(/^linux_sandbox::/)'

      # The Landlock ruleset regressions are lib-unit tests, so the ignored
      # sandbox leg above does not select them. Run them once, in the first
      # shard, with the capability required: a kernel without Landlock ABI 2
      # fails this step instead of reporting the regressions as passed after
      # a visible skip (STD-04 §R8). No `--no-tests` pass: an empty selection
      # (nextest exits 4) fails, and the list count is checked first.
      - name: Linux Landlock ruleset gate
        if: ${{ env.SHARD == '1' && (!contains(needs.scope.outputs.mode, ':') || contains(needs.scope.outputs.mode, 'orbit-exec')) }}
        env:
          ORBIT_REQUIRE_LANDLOCK_RULESET: "1"
        run: |
          set -euo pipefail
          reuse=(--binaries-metadata target/nextest/binaries-metadata.json
            --cargo-metadata target/nextest/cargo-metadata.json
            --workspace-remap "$PWD" --target-dir-remap "$PWD/target")
          selected=$(cargo nextest list "${reuse[@]}" \
            -E 'package(orbit-exec) & test(/^linux_landlock::tests::ruleset::/)' \
            --message-format json |
            jq '[."rust-suites"[].testcases[] | select(."filter-match".status == "matches")] | length')
          if [[ "$selected" -eq 0 ]]; then
            echo "Linux Landlock ruleset gate: the filterset selects no tests" >&2
            exit 1
          fi
          cargo nextest run --profile ci --no-fail-fast "${reuse[@]}" \
            -E 'package(orbit-exec) & test(/^linux_landlock::tests::ruleset::/)'

  test-2:
    needs: [pr-state, scope]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.pr-state.outputs.state == 'open') && needs.scope.outputs.mode != 'docs' && needs.scope.outputs.mode != 'skip' }}
    name: Test shard 2/3
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      SHARD: "2"
      PARTITION: "3"
    steps: *test-shard-steps

  test-3:
    needs: [pr-state, scope]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.pr-state.outputs.state == 'open') && needs.scope.outputs.mode != 'docs' && needs.scope.outputs.mode != 'skip' }}
    name: Test shard 3/3
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      SHARD: "3"
      PARTITION: "4"
    steps: *test-shard-steps

  # A fourth runner with the shard steps and one more count partition. It is
  # not a "Test shard k/N" job, so NEXTEST_SHARDS, the shard names and the
  # agent-main ruleset are unchanged; the Check job awaits it like a shard,
  # so its failure still fails the required Check / Clippy / Test check.
  test-extra:
    needs: [pr-state, scope]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.pr-state.outputs.state == 'open') && needs.scope.outputs.mode != 'docs' && needs.scope.outputs.mode != 'skip' }}
    name: Test extra partition
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      SHARD: "extra"
      PARTITION: "5"
    steps: *test-shard-steps

  # Prepare beside compilation, like every other shard, so partition 2 no
  # longer waits for the build runner's proof, doctests and tool setup. Check
  # awaits this literal job even though the ruleset does not name it directly.
  test-partition-2:
    needs: [pr-state, scope]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.pr-state.outputs.state == 'open') && needs.scope.outputs.mode != 'docs' && needs.scope.outputs.mode != 'skip' }}
    name: Test partition 2
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      SHARD: "partition-2"
      PARTITION: "2"
    steps: *test-shard-steps

  # [ORB-21420] A sixth runner with the shard steps. On full runs every
  # partition kept four cores busy (93-97%), so the slowest partition's nextest
  # time bound the Check job after the build; a sixth count partition shortens
  # every partition without adding work to the build runner. Check awaits this
  # literal job like the other partition jobs.
  test-partition-6:
    needs: [pr-state, scope]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.pr-state.outputs.state == 'open') && needs.scope.outputs.mode != 'docs' && needs.scope.outputs.mode != 'skip' }}
    name: Test partition 6
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      SHARD: "partition-6"
      PARTITION: "6"
    steps: *test-shard-steps

  # [ORB-22077] Replaying the 2026-11-04 cohort's logged durations, an eighth
  # count partition cut the slowest partition's test time by 35-57 s on core and
  # full selections. That cohort had a 96–136 s longest single test. The
  # current full-run profile has a 58.8 s longest case in the last partition;
  # revisit its CPU tail with twelve runners and the same exact-once proof.
  # Check awaits these literal jobs too.
  test-partition-7:
    needs: [pr-state, scope]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.pr-state.outputs.state == 'open') && needs.scope.outputs.mode != 'docs' && needs.scope.outputs.mode != 'skip' }}
    name: Test partition 7
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      SHARD: "partition-7"
      PARTITION: "7"
    steps: *test-shard-steps

  test-partition-8:
    needs: [pr-state, scope]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.pr-state.outputs.state == 'open') && needs.scope.outputs.mode != 'docs' && needs.scope.outputs.mode != 'skip' }}
    name: Test partition 8
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      SHARD: "partition-8"
      PARTITION: "8"
    steps: *test-shard-steps

  test-partition-9:
    needs: [pr-state, scope]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.pr-state.outputs.state == 'open') && needs.scope.outputs.mode != 'docs' && needs.scope.outputs.mode != 'skip' }}
    name: Test partition 9
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      SHARD: "partition-9"
      PARTITION: "9"
    steps: *test-shard-steps

  test-partition-10:
    needs: [pr-state, scope]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.pr-state.outputs.state == 'open') && needs.scope.outputs.mode != 'docs' && needs.scope.outputs.mode != 'skip' }}
    name: Test partition 10
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      SHARD: "partition-10"
      PARTITION: "10"
    steps: *test-shard-steps

  test-partition-11:
    needs: [pr-state, scope]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.pr-state.outputs.state == 'open') && needs.scope.outputs.mode != 'docs' && needs.scope.outputs.mode != 'skip' }}
    name: Test partition 11
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      SHARD: "partition-11"
      PARTITION: "11"
    steps: *test-shard-steps

  test-partition-12:
    needs: [pr-state, scope]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.pr-state.outputs.state == 'open') && needs.scope.outputs.mode != 'docs' && needs.scope.outputs.mode != 'skip' }}
    name: Test partition 12
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      SHARD: "partition-12"
      PARTITION: "12"
    steps: *test-shard-steps
