name: macOS Platform

# The orbit-exec macOS sandbox tests (`#[cfg(target_os = "macos")]`, gated on
# `sandbox_exec_can_apply()`) compile generated SBPL profiles through the real
# `/usr/bin/sandbox-exec`. The primary CI workflow runs on Linux, where those
# tests are compiled out entirely — which is how ORB-00366's `(?i)` SBPL
# breakage (ORB-00372) reached agent-main undetected. This leg runs them on a
# real macOS runner. Path-filtered so the (cost-weighted) macOS runner only
# fires on PRs that touch sandbox-relevant code.

on:
  push:
    branches: [main, agent-main]
  pull_request:
    paths:
      - "crates/orbit-exec/**"
      # [ORB-11055] Child-runtime write-root inventory lives in orbit-core and
      # is compiled into the SBPL profile the macOS sandbox job enforces.
      - "crates/orbit-core/src/adapter/engine_host/v2_host/sandbox.rs"
      - "crates/orbit-core/src/adapter/engine_host/v2_host/tests/sandbox.rs"
      - "crates/orbit-core/src/adapter/engine_host/v2_host/tests/sandbox_nested.rs"
      # [ORB-10009] SBPL profiles are compiled from resolved policy rules, so
      # policy-evaluation changes can alter what the macOS sandbox enforces.
      - "crates/orbit-policy/**"
      - "crates/orbit-common/src/types/policy_def.rs"
      - "crates/orbit-common/src/utility/glob.rs"
      # [ORB-11067] Managed-child logging must use the registry root authorized
      # by the macOS sandbox rather than the provider-specific HOME.
      - "crates/orbit-common/src/observability/logging.rs"
      - "crates/orbit-common/src/observability/tests/logging.rs"
      # [ORB-10682] Darwin owner/cancellation liveness uses native libproc
      # state so unreaped zombies do not look like surviving work.
      - "crates/orbit-common/src/utility/process_identity.rs"
      - "crates/orbit-common/src/utility/tests/process_identity.rs"
      - "crates/orbit-core/src/application/job/run/owner.rs"
      - "crates/orbit-core/src/application/job/run/tests/actions.rs"
      - "crates/orbit-core/src/application/job/run/tests/owner.rs"
      - "Cargo.lock"
      - ".github/workflows/ci-macos.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  macos-sandbox:
    name: macOS Sandbox
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PR head SHA, not the branch name GitHub deletes on merge, and
          # not github.sha (the ephemeral merge commit).
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2026-05-07)

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-macos-sandbox-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-macos-sandbox-
            ${{ runner.os }}-cargo-

      # Exercises the real-`sandbox-exec` regex regression test added by
      # ORB-00372 plus the existing macOS sandbox suite. If a future macOS
      # runner forbids `sandbox-exec`, `sandbox_exec_can_apply()` self-skips the
      # apply-time tests rather than failing — never worse than the Linux gate.
      - name: Run orbit-exec sandbox tests (real sandbox-exec)
        run: cargo test -p orbit-exec --locked

      # [ORB-11055] The nested `orbit.task.update` regression needs the CLI
      # binary; the child-runtime inventory test lives in orbit-core.
      - name: Build orbit CLI for nested sandbox regression
        run: cargo build -p orbit-cli --locked --bin orbit

      - name: Run orbit-core sandbox tests
        run: cargo test -p orbit-core --locked sandbox

      # Linux cannot exercise Darwin's libproc zombie/group semantics. Keep
      # these filters aligned with the owner/liveness path triggers above.
      - name: Run process identity and job-run owner tests
        run: |
          cargo test -p orbit-common --locked process_identity -- --nocapture
          cargo test -p orbit-core --locked command::job::run::tests::owner -- --nocapture
          cargo test -p orbit-core --locked command::job::run::tests::actions -- --nocapture
