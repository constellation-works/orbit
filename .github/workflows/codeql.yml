name: CodeQL

on:
  push:
    branches: [main, agent-main]
  schedule:
    - cron: "0 6 * * 1"

# Analyze pushes to main and agent-main, plus the weekly Monday schedule.
# A newer push replaces any analysis still pending for the same ref, so the
# queue stays at one run per ref instead of trailing every merge. Branch pushes
# let a running analysis finish: agent-main merges faster than an analysis
# takes, so cancelling in progress would never publish a result.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: false

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:${{ matrix.language }}"
