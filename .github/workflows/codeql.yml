name: CodeQL

on:
  push:
    branches: [main, agent-main]
  schedule:
    - cron: "0 6 * * 1"

# Analyze pushes to main and agent-main, plus the weekly Monday schedule.
# A newer push replaces any analysis still pending for the same ref, so the
# queue stays at one run per ref instead of trailing every merge. Branch pushes
# let a running analysis finish: agent-main merges faster than an analysis
# takes, so cancelling in progress would never publish a result.
# A docs-only push whose parent commit already completed every analysis job
# skips those jobs (see the Change scope job). The Monday schedule always
# runs them. The concurrency group below is unchanged.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: false

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  # Docs-only pushes skip the analysis matrix when BEFORE already has a
  # successful completed run of every check named below. The classifier's
  # default parent check is ci.yml's `Check / Clippy / Test`, so this job
  # names the three analysis checks. An empty mode runs the matrix. The
  # Monday schedule runs it whatever the mode.
  scope:
    name: Change scope
    runs-on: ubuntu-latest
    timeout-minutes: 3
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
    steps:
      # The classification reads only the GitHub API. Check out the triggering
      # commit so a run that sat queued still uses this workflow's script.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Classify the change
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          # Keep these names equal to the rendered analysis job names. Every
          # one must have completed successfully on BEFORE before a docs push skips.
          DOCS_BEFORE_CHECKS: |
            Analyze (actions)
            Analyze (javascript-typescript)
            Analyze (rust)
        run: scripts/ci-change-scope.sh

  analyze:
    needs: scope
    if: ${{ !cancelled() && (github.event_name == 'schedule' || needs.scope.outputs.mode != 'docs') }}
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
