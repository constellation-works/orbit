name: CodeQL

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# Analyze pushes to main, run daily on agent-main (the repository's default
# branch), and support manual runs via workflow_dispatch. agent-main push
# analysis was dropped because merge bursts exhausted the GitHub installation
# API rate limit ('API rate limit exceeded for installation') and spent 3
# CodeQL runner jobs per merge. A daily scheduled analysis covers agent-main
# changes before promotion to main without rate-limit exhaustion. Running
# analyses are not cancelled in progress so completed results always publish.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: false

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
