# These are checked on production targets by make ci-lint and ci-guardrails.
# Every lint pass allows disallowed_methods on the command line; each crate
# root denies it again outside `test` and its test feature, because existing
# test-only synchronization channels and filesystem fixtures are outside
# production rules.
disallowed-methods = [
    { path = "std::sync::mpsc::channel", reason = "production channels must have a bounded capacity" },
    { path = "tokio::sync::mpsc::unbounded_channel", reason = "production channels must have a bounded capacity" },
    { path = "std::process::Command::output", reason = "a child wait needs a deadline, a process group and capped capture; use orbit_common::process::run_bounded or run_bounded_capped" },
    { path = "std::process::Command::status", reason = "a child wait needs a deadline and a process group; use orbit_common::process::run_bounded or run_bounded_capped, or add a reasoned exception for an interactive or long-lived child" },
    { path = "std::fs::write", reason = "durable replacements must use orbit_common::fs::io atomic helpers; deliberate in-place writes need a reasoned exception" },
    { path = "std::fs::create_dir_all", reason = "Orbit state directories must be owner-only regardless of umask; use orbit_common::fs::io::create_private_dir_all; external directories need a reasoned exception" },
    { path = "std::fs::create_dir", reason = "Orbit state directories must be owner-only regardless of umask; use orbit_common::fs::io::create_private_dir; external directories need a reasoned exception" },
    { path = "std::fs::File::sync_all", reason = "durability syncs go through orbit_common::fs::io::sync_file so test runs can relax them" },
    { path = "std::fs::File::sync_data", reason = "durability syncs go through orbit_common::fs::io::sync_file_data so test runs can relax them" },
    { path = "std::env::var", reason = "Use the process Env snapshot captured at startup instead of accessing ambient state" },
    { path = "std::env::var_os", reason = "Use the process Env snapshot captured at startup instead of accessing ambient state" },
    { path = "std::env::vars", reason = "Use the process Env snapshot captured at startup instead of accessing ambient state" },
    { path = "std::env::vars_os", reason = "Use the process Env snapshot captured at startup instead of accessing ambient state" },
    { path = "std::env::set_var", reason = "Use the process Env snapshot captured at startup instead of accessing ambient state" },
    { path = "std::env::remove_var", reason = "Use the process Env snapshot captured at startup instead of accessing ambient state" },
    { path = "orbit_store::Store::open", reason = "composition opens the store once; receive the handle, or open another database through orbit_core::composition::store_opener" },
    { path = "orbit_store::Store::open_read_only", reason = "composition opens the store once; receive the handle, or open another database through orbit_core::composition::store_opener" },
]

# A file-lock guard must be released before suspension. ScopedEnv already
# contains a MutexGuard covered by await_holding_lock; a few web tests have
# documented test-scoped exceptions. GenerationGuard is intentionally a
# long-lived process admission pin.
await-holding-invalid-types = [
    { path = "orbit_common::fs::file_lock::FileLockGuard", reason = "release the advisory file lock before awaiting" },
]

# min_ident_chars (STD-12 R2/R14): no one-letter binding is exempt; generic type
# parameters and lifetimes are outside the lint. The desktop workspace enables
# the lint; the main workspace enables it once its remaining bindings are renamed.
allowed-idents-below-min-chars = []
