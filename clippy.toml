# These are checked on production targets by make ci-lint and ci-guardrails.
# The all-targets pass allows disallowed_methods because existing test-only
# synchronization channels and filesystem fixtures are outside production rules.
disallowed-methods = [
    { path = "std::sync::mpsc::channel", reason = "production channels must have a bounded capacity" },
    { path = "tokio::sync::mpsc::unbounded_channel", reason = "production channels must have a bounded capacity" },
    { path = "std::process::Command::output", reason = "a child wait needs a deadline, a process group and capped capture; use orbit_common::process::run_bounded or run_bounded_capped" },
    { path = "std::process::Command::status", reason = "a child wait needs a deadline and a process group; use orbit_common::process::run_bounded or run_bounded_capped, or add a reasoned exception for an interactive or long-lived child" },
    { path = "std::fs::write", reason = "durable replacements must use orbit_common::fs::io atomic helpers; deliberate in-place writes need a reasoned exception" },
]

# A file-lock guard must be released before suspension. ScopedEnv already
# contains a MutexGuard covered by await_holding_lock; a few web tests have
# documented test-scoped exceptions. GenerationGuard is intentionally a
# long-lived process admission pin.
await-holding-invalid-types = [
    { path = "orbit_common::fs::file_lock::FileLockGuard", reason = "release the advisory file lock before awaiting" },
]
