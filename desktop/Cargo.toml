# The desktop shell is its own Cargo workspace (excluded from the root one) so
# Tauri and the platform webview stacks stay out of the main CI build.
[workspace]

[package]
name = "orbit-desktop"
version = "0.28.3"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Desktop window for the Orbit dashboard"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
notify-rust = "4"
serde_json = "1"
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5"
tauri-plugin-opener = "2.7"
tauri-plugin-window-state = "2"
# Plain HTTP to the app's own loopback server only: no TLS stack.
ureq = { version = "3.1", default-features = false }
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.4"

[lints.clippy]
await_holding_lock = "deny"
dbg_macro = "deny"
expect_used = "warn"
print_stderr = "warn"
print_stdout = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
