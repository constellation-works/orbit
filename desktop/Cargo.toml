# The desktop shell is its own Cargo workspace (excluded from the root one) so
# Tauri and the platform webview stacks stay out of the main CI build.
[workspace]

[package]
name = "orbit-desktop"
version = "0.28.3"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Desktop window for the Orbit dashboard"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# Update checks compare a key's not_after and revoked_at with today's date.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
notify-rust = "4"
# Release manifest verification, as in orbit-common::security::release.
rsa = { version = "0.10.0-rc.18", features = ["sha2"] }
serde_json = "1"
sha2 = "0.11"
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2.7"
tauri-plugin-window-state = "2"
# Loopback HTTP to the app's own server, and HTTPS to GitHub for update checks.
ureq = { version = "3.1", default-features = false, features = ["rustls"] }
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.4"

[lints.clippy]
await_holding_lock = "deny"
dbg_macro = "deny"
expect_used = "warn"
print_stderr = "warn"
print_stdout = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
