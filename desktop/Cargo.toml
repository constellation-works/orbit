# The desktop shell is its own Cargo workspace (excluded from the root one) so
# Tauri and the platform webview stacks stay out of the main CI build.
[workspace]

[package]
name = "orbit-desktop"
version = "0.28.3"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Desktop window for the Orbit dashboard"
publish = false

# The polling library can run without native webview dependencies.
[features]
default = ["native"]
native = [
    "dep:tauri-build", "dep:notify-rust", "dep:tauri", "dep:tauri-plugin-autostart",
    "dep:tauri-plugin-opener", "dep:tauri-plugin-window-state", "dep:ureq",
    "dep:libc", "dep:signal-hook",
]

[[bin]]
name = "orbit-desktop"
path = "src/main.rs"
required-features = ["native"]

[build-dependencies]
tauri-build = { version = "2.7", features = [], optional = true }

[dependencies]
notify-rust = { version = "4", optional = true }
serde_json = "1"
tauri = { version = "2.12", features = ["tray-icon"], optional = true }
tauri-plugin-autostart = { version = "2.5", optional = true }
tauri-plugin-opener = { version = "2.7", optional = true }
tauri-plugin-window-state = { version = "2", optional = true }
# Plain HTTP to the app's own loopback server only: no TLS stack.
ureq = { version = "3.1", default-features = false, optional = true }
url = "2"

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }
signal-hook = { version = "0.4", optional = true }

[lints.clippy]
await_holding_lock = "deny"
dbg_macro = "deny"
expect_used = "warn"
print_stderr = "warn"
print_stdout = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
