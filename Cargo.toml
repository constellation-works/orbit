[workspace]
members = [
  "crates/orbit-agent",
  "crates/orbit-automation",
  "crates/orbit-cli",
  "crates/orbit-cmd",
  "crates/orbit-common",
  "crates/orbit-config",
  "crates/orbit-types",
  "crates/orbit-registry",
  "crates/orbit-search",
  "crates/orbit-core",
  "crates/orbit-engine",
  "crates/orbit-store",
  "crates/orbit-policy",
  "crates/orbit-exec",
  "crates/orbit-tools",
  "crates/orbit-mcp",
  "crates/orbit-web",
]
resolver = "2"

[workspace.package]
version = "0.21.0"
edition = "2024"
license = "MIT"
# MSRV [ORB-10010]: edition 2024 requires >= 1.85; the highest `rust-version`
# among locked dependencies is 1.88 (time, cookie_store, ort), and workspace
# code uses the file-locking API (`File::unlock`) stabilized in 1.89. Enforced
# by the `msrv` job in .github/workflows/ci.yml (keep its MSRV env var in sync).
rust-version = "1.89"

# Workspace-wide lint config. Each crate opts in via `[lints] workspace = true`.
# Keep this list short — only rules that are mechanically true everywhere.
[workspace.lints.clippy]
await_holding_lock = "deny"
dbg_macro = "deny"
expect_used = "warn"
print_stderr = "warn"
print_stdout = "warn"
unwrap_used = "warn"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.dependencies]
assert_cmd = "2"
base64 = "0.22"
axum = { version = "0.7", default-features = false, features = ["http1", "json", "query", "tokio"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4.5", features = ["derive"] }
croner = "3"
flate2 = "1"
fastembed = { version = "5.13.4", default-features = false, features = ["hf-hub-native-tls", "ort-download-binaries-native-tls"] }
fs2 = "0.4"
futures-core = "0.3"
getrandom = "0.3"
hostname = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "sync"] }
jsonschema = { version = "0.18", default-features = false }
libc = "0.2"
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
rsa = { version = "0.10.0-rc.18", features = ["sha2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
regex = "1"
blake3 = "1"
sha2 = "0.10"
tiktoken-rs = "0.11.0"
thiserror = "2"
toml = "0.8"
toml_edit = "0.22"
tar = "0.4"
zstd = "0.13"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
unicode-normalization = "0.1"
url = "2"
wait-timeout = "0.2"
proptest = "1"
predicates = "3"
tempfile = "3"
