[package]
name = "orbit-exec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.orbit]
stability = "internal"

[lints]
workspace = true

[features]
# Test-only hooks (the forced Seatbelt-refusal setter in the sandbox-exec
# probe). Enable it only from `[dev-dependencies]`, never in a shipped build.
test-support = []

[dependencies]
orbit-common = { path = "../orbit-common" }
orbit-types = { path = "../orbit-types" }
regex.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
orbit-common = { path = "../orbit-common", features = ["test-support"] }
tempfile.workspace = true
wait-timeout.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true
