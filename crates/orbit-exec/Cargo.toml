[package]
name = "orbit-exec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.orbit]
stability = "internal"

[lints]
workspace = true

[dependencies]
orbit-common = { path = "../orbit-common" }
orbit-types = { path = "../orbit-types" }
regex.workspace = true
tempfile = "3"
wait-timeout.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
# `test_env::scoped` — one shared ambient-environment guard, so launcher tests
# state the environment they reason about instead of inheriting the shell.
orbit-common = { path = "../orbit-common", features = ["test-util"] }
