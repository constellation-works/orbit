[package]
name = "orbit-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.orbit]
stability = "internal"

[lints]
workspace = true

[features]
# Test-only hooks for `orbit-core` and its downstream crates' tests. Enable it
# only from `[dev-dependencies]` or `orbit-core`'s own `test-support` feature.
test-support = []

[dependencies]
blake3.workspace = true
chrono.workspace = true
fs2.workspace = true
getrandom.workspace = true
orbit-common = { path = "../orbit-common" }
orbit-config = { path = "../orbit-config" }
orbit-engine = { path = "../orbit-engine" }
orbit-exec = { path = "../orbit-exec" }
orbit-policy = { path = "../orbit-policy" }
orbit-search = { path = "../orbit-search" }
orbit-store = { path = "../orbit-store" }
orbit-tools = { path = "../orbit-tools" }
orbit-types = { path = "../orbit-types" }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
tempfile.workspace = true
toml.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
# Unit tests reach the `test-support` hooks through this self dependency.
orbit-runtime = { path = ".", features = ["test-support"] }
orbit-engine = { path = "../orbit-engine", features = ["test-support"] }
