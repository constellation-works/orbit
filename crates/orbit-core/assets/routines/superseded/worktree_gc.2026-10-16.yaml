# Superseded `worktree_gc` default (shipped through 2026-10-16): `missed_run`
# was skip. An opted-in copy of this shape refreshes onto catch_up_once.
schemaVersion: 1
name: __ORBIT_ROUTINE_NAME__
description: >
  Hourly reclamation of worktrees whose associated task has settled to
  rejected, archived, or done.
enabled: false
trigger:
  cron: "35 * * * *"
  missed_run: skip
target: job:worktree_gc_pipeline
policy:
  timeout_minutes: 30
  overlap: forbid
