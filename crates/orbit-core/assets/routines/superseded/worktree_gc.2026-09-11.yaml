# Superseded `worktree_gc` default (shipped through 2026-09-11): missed_run
# was skip. Kept as a provenance shape only — see
# `SUPERSEDED_ROUTINE_TEMPLATES` in `application/routines/seed.rs`.
schemaVersion: 1
name: __ORBIT_ROUTINE_NAME__
description: >
  Hourly reclamation of worktrees whose associated task has settled to
  rejected, archived, or done.
enabled: false
trigger:
  cron: "35 * * * *"
  missed_run: skip
target: job:worktree_gc_pipeline
