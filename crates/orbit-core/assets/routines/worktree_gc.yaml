# Default worktree garbage-collection routine [ORB-10374].
# Seeded disabled: operators must review and opt in before unattended deletion.
schemaVersion: 1
name: __ORBIT_ROUTINE_NAME__
description: >
  Hourly reclamation of worktrees whose associated task has settled to
  rejected, archived, or done, and of someday worktrees older than
  worktree.parked_reclaim_after_hours. A live claim or held lease is kept.
enabled: false
trigger:
  cron: "35 * * * *"
  missed_run: skip
target: job:worktree_gc_pipeline
policy:
  timeout_minutes: 30
  overlap: forbid
