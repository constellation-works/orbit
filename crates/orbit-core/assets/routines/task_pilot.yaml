# Default task-pilot routine [ORB-10739, ORB-12745]. Seeded into
# `.orbit/routines/` on `orbit init` with the routine name, this host's
# registered machine id (`owner_machine`) and the workspace's registered base
# branch resolved at seed time. It is intentionally disabled: enabling
# scheduled task preflight is an explicit, versioned workspace decision.
#
# State-triggered rather than cron [ORB-11331]: each clock tick fingerprints
# the eligible tasks against the pinned branch head and admits the tasks whose
# material has no fresh assessment once each has settled for debounce_minutes,
# or waited max_wait_minutes, up to batch_size of them into one run whose
# members share one stored crew [ORB-12761] and whose
# pilots take at most five tasks each [ORB-12746]. A fresh assessment,
# including an unready verdict, never re-dispatches; a material edit creates
# new work. Nothing fires while the backlog is unchanged. Preparation never
# promotes or dispatches the assessed task.
#
# What is material is `[workflow.task_pilot_freshness]` in config.toml
# [ORB-13638]: by default only the title, description, acceptance criteria,
# plan and selectors, with branch-head moves ignored, so retagging or
# reassigning an assessed task does not pilot it again. An optional
# `freshness` block under `trigger.state` overrides either key for this
# routine only, for example:
#
#     freshness:
#       material_fields: [title, description, criteria, plan, selectors, tags]
#       source_sensitivity: context_files   # ignore | context_files | any
#
# Changing the resolved freshness invalidates assessments accepted under the
# old one.
#
# `eligibility` is optional and defaults to the values shown: proposed or
# backlog tasks not tagged `no-diff-expected` / `no-diff-needed`, of any type,
# with no required tags. Narrow it here; changing it invalidates assessments
# accepted under the old predicate. See
# docs/design/automation-triggers/5_operations.md.
#
# Only this host evaluates the trigger (`owner_machine`); a second host
# registering the same workspace seeds its own owner. Explicit task-ID runs
# (`orbit run task-pilot <id>`) remain available for any workspace task and do
# not use this gate.
schemaVersion: 1
name: __ORBIT_ROUTINE_NAME__
description: >
  Preflight proposed/backlog tasks whose material fingerprint has no fresh
  task-pilot assessment. State-triggered: fires on creation or material edit
  and stays quiet otherwise. Disabled by default; set enabled to true in this
  versioned definition to opt this workspace into scheduled task preflight.
enabled: false
trigger:
  state:
    kind: preparation_eligible
    owner_machine: __ORBIT_OWNER_MACHINE__
    branch: __ORBIT_BASE_BRANCH__
    debounce_minutes: 2
    max_wait_minutes: 10
    max_items: 50
    batch_size: 5
    retries: 1
    deadline_minutes: 90
    eligibility:
      statuses: [proposed, backlog]
      exclude_tags: [no-diff-expected, no-diff-needed]
      require_tags: []
      task_types: []
target: job:task_pilot_pipeline
policy:
  timeout_minutes: 90
  overlap: forbid
  retries: {max: 1, backoff_minutes: 5}
