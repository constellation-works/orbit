# Retired `crew_memory_dream` default. Orbit no longer seeds this weekly
# dreaming routine; the job it targeted, `crew_memory_dream_pipeline`, still
# ships. Kept as a provenance shape only, so `orbit workspace sync` can tell an
# Orbit-seeded copy from an operator-authored one — see
# `RETIRED_ROUTINE_FILES` in `app/routine/seed.rs`.
schemaVersion: 1
name: __ORBIT_ROUTINE_NAME__
description: >
  Weekly crew memory dreaming: one reflection task per model with enough
  recent implementer work, each with its evidence pack, while an experiment
  with a memory arm is running.
enabled: true
trigger:
  cron: "0 2 * * 1"
  missed_run: skip
target: job:crew_memory_dream_pipeline
policy:
  timeout_minutes: 30
  overlap: forbid
