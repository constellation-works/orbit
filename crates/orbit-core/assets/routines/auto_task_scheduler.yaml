# Default auto-task scheduler routine [ORB-10149]. Seeded into
# `.orbit/routines/` on `orbit init` with the routine name resolved at seed
# time (see `seed_default_routines` in
# `crates/orbit-core/src/application/routine.rs`). It is evaluated by the
# clock of every host with an owner checkout of this workspace. The versioned
# `enabled` switch is deliberately false when seeded; opt in by reviewing
# this definition and changing it to true.
#
# This is THE scheduler surface for auto-tasks: one generic routine that fires
# `auto_task_scheduler_pipeline`, which reads every `.orbit/auto_tasks/*.yaml`
# definition and mints tasks from the due ones. Adding a new periodic chore is
# a new definition (`orbit auto-task add`), never new orbit code or a new
# routine. Its fires are observable on the dashboard routines surface.
#
# Cadence is minutely so a definition's own cron/interval schedule — not this
# routine's cadence — governs when its tasks are minted; the per-definition
# cursor and catch-up collapse keep a minutely sweep cheap and idempotent.
# `overlap: forbid` plus the job's `max_active_runs: 1` keep it single-flight.
schemaVersion: 1
name: __ORBIT_ROUTINE_NAME__
description: >
  The generic auto-task scheduler: mint tasks from every due, enabled
  `.orbit/auto_tasks` definition. Catch-up collapses and `skip_if_open`
  dedupe are enforced by the scheduler; each definition's own schedule
  governs its cadence.
enabled: false
trigger:
  cron: "* * * * *"
  missed_run: skip
target: job:auto_task_scheduler_pipeline
policy:
  timeout_minutes: 30
  overlap: forbid
