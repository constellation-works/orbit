# Default failed-run triage routine [ORB-10129]. Seeded into
# `.orbit/routines/` on `orbit init` with the routine name resolved at seed
# time (see `seed_default_routines` in
# `crates/orbit-core/src/application/routine.rs`). It is evaluated by the
# clock of every host with an owner checkout of this workspace. The versioned
# `enabled` switch is deliberately false when seeded; opt in by reviewing
# this definition and changing it to true.
#
# Cadence is deliberately sparser than the ~20-minute ship sweep: triage is
# cleanup, not a hot path. `overlap: forbid` plus the job's
# `max_active_runs: 1` keep triage single-flight.
schemaVersion: 1
name: __ORBIT_ROUTINE_NAME__
description: >
  Hourly triage of tasks blocked by failed job runs: diagnose the failure,
  re-backlog environmental casualties, and leave everything else blocked
  with a diagnosis attached.
enabled: false
trigger:
  cron: "15 * * * *"
  missed_run: skip
target: job:task_triage_pipeline
policy:
  timeout_minutes: 45
  overlap: forbid
