# Legacy Gemini CLI executor. Individual Gemini CLI accounts stopped 2026-06-18;
# enterprise Gemini Code Assist and API-key authentication remain available.
# `orbit init` enables the Antigravity (`agy`) crews when `agy` is installed;
# those crews run on the `antigravity` executor.
# Do not treat this as the current Google terminal agent. [ORB-11299]
schemaVersion: 2
kind: Executor
metadata:
  name: gemini
spec:
  executor_type: direct_agent
  command: gemini
  args:
    - --approval-mode
    - yolo
    - --allowed-mcp-server-names
    - orbit
    - -o
    - json
  stdout_format: envelope
  sandbox: macos-sandbox-exec
  model_flag: "-m"
  env: {}
