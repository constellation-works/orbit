schemaVersion: 2
kind: Executor
metadata:
  name: local-shell
spec:
  # Deterministic local command execution, dispatched by the `local_shell`
  # deterministic action. This executor carries no model, prompt, or agent tool
  # authority; the activity's own config names the program to run.
  #
  # `command` and `args` here are optional defaults for steps that name no
  # program of their own, `env` is layered onto the resolved [execution.env]
  # baseline, and `timeout_seconds` is the fallback wall-clock budget.
  #
  # No `sandbox` is declared, so shell steps run bare under the process
  # supervisor. The cwd containment check validates only the child's initial
  # working directory. Filesystem access after launch is limited only by an
  # effective OS sandbox or by restrictions the Orbit process inherited. Add
  # `sandbox: macos-sandbox-exec` on macOS or `sandbox: linux-bwrap` on Linux
  # to wrap every activity that uses this executor in that OS backend. The
  # backend is selected here. An activity's `fsProfile` is optional: it selects
  # a named policy profile; without one, `unrestricted` applies. macOS Seatbelt
  # applies read and modify rules. Linux Bubblewrap enforces modify rules but
  # not profile read rules, including `denyRead`; only fixed credential and
  # runtime-directory masks and explicit caller masks restrict host reads.
  # Do not rely on Linux `denyRead` to protect other secrets. If the backend
  # is unavailable, `allow_fallback: true` permits bare execution without its
  # policy or masks; otherwise the step fails. Other setup or spawn errors do
  # not trigger fallback. Each step reports the backend it actually ran under.
  executor_type: local_shell
  args: []
  env: {}
