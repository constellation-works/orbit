schemaVersion: 2
kind: Activity
metadata:
  name: store_gc
spec:
  type: deterministic
  description: >
    Apply the store retention `orbit gc audit --apply` and `orbit gc runs
    --apply` perform, under `retention.audit_days` and `retention.runs_days`:
    delete command and run audit rows older than the audit window, sweep the
    audit blobs no remaining row or pending write names, and drop the pipeline
    state of terminal runs older than the run window. Deletes run in batches
    of short write transactions; VACUUM is left to the operator.
  input_schema_json:
    type: object
  output_schema_json:
    type: object
    required: [audit, runs]
    properties:
      audit:
        type: object
      runs:
        type: object
  action: store_gc
  config: {}
