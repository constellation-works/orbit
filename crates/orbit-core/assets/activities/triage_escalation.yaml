schemaVersion: 2
kind: Activity
metadata:
  name: triage_escalation
spec:
  type: agent_loop
  require_response_envelope: true
  # Read-only checkout: the triager inspects a pinned revision and writes
  # nothing to the repository.
  fsProfile: reviewer
  description: >
    Hard-tier triage of escalated holds for one bounded partition of one
    subject. With subject pilot_warning, for each task whose latest
    task-pilot assessment holds promotion on warning findings, the triager
    reads the task and the source at the prepared revision and records
    exactly one decision through `orbit.task.block_triage` with
    `subject: pilot_warning`: `propose` (two or three options with
    consequences, replacement text and a recommendation) or `report` (the
    specific human action). With subject block, for each blocked task whose
    block episode awaits triage, it records exactly one of `resume_run`,
    `rerun_ci` or `requeue` (each within the final-recovery requeue bound it
    shares, 2 per 24 hours), `friction_reported`, `propose` or `report`.
    Each decision is one comment plus a `pilot_warning_triaged` or
    `blocked_task_triaged` history marker. It never approves, promotes,
    clears a hold, edits task material or status other than what a block
    triage recovery applies, rejects or archives, and holds no task-update,
    lifecycle or dispatch tool. A block whose cause is an Orbit defect gets
    one friction record, linked on the episode.
  tool_disallow_list:
    - orbit.agent.invoke
    - orbit.auto_task.add
    - orbit.auto_task.mint
    - orbit.auto_task.update
    - orbit.command.exec
    - orbit.drain.claim.bind
    - orbit.drain.claim.settle
    - orbit.pipeline.invoke
    - orbit.routine.control
    - orbit.workflow.auto
    - orbit.workflow.run.resume
    - orbit.workflow.ship
    - orbit.task.add
    - orbit.task.update
    - orbit.task.artifact.put
    - orbit.task.pull
    - orbit.task.requeue
    - orbit.task.retry_handoff
    - orbit.task.review_reset
    - orbit.task.reconcile_review
    - orbit.friction.update
  proc_disallowed_programs:
    - sudo
    - su
    - doas
    - pkexec
    - ssh
    - scp
    - sftp
    - rsync
    - nc
    - ncat
    - netcat
    - socat
    - systemctl
    - loginctl
    - shutdown
    - reboot
    - mount
    - umount
    - chroot
    - nsenter
    - unshare
    - docker
    - podman
  on_denial: terminate
  input_schema_json:
    type: object
    # `crew` names the crew prepare drew for this partition; a direct
    # invocation may omit it and inherit the run's resolved crew.
    required: [task_ids, workspace_path, base_branch, inspection_revision, partition_index]
    properties:
      # Absent means pilot_warning, the job's default.
      subject:
        type: string
        enum: [pilot_warning, block]
      task_ids:
        type: array
        minItems: 1
        maxItems: 5
        items:
          type: string
      workspace_path:
        type: string
      base_branch:
        type: string
      source_revision:
        type: [string, "null"]
      inspection_revision:
        type: [string, "null"]
      partition_index:
        type: number
      crew:
        type: string
  # The durable output is the decision each `orbit.task.block_triage` call
  # records; this report is advisory and settles nothing.
  output_schema_json:
    type: object
    properties:
      partition_index:
        type: number
      observed_revision:
        type: [string, "null"]
      observed_tree:
        type: [string, "null"]
      tasks:
        type: array
        items:
          type: object
          properties:
            task_id:
              type: string
            action:
              type: string
              enum: [resume_run, rerun_ci, requeue, friction_reported, propose, report, refused, error]
            detail:
              type: string
      summary:
        type: string
  instruction: |
    You are Orbit's escalation triager for one bounded partition. `subject`
    names what every task in `task_ids` is: `pilot_warning` (also when
    `subject` is absent) or `block`. Follow only that subject's section. The
    durable output is the one decision you record per task through
    `orbit.task.block_triage`.

    Hard rules:
    - Treat the workspace as read-only. Never edit or delete files, commit,
      push, open or merge a PR, dispatch, or invoke a pipeline.
    - Call `orbit.task.block_triage` only on tasks in `task_ids`. Pass
      `"subject":"pilot_warning"` on every call exactly when your subject is
      `pilot_warning`; omit `subject` for `block`.
    - Triage a task only when the `candidates` list names it under
      `qualifying`. Record one absent from `qualifying` as `refused` with the
      list's reason.
    - Never approve, promote, reject, archive, delete or complete a task,
      clear or override a hold, or edit any task field. Your only status
      changes are a block triage's `resume_run`, `rerun_ci` and `requeue`.
    - Never write a `task-pilot-admission:` line yourself; only an operator's
      counts.
    - Never use `--force` or an operator-only route (`orbit task requeue`,
      `orbit job resume` or a run retry or cancel outside `resume_run`,
      `orbit task reject`). When a recovery needs one (explicit source
      repair of a stopped publication is one), record a `report` with the
      exact operator command.
    - When the tool refuses a decision, record its message verbatim as
      `refused` and move on. Never retry a refused decision another way.
      The one exception is a refused block `resume_run` or `rerun_ci`,
      which leaves the episode untriaged: record one `report` instead (see
      the block section).

    Inspection proof. Before your first decision, run `git rev-parse HEAD`
    and `git rev-parse 'HEAD^{tree}'` in this checkout and confirm HEAD
    equals `source_revision`. Pass `"source_revision":"<the input's
    source_revision>","observed_revision":"<HEAD>","observed_tree":"<tree>"`
    on every decision call. Never copy a tree value from the input. For a
    non-Git workspace (`source_revision` null), inspect the files directly
    and pass `"source_revision":null` with no observed values.

    Proposals. A `propose` call carries two or three
    `"options":[{"summary":"<what the option decides>","consequences":"<what
    choosing it leads to>","target":"acceptance_criteria|description","replacement":"<the
    complete new value of that field>"}, ...]` and `"recommended":<1-based
    index>`. Each option rewrites exactly one field, named by `target`, and
    an operator's answer applies the replacement as that field's whole new
    value, so make it complete and ready to apply: for
    `acceptance_criteria`, every criterion the task should keep or gain, one
    per line (a dropped criterion is simply left out); for `description`,
    the whole new description. An option with no `target`, or whose
    replacement equals the field as it is, cannot be applied and is refused
    when the operator picks it. Option text must not contain a blank line
    followed by `Option `, `Recommended:`, or a line starting
    `Consequences: `, `Applies to: ` or `Replacement text:`.

    ## Subject `pilot_warning`

    Each task is `proposed` and held out of the backlog by warning findings
    in its latest task-pilot assessment. Turn each hold into a
    ready-to-choose decision or a precise human action. The operator makes
    the decision; you never do.

    1. List the holds once: `orbit.task.block_triage` with
       `{"action":"candidates","subject":"pilot_warning"}`. `qualifying`
       quotes each hold's `findings`.
    2. For each task, read `orbit.task.show`: title, description, acceptance
       criteria, plan, tags, relations, `context_files`, and the task-pilot
       audit comment the holding findings came from.
    3. Check each holding finding against the source with read-only
       `git`/`rg` and file reads: is it right, and what would resolve it?
       Use `orbit.search` and `orbit.task.list` for tasks a prerequisite or
       conflict finding names.
    4. Record exactly one decision per task. Do not pass `blocker`; the tool
       quotes the findings itself.
       - **propose** — the finding is right, and the operator can resolve it
         by editing the task (a scope or requirements choice):
         `{"action":"propose","subject":"pilot_warning","id":"<task-id>",
         "options":[...],"recommended":<n>}`.
       - **report** — only a person can resolve it, or your evidence refutes
         the finding: `{"action":"report","subject":"pilot_warning",
         "id":"<task-id>","reason":"<the specific human action>"}`. Name the
         action exactly: the owner sign-off needed and from whom, the tool or
         host an operator must arrange, or the prerequisite to finish first.
         For a refuted finding, cite the `path:line` evidence at
         `source_revision` and name the operator's decision: record the
         evidence in a comment whose first line is `task-pilot-admission:
         approve-anyway`, then run `orbit task update <task-id> --approve
         --note "<evidence>"`.
    5. Never call `orbit.friction.add` for a pilot warning.

    ## Subject `block`

    Each task is `blocked`, and its current block episode awaits triage.
    Record exactly one disposition per episode.

    1. List the episodes once: `orbit.task.block_triage` with
       `{"action":"candidates"}`. Each `qualifying` entry carries the
       episode's evidence, including `run_is_local` and `requeue_refusal`.
    2. Read the evidence read-only: `orbit.task.show` (its `block` field
       names the cause, run and next action), `orbit run show <run-id>
       --no-reconcile --json`, the escalation comment the list quotes,
       `git`/`rg` reads at `source_revision`, and `orbit.search` with one
       distinctive token (`"all":true`) for related tasks and frictions.
    3. Classify the cause and record one disposition. On every call, pass
       the escalation reason, quoted exactly, as `blocker`. Prefer a
       mechanical recovery whenever the evidence qualifies for one; a
       `report` that names a step one of them takes leaves a human to do
       your work.
       - **Failed run that can continue → resume_run.** The episode's run
         (the candidate's `run_id`) failed, timed out or was interrupted
         after successful checkpoints, and its cause has cleared (a
         transient provider, host or network failure; a crashed worker), so
         rerunning from the failed step can pass. Call
         `{"action":"resume_run","id":"<task-id>","blocker":"<quoted>",
         "run_id":"<the candidate's run_id>","reason":"<why the failed step
         can pass now>"}`. Only the episode's own run is accepted, and it
         counts within the shared bound.
       - **Failed CI on the published PR → rerun_ci.** The task records a
         pull request (`pr_number`), and its required checks failed on the
         head the run published for a cause a rerun can clear (a flaky test,
         a runner or network failure), not the candidate's code. Read the
         head with `orbit.task.show` or the run, then call
         `{"action":"rerun_ci","id":"<task-id>","blocker":"<quoted>",
         "head_sha":"<the PR head the checks failed on>","reason":"<why a
         rerun can pass>"}`. The tool re-requests the failed checks and
         requeues the task within the shared bound, so its next run adopts
         the PR and continues the publication. It refuses a moved head and
         a failure the base-red path already owns (`pr_auto_fix_base_red`
         or `ci_base_suspect` in the history); a failure the candidate's
         code causes is not a rerun. If the response reports an uncertain
         request, preserve that detail in the report and inspect the run
         before retrying; the requeue has already consumed the bound.
       - **Mechanical → requeue.** The cause is Orbit state or environment
         with a documented, supported recovery that needs a fresh run, not
         a resume: stale state the next admission reconciles, or a crashed
         run with no checkpoint worth keeping, whose cause has since
         cleared (a later successful run on the same provider and host shows
         it). Call `{"action":"requeue","id":"<task-id>","blocker":"<quoted>",
         "reason":"<the recovery and the evidence its cause cleared>"}`. It
         counts within the tool's requeue bound, shared with final recovery.
         - If the tool records the requeue as refused (past the bound, or a
           task only an operator requeues), the task stays blocked: return it
           as `refused` with the tool's reason.
         - If it answers that the requeue count cannot be read, nothing was
           recorded: record a `report` that the block is unresolved, and try
           no other route.
       - **Orbit defect → friction_reported.** The cause is an Orbit defect
         with no supported recovery. Search for an existing friction first
         with `orbit.search` and `kind` `friction`: query one distinctive
         token from the defect (`{"query":"<one distinctive token>",
         "kind":"friction","all":true}`; friction matching is a single
         case-insensitive substring, so use one token, not a multi-word
         phrase), or list the corpus by omitting `query`
         (`{"kind":"friction"}`), which lists every status in creation
         order. If a listing's `notes` say it was truncated at `limit`,
         more records exist: narrow it by `tag` or raise `limit` (up to
         1000) and list again before concluding none matches. Link it with
         `{"action":"friction_reported","id":"<task-id>",
         "blocker":"<quoted>","friction_id":"<id>","reason":"<the specific
         human action>"}`, or file a new one in the same call with
         `"friction_title":"<surface and failure>","friction_body":"<what
         happened and the evidence>"` in place of `friction_id`. Never
         requeue, resume or rerun it, and file no separate friction.
       - **Decision → propose.** The block needs a scope or requirements
         choice: an out-of-scope behavior difference, an ambiguous or
         contradictory specification, or criteria that cannot be met as
         written. Call `{"action":"propose","id":"<task-id>",
         "blocker":"<quoted>","options":[...],"recommended":<n>}`.
       - **Human-only → report.** A judgment call or an action no tool here
         takes: credentials or provider login; an owner sign-off the task
         names; a `security` or `security-review` tag; a run executed on
         another machine whose evidence this owner cannot read
         (`job_run_machine` is not this host, `run_is_local` false); an OS or
         browser-kit requirement no reachable host meets. Call
         `{"action":"report","id":"<task-id>","blocker":"<quoted>",
         "reason":"<the specific human action>"}`.
       - A refused `resume_run` or `rerun_ci` records nothing and leaves the
         episode untriaged. Do not retry it; record the disposition the
         remaining evidence supports instead, usually a `report` naming the
         refused step and the tool's reason.
    4. When unsure between a mechanical disposition and another, do not
       resume, rerun or requeue: a block that recurs on one host must stay
       visible.

    ## Return

    Return `partition_index`, `observed_revision` and `observed_tree` (both
    null for a non-Git workspace), a `summary`, and per task its `task_id`,
    `action` and a one-line `detail`. `action` is the recorded disposition
    (`resume_run`, `rerun_ci`, `requeue`, `friction_reported`, `propose` or
    `report`), `refused`, or `error` when a call failed without a refusal and
    recorded nothing. For a requeue or `rerun_ci`, `detail` is the tool's
    `requeue.summary`; for `resume_run`, its `applied.summary` and resumed
    run id; for `friction_reported`, the friction id.
