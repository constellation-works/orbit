schemaVersion: 2
kind: Activity
metadata:
  name: invoke_and_wait
spec:
  type: deterministic
  description: >
    Submit a named v2 Job and block until its Run reaches a terminal
    state, then return a bounded summary of its wait entry as data:
    `run_id`, `status`, `finished_at`, `duration_ms` and `error`. The
    child's pipeline is not copied into the parent; read it from the child
    Run by `run_id`. Internally chains
    `orbit.pipeline.invoke` (to submit the child Run) and
    `orbit.pipeline.wait` (to block on completion). Submission and waiting
    are separate observable phases: the child's exact run ID is persisted
    into the parent Run's state, and audited, before the wait begins, so
    CLI, MCP, API, and dashboard readers can name the child for the whole
    duration of the block. A submission that cannot produce a durable
    child Run fails this activity immediately with the invocation error
    rather than idling until `timeout_seconds`. Cancelling the parent
    while it waits keeps the child link, marks the wait terminal, and
    cancels the child (an `invoke_detached` child is left running instead).
    Workflows that require
    a successful child Run should follow this activity with
    `pipeline_success_guard` after any cleanup that depends on the raw
    child status. The returned `status` mirrors the child Run's terminal state:
    `success`,
    `failed`, `cancelled`, `interrupted`, or `timeout`. A `timeout` here means the
    WAIT side of the activity exceeded `timeout_seconds`. What happens to a
    child still pending or running then is the caller's `on_timeout`
    choice. `cancel_child` cancels it, so the parent never ends with a live
    child: the child's failure handoff keeps its candidate (committed,
    carried to its durable ref, no PR) and its task returns to the backlog
    naming the timeout and that candidate, so the task's next run resumes
    it. The output is `timeout` with `child_cancelled: true`, the kept
    `candidate`, and an `error` that leads with `child_timeout`. A child that
    finished before it could be cancelled reports its own status instead.
    `leave_running` (the default) leaves the child running and reports
    `timeout` with `child_live: true`; callers that care must inspect
    `run_id` to decide follow-up. Gate workflows may pass
    `admission_task_ids` and `admission_workflow` to re-check workflow
    admission immediately before dispatch, so an admission granted before a
    long gate wait cannot dispatch work whose status has since changed.
    Neither case submits a child Run: stale `review` / `done`
    tasks return a successful no-op output with `skipped: true`, while a task
    withdrawn during the wait returns `skipped: true` with a non-success
    `status` and an `error` naming the task and its status, so a following
    release step still runs and `pipeline_success_guard` then fails the
    parent. A task that keeps an admissible status but is refused by
    admission (a pilot hold, a native-OS wait or an unreadable pilot receipt)
    stops the same way, with the admission error as the `error`. A task id
    that resolves to no task at all fails the activity. A gate whose wait
    budget expired passes its `deferral` (`deferred: true`); the activity
    then submits no child and returns a successful no-op with `skipped:
    true` and that `deferral`, naming what blocked the task, which stays in
    backlog.
  input_schema_json:
    type: object
    required: [job_name, run_input]
    properties:
      job_name:
        type: string
      run_input:
        type: object
      timeout_seconds:
        type: number
        minimum: 1
        maximum: 21600
      poll_interval_seconds:
        type: number
        minimum: 1
      on_timeout:
        type: string
        enum: [leave_running, cancel_child]
      priority:
        type: string
        enum: [low, medium, high, critical]
      admission_task_ids:
        type: array
        items:
          type: string
      admission_workflow:
        type: string
      deferral:
        type: object
  output_schema_json:
    type: object
    required: [status, run_id]
    properties:
      status:
        type: string
        enum: [success, failed, cancelled, interrupted, timeout, pending, running]
      run_id:
        type: string
      finished_at:
        type: string
      duration_ms:
        type: integer
        minimum: 0
      error:
        type: string
      child_live:
        type: boolean
      child_cancelled:
        type: boolean
      candidate:
        type: object
      skipped:
        type: boolean
      reason:
        type: string
      task_statuses:
        type: array
        items:
          type: object
      deferral:
        type: object
  action: invoke_and_wait
  config: {}
