schemaVersion: 2
kind: Activity
metadata:
  name: evolution_rank
spec:
  type: deterministic
  description: Rank open evolution records above every configured threshold; durably record even an empty pass.
  input_schema_json: {type: object}
  output_schema_json:
    type: object
    required: [record_count, records]
    properties:
      record_count: {type: number}
      records: {type: array}
  action: evolution_rank
  config: {}
