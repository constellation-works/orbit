schemaVersion: 2
kind: Activity
metadata:
  name: worktree_setup
spec:
  type: deterministic
  description: >
    Create a worktree and branch for one task or a task bundle, stamp the task
    records with job-run/workspace metadata, and move them to `in-progress`.
    An existing branch or registered checkout is reused only when its HEAD
    already equals the resolved `base_sha`. An unexplained mismatch refuses
    before admission, names branch/tip/base, and leaves retained work
    untouched. Retrying without recovering that leftover refuses again;
    inspect it, then move the branch aside or delete it only after confirming
    no retained candidate is needed.
  input_schema_json:
    type: object
    properties:
      task_id:
        type: string
      task_ids:
        type: array
        minItems: 1
        items:
          type: string
      run_id:
        type: string
        description: >
          Worktree identity token. Epic pipelines pin `epic-<task-id>` so the
          checkout is stable across runs. Distinct from the admitted job.
      job_run_id:
        type: string
        description: >
          Admitted job that owns task stamps and downstream execution. The
          dispatcher injects this when `run_id` is already an identity token.
      base:
        type: string
      base_branch:
        type: string
      base_sync:
        type: string
        enum: [remote, local]
      branch_prefix:
        type: string
      landing_mode:
        type: string
        enum: [local, pr]
      ship_mode:
        type: string
        enum: [local, pr]
  output_schema_json:
    type: object
    properties:
      job_run_id:
        type: string
      batch_id:
        type: string
        description: Deprecated compatibility alias for job_run_id.
      workspace_path:
        type: string
      head_ref:
        type: string
      base_ref:
        type: string
        description: Moving start-point ref name, for steps that reconcile against the live base.
      base_sha:
        type: string
        description: >
          Immutable commit this worktree was created at, resolved once so later
          steps never re-resolve the moving ref. A successful setup guarantees
          the checkout HEAD equals this id; setup never publishes it against
          unexplained reused history.
  action: worktree_setup
  config: {}
