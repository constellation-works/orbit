schemaVersion: 2
kind: Activity
metadata:
  name: prepare_rule_findings
spec:
  type: deterministic
  description: >
    Read-only owner context for a rule-results producer. Lists the
    producer-declared defect groups that open ux-rules tasks (proposed,
    backlog, in-progress, review or blocked) already own, as opaque
    {surface, rule, defect: {version, key}} entries, so the producer reports
    every current observation of those groups, passing ones included, while
    it only counts untracked passing observations. Nothing is written. An
    owner created after this snapshot is not listed; its members stay
    missing until reported and never receive pass credit from omission.
  input_schema_json:
    type: object
    properties: {}
  output_schema_json:
    type: object
    required: [schema_version, groups]
    properties:
      schema_version:
        type: number
      groups:
        type: array
        description: One entry per open owner's defect group, ordered by group fingerprint, with members listing the aggregate fingerprints its observations were recorded under.
  action: prepare_rule_findings
  config: {}
