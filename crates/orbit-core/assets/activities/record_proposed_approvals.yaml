schemaVersion: 2
kind: Activity
metadata:
  name: record_proposed_approvals
spec:
  type: deterministic
  description: >
    Record what this drain's finished `--approve-proposed` task-pilot
    children did. Every finished pilot the drain has not recorded yet is
    read from its own run input; a task counts as approved only when it has
    left `proposed` and its history holds a `proposal_approved` entry whose
    note names this drain; the pilot's own output is not trusted for that.
    The approvals are added to the drain run's `drain_approvals` report in
    the same write that closes the pilot's dispatch, so each pilot is
    counted once, and the held view of every remaining `proposed` task is
    refreshed with its reason: the qualification it misses, the task-pilot
    classification that held it, `pilot_running` while a live pilot carries
    it, or `pilot_unresolved` when the pilot left no decision. A task whose
    current pilot assessment is `verified_no_diff` (and is not tagged
    `no-diff-expected`) is held as `pilot_verified_no_diff` with the pilot's
    evidence and cited commits; one Orbit automation filed is archived
    instead (`closed`) when a cited commit that relates to the finding is
    proven on the base branch, unless the drain's admissions are stopped.
    `pilots` lists each pilot recorded by this call with its terminal status
    and the tasks it approved.
  input_schema_json:
    type: object
    properties: {}
  output_schema_json:
    type: object
    required: [approved, approved_count, pilots, held, held_total, held_by_reason]
    properties:
      approved:
        type: array
        items:
          type: string
      approved_count:
        type: number
      pilots:
        type: array
        items:
          type: object
          required: [run_id, status, approved]
          properties:
            run_id:
              type: string
            status:
              type: string
            approved:
              type: array
              items:
                type: string
      held:
        type: array
        items:
          type: object
      held_total:
        type: number
      held_by_reason:
        type: object
      closed:
        type: array
        items:
          type: string
  action: record_proposed_approvals
  config: {}
