schemaVersion: 2
kind: Activity
metadata:
  name: evolution_apply
spec:
  type: deterministic
  description: Validate ranked drafts, recover duplicates, attach cost evidence and link proposed tasks. Never promotes or builds work.
  input_schema_json:
    type: object
    required: [proposals]
    properties:
      proposals: {type: array}
  output_schema_json: {type: object}
  action: evolution_apply
  config: {}
