schemaVersion: 2
kind: Activity
metadata:
  name: file_dependabot_alert_tasks
spec:
  type: deterministic
  description: >
    File bounded, evidence-complete backlog tasks from a host-collected
    Dependabot, Code scanning, and secret scanning snapshot. Preserve
    Dependabot clustering, severity filtering, and PR skips; dedupe the other
    families by repository and alert number; and enforce one max_tasks bound
    across all families. Code scanning alerts that share scan provenance, rule
    and scanner message are filed as one bounded remediation group carrying a
    per-alert evidence ledger, a per-alert disposition contract, the highest
    member severity as priority, and every member's per-alert coverage key.
    Coverage is still decided per alert, so an alert an open task already owns
    is left to that task and its uncovered siblings become an attributed delta
    group rather than widening work in flight. Exact generated-key tags remain
    the fast path, then a shared high-confidence material coverage check finds
    untagged still-open tasks. Skips name the covering task and bounded match
    evidence; closed historical tasks and superficial similarities do not
    suppress a current alert. The exception is a Code scanning alert whose
    exact-key task was rejected: while the alert's number, rule and location
    still match what that task recorded, the sweep reports a `rejected_owner`
    skip naming the rejected task instead of re-filing it, and files it again
    once the rule or location changes. A rejection that names a covering task
    is a duplicate verdict and does not suppress. Duplicate-check failures are bounded retryable
    errors and happen before any task is filed. Filed tasks require no tools.
  input_schema_json:
    type: object
    required: [dependabot_snapshot]
    properties:
      dependabot_snapshot:
        type: object
      min_severity:
        type: string
        enum: [low, moderate, high, critical]
        description: >
          Optional run override for the minimum severity filed for Dependabot
          and Code scanning alerts. Otherwise use security_alert_sweep.min_severity
          from workspace then global config, with a built-in default of moderate.
          Secret scanning alerts are always filed regardless of this floor.
      skip_when_dependabot_pr_open:
        type: boolean
        default: true
      max_tasks:
        type: number
        minimum: 1
        maximum: 50
  output_schema_json:
    type: object
    required: [outcome, collection_outcome, family_outcomes, clusters, filed_count, filed, skipped_existing, skipped_dependabot_pr, skipped_over_cap, excluded_below_min_severity, min_severity, min_severity_source]
    properties:
      outcome:
        type: string
      collection_outcome:
        type: string
      family_outcomes:
        type: object
      clusters:
        type: number
      filed_count:
        type: number
      filed:
        type: array
      skipped_existing:
        type: array
        items:
          type: object
          required: [family, key, task_id, match_kind, match_evidence]
          properties:
            family:
              type: string
            key:
              type: string
            task_id:
              type: string
            match_kind:
              type: string
              enum: [exact_key, material_coverage, rejected_owner]
            match_evidence:
              type: object
      skipped_dependabot_pr:
        type: array
      skipped_over_cap:
        type: array
      excluded_below_min_severity:
        type: array
      min_severity:
        type: string
        enum: [low, moderate, high, critical]
        description: Effective severity floor used for this filing step.
      min_severity_source:
        type: string
        enum: [input, workspace, global, built-in]
        description: Layer that supplied the effective severity floor.
      code_scanning_group_bounds:
        type: object
        description: >
          The alert and distinct-path caps that split one cause into several
          remediation groups so each leaf task stays executable.
  action: file_dependabot_alert_tasks
  config: {}
