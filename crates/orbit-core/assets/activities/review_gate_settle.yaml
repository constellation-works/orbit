schemaVersion: 2
kind: Activity
metadata:
  name: review_gate_settle
spec:
  type: deterministic
  description: >
    Settle the admitted before-PR review attempt: read the reviewer's
    persisted report, commit the reviewer's changes as the candidate's one
    reviewer commit (`review: <summary>`, attributed to the reviewer) over the
    untouched implementation, cross-check the claimed verdict against the
    repository, validation records, task meaning, and the lineage budget,
    post the findings and what changed for each as a task comment, then issue
    the certificate and settle the ledger. `accept` and `accept_with_fixes`
    return the reviewed head and base the PR steps recheck; with fixes,
    `reviewer_fixed` asks the pipeline to revalidate the new head and
    `review_fixes` carries the PR body sections for fixes, raw validation
    records, and any failed out-of-scope diagnostics the review does not cover.
    A verdict needing only named external evidence ends the run as `held`,
    preserves `review_awaiting_evidence` on the task, and bypasses recovery and
    the failure handoff. A failed required check the reviewer claims the
    pinned base shares is rerun on the candidate and the base; when every such
    claim reproduces and nothing else is open, the step fails typed
    `[baseline_red]` so the failure handoff keeps the candidate and holds the
    task in the backlog until the base passes. A claim the host contradicts
    settles `incomplete`. Other `reject` and `incomplete` verdicts fail the
    step so the failure handoff preserves the candidate without publishing a
    PR.
  input_schema_json:
    type: object
    required: [job_run_id, completed_task_ids, workspace_path, admission]
    properties:
      job_run_id:
        type: string
      completed_task_ids:
        type: array
        items:
          type: string
      workspace_path:
        type: string
      base:
        type: string
      base_sync:
        type: string
        enum: [remote, local]
      admission:
        type: object
        description: The review_gate_admit output for this run.
  output_schema_json:
    type: object
    required: [gate, reviewed_head_sha, reviewed_base_sha]
    properties:
      gate:
        type: string
        enum: [passed, not_required]
      verdict:
        type: string
        enum: [accept, accept_with_fixes]
      assurance:
        type: string
      attempt_id:
        type: string
      reviewed_head_sha:
        type: string
      reviewed_base_sha:
        type: string
      implementation_head_sha:
        type: string
        description: The implementation head the reviewer examined, before its commit.
      final_candidate_tree:
        type: string
      reviewer_fixed:
        type: boolean
        description: Whether the reviewer committed fixes that owner validation must rerun on.
      review_fixes:
        type: string
        description: The PR body's review sections for fixes, raw validation records, and failed diagnostics; empty when none apply.
  action: review_gate_settle
  config: {}
