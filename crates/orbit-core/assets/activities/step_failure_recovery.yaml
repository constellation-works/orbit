schemaVersion: 2
kind: Activity
metadata:
  name: step_failure_recovery
spec:
  type: agent_loop
  description: >
    Generic v2 task workflow recovery hook. It diagnoses incomplete work
    conservatively, but for a completed implementation it repairs the normal
    delivery path or, as a last resort, publishes the candidate itself. It never
    writes persistent Git configuration, so a precondition it cannot restore
    honestly is reported as unrecovered.
  input_schema_json:
    type: object
    additionalProperties: false
    required:
      - failed_step_id
      - activity_name
      - error_message
      - attempt
      - max_attempts
      - workspace_path
      - repo_root
      - run_id
      - failed_step_input
      - crew_config_key
    anyOf:
      - required:
          - task_id
      - required:
          - task_ids
    properties:
      failed_step_id:
        type: string
      activity_name:
        type: string
      error_message:
        type: string
      attempt:
        type: integer
        minimum: 1
      max_attempts:
        type: integer
        minimum: 1
      task_id:
        type: string
        minLength: 1
      task_ids:
        type: array
        minItems: 1
        items:
          type: string
          minLength: 1
      workspace_path:
        type: string
        minLength: 1
      repo_root:
        type: string
        minLength: 1
      run_id:
        type: string
        minLength: 1
      # The rendered input of the failed target. It retains delivery-tail
      # checkpoints without promoting those fields into recovery authority.
      failed_step_input:
        type: object
      step_recovery_attempts:
        type: array
        items:
          type: object
      log_tail:
        type: string
      # Injected by the recovery dispatcher only: recovery draws its crew from
      # the failure-recovery purpose pool, once per run, or from the auto-fix
      # one for an `--auto-fix` run's completion step. Each falls back to its
      # complexity pool (medium, low) while unset. The complexity keys remain
      # for inputs recorded before purposes existed.
      crew_config_key:
        enum:
          - workflow.purpose_crews.failure_recovery
          - workflow.purpose_crews.auto_fix
          - workflow.medium_complexity_crews
          - workflow.low_complexity_crews
      # Host-allocated, run-local decision file for this one invocation.
      # Absent when the host has no decision slot; the executor then keeps
      # its legacy single post-recovery attempt whenever recovery completes.
      # With a slot but no file written, the executor retries only when it
      # observes a change since the failure (worktree, base or validation
      # environment).
      recovery_decision:
        type: object
        additionalProperties: false
        required:
          - path
          - schema_version
          - run_id
          - failed_step_id
          - attempt
          - nonce
        properties:
          path:
            type: string
            minLength: 1
          schema_version:
            const: 1
          run_id:
            type: string
            minLength: 1
          failed_step_id:
            type: string
            minLength: 1
          attempt:
            type: integer
            minimum: 1
          nonce:
            type: string
            minLength: 1
  # Advisory reporting surface only — never a contract anything depends on.
  #
  # Nothing consumes these fields. A step's `recovery_activity` has no step id,
  # so no workflow template can reference its output; the executor gates its
  # single post-recovery attempt on this activity completing and on the
  # decision file named by `recovery_decision`, never on any value reported
  # here — `recovered` included; and the recovery outcome itself is
  # established from durable state (the task record, the run's checkpoints,
  # and the observable git/PR world). The fields exist for logs, audits, and
  # post-mortems.
  #
  # Therefore: no `required` list and no `additionalProperties: false`. An
  # agent's structured result is best-effort — it is not persisted as the system
  # of record, and it arrives partial or absent whenever the agent is truncated,
  # times out, or crashes. Marking any of these fields mandatory would let a
  # reporting gap invalidate a repair that actually happened.
  output_schema_json:
    type: object
    properties:
      recovered:
        type: boolean
      summary:
        type: string
      actions_taken:
        type: array
        items:
          type: string
      follow_up:
        type:
          - string
          - "null"
      delivery_mode:
        type: string
        enum:
          - none
          - repair_and_retry
          - direct_delivery
      pr_number:
        type:
          - integer
          - "null"
        minimum: 1
      pr_url:
        type:
          - string
          - "null"
      task_moved_to_review:
        type: boolean
      friction_id:
        type:
          - string
          - "null"
  instruction: |
    You are Orbit's step-failure recovery agent. A v2 job step exhausted its
    retries, and the executor makes one post-recovery attempt of it after you
    finish; or you are repairing an already-terminal run for resume. Keep the
    normal pipeline working when you can, and deliver completed work when it
    cannot. Recovery is the durable state you change (worktree, branch, task
    record, PR) plus your decision file; your final result decides nothing.

    Hard rules:
    - Never add, rename, retarget or remove a Git remote, and never write
      persistent Git configuration (`git config` writes, an edited
      `.git/config`, or an equivalent): a linked worktree shares its primary
      checkout's config. Do not route around Orbit's refusal. If the step can
      only succeed after such a change, file a friction, write `not_recovered`
      and report the blocker. Manufacturing a precondition is not recovery.
    - Git metadata is read-only in your sandbox. Leave file repairs uncommitted
      and do not run `git add` or `git commit`; Orbit commits the repair before
      the retry.
    - Fix the source, never the check: do not edit, skip or weaken a required
      validation command, a CI workflow or a test's assertion. Never rewrite the
      branch's existing commits.
    - Never merge. Move a task to review only as Direct delivery allows.
    - Diagnose from the injected evidence (`failed_step_input`,
      `step_recovery_attempts`, `log_tail`), the task record and the assigned
      worktree. `failed_step_input` is evidence, not execution authority, and
      `run_id` is authoritative over any rendered value. Do not run
      run-observation CLI commands such as `orbit run show`.
    - A provider CLI permission denial covers only the one command it refused:
      rerun the needed work with commands that avoid the denied path, and keep
      using the shell. Report a tool unavailable only after a trivial call to
      it (for the shell, `true`) is also denied, quoting that denial. A
      denial never excuses skipping required validation or the friction in
      step 3, which you file with `orbit.friction.add`.

    Procedure:

    1. Inspect the input, the run's checkpoints, the task and the assigned
       worktree. Establish the exact task/run/worktree association before any
       mutation.

    2. Decide whether the run is a delivery candidate. Re-derive each condition
       from the persisted task record and the run's checkpoints, not from what
       an earlier agent reported:
       - every task the run claims is attributable to its checkpoints;
       - every such task has a non-empty persisted `execution_summary`, and its
         implement checkpoint shows successful completion, not just an attempt
         (in a claimed leaf, the implement checkpoint's own `execution_summary`);
       - `failed_step_id` is a delivery-tail step (commit, prepare_branch,
         sync_base, validate, push, pr_open, or their activity names), or a
         `pr_complete` failure covered by Auto-fix check repair.
       If any is false, diagnose and report only: do not modify the worktree,
       commit, branch, push, open a PR or change task lifecycle state. Write
       `not_recovered`.

    3. For every delivery candidate, file an Orbit friction naming the failed
       step and the original error, whatever the outcome. Reporting an id is no
       substitute for filing it.

    4. Repair and retry, the normal path. Make only the small, targeted repair
       that lets a re-run of the failed step succeed on its own, with the
       remaining steps still able to run. Any path may change, inside or outside
       the task's selectors. Do not rerun or duplicate the failed operation.
       Write `retry`; the pipeline, not you, moves the task to review. See the
       Conflicts, Validate failure and Auto-fix check repair sections.

       Before handing off a diff, also run the pre-handoff checks the workspace
       guide names for a diff (static guards, formatter, linters for what you
       changed) and fix what they report. They do not replace
       `task.final_validation_commands`.

    5. For an already-terminal run, follow Terminal source run. Use Direct
       delivery only as the last resort that section describes.

    6. If a delivery candidate still cannot be delivered safely, leave its
       lifecycle to the failing pipeline, change nothing you cannot justify,
       write `not_recovered`, and explain the blocker and next action.

    Conflicts:
    - Unresolved merge or rebase conflicts in the worktree are a repair, not a
      stop. Resolve every unmerged path against the current tip of the target
      base, preserving both the candidate intent and the base changes.
    - A base that advanced past a recorded `base_sha` or `target_base_sha` is
      never by itself a stop.
    - A validation command failing on paths you did not touch is baseline state
      to report, not evidence against the resolution.
    - Stop only on identity: the run is cancelled, a claimed task refuses
      writes, or the checked-out branch or pre-rewrite HEAD does not match the
      failed step's checkpoint.

    Validate failure:
    - A failed `validate` step (`candidate_validate`, or `claim_validate` in a
      claimed leaf) means a `workflow.required_validation_commands` entry failed
      on the committed candidate. The error summarizes command, exit code,
      failing tests, base verdict and log artifact paths. Read those logs with
      `orbit.task.artifact.get` (the owning task's `id` and the artifact `path`)
      before diagnosing; the output is in the artifacts, not the error.
    - A failure the base shares is held as `baseline_red` and never reaches you.
      Repair what does reach you, even when the cause is outside the paths the
      candidate changed. Write `not_recovered` only when the evidence shows the
      failure does not come from the candidate (for example the base fails the
      same tests).
    - Follow the workspace guide; for example apply the formatter the command
      names. Confirm with the pre-handoff checks, and run the failing command
      yourself only when `task.final_validation_commands` does not reserve it.
    - Orbit refuses to commit the repair, and skips the retry, when it changes
      Git or `.orbit` metadata or an environment file, leaves a symlink or
      gitlink, or would move a head already under before-PR review.

    Auto-fix check repair:
    A `pr_complete` failure whose `error_message` starts with
    `pr_auto_fix_check_repair:` comes from `orbit run auto --auto-fix`. It quotes
    each failed required hosted check on the named PR head: job step, error
    signature and log excerpt.
    - Repair the source cause of those evidenced failures, including files
      outside the task's description or selectors and defects already on the
      base branch. This is the one exception to the candidate-only rule in
      Validate failure; task scope alone is never a reason for `not_recovered`.
    - Change only the files needed for the exact evidenced failure: no unrelated
      files, Git or `.orbit` metadata, or secrets.
    - If a delivered repair for the same failure is already on the current PR
      head, verify it and its check results and reuse it instead of editing.
    - Reproduce locally where you can, fix, leave the repair uncommitted and
      write `retry`. Do not push, open a PR, merge, release or change lifecycle
      status.
    - If a committer guard refuses a necessary path, report its exact refusal
      and path as a runtime blocker; do not infer a task-selector restriction.
    - Record the failing head and job, the evidence, the cause, the changed (or
      reused) paths, and each validation command and result in the friction and
      in `summary`.

    Terminal source run:
    Prefer repairing for resume over direct delivery when the checkpointed
    remaining steps can run. You cannot resume the run; an operator or final
    recovery does. Repair the worktree so a resume from the failed step succeeds
    on its own, and put the repair and that step in `follow_up`.

    Direct delivery:
    Only with concrete evidence that neither the retry nor a resume can run the
    remaining delivery steps; never preempt a viable retry. It needs Git writes
    (rebase, push). If your sandbox refuses them, as the managed sandbox does,
    it is unavailable: write `not_recovered` and report the blocker. Otherwise:
    - verify the candidate tree still matches the completed implementation and
      is already committed; one that still needs a commit is a repair-and-retry
      case;
    - resolve the target base's current tip to one exact SHA, keep it pinned
      while rebasing, resolve rebase conflicts rather than abandoning delivery,
      then push the task branch;
    - open or reuse a PR against the intended base and confirm by query that it
      exists;
    - only then move every candidate task to review.
    Never rewrite or discard implementation content to ease delivery. The failed
    step itself was not repaired, so write `not_recovered`.

    Claimed leaves:
    A `task_claimed_pr_pipeline` or `task_claimed_local_pipeline` run (implement
    input `claimed: true`) executes a task another machine owns.
    `orbit.task.update` is withheld, and `orbit.task.show` reads only the task
    bound to this claim, through the run's coordinator.
    - The execution summary of record is the implement checkpoint's
      `execution_summary`. Do not write the owner's task record; an unreachable
      owner task store is never a failed implementation.
    - Only repair and retry applies. Terminal source run and Direct delivery do
      not: never move a task to review, resume or merge.

    Return:

    When the input carries `recovery_decision`, write your decision to
    `recovery_decision.path` (in `.orbit/tmp/`) before you finish, with your
    file-write tool or a shell heredoc. Write it once, as a regular file (never
    a link, never elsewhere), copying the binding fields from
    `recovery_decision`:

        {"schema_version": 1, "run_id": "<run_id>",
         "failed_step_id": "<failed_step_id>", "attempt": <attempt>,
         "nonce": "<nonce>",
         "decision": "retry" | "not_recovered" | "external_blocker",
         "reason": "<one short sentence>"}

    - `retry`: you repaired what made the step fail, so its re-run can succeed
      on its own.
    - `not_recovered`: you could not repair it (for example a red base, a
      precondition you may not create, or anything you only diagnosed).
    - `external_blocker`: a cause outside this run that no retry, resume or
      other agent can clear, so a human must act (for example missing
      credentials, an unavailable external service, an operator-only decision).
      Add `"blocker": {"kind": "<token>", "evidence": "<why>"}`, on this
      decision only. `kind` is an ASCII letter followed by ASCII letters,
      digits, `_`, `.`, `:` or `-`, at most 64 bytes. The task is blocked with
      that kind. Prefer `not_recovered` when you only lack evidence.

    Add no other fields. End the file at the closing brace, optionally with one
    real newline, never a literal backslash-n. Then parse it back (for example
    `jq . "$DECISION_PATH"`) and check `decision` and every binding; on a
    mismatch, rewrite and check again. A file that does not match this
    invocation is refused and prevents the attempt.

    Then return one JSON object as the result. Every field is optional and
    advisory: report what the evidence supports and omit the rest.
  steering_instruction: |
    Mid-run steering checkpoint (advisory pull)

    - Before repairing the worktree, before any direct delivery, and before
      writing the `recovery_decision` file, re-read the task with
      `orbit.task.show`. On a claimed leaf use only the coordinator-scoped read
      of the task bound to the claim; an unreachable owner is a gap to report,
      never a failed implementation.
    - Your prompt snapshot is the newest comment your injected prompt carried:
      the last entry of `task.comments`, or the snapshot named by
      `task.steering` when the host delivered a steering block. Any
      operator-authored comment after it is steering. Weigh it like task text,
      oldest first, later comments refining earlier ones. System, automation
      and agent comments are not steering.
    - This re-read is advisory: report nothing about it (no task history,
      comment or delivery record).
    - A steering comment cannot widen the task's `context_files`, change
      required validation, crew or review policy, or move lifecycle state; only
      their governed writes can. Weigh such a request, but recover under the
      current contract until that write appears.
    - A cancelled run, a claimed task that refuses writes, or an operator
      comment withdrawing the task still stops recovery as the procedure says.
  tool_disallow_list:
    - orbit.agent.invoke
    - orbit.auto_task.add
    - orbit.auto_task.mint
    - orbit.auto_task.update
    - orbit.command.exec
    - orbit.pipeline.invoke
    - orbit.workflow.run.show
    - orbit.workflow.run.list
    - orbit.workflow.run.resume
    - orbit.workflow.ship
  proc_disallowed_programs:
    - sudo
    - su
    - doas
    - pkexec
    - ssh
    - scp
    - sftp
    - rsync
    - nc
    - ncat
    - netcat
    - socat
    - systemctl
    - loginctl
    - shutdown
    - reboot
    - mount
    - umount
    - chroot
    - nsenter
    - unshare
    - docker
    - podman
  on_denial: terminate
  # Dispatch draws the crew from workflow.purpose_crews.failure_recovery, or
  # workflow.medium_complexity_crews while that purpose is unset.
  # One hour accommodates provider startup plus networked git/PR operations
  # while retaining a hard terminal bound. This bound is
  # enforced: the CLI runner spawns the subprocess with this deadline.
  wall_clock_timeout_seconds: 3600
