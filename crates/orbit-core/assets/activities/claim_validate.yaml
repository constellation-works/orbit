schemaVersion: 2
kind: Activity
metadata:
  name: claim_validate
spec:
  type: deterministic
  description: >
    Independently resolve the candidate and its base from the executor's
    worktree, refuse a candidate that does not descend from that base, run the
    commands this owner requires on that exact candidate, and attach one
    captured log per command to the owner's copy of the task. On the
    pull-request route the step runs before publication: with no
    `pull_request` it runs the commands and returns their results as
    `publication: pending` without attaching typed handoff logs (diagnostic
    failure/base/replay logs may already be attached), and a later run given that
    output as `prevalidated` runs nothing, pins the results to the published
    candidate and attaches the logs. A network-inconclusive failure (curl
    status 000, DNS, TLS timeout) is rerun up to twice with backoff; a failure
    that survives is rerun on the candidate's base in a clean detached
    worktree (cached per host, base and command), both logs are attached, and
    a failure the base shares fails as a typed `baseline_red` that releases
    the claim with a hold instead of failing it, unless every test the
    candidate fails also fails on the base: that command is known red, its
    log carries its exit status and a known-red report the owner rechecks
    against its own run of the base before accepting the handoff, the
    decision is `passed_with_known_red`, and the next command runs.
    A comparable passing base permits one serial isolated replay of at most
    three failed tests with a replayable selection. A pass with exact
    selection, executed coverage and no host refusals carries `flaky`
    evidence and `passed_with_flaky_tests` through publication and pinning;
    owner acceptance records the tests in task history and files each
    signature once as a friction. `pr_open` names them with rerun evidence.
    An empty
    requirement list
    runs nothing and records `skipped_no_required_commands` with no
    validation references. Task, claim, execution machine and bound run come
    from the trusted worker binding; a step input that disagrees is refused
    rather than preferred. A verified clean-tree commit checkpoint, or a
    claimed `no-diff-expected` skip naming this run and base, takes the
    NoDiff route: recheck it, run required commands on the clean base,
    and pin the checkpoint for owner revalidation without publication.
    A gate the implementer handed off with Bubblewrap, Seatbelt or ps-denied
    deferrals (`implementation.deferred_sandbox_validation`) runs after the
    required commands, on the NoDiff route too, outside the agent sandbox on
    this claim host, and must report executed tests; one that still prints a
    `DEFERRED:` (including `DEFERRED: ps denied:`) or `SKIP: sandbox-exec
    cannot apply a profile:` line is the validation environment's failure, a
    replay that fails fails the step, and a passing replay is pinned with the
    required commands as the gate's evidence.
  input_schema_json:
    type: object
    required: [workspace_path]
    properties:
      workspace_path:
        type: string
      # The run's sync mode (`local` or `remote`). Observation resolves the
      # base through the same mapping as worktree setup / pr_prepare, so a
      # remote-sync claim reads `origin/<base>` rather than a lagging local
      # `refs/heads/<base>`.
      base_sync:
        type: string
      # The base SHA `sync_base` published. Observation compares it to the
      # merge-base of the candidate and the resolved base ref, not the live
      # tip of `origin/<base>`: a later advance of that tip is not a
      # disagreement, but a candidate that does not contain this SHA is.
      base_sha:
        type: string
      # Set only on the pull-request route, from the number this run's own
      # publication step observed. `pr_open` emits `pr_number` as a JSON
      # string; an exact step-output template forwards that type unchanged,
      # so the live value is a string. Integers remain accepted.
      pull_request:
        type: [string, integer, "null"]
      skipped_no_diff_expected:
        type: [boolean, "null"]
      already_landed_checkpoint:
        type: [object, "null"]
        description: Commit's verified no-diff or already-landed checkpoint; a skip flag alone refuses.
      # The output of this activity's pre-publication run on the same
      # candidate. When set, no command runs: the passed results are pinned
      # to the candidate as published, which must be the commit and base they
      # passed on.
      prevalidated:
        type: [object, "null"]
      # A pre-publication output to return unchanged unless
      # `revalidate` is true; with it true the commands run on the current,
      # still unpublished head (a before-landing reviewer's fix).
      carry:
        type: [object, "null"]
      revalidate:
        type: boolean
      # This attempt's implementer output. The `deferred_sandbox_validation`
      # record the implement step derived into it adds that gate after the
      # required commands, run here
      # outside the agent sandbox; it must report executed tests, and the
      # pre-publication output names it in `replayed`.
      implementation:
        type: [object, "null"]
  output_schema_json:
    type: object
    required: [candidate, validation]
    properties:
      decision:
        type: string
        enum: [passed, passed_with_known_red, passed_with_flaky_tests, skipped_no_required_commands]
      note:
        type: string
        description: Why no command ran, when the requirement list is empty.
      publication:
        type: string
        enum: [pending]
        description: >
          Set when the commands ran before publication; the logs are attached
          by the run given this output as `prevalidated`.
      results:
        type: array
        description: >
          Each passed or known-red command with its captured output, exit
          status and known-red or flaky report, when publication is pending.
        items:
          type: object
      known_red:
        type: array
        description: >
          The commands that failed only with tests the base fails too:
          command, base and candidate commits, run and failing tests.
        items:
          type: object
      flaky:
        type: array
        description: >
          Tests that failed initially, passed on a comparable base, and passed
          one bounded isolated candidate replay, with pinned command, run,
          base/head, selection, executed count and captured evidence.
        items:
          type: object
      candidate:
        type: [object, "null"]
        description: >
          Repository, branches, candidate and base revisions, and the delivery
          variant this claim produced; null while publication is pending.
      validation:
        type: array
        description: Digest-pinned owner artifact references, one per command.
        items:
          type: object
      no_diff_evidence:
        type: [object, "null"]
        description: Digest-pinned clean-tree verifier report for the NoDiff handoff.
      validation_env:
        type: [object, "null"]
        description: >
          How PATH was resolved for the commands: source (`login_shell`,
          `config` or `launcher_fallback`), PATH and the login-shell outcome.
      commands:
        type: array
        description: The commands that passed outright.
        items:
          type: string
      replayed:
        type: array
        description: >
          Gates run for the implementer's deferred sandbox validation, when
          publication is pending.
        items:
          type: string
      tested_head:
        type: string
      validated_base:
        type: string
  action: claim_validate
  config: {}
