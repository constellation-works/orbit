schemaVersion: 2
kind: Activity
metadata:
  name: agent_assess_diff
spec:
  type: agent_loop
  description: >
    Assessment step for the v2 assess-and-fix loop example. Consumes the
    implementation diff and emits a structured verdict.
  input_schema_json:
    type: object
    required: [diff]
    properties:
      diff:
        type: string
      branch:
        type: string
      iteration:
        type: integer
  output_schema_json:
    type: object
    required: [decision, blocking_count]
    properties:
      decision:
        type: string
        enum: [approved, changes_requested, rejected]
      blocking_count:
        type: integer
      findings:
        type: array
        items:
          type: object
  instruction: |
    Assess the given diff and return a structured verdict. Emit `decision: approved`
    only when there are no blocking issues; otherwise emit
    `changes_requested` with findings and a non-zero `blocking_count`. The diff
    input is the frozen implementation diff, and no loop input carries findings
    back into a later assessment: each iteration judges the same original diff,
    while the findings flow forward to the fix step, which commits to the branch.
  tools:
    - orbit.audit.*
  on_denial: terminate
  max_iterations: 1
  provider: claude
  wall_clock_timeout_seconds: 300
