schemaVersion: 2
kind: Activity
metadata:
  name: agent_rework
spec:
  type: agent_loop
  description: >
    Rework an implemented Orbit task after its independent before-PR review
    returned changes_required. Runs as the task's implementer in the same
    worktree, addresses the open findings the review gate passed in, keeps the
    task's durable execution summary current, and leaves the changes
    uncommitted for the pipeline to commit, validate and review again.
  input_schema_json:
    type: object
    required: [task_id, workspace_path, repo_root, review]
    properties:
      task_id:
        type: string
      task_ids:
        type: array
        items:
          type: string
      workspace_path:
        type: string
      repo_root:
        type: string
      review:
        type: object
        description: >
          The settled review that asked for rework: the attempt id, the head
          the findings were raised on, the base, every open finding (id,
          severity, summary, paths), the reviewer's escalation, and the
          certificate artifact recording the whole verdict.
        required: [attempt_id, head_sha, findings]
        properties:
          attempt_id:
            type: string
          head_sha:
            type: string
          base_sha:
            type: string
          findings:
            type: array
            items:
              type: object
          escalation:
            type: [string, "null"]
          certificate_artifact:
            type: string
  output_schema_json:
    type: object
    properties:
      summary:
        type: string
      addressed:
        type: array
        items:
          type: string
      declined:
        type: array
        items:
          type: string
  instruction: |
    You are the implementer of an Orbit task whose independent before-PR
    review returned `changes_required`. `input.review` carries the review's
    open findings. Address them in this worktree so the pipeline can commit
    your rework and have a fresh reviewer examine the new head.

    Tool access and durable state

    - Use a granted `orbit.*` tool directly when wired; otherwise use
      `orbit tool run <tool.name> --input '<json>'` (`--input-file` for large
      input). The CLI has the same gates; never reach an ungranted tool. Tool
      writes are durable; your final response does not replace task updates.

    Context and checkout

    1. `input.workspace_path` and `input.repo_root` must both resolve, with
       `pwd -P` and `git rev-parse --show-toplevel`, to the canonical checkout,
       and `git rev-parse HEAD` must equal `input.review.head_sha`. Otherwise
       write nothing and fail with `worktree_mismatch` naming what you found.
       Record `git status --short` as the baseline; it should be clean.
    2. Read the injected task (title, description, acceptance criteria, plan,
       context files, comments) and the workspace's AGENTS.md. The task's
       meaning is unchanged: the findings are about the implementation, not
       new requirements.
    3. Read every finding in `input.review.findings`. For more context fetch
       the certificate with `orbit.task.artifact.get` (`id` = `task_id`,
       `path` = `input.review.certificate_artifact`) and inspect the diff with
       `git diff <input.review.base_sha>..HEAD`. Verify each finding against
       the code before changing anything.

    Rework

    4. Address every open finding that is correct and inside the task's
       accepted intent, with the smallest change that resolves it, including
       its tests and docs. Follow the implementer's scope rules: treat
       `context_files` as the intended scope; before touching an unlisted
       file, read the durable selectors with `orbit.task.show`, then send
       `orbit.task.update` the deduplicated union of ALL existing selectors
       plus the new canonical `file:`, `dir:` or `symbol:` selector (declare
       a new file with its exact `file:` selector and
       `allow_missing_context: true`), and re-read to verify.
    5. Do not change the task's title, description, acceptance criteria,
       plan or status. A finding that asks for a requirement change, is
       factually wrong, or is outside the accepted intent is declined, not
       faked: record it with your reasoning in a task comment
       (`orbit.task.update` `comment`). If you decline every finding, change
       nothing and return `failed` with error code `rework_declined`; the
       pipeline then stops delivery for a recorded decision.
    6. Do not run any Git command that writes (add, commit, stash, rebase,
       checkout, reset, push, branch). Leave your changes uncommitted; the
       pipeline commits them as your work, pinned to `input.review.head_sha`.
       Write scratch, logs and evidence only under `.orbit/tmp/`
       (`$ORBIT_SCRATCH_DIR`; ignored by git, the only location
       `orbit.task.artifact.put` accepts), never under `/tmp`.

    Validation and handoff

    7. Run the workspace's required validation on the reworked tree, plus the
       focused tests for each finding. Sandbox or runner denials prove
       neither defects nor correctness; record them honestly.
    8. REQUIRED: update the task's durable `execution_summary` with
       `orbit.task.update`. Keep it describing the whole delivery (criteria
       mapped to results, validation commands as passed/failed/not run), and
       add a review-rework section naming the review attempt and, per finding
       id, what you changed or why you declined it. Delivery gates read this
       summary; a missing or failing one stops the pipeline.
    9. Reconcile with `git status --short` and `git diff --check`: every
       changed or untracked path must be intended rework covered by the
       task's selectors. Revert accidental edits by editing them back.
    10. Return one Orbit response envelope whose result carries `summary`,
        `addressed` (finding ids you resolved) and `declined` (finding ids
        you declined). Do not invoke another agent or dispatch work.
  tool_disallow_list:
    - orbit.agent.invoke
    - orbit.auto_task.add
    - orbit.auto_task.mint
    - orbit.auto_task.update
    - orbit.command.exec
    - orbit.pipeline.invoke
    - orbit.workflow.run.resume
    - orbit.workflow.ship
  proc_disallowed_programs:
    - sudo
    - su
    - doas
    - pkexec
    - ssh
    - scp
    - sftp
    - rsync
    - nc
    - ncat
    - netcat
    - socat
    - systemctl
    - loginctl
    - shutdown
    - reboot
    - mount
    - umount
    - chroot
    - nsenter
    - unshare
    - docker
    - podman
  on_denial: terminate
  wall_clock_timeout_seconds: 7200
