schemaVersion: 2
kind: Activity
metadata:
  name: claim_candidate_carry
spec:
  type: deterministic
  description: >
    Terminal failure hook of a claimed pull-request leaf. When the
    leaf committed a candidate and failed before its own push, it pushes the
    candidate's branch tip to `refs/orbit/candidates/<task>/<run>` on
    `origin`, so the task's next claim can fetch and resume it on any host.
    When the leaf had pushed its branch and then committed past the pushed
    head (a rejected before-landing review's fix), it carries the local tip
    to the same ref. Its output, checkpointed on the run, is what the leaf's
    failure settlement names: `carry` is `published` (the leaf's push
    already put the branch tip on `origin`), `durable` (with
    `durable_ref`, and `published_sha` when it carried commits past the
    pushed head), `failed` (with `reason`; the local `head_sha` stays on this
    host, and `published_sha` names an earlier pushed head when present)
    or `none` (nothing was committed or left dirty). Before the normal commit, it snapshots dirty
    files as one marked partial implementation commit without moving the
    branch or changing the index or worktree. Protected paths, environment
    files, symlinks and gitlinks refuse the snapshot with a reason; scratch
    under `.orbit/tmp/` is excluded. It never changes the run's failure.
  input_schema_json:
    type: object
    additionalProperties: false
    required:
      - failed_step_id
      - activity_name
      - error_code
      - error_message
      - job_input
      - pipeline
      - run_id
    properties:
      failed_step_id:
        type: string
      activity_name:
        type: string
      error_code:
        type: string
      error_message:
        type: string
      job_input:
        type: object
      pipeline:
        type: object
      run_id:
        type: string
  output_schema_json:
    type: object
    required:
      - phase
      - carry
    properties:
      phase:
        type: string
      carry:
        type: string
        enum: [published, durable, failed, none]
      task_id:
        type: string
      branch:
        type: string
      head_sha:
        type: string
      partial:
        type: boolean
      durable_ref:
        type: string
      published_sha:
        type: string
      reason:
        type: string
  action: claim_candidate_carry
