schemaVersion: 2
kind: Activity
metadata:
  name: candidate_validate
spec:
  type: deterministic
  description: >
    Run the workspace's `workflow.required_validation_commands` on the owner's
    committed candidate, using the same command runner, environment and
    failure text as `claim_validate`, and attach one captured log per command
    to every task the run delivers. The candidate must be a clean checkout of
    a named branch containing `base_sha`. A failing command fails the step
    with its output after its log is attached, so step recovery can repair the
    candidate and retry. An empty requirement list is a no-op.
  input_schema_json:
    type: object
    required: [job_run_id, workspace_path, completed_task_ids]
    properties:
      job_run_id:
        type: string
      workspace_path:
        type: string
      completed_task_ids:
        type: array
        minItems: 1
        items:
          type: string
      # The base the candidate was synchronized onto. The candidate must
      # contain it; a later advance of the base tip is not a refusal.
      base_sha:
        type: [string, "null"]
  output_schema_json:
    type: object
    required: [phase, decision, commands, validation]
    properties:
      phase:
        type: string
      decision:
        type: string
        enum: [passed, skipped_no_required_commands]
      commands:
        type: array
        items:
          type: string
      branch:
        type: string
      tested_head:
        type: string
      validation:
        type: array
        description: Digest-pinned task artifact references, one per command.
        items:
          type: object
  action: candidate_validate
  config: {}
