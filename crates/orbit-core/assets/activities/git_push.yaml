schemaVersion: 2
kind: Activity
metadata:
  name: git_push
spec:
  type: deterministic
  description: >
    Push the active worktree branch without overwriting remote-only commits.
    A rewritten branch requires the exact expected remote SHA from the durable
    pre-rewrite checkpoint. A push the forge refuses for a server-side reason
    is retried with exponential backoff; past that budget the run holds at
    this step (forge_unavailable) for the clock to resume. A claimed leaf's
    `forge_retry.window_ms` keeps the push retrying past the budget instead,
    until the window closes.
  input_schema_json:
    type: object
    properties:
      job_run_id:
        type: string
      workspace_path:
        type: string
      branch:
        type: string
      base:
        type: string
      base_ref:
        type: string
      completed_task_ids:
        type: array
        items:
          type: string
      rewrite_performed:
        type: boolean
      rewrite_head_before:
        type: string
      expected_remote_sha:
        type: [string, "null"]
      # The published head a before-landing reviewer's fix must
      # go onto: the remote branch must still be at it, and the push is
      # conditional on it, else the step fails as `push_lease_lost`.
      lease_remote_sha:
        type: string
      # A claimed leaf's `candidate_resume` output. When its
      # `reused_head_sha` names the published head of the candidate whose
      # branch this run adopted, a local branch that diverged from exactly
      # that remote head replaces it under a lease; any other remote head is
      # refused as usual. Absent or without that field, nothing changes.
      candidate_resume:
        type: [object, "null"]
      # Transient push retry budget. Absent means the production default:
      # 6 attempts, backoff from 10 s doubling to a 160 s cap.
      forge_retry:
        type: [object, "null"]
        properties:
          max_attempts:
            type: integer
          initial_backoff_ms:
            type: integer
          backoff_cap_ms:
            type: integer
          # Keep retrying past max_attempts, at backoff_cap_ms,
          # until this long after the forge first refused the push (at most
          # two hours). Absent stops at max_attempts.
          window_ms:
            type: [integer, "null"]
      # A claimed leaf's implement-step output. Under the claim's worker
      # binding the delivery gate judges its summary, not the owner's
      # stored one; any other run ignores it.
      implementation:
        type: [object, "null"]
  output_schema_json:
    type: object
    required: [phase, decision, branch, local_sha, force_with_lease]
    properties:
      phase:
        type: string
      decision:
        type: string
      branch:
        type: string
      local_sha:
        type: string
      remote_sha_before:
        type: [string, "null"]
      force_with_lease:
        type: boolean
      push_attempts:
        type: integer
      push_waited_ms:
        type: integer
  action: git_push
  config: {}
