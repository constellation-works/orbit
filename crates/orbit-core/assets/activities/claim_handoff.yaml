schemaVersion: 2
kind: Activity
metadata:
  name: claim_handoff
spec:
  type: deterministic
  description: >
    Terminate a claimed leaf at its typed delivery handoff. Re-observes the
    candidate, refuses one the validation evidence no longer pins, and records
    the handoff as this claim's durable pending settlement before anything is
    sent to the owner. It merges nothing and completes nothing. Its review
    disposition is `not_required` unless the leaf ran the before-PR gate and
    passes that review's evidence, which must name the candidate handed off;
    the owner judges it against the review contract the claim captured.
  input_schema_json:
    type: object
    required: [workspace_path, candidate, validation]
    properties:
      workspace_path:
        type: string
      # Same mapping as `claim_validate`: remote sync observes `origin/<base>`.
      base_sync:
        type: string
      base_sha:
        type: string
      # Same shape as `claim_validate`: `pr_open` emits a JSON string.
      pull_request:
        type: [string, integer, "null"]
      candidate:
        type: object
        description: The candidate the required validation actually ran on.
      validation:
        type: array
        items:
          type: object
      execution_summary:
        type: string
      # The claimed-mode implement step's output. Its `execution_summary`
      # (else `summary`), `comment` and `context_files_added` compose the
      # handoff's summary, which acceptance writes as the owner's.
      implementation:
        type: [object, "null"]
      # The before-PR review the leaf ran on this candidate: verdict,
      # reviewed head/base, reviewer commit, crew and run, and the
      # owner-held certificate and reviewer artifacts. Absent when the claim
      # captured no before-PR review.
      review_evidence:
        type: [object, "null"]
  output_schema_json:
    type: object
    required: [handed_off, merged]
    properties:
      handed_off:
        type: boolean
      merged:
        type: boolean
        description: Pinned false; a claimed leaf never lands its own work.
      task_id:
        type: string
      candidate:
        type: string
      base:
        type: string
      delivery:
        type: string
  action: claim_handoff
  config: {}
