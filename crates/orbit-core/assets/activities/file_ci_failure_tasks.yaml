schemaVersion: 2
kind: Activity
metadata:
  name: file_ci_failure_tasks
spec:
  type: deterministic
  description: >
    Turn one `collect_ci_evidence` snapshot into quarantined proposed bug tasks.
    Clusters the snapshot's current, non-stale failures by root cause
    (workflow, failing job, failing step, normalized error signature, and the
    commit the runner actually tested) so one regression repeated across a push
    run and a pull-request run of the same commit becomes one task rather than
    several. The normalized signature prefers a concrete test/panic diagnostic
    over ANSI styling, generic cancellation/process/cargo trailers, and
    assertion payload help text; the filed description still carries the raw
    excerpt. With no concrete line the step name is used and labelled as a
    fallback. Current failures may include already-failed jobs from an
    in-flight workflow when that evidence is complete; a pending check is
    never present in the snapshot as a current failure and must not be filed. Each surviving cluster is filed at `status: proposed` with the
    collected evidence rendered inline in the description, so the implementing
    agent never needs a GitHub credential; no `required_tools` are attached and
    the task can later ship through the ordinary pull-request route only after
    task-pilot validation and explicit CI-sweep admission. Filing itself never
    promotes or dispatches implementation. It is deduped
    against still-open tasks first by a commit-independent failure key carried
    as a `ci-failure:<key>` tag, then by rejected exact-key tasks whose comments
    name one still-open covering owner, then by a shared high-confidence
    material coverage assessment over untagged tasks. Coverage matches a
    generated workflow/job/step brief or a specific error together with the
    failing command or the same run and job identity; generic npx/cargo
    wrappers, a shared workflow or file, or task completion alone do not
    suppress a current failure. After open-owner lookup misses, a bounded
    completed-owner assessment verifies structured task artifacts against the
    exact source diagnostics, failing and passing command results, authoritative
    delivery state and Git applicability. Proven pre-fix observations are
    retained as task artifacts on the existing owner and are not pilot candidates.
    Missing or contradictory proof is reported in repair_assessments as unresolved;
    ordinary proposed filing and pilot checks remain available. A repeated sweep
    over a run that is still red,
    or a root cause already owned by a manual task, therefore does not file
    the same work twice. Filing never mutates the covering task's tags or
    prose; completed coverage adds idempotent observation artifacts. Skips name
    the covering task and bounded match evidence. The three
    endings stay distinct
    and none of them is a CI pass: a snapshot with `collected: false` reports
    `capability_unavailable` and files nothing, a snapshot with no current
    failure reports `no_current_failure` and files nothing, and anything else
    reports `current_failures` with what it filed, skipped as already open,
    left unfiled at the `max_tasks` cap, or deferred for incomplete evidence.
    Schema version 2 requires one job per failure row, matching diagnostic
    and checkout job identities, one known failed step, and complete
    diagnostic evidence. A complete bounded diagnostic_unit with matching job
    and step can replace a truncated display for signature calculation. Raw
    selected evidence remains in the snapshot; descriptions separately cap
    display at 4000 bytes and disclose collection display truncation. Legacy
    version-1 run-scoped snapshots remain readable
    for audit but their failures are deferred for recollection; no job ordering
    inference or event/PR head substitution is allowed. Retryable failures are
    separated by blast radius. One that names a job defers only that job.
    One that names only a run, such as an exhausted run investigation budget
    or unreadable job metadata, defers that run's findings. Each appears in
    `deferred` with its reasons and is excluded from clustering, while
    every complete finding in the same snapshot still files and dedupes. One
    that names no run — a repository, run-listing, or pull-request-listing
    read, a registration, dedupe-lookup, or task-creation failure — leaves the
    whole snapshot in doubt and fails the activity with a bounded
    `retryable_error` payload, as does a snapshot in which nothing was complete
    enough to file. A current failure is never converted to
    `no_current_failure` merely because its handoff failed. Every
    successful output includes an `audit` object with counts and identities for
    latest runs, current and investigated failures, created tasks, existing
    dedupe owners, and the findings deferred for incomplete evidence, so
    partial registration is legible to an operator rather than inferred. The
    filing entries retain workflow, job, step, runner-tested commit, source run
    IDs/URLs, and ref kinds/branches for the later pilot/admission audit.
  input_schema_json:
    type: object
    required: [ci_evidence]
    properties:
      ci_evidence:
        type: object
        description: >
          The snapshot emitted by `collect_ci_evidence`, passed through
          unmodified.
      max_tasks:
        type: number
        minimum: 1
        maximum: 20
        description: >
          Cap on tasks filed in one pass. Clusters beyond the cap are reported
          in `skipped_over_cap` rather than dropped silently.
  output_schema_json:
    type: object
    required: [outcome, clusters, filed_count, filed, pilot_candidate_count, pilot_candidates, skipped_existing, skipped_over_cap, deferred, audit]
    properties:
      outcome:
        type: string
        enum: [capability_unavailable, no_current_failure, current_failures]
      capability:
        oneOf:
          - type: object
          - type: "null"
      detail:
        type: string
      clusters:
        type: number
      filed_count:
        type: number
      pilot_candidate_count:
        type: number
      max_tasks:
        type: number
      filed:
        type: array
        items:
          type: object
          required: [task_id, failure_key]
          properties:
            task_id:
              type: string
            failure_key:
              type: string
            cluster_key:
              type: string
            workflow:
              type: string
            job:
              type: string
            step:
              type: string
            tested_commit:
              type: string
            run_ids:
              type: array
            run_urls:
              type: array
              items:
                type: string
            ref_kinds:
              type: array
              items:
                type: string
            head_branches:
              type: array
              items:
                type: string
      pilot_candidates:
        type: array
        description: >
          Newly filed proposed tasks plus matching proposed CI tasks whose
          earlier pilot did not admit them. Each entry carries the current
          sweep provenance used by the pilot/admission boundary.
        items:
          type: object
          required: [task_id, failure_key, workflow, job, step, tested_commit, run_ids, run_urls, ref_kinds, head_branches]
      skipped_existing:
        type: array
        items:
          type: object
          required: [failure_key, task_id, match_kind, match_evidence]
          properties:
            failure_key:
              type: string
            cluster_key:
              type: string
            task_id:
              type: string
            workflow:
              type: string
            match_kind:
              type: string
              enum: [exact_key, material_coverage, confirmed_duplicate, covered_by_repair]
            match_evidence:
              type: object
      repair_assessments:
        type: array
        description: >
          Bounded completed-owner assessments: covered_by_repair with referenced
          validation and source provenance, or unresolved with a reason. An
          unresolved assessment does not certify coverage or admission.
        items:
          type: object
      skipped_over_cap:
        type: array
        items:
          type: object
          required: [failure_key]
          properties:
            failure_key:
              type: string
            workflow:
              type: string
            job:
              type: string
            run_urls:
              type: array
              items:
                type: string
      deferred:
        type: array
        description: >
          Current failures left unfiled because their own evidence is
          incomplete. Each entry carries the run and job it is about and bounded
          retryable reasons, so the gap stays visible and a later sweep can
          finish it.
        items:
          type: object
          required: [run_id, reasons]
          properties:
            job_id:
              type: [number, "null"]
            run_id:
              oneOf:
                - type: number
                - type: string
                - type: "null"
            url:
              type: string
            workflow:
              type: string
            head_branch:
              type: string
            ref_kind:
              type: string
            investigated:
              type: boolean
            retryable:
              type: boolean
            reasons:
              type: array
              items:
                type: object
      audit:
        type: object
  action: file_ci_failure_tasks
  config: {}
