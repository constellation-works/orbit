schemaVersion: 2
kind: Activity
metadata:
  name: list_backlog_tasks
spec:
  type: deterministic
  description: >
    Materialize the current workspace backlog as an ordered task list for
    the auto-pipeline. In automatic mode it filters to `status: backlog` with
    all task dependencies satisfied and drops any backlog parent/subtask group
    whose `context_files` overlap the active task-lock surface from
    `in-progress` or `review` tasks. A task tagged `no-diff-expected` is not
    part of that surface: it still waits on its own dependencies and on locks
    other tasks hold, and it does not exclude overlapping backlog work.
    Tasks with empty `context_files` are withheld as `unprepared` on automatic
    and explicit selection unless tagged exactly `no-diff-expected`. The
    `detail` directs task-pilot or an operator to prepare their context scope.
    The latest applied task-pilot assessment's `duplicate_of` or
    `already_landed` finding withholds automatic and explicit selection as
    `pilot_duplicate` or `pilot_already_landed`, even when assessment did not
    request lifecycle promotion. A newer clear assessment releases the hold,
    as does a human task comment whose first line is
    `task-pilot-admission: approve-anyway` or `task-pilot-admission: clear`.
    A later assessment supersedes that operator decision; ordinary edits and
    agent comments do not release the hold.
    Parent/child relations order nothing here:
    every task is a leaf admitted on its own declared footprint. The one
    exception is a root carrying the `epic` size tag that declares no
    `context_files` of its own while a descendant does: it inherits no
    descendant surface any more, so it would be dispatched holding no
    reservation against the work it would touch, and it is withheld on every
    path, automatic or explicit. Its exclusion carries a `detail` naming the
    descendants and the repair, since no later drain clears it.
    In automatic mode a task whose `delivery:<job>` tag selects a job that
    cannot deliver it in `mode` (default: the workspace ship mode) — its
    plugin disabled or uninstalled, or the mode undeclared — is withheld as
    `delivery_job_unavailable`, with the refusal in `detail`, rather than
    dispatched to a gate that would refuse it on every pass.
    When `mode` is `local` and effective `review.before_pr` is on, a task
    that cleared the per-task gates is withheld as `local_route_before_pr`,
    with the deciding config layer and the remedy in `detail`. A PR-mode
    delivery does not take that hold. The local-route pipeline admission
    still refuses the same combination if a delivery is submitted anyway.
    Automatic mode includes an `excluded` array that attributes pre-gate lock
    exclusions; it does not report status-based admission or `max_tasks`
    truncation. Explicit `task_ids` input is treated as an override and skips
    conflict filtering, but still reports the eligibility exclusions it applies.
    Automatic ordering puts critical tasks first, then corrective tasks (`bug`
    type or an exact `code-review` / `security-review` tag), then all remaining
    work. Within each band it sorts critical → high → medium → low,
    followed by `created_at` ascending and task ID ascending. Caps at
    `max_tasks` (default 50) to keep the agent's context window bounded. Also
    emits conservative singleton `bundles` so downstream dispatch can proceed
    without depending on an agent's final response payload.
  input_schema_json:
    type: object
    properties:
      max_tasks:
        type: number
        minimum: 1
        maximum: 500
      task_ids:
        type: array
        items:
          type: string
      mode:
        type: string
        enum: [pr, local]
  output_schema_json:
    type: object
    required: [tasks, task_ids, task_count, bundles]
    properties:
      task_count:
        type: number
      task_ids:
        type: array
        items:
          type: string
      bundles:
        type: array
        items:
          type: array
          items:
            type: string
      tasks:
        type: array
        items:
          type: object
          required: [id, title, type, priority, context_files]
          properties:
            id:
              type: string
            title:
              type: string
            type:
              type: string
            priority:
              type: string
            context_files:
              type: array
              items:
                type: string
            parent_id:
              oneOf:
                - type: string
                - type: "null"
      excluded:
        type: array
        items:
          type: object
          required: [id, reason, conflicts]
          properties:
            id:
              type: string
            reason:
              type: string
              enum:
                - context_lock_conflict
                - crew_not_allowed
                - delivery_job_unavailable
                - group_member_conflict
                - inherited_only_epic_root
                - local_route_before_pr
                - unassessed_complexity
                - unprepared
                - pilot_duplicate
                - pilot_already_landed
            detail:
              type: string
            conflicts:
              type: array
              items:
                type: object
                required: [requested_file, locking_task_id]
                properties:
                  requested_file:
                    type: string
                  locking_task_id:
                    type: string
  action: list_backlog_tasks
  config: {}
