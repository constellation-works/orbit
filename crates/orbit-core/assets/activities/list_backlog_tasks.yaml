schemaVersion: 2
kind: Activity
metadata:
  name: list_backlog_tasks
spec:
  type: deterministic
  description: >
    Materialize the current workspace backlog as an ordered task list for
    the auto-pipeline. In automatic mode it filters to `status: backlog` with
    all task dependencies satisfied and drops any backlog parent/subtask group
    whose `context_files` overlap the active task-lock surface from
    `in-progress` or `review` tasks. Parent/child relations order nothing here:
    every task is a leaf admitted on its own declared footprint. The one
    exception is a root carrying the `epic` size tag that declares no
    `context_files` of its own while a descendant does: it inherits no
    descendant surface any more, so it would be dispatched holding no
    reservation against the work it would touch, and it is withheld on every
    path, automatic or explicit. Its exclusion carries a `detail` naming the
    descendants and the repair, since no later drain clears it.
    Automatic mode includes an `excluded` array that attributes pre-gate lock
    exclusions; it does not report status-based admission or `max_tasks`
    truncation. Explicit `task_ids` input is treated as an override and skips
    conflict filtering, but still reports the eligibility exclusions it applies.
    Automatic ordering puts critical tasks first, then corrective tasks (`bug`
    type or an exact `code-review` / `security-review` tag), then all remaining
    work. Within each band it sorts critical → high → medium → low,
    followed by `created_at` ascending and task ID ascending. Caps at
    `max_tasks` (default 50) to keep the agent's context window bounded. Also
    emits conservative singleton `bundles` so downstream dispatch can proceed
    without depending on an agent's final response payload.
  input_schema_json:
    type: object
    properties:
      max_tasks:
        type: number
        minimum: 1
        maximum: 500
      task_ids:
        type: array
        items:
          type: string
  output_schema_json:
    type: object
    required: [tasks, task_ids, task_count, bundles]
    properties:
      task_count:
        type: number
      task_ids:
        type: array
        items:
          type: string
      bundles:
        type: array
        items:
          type: array
          items:
            type: string
      tasks:
        type: array
        items:
          type: object
          required: [id, title, type, priority, context_files]
          properties:
            id:
              type: string
            title:
              type: string
            type:
              type: string
            priority:
              type: string
            context_files:
              type: array
              items:
                type: string
            parent_id:
              oneOf:
                - type: string
                - type: "null"
      excluded:
        type: array
        items:
          type: object
          required: [id, reason, conflicts]
          properties:
            id:
              type: string
            reason:
              type: string
              enum:
                - context_lock_conflict
                - crew_not_allowed
                - group_member_conflict
                - inherited_only_epic_root
                - unassessed_complexity
            detail:
              type: string
            conflicts:
              type: array
              items:
                type: object
                required: [requested_file, locking_task_id]
                properties:
                  requested_file:
                    type: string
                  locking_task_id:
                    type: string
  action: list_backlog_tasks
  config: {}
