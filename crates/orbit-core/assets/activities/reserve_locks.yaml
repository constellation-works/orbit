schemaVersion: 2
kind: Activity
metadata:
  name: reserve_locks
spec:
  type: deterministic
  description: >
    Atomically reserve file locks for a task bundle by delegating to the
    `orbit.task.locks.reserve` tool. Thin deterministic wrapper that lets
    a workflow poll inside a `loop:` with `break_when:` until the
    reservation is granted. On a successful grant the output carries a
    `reservation_id` that a later release step (or TTL expiration) can
    use to free the locks. On a conflict the output records the blocking
    `task` / `reservation` holders so the caller can decide whether to
    wait or abort. `conflicts` and `waiting_on_deps` are always present,
    empty when they do not apply, so a step that always runs can read them.

    Dependency edges are checked before locks. An unmet-but-reachable
    dependency yields `reserved: false` with `waiting_on_deps` populated
    (the caller should keep polling); a dependency that can never reach
    `done` — archived without having reached `done` first, rejected, or
    dangling — fails the activity
    immediately with a `task.dependencies.unsatisfiable` error rather
    than making the caller poll out its wait budget. A dependency
    archived after it reached `done` is satisfied, like `done`.

    A single task whose `delivery_job` is `task_pr_pipeline` and whose next
    run resumes a publication a final-recovery requeue preserved adopts
    before it edits, so a conflict does not hold it: it is granted a
    reservation holding no files, `footprint_deferred: true`, with the
    holders it did not wait on in `deferred_conflicts` and the run and pull
    request it resumes in `published_delivery`. Its leaf takes the footprint
    before its first editing agent. `footprint_deferred` is otherwise false.
  input_schema_json:
    type: object
    required: [task_ids]
    properties:
      task_ids:
        type: array
        items:
          type: string
      ttl_seconds:
        type: number
        minimum: 1
        maximum: 14400
      delivery_job:
        type: string
  output_schema_json:
    type: object
    required: [reserved]
    properties:
      reserved:
        type: boolean
      waiting_on_deps:
        type: array
        items:
          type: string
      reservation_id:
        type: string
      expires_at:
        type: string
      reserved_files:
        type: array
        items:
          type: string
      conflicts:
        type: array
        items:
          type: object
          required: [file, held_by, held_by_id]
          properties:
            file:
              type: string
            held_by:
              type: string
              enum: [task, reservation]
            held_by_id:
              type: string
      footprint_deferred:
        type: boolean
      deferred_conflicts:
        type: array
      published_delivery:
        type: object
  action: reserve_locks
  config: {}
