schemaVersion: 2
kind: Activity
metadata:
  name: collect_ci_evidence
spec:
  type: deterministic
  description: >
    Run the GitHub capability preflight and every CI discovery query on the
    host, outside any agent sandbox, and emit one bounded, redacted evidence
    snapshot. Derives the workspace's integration head, the repository's
    release head as GitHub itself reports it, and every open pull-request head
    rather than assuming branch names; separates the event-reported SHA, the
    ref's current head, and the commit the runner actually checked out; and
    reports every bound it hit in `truncation` rather than silently returning
    less. Schema version 2 emits one current-failure row per failed job, with
    job_id and log_job_id binding the diagnostic and checkout provenance to
    that job. Each failed job also carries the runner_labels the jobs API
    reports for it (the runner's `runs-on`), the evidence filing routes the
    repair's `os:` tag from; a failed labels read is recorded as
    runner_labels_error and never defers the failure. Both failed-step and checkout reads explicitly select the job;
    a fallback may only supply that same job. The global max_job_log_reads
    budget defaults to 6 (maximum 25), with stable job ordering and a rotating
    overflow slot. Each read retains the existing timeout, excerpt/scan bounds
    and one-job fallback. A separate diagnostic_unit keeps a complete runner
    command from its Run group through nonzero process completion (256 KiB cap),
    bound to the unique failed step. A truncated head/tail display alone does
    not defer a job with this complete unit. When gh labels every line of the
    unit with its unattributed `UNKNOWN STEP` column, the unit names no
    conflicting step, so the one nonzero-exit command is bound to the job's
    one failed step and records `step_attribution: unattributed`; a unit
    mixing a different step's label is still rejected. Missing/ambiguous command boundaries,
    source truncation and exhausted job/checkout budgets remain retryable;
    complete sibling jobs still progress. Checkout identity is extracted while
    the full runner-log stream is drained, before the human excerpt is truncated;
    extraction scans at most
    8 MiB per log. Process stdout reads stop beyond 8 MiB with at most one
    4 KiB lookahead chunk and a retryable error; command line buffers are capped
    at 16 KiB. No additional query or retry is used for command selection.
    Workflow runs are listed repository-wide in one query. `latest_runs`
    records the newest run of each workflow for audit, ordered by creation
    time then run ID. Current failures are selected by relevant identity
    (workflow, ref, and observed failed jobs): a queued or in-progress
    successor is not evidence that an observed failure is resolved, an
    unrelated pull-request run cannot erase a landing-branch failure, and a
    genuinely newer completed non-unsuccessful check of the same identity
    (or a landing-branch success, for non-landing noise) does suppress it.
    A red run whose workflow has a newer push run on the same branch still
    queued or in progress at a descendant commit (ancestry from the host
    checkout, fetching an unseen run commit by id) may already be repaired by
    that run, so a lone red run is moved to `pending_supersession` with
    `pending_on` naming that run, `pending_since` (its completion time) and
    `window_minutes`, before any investigation slot is spent; nothing is
    filed for it this sweep. A pending successor does not hold back a failure
    that has reproduced: when the previous completed run of the same workflow
    and branch, at the same or an ancestor commit, is red (not cancelled) and
    fails a job the held run fails, at a failed step they share, with the same
    normalized error signature, the held run stays current with
    `reproduced_on` naming that run, the pending run, and `shared_cause` (the
    job, its shared failed steps and the signature). The signature is the one
    filing dedupes on, computed from each job's failed-step log the way filing
    reads it; a shared job and step alone is not a reproduction, because one
    CI step can run several unrelated checks, and a step-name fallback with no
    diagnostic line proves nothing. Comparisons read at most 12 run views and
    6 failed-step logs per sweep, each log bounded by `log_max_bytes`; a
    comparison past a cap or whose log cannot be read leaves the run held,
    with a note. The hold is also bounded: a run held for
    `pending_supersession_window_minutes` (default 30) since it completed stays
    current with `held_past_window` naming the pending run, and filing writes
    that run into the task description. A rerun
    of the same commit, a successor that is not a proven descendant, or an
    ancestry query that fails leaves the failure current, with a note.
    Only landing-ref pushes of the observed event commit, or job checkouts
    matching an observed integration/release tip, remain in current_failures.
    Other live branch failures are retained in branch_failures, including
    unmerged task PRs, so filing cannot mistake their source for landing code.
    Already-failed jobs inside an in-flight workflow remain visible as current;
    only complete job evidence may be filed. A pending check alone is never a
    repair task. Incomplete mixed-state logs stay in `retryable_errors` until a
    later sweep can finish them. A red run on a branch that is neither a
    scanned head nor present on origin is reported as
    `ref_no_longer_exists` rather than current: its pull request merged or
    its branch was deleted, so the landing branch's own runs are the live
    evidence. A red run on a branch still on origin whose pull request was
    closed or merged while the branch still points at that pull request's
    head, with no open pull request on the branch, is reported as
    `pull_request_closed` with the pull request's number, URL and
    state; a branch that moved past its closed pull request stays current. A
    bounded listing of 100 closed pull requests is supplemented by a
    branch-specific listing when that page is full and omits a selected
    candidate, or when the global listing is unavailable. A matching closed PR
    is checked against open PRs on the branch before it is retired. Failed or
    truncated branch-specific listings defer the candidate with a note.
    That probe is authoritative and bounded — one origin query per
    distinct branch carrying a red run, rotating through overflow candidates
    across bounded sweeps by `investigation_cursor` without starvation. A candidate
    branch whose origin probe is skipped past the probe budget or fails transiently
    remains in `deferred` with a run-scoped retryable error rather than being
    listed as current or assumed merged; verified current failures still progress.
    When candidates outnumber `max_investigated_runs` the
    ranked prefix keeps all but one slot and the last slot rotates through
    the overflow by `investigation_cursor`, so a candidate below the cap is
    investigated within one rotation instead of never. A cancelled run is
    screened from its run view and job annotations before that budget is
    spent. Each cancelled job that still lists a failed step has its
    check-run annotations read (at most 12 reads per sweep); GitHub's
    "Canceling since a higher priority waiting request ... exists" marks the
    job `concurrency_cancellation`, because a concurrency group interrupted
    it and nothing in it failed. When every job is cancelled without a failed
    step or by concurrency, the run is `inconclusive` (reason
    `cancelled_without_failed_steps` or `concurrency_cancelled`) without any
    log read, even when it is the newest run of its workflow on its branch,
    or listed in `stale_or_superseded` when a newer run of the same workflow
    on the same branch exists; neither takes a slot. A cancelled run with any
    other failed step, or whose annotations could not be read, stays a
    candidate and never hides an older actionable failure. Discovery or
    investigation failures are bounded, redacted, and emitted in
    `retryable_errors`; the filing step defers affected jobs (or rejects
    discovery-wide gaps) so missing evidence cannot be mistaken for a clean
    result. A run-scoped error with the same run, job and operation on 3
    consecutive workflow sweeps stops failing the sweep: it moves to
    `persistent_retryable_errors` with its `consecutive_sweeps`, the
    incomplete findings it held move to `persistently_incomplete`, and a note
    says so. The counts persist in
    `<data root>/state/ci_failure_sweep/retryable_history.json`; collection
    retries of one workflow run count once, an error missing from one sweep
    starts over, and an error that names no run never degrades. An unavailable
    GitHub capability breaks the streak because that sweep could not observe
    the error. A landing-branch failure is also counted by branch and workflow,
    because each push replaces the run its gap is keyed by: once that identity
    has stayed unfileable on 3 consecutive sweeps, whichever runs it was seen
    on, its gaps become persistent too. Every persistently incomplete
    landing-branch failure is listed in `landing_evidence_incomplete` with
    `evidence_gaps` and `consecutive_sweeps`, and keeps `outcome_hint` at
    `current_failures`, so filing escalates it instead of deferring it again.
    When no GitHub client is available or authenticated the snapshot carries
    `collected: false` and gathers nothing further, so a caller can never
    mistake it for a clean CI result.
  input_schema_json:
    type: object
    properties:
      workspace_path:
        type: string
      integration_branch:
        type: string
        description: >
          The branch this workspace ships onto. Defaults to `base_branch`, then
          to the repository's GitHub default branch.
      base_branch:
        type: string
      max_runs:
        type: number
        description: >
          Cap on the single repository-wide workflow-run listing. This is a
          whole-repository budget, not a per-head one; it must stay deep enough
          that the integration head's newest run survives the pull-request runs
          that outnumber it. Defaults to 100, which is also the maximum: one
          `gh run list` page holds at most 100 runs, so larger values are
          clamped and the snapshot reports the applied limit. Values below 1
          are raised to 1.
      max_pull_requests:
        type: number
        description: >
          Cap on the open pull requests whose heads are scanned. Defaults to
          10, maximum 50; values below 1 are raised to 1.
      max_investigated_runs:
        type: number
      max_retired_ref_probes:
        type: number
        description: >
          Cap on origin probes for branches no scanned head covers. Defaults to
          20, maximum 100. Branches past the cap keep their failures deferred
          with retryable errors until relevance is established rather than
          being assumed merged or current.
      investigation_cursor:
        type: number
        description: >
          Which overflow candidate the rotating investigation slot lands on.
          Defaults to the collection hour, which advances once per hourly
          sweep; pin it to make a sweep's selection reproducible.
      log_max_bytes:
        type: number
      max_job_log_reads:
        type: number
        description: >
          Global cap on failed-job log reads, default 6, maximum 25. Overflow
          jobs remain deferred; investigation_cursor rotates the last slot.
      max_checkout_log_reads:
        type: number
        description: >
          Global cap on additional checkout reads, each narrowed to the same
          failed job. Default 3, maximum 25.
      pending_supersession_window_minutes:
        type: number
        description: >
          How long a red run that has not reproduced may be held in
          `pending_supersession` for an in-flight descendant run, measured
          from the red run's completion. Default 30, maximum 1440; 0 files it
          without holding.
  output_schema_json:
    type: object
    required: [phase, ci_evidence]
    properties:
      phase:
        type: string
      ci_evidence:
        type: object
        required: [schema_version, collected, capability]
        properties:
          schema_version:
            type: number
          collected:
            type: boolean
          outcome_hint:
            type: string
          capability:
            type: object
          repository:
            type: object
          heads:
            type: array
          latest_runs:
            type: array
          current_failures:
            type: array
          branch_failures:
            type: array
          stale_or_superseded:
            type: array
          in_flight:
            type: array
          deferred:
            type: array
          pending_supersession:
            type: array
            description: >
              Red runs held while a descendant push run of the same workflow
              and branch is in flight and the failure has neither reproduced
              on the previous completed run nor outlived the window, each
              with `reason` (`newer_descendant_run_in_flight`), `evidence`,
              `pending_on`, `pending_since` and `window_minutes`.
          retryable_errors:
            type: array
          persistent_retryable_errors:
            type: array
          persistently_incomplete:
            type: array
          landing_evidence_incomplete:
            type: array
            description: >
              Persistently incomplete landing-branch failures, each with the
              `evidence_gaps` that kept it unfileable and `consecutive_sweeps`.
              Filing escalates each branch and workflow to one task.
          summary:
            type: object
          truncation:
            type: object
          collected_at:
            type: string
  action: collect_ci_evidence
  config: {}
