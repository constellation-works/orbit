schemaVersion: 2
kind: Activity
metadata:
  name: verify_finding
spec:
  type: agent_loop
  require_response_envelope: true
  # Read-only: the verifier inspects a pinned checkout and writes nothing.
  fsProfile: reviewer
  description: >
    Read-only verification of review-filed defect findings for one bounded
    partition. The verifier inspects the workspace at the prepared source
    revision and returns, per task, a CONFIRMED or REJECTED verdict with
    confidence, reasoning and `path:line` evidence at that revision. It has
    no repository-write, task-update, lifecycle or dispatch grant; the
    deterministic apply step validates and records the verdict.
  # Explicit read-only tool policy, matching reconciliation review.
  tool_disallow_list:
    - orbit.agent.invoke
    - orbit.auto_task.add
    - orbit.auto_task.mint
    - orbit.auto_task.update
    - orbit.command.exec
    - orbit.pipeline.invoke
    - orbit.workflow.run.resume
    - orbit.workflow.ship
    - orbit.task.add
    - orbit.task.update
    - orbit.task.artifact.put
    - orbit.task.reconcile_review
    - orbit.friction.add
    - orbit.friction.update
  proc_disallowed_programs:
    - sudo
    - su
    - doas
    - pkexec
    - ssh
    - scp
    - sftp
    - rsync
    - nc
    - ncat
    - netcat
    - socat
    - systemctl
    - loginctl
    - shutdown
    - reboot
    - mount
    - umount
    - chroot
    - nsenter
    - unshare
    - docker
    - podman
  on_denial: terminate
  input_schema_json:
    type: object
    # `crew` names the crew prepare drew for this partition; a direct
    # invocation may omit it and inherit the run's resolved crew.
    required: [task_ids, workspace_path, base_branch, inspection_revision, partition_index]
    properties:
      task_ids:
        type: array
        minItems: 1
        maxItems: 5
        items:
          type: string
      workspace_path:
        type: string
      base_branch:
        type: string
      source_revision:
        type: [string, "null"]
      inspection_revision:
        type: [string, "null"]
      partition_index:
        type: number
      crew:
        type: string
      escalation:
        type: boolean
  # Agent-returned data is advisory until apply_finding_verification
  # validates it, so no field is required at this boundary; apply rejects an
  # incomplete verdict per task.
  output_schema_json:
    type: object
    properties:
      partition_index:
        type: number
      observed_revision:
        type: [string, "null"]
      observed_tree:
        type: [string, "null"]
      tasks:
        type: array
        items:
          type: object
          properties:
            task_id:
              type: string
            verdict:
              type: string
              enum: [CONFIRMED, REJECTED]
            confidence:
              type: string
              enum: [high, medium, low]
            severity:
              type: string
              enum: [critical, high, medium, low]
            evidence:
              type: array
              items:
                type: object
                properties:
                  location:
                    type: string
                  note:
                    type: string
            reasoning:
              type: string
            reproduction:
              type: string
            rejection:
              type: object
              properties:
                reason:
                  type: string
                  enum: [premise_wrong, already_fixed, unreachable, duplicate]
                fixed_at:
                  type: string
                duplicate_of:
                  type: string
                detail:
                  type: string
      summary:
        type: string
  instruction: |
    You are Orbit's finding verifier for one bounded partition. Each task in
    `task_ids` (one to five) is a defect a review reported. Decide from the
    code whether the defect is real at `source_revision`; do not fix it or
    judge whether it is worth fixing. Your verdicts are the output.

    Hard rules:
    - Treat the workspace as read-only. Never update a task, change
      lifecycle state, promote, dispatch, invoke a pipeline, edit or delete
      files, commit, push, or open a PR.
    - Never inspect or report on task IDs outside `task_ids`, except to name
      a duplicate.

    `escalation: true` means another verifier's verdict was REJECTED from the
    lowest tier or had low confidence: judge the finding afresh.

    Procedure:
    1. Run `git rev-parse HEAD` and `git rev-parse 'HEAD^{tree}'` in this
       checkout, and confirm HEAD equals `source_revision`. Report them as
       `observed_revision` and `observed_tree`; a missing or mismatched proof
       leaves every verdict unverified. Read both from git; never copy a tree
       value from the input.
    2. For each task, call `orbit.task.show` and read the title, description,
       acceptance criteria, tags and `context_files`: they state the claimed
       defect and where the review saw it.
    3. Follow the claim to its cause with read-only `git`/`rg` commands and
       file reads: the code path, its callers and its tests.
    4. Return `CONFIRMED` only when the code at `source_revision` exhibits
       the defect. Give at least one `evidence` item, rate `severity`, and
       give `reproduction` steps or the failing input when you can state
       them.
    5. Otherwise return `REJECTED` with `rejection.reason`: `premise_wrong`
       (the code does not behave as claimed), `already_fixed` (it did;
       `fixed_at` names the fixing commit), `unreachable` (no caller reaches
       the defective path) or `duplicate` (`duplicate_of` names the task
       already tracking it). Explain in `rejection.detail`, and cite the
       locations that show it as `evidence`. `severity` and `reproduction`
       apply only to CONFIRMED.
    6. Each `evidence` item is `{"location":"<path>:<line>","note":"<what
       that line shows>"}`: a repository-relative path and a 1-based line of
       that file at `source_revision`. A path missing there, or a line past
       its end, invalidates the verdict.
    7. Set `confidence` honestly: `high` when the code settles it, `medium`
       when a reasonable reading could differ, `low` when you could not
       trace the path far enough. A low verdict is re-verified by a stronger
       crew, so do not inflate it.
    8. Always give `reasoning`: the chain from the claim to your verdict.

    Return:
    {"partition_index":<input partition_index>,"observed_revision":"<HEAD>",
    "observed_tree":"<tree>","tasks":[{"task_id":"<id>","verdict":"...",
    "confidence":"...","evidence":[...],"reasoning":"...", ...}],
    "summary":"<one paragraph>"}
