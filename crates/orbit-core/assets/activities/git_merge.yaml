schemaVersion: 2
kind: Activity
metadata:
  name: git_merge
spec:
  type: deterministic
  description: >
    Merge a worktree branch either by fast-forwarding into the base branch or by
    merging the associated GitHub pull request. A successful fast-forward records
    `landed_commit` when it moves the base, including a fast-forward that
    follows a rebase. If the base already contains the candidate, the output
    reports `merged: false`, `already_contained: true`, `completion_held: false`,
    and `base_commit` without a task landing. A fast-forward whose input
    carries `completion: done` first decides the `completion.hold` rules
    against the candidate's diff; a held candidate is not merged and the
    output reports `merged: false` and `completion_held: true` with the held
    tasks and the hold.
  input_schema_json:
    type: object
    properties:
      job_run_id:
        type: string
      task_id:
        type: string
      task_ids:
        type: array
        items:
          type: string
      completed_task_ids:
        type: array
        items:
          type: string
      strategy:
        type: string
        enum: [fast_forward, pr_merge]
      base:
        type: string
      base_sync:
        type: string
      completion:
        type: string
        description: >
          `done` when this run is authorized to complete its tasks: the
          fast-forward then honors the `completion.hold` rules before the
          candidate lands on the base. Any other value merges as today.
      workspace_path:
        type: string
  output_schema_json:
    type: object
    properties:
      merged:
        type: boolean
      base_commit:
        type: string
        description: Full commit id observed at the base after the operation.
      landed_commit:
        type: string
        description: >
          Full commit id landed by a fast-forward that moved the base.
          Absent when the step merged nothing.
      already_contained:
        type: boolean
        description: >
          True when the fast-forward was a no-op because the base already
          contained the candidate.
      completion_held:
        type: boolean
        description: >
          True when a `completion.hold` rule held completion before merging.
          False when the fast-forward ran (including an already-contained
          no-op).
      reason:
        type: string
      held_task_ids:
        type: array
        items:
          type: string
      completion_hold:
        type: object
  action: git_merge
  config: {}
