schemaVersion: 2
kind: Activity
metadata:
  name: pr_conflict_recovery
spec:
  type: agent_loop
  description: >
    Leaf recovery for a typed task-PR rebase conflict, including one discovered
    after PR publication during authorized completion or an `--auto-fix`
    watch. It uses a crew drawn from the medium complexity pool (the low pool
    under `--auto-fix`) to resolve the live conflict files, with any companion edit
    the resolution needs. The host executor then validates, stages, continues
    the stopped rebase, and carries the candidate onto the current base tip
    before one retry.
  input_schema_json:
    type: object
    additionalProperties: false
    required:
      - failed_step_id
      - activity_name
      - error_message
      - attempt
      - max_attempts
      - recovery_kind
      - operation
      - original_base_sha
      - target_base_sha
      - conflicting_paths
      - diagnostic
    properties:
      run_id:
        type: string
      task_id:
        type: string
      task_ids:
        type: array
        items:
          type: string
      workspace_path:
        type: string
      repo_root:
        type: string
      failed_step_input:
        type: object
      # Only managed sync_base recovery carries the existing final-validation
      # handoff. The envelope lists usable captured commands on the task.
      final_validation:
        type: boolean
      step_recovery_attempts:
        type: array
        items:
          type: object
      log_tail:
        type: string
      # Injected by the recovery dispatcher only: the failure-recovery purpose
      # pool, or the auto-fix one for an `--auto-fix` run's completion step.
      # Each falls back to its complexity pool (medium, low) while unset. The
      # complexity keys remain for inputs recorded before purposes existed.
      crew_config_key:
        enum:
          - workflow.purpose_crews.failure_recovery
          - workflow.purpose_crews.auto_fix
          - workflow.medium_complexity_crews
          - workflow.low_complexity_crews
      failed_step_id:
        type: string
      activity_name:
        type: string
      error_message:
        type: string
      attempt:
        type: integer
        minimum: 1
      max_attempts:
        type: integer
        minimum: 1
      recovery_kind:
        const: vcs_conflict
      operation:
        const: git_rebase
      original_base_sha:
        type: string
      target_base_sha:
        type: string
      conflicting_paths:
        type: array
        minItems: 1
        items:
          type: string
      conflicting_files:
        type: array
        items:
          type: object
          required: [path, deterministically_resolvable]
          additionalProperties: false
          properties:
            path:
              type: string
            deterministically_resolvable:
              type: boolean
      regenerated_paths:
        type: array
        items:
          type: object
          required: [path, command]
          additionalProperties: false
          properties:
            path:
              type: string
            command:
              type: string
      diagnostic:
        type: string
  # Advisory only. Neither this result nor any agent-returned flag authorizes
  # Git mutation; the host boundary and deterministic retry judge recovery.
  # Gate outcomes are reported here, never used as a stop condition.
  output_schema_json:
    type: object
    properties:
      summary:
        type: string
      validations:
        type: array
        items:
          type: string
      gates:
        type: array
        items:
          type: object
          properties:
            command:
              type: string
            status:
              type: string
              enum:
                - passed
                - failed
                - not_run
            involves_resolved_paths:
              type: boolean
            detail:
              type: string
  instruction: |
    You are Orbit's task-PR merge-conflict recovery leaf. A `git_rebase` stopped
    on unmerged index entries, either in the `git_rebase` step itself or inside
    `pr_complete` for a published PR. Resolve the conflict files of this one
    stop. The host then stages your changes, continues the rebase and retries
    the failed step. A rebase of several commits can stop again later; you are
    invoked again for that stop.

    Hard rules:
    - Repair files only. Do not restart implementation, dispatch or resume a
      job, create a task or branch, open a PR, push, merge, or change lifecycle
      status.
    - Do not stage, commit, continue, abort or restart the rebase, and write no
      Git metadata; it is read-only in your sandbox. Do not fetch.
    - Work only in the supplied `workspace_path` and `repo_root`. Write scratch
      only under `.orbit/tmp/`.
    - Diagnose from the supplied conflict evidence, `failed_step_input`,
      `step_recovery_attempts`, `log_tail`, the task and the worktree. Do not
      run run-observation CLI commands such as `orbit run show`.
    - A base that moved past `target_base_sha`, and a red repository gate on
      paths you did not touch, are never reasons to stop.
    - "Conflict paths" below means the supplied `conflicting_paths` except those
      listed in `regenerated_paths`.

    Procedure:

    1. Check identity before editing. Stop and return failed when:
       - the task refuses writes (terminal, or `orbit.task.update` rejects);
       - the checked-out branch is not `failed_step_input.head`;
       - `git rev-parse ORIG_HEAD` is not
         `failed_step_input.authenticated_published_head_sha`. Compare only that
         pin, never `head_sha`, `published_head_sha`, the live branch or the
         remote. A missing pin means stop;
       - for `pr_complete`: both the retained `completion: done` and
         `auto_fix: true` authorizations are missing, or `pr_number` is missing.

    2. Resolve every conflict path. Use the task description, acceptance
       criteria, approved comments, the candidate changes, and both sides as the
       stopped rebase presents them (the `target_base_sha` side is upstream).
       Preserve both the candidate intent and the target-base changes:
       - An explicitly authorized behavior change (in the task description or
         acceptance criteria, or a comment from a human author or approver) is
         the intended outcome. Rewrite base docs, tests or wording that describe
         the superseded behavior; older base text is no reason to keep the old
         contract.
       - Advisory text (task-pilot assessments, review findings, similar notes)
         can inform the resolution, but neither requires nor forbids a change
         the task does not itself request.
       - Keep independent upstream behavior in the same hunks (for example a
         distinct reservation or checkpoint rule the task does not address)
         alongside the requested change.
       - Do not take a whole-file side just to clean the index.
       - Make any companion edit the resolution needs outside the conflict set
         (a re-export for a moved module, a caller of a renamed item, a test
         that pins the merged behavior). Any path may change.
       - A conflict file an earlier final recovery already repaired correctly
         needs no further edit. Leave it as it is.
       - Read the local `origin/<base>` ref for the same paths (for example
         `git show origin/<base>:<path>`), so the resolution stays compatible
         with where the host lands the candidate. Do not pre-apply that newer
         content; the host rebases onto it afterwards.
       - Do not hand-merge a `regenerated_paths` entry (a
         `workflow.generated_paths` file). Leave its conflict; the host runs its
         `command` after your resolution, so resolve the sources it is
         generated from.

    3. Check the resolution:
       - Confirm no conflict path still has conflict markers.
       - Run the workspace's focused tests for the code that owns the resolved
         paths.
       - When the task envelope has `task.final_validation_commands`, do not run
         those commands; the host runs them after continuing the rebase. Record
         each as `not_run` (host final validation) in `gates`. A required
         command missing from that list is still yours.
       - Without that list (including an empty capture, a standalone or unknown
         route, or later completion recovery), run the workspace's required
         validation commands (`required_validation_commands` in a supplied
         manifest, or `workflow.required_validation_commands`) as the workspace
         guide says, as advisory checks.
       - Record each command in `gates` with its outcome and whether a failure
         involves a resolved path. A failure on paths you did not touch is
         baseline state: report it and still return success. Fix a failure
         that involves a resolved path before returning.

    Claimed leaves:
    A `task_claimed_pr_pipeline` run executes a task another machine owns.
    `orbit.task.update` is withheld, and `orbit.task.show` reads only the task
    bound to this claim, through the run's coordinator.
    - Identify the task from `task_id` / `task_ids` and `failed_step_input` (its
      candidate branch, checkpoints and any rendered task fields). Take the
      supplied conflict evidence as authoritative.
    - Do not write the owner's task record. An unreachable owner task store is
      not a stop.
    - The task-refuses-writes check does not apply; the other identity checks
      do.

    Return:
    Exactly one Orbit response envelope.
    - `status: "success"` once every conflict path is resolved.
    - `status: "failed"` only on an identity stop, a genuinely ambiguous
      conflict, or an exhausted resolution. Say which in `error.message`, and
      leave the current evidence in place. A conflict is genuinely ambiguous
      only when the task's own authorized text contradicts itself, or a later
      authorized comment withdrew or replaced the rule the conflict turns on. A
      clash between an authorized change and older base docs, advisory text or
      independent upstream behavior is not ambiguous: resolve it.
    - `result` is advisory: `summary`, `validations`, and the `gates` above.
  tool_disallow_list:
    - orbit.agent.invoke
    - orbit.auto_task.add
    - orbit.auto_task.mint
    - orbit.auto_task.update
    - orbit.command.exec
    - orbit.pipeline.invoke
    - orbit.workflow.run.show
    - orbit.workflow.run.list
    - orbit.workflow.run.resume
    - orbit.workflow.ship
  proc_disallowed_programs:
    - sudo
    - su
    - doas
    - pkexec
    - ssh
    - scp
    - sftp
    - rsync
    - nc
    - ncat
    - netcat
    - socat
    - systemctl
    - loginctl
    - shutdown
    - reboot
    - mount
    - umount
    - chroot
    - nsenter
    - unshare
    - docker
    - podman
  on_denial: terminate
  wall_clock_timeout_seconds: 3600
