schemaVersion: 2
kind: Activity
metadata:
  name: resident_observe
spec:
  type: deterministic
  description: >
    Start the owning run's resident cycle for the mandate its run input names.
    A mandate that is not active or no longer due starts nothing and reports
    `cycle_count: 0` with the reason. Otherwise a live cycle whose run stopped
    or whose lease expired first gets a synthesized `incomplete` checkpoint
    rebuilt from its action rows, and this cycle recovers it. The run then
    publishes its live cycle under the assignment lock, records the cycle's
    grant (the effective authority, observe-only while a maintenance notice
    is open in the mandate's scope or its deadline has passed) and returns
    the brief: mandate, grant, recent checkpoints, open requests, comments
    since the last cycle, wake reasons, notices and the recovered actions.
    Worktree creation and predecessor-removal failures are reported in the
    brief as `worktree_error` and `worktree_removal_error`.
  input_schema_json:
    type: object
    properties:
      task_ids:
        type: array
        items:
          type: string
  output_schema_json:
    type: object
    required: [task_id, cycle_count]
    properties:
      task_id:
        type: string
      cycle_count:
        type: number
      skip_reason:
        type: string
      cycle:
        type: string
      crew:
        type: string
      continuity:
        type: string
      conversation_ref:
        type: [string, "null"]
      worktree_error:
        type: string
        description: >
          Present when observe could not create or resume this cycle's managed
          worktree; the path is preserved when ownership cannot be proven.
      worktree_removal_error:
        type: string
        description: >
          Present when observe kept a dead predecessor's worktree because Git
          refused removal or ownership of an unregistered directory could not
          be proven.
  action: resident_observe
  config: {}
