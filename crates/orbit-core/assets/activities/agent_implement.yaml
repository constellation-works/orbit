schemaVersion: 2
kind: Activity
metadata:
  name: agent_implement
spec:
  type: agent_loop
  description: >
    Implement a single Orbit task using the injected task envelope or the
    canonical task record, keeping the task history current as work progresses.
    Deliver clear, usable results with evidence for the acceptance criteria.
  input_schema_json:
    type: object
    required: [task_id]
    properties:
      task_id:
        type: string
      verification_mode:
        type: string
      workspace_path:
        type: string
      repo_root:
        type: string
      # Set by the claimed pipelines only. The runner denies
      # `orbit.task.update` for a claimed invocation, whether or not this is
      # set: a claimed leaf's worker binding is enough. `orbit.task.show` is
      # read-only and scoped by the run broker to the claimed task.
      claimed:
        type: boolean
      # Set by `candidate_resume` when the checkout already holds this
      # task's preserved candidate that needs repair: `trigger`
      # (`implementation`, `conflict`, `validation`, `review` or
      # `continuation`), `output`,
      # and `failed_step_id`, `conflicting_paths` or the failing `command`.
      resume_candidate:
        type: [object, "null"]
  output_schema_json:
    type: object
    properties:
      summary:
        type: string
      diff:
        type: string
      skipped_reason:
        type: string
      # Claimed mode: the execution summary the handoff carries to the owner.
      execution_summary:
        type: string
      # Claimed mode: selectors the implementer would have appended (advisory;
      # the owner widens the claim over the candidate's additions).
      context_files_added:
        type: array
        items:
          type: string
      # Claimed mode: a task comment the implementer would have posted.
      comment:
        type: string
      # Claimed no-diff evidence: the deterministic commit step imports only
      # these bounded scratch files and verifies them before delivery.
      no_diff_artifacts:
        type: array
        items:
          type: object
          required: [path, source_path]
          additionalProperties: false
          properties:
            path:
              type: string
            source_path:
              type: string
      # A real blocker (item 8). The step boundary records it and stops the run.
      blocker:
        type: object
        required: [kind, evidence]
        properties:
          kind:
            type: string
          evidence:
            type: string
  instruction: |
    Complete the Orbit task with validated outputs, following acceptance
    criteria and workspace instructions. Propose only when requested.

    Tool access and durable state

    - Use a granted `orbit.*` tool directly when wired; otherwise use
      `orbit tool run <tool.name> --input '<json>'` (`--input-file` for large
      input). The CLI has the same gates; never reach an ungranted tool. Tool
      writes are durable; your final response does not replace task updates.
    - Workflow input `task_id` and `ORBIT_TASK_ID` identify the task; task-tool
      arguments use `id`, not `task_id` or `taskId`. For example:
      `orbit tool run orbit.task.show --input '{"id":"<task-id>","model":"<agent-family>"}'`.
      Use `id` for `orbit.task.update`, `orbit.task.artifact.put`, and
      `orbit.task.artifact.get` too. GitHub run tools take `run`, even though
      their output uses `run_id`; `orbit.task.add` takes `type` (feature, bug,
      refactor, or chore). Search statuses use `task:rejected` or
      `friction:resolved`, never `status:rejected` or a bare status.

    Claimed mode

    - When `input.claimed` is true, the pipeline delivers your output to the
      owning machine. The injected task is authoritative; `orbit.task.update`
      is unavailable. `orbit.task.show` can read only the claimed task through
      the run's coordinator. Return writes as output fields:
      - `execution_summary` (REQUIRED): the item 12 summary.
      - `context_files_added`: selectors from item 4 (reported, not applied;
        the owner widens the claim's footprint over every path the candidate
        adds when it accepts the handoff).
      - `comment`: any task comment or leftovers (item 11). A real blocker
        (item 8) is `result.blocker` `{kind, evidence}`, not a status write
        and not only this comment.
    - In claimed mode, for a clean no-op or already-satisfied base, write the structured
      `no-diff.json` or `already-landed.json` report and every validation log
      under the checkout's `.orbit/tmp/`. Return `no_diff_artifacts` as
      `[{"path":"no-diff.json","source_path":".orbit/tmp/no-diff.json"}, ...]`,
      including each report-referenced log. The deterministic commit step
      attaches these bytes through the claim and runs the existing verifier;
      the sandboxed implementer does not call owner artifact tools. This
      replaces the artifact-attachment requirement in item 12 for claimed mode.
    - Other owner-routed tools may be unreachable; that is never a failure or
      blocker. Record it in `comment`; report `failed` only for the work.

    Terminal-task guard

    - Before reading anything else, inspect the injected task. If
      `task.terminal` is true, do no investigation, edits, or validation; return
      success with `skipped_reason: "task_terminal"` and name `task.status` in
      the summary.
    - Re-read status with `orbit.task.show` before the first edit and before validation
      (not in claimed mode, which relies on the injected status).
      Apply the same stop rule if the fresh status refuses writes,
      or if `orbit.task.update` rejects a write because the task became terminal.
      Do not retry, work around it, or file friction for this designed outcome.

    Context and checkout

    1. The injected task is authoritative for title, description, acceptance
       criteria, plan, and context files. If it is absent or malformed, recover
       it with `orbit.task.show`. Read description, criteria, and plan first;
       persist a concrete plan when it is blank. Read comments chronologically.
       Later authorized refinements supersede earlier suggestions; report
       unresolved contradictions. Recover truncated comments with granted
       task tools when needed to understand the mandate.
    2. Resolve every canonical `context_files` selector. Read `file:` targets
       with the provider-native file-read tool. For `dir:`, verify containment
       beneath the workspace root, list with `rg --files <directory>`, then
       read key files; never pass directories to the file-read tool.
    3. `input.workspace_path` and `input.repo_root` override task paths. Before
       any write, obtain `pwd -P` and `git rev-parse --show-toplevel`; both
       supplied roots must resolve to the canonical checkout. Otherwise write
       nothing and fail with `worktree_mismatch`, naming requested and
       resolved roots. Read the workspace's AGENTS.md and relevant guidance.
       Record starting HEAD and full `git status --short` as the baseline
       distinguishing run-owned output from pre-existing edits; preserve those
       edits. Inspect materials, consumers, and evidence before changes.

    Resumed candidate

    - When `input.resume_candidate` is set, the checkout already holds this
      task's candidate from an earlier failed run, applied onto the current
      base as uncommitted changes. Continue from that diff; do not discard
      it and start over. Finish what `trigger` names: `implementation` (the
      earlier run failed at `failed_step_id` before `commit`, so the diff is
      a partial implementation — complete the task from it; a compiling
      subset is not done), `conflict` (resolve the conflict markers in
      `conflicting_paths` against the new base), `validation` (the `output`
      of the failing `command`), `review` (the findings in the review
      settlement comment) or `continuation` (an earlier claim committed it
      but did not deliver it — check it against the task and finish what is
      missing). Then rerun the checks and say in the summary that
      you repaired a resumed candidate.

    Scope and implementation

    4. Treat `context_files` as a starting point, not a limit. Create or
       modify any path the work requires, including paths outside the task's
       selectors (a new test file, a caller, a re-export); explain why in the
       summary. Orbit widens the task's selectors over every path you change
       and records in task history which step introduced it, so declaring
       selectors yourself is optional. To declare one, read durable
       `context_files` with `orbit.task.show`, then use `orbit.task.update`
       with the deduplicated union of ALL existing selectors and the added
       canonical in-workspace `file:`, `dir:`, or `symbol:` selector (with
       `allow_missing_context: true` for a file you will create). The list
       REPLACES existing selectors; omission preserves them, `[]` clears them.
       Never send additions alone. In claimed mode, report
       `context_files_added` instead of calling unavailable task tools.
       Revert accidental edits. Comment and stop for broad, ambiguous, or
       out-of-scope behavior: scope is the task's intent, not its selectors.
       Never delete unrelated materials as cleanup.
    5. Keep shared instructions domain-neutral. Follow the workspace's
       AGENTS.md, current evidence, and requirements for repository practices.
    6. Deliver clear outputs, preserve compatibility, and explain constraints.
       Tool availability does not prove installation or permit global installs,
       policy bypass, or secret access.

    Validation and handoff

    7. Follow workspace validation policy. Check each acceptance criterion
       with appropriate evidence: source support for research,
       reproducibility for analysis, or behavior checks for software.
       Run the workspace's required validation commands from a supplied
       delivery manifest's `required_validation_commands` or
       `workflow.required_validation_commands`, following its own AGENTS.md.
       When the workspace requires an affected-test gate, run full test
       targets of changed crates and their transitive workspace dependents;
       a formatting/guardrail pass and focused test filters do not replace it.
       Use the workspace's supported mechanism to pin the comparison base
       when the delivery base is supplied, and include committed, staged,
       unstaged and untracked candidate paths.
       Exercise the affected environment when needed; state limits of indirect
       evidence or checks run elsewhere.
       Run build, test, cargo and make validation that can take minutes in the
       provider's native shell session (for Codex, exec_command/write_stdin),
       or another long-running transport the lane provides. proc.spawn is for
       short bounded commands and has a 60-second (60000 ms) ceiling; larger
       timeout_ms requests are clamped. A proc.spawn timeout on cargo/make is
       never a validation blocker: rerun through the long-running transport
       and await completion, including time waiting for shared build-budget
       admission. Preserve sandboxing and build-budget admission.
       Sandbox/runner denials (e.g. EPERM) prove neither defects nor correctness.
       Try safe in-scope alternatives without bypassing policy; record the
       exact command, denial, and uncertainty. Return success only for a
       complete deliverable when workspace policy permits deferring the
       check; otherwise report the validation blocker.
       Run only gates named by workspace policy. When a gate fails outside the
       delivery scope, reproduce it once on the unmodified baseline (the same
       command at the base commit or with your diff reverted). A failure there
       is pre-existing: record the command, case, and baseline result, keep
       checks touched by your changes green, and hand off as success.
       Orbit's own required validation makes the same comparison after you
       hand off. It reruns a network-inconclusive failure (curl status 000,
       DNS, TLS timeout), and it reruns a failing required command on the
       base. When the base fails the same way, the task is held, not blocked,
       until the base passes. So never weaken, skip or work around a required
       command to get past a red base, and never set `blocked` or return a
       blocker for one; a failure the base does not share is yours to fix.
    8. For a real blocker (missing dependency, contradictory requirements, or
       unresolvable conflict), return `result.blocker` as `{kind, evidence}`.
       `kind` is a short token: an ASCII letter, then ASCII letters, digits,
       `_`, `.`, `:`, or `-`, at most 64 bytes. `evidence` is the reason.
       The step boundary records the kind, stops the run, and keeps the
       candidate. Do not call `orbit.task.update` to set `blocked`; that write
       is refused. A criterion contradicting AGENTS.md or equivalent is not a
       blocker: the workspace rule wins; skip it and record the deviation and
       source in the execution summary.
    9. File `orbit.friction.add` with evidence only for a contradicted
       assumption, recurring failure, incident root cause, or non-obvious
       gotcha that took over 10 minutes.
    10. Review the deliverable and diff for accuracy, unintended changes, and
        stale material; run required checks. Run-owned non-deliverable output
        is only what `git status --short` adds to the
        item 3 baseline; ignored build output, caches, and sandbox-owned paths
        like `<worktree>/target` are not yours to remove and never block
        handoff. Write scratch, logs, and review evidence under `.orbit/tmp/`
        (`$ORBIT_SCRATCH_DIR`; ignored by git, run-scoped, the only location
        `orbit.task.artifact.put` accepts). Never under `/tmp`. Attach it
        through granted task tools; scratch there needs no Trash-based
        recoverable cleanup. Before success, remove or revert run-owned
        output verified outside the deliverable. Deletion is exceptional for
        stray untracked paths: never use raw `rm -f` or `rm -rf`, or broad
        cleanup for specific leftovers. Never retry denied cleanup or replace
        it destructively. Preserve pre-existing contents, others' edits, and
        legitimate outputs.
    11. Reconcile changes before returning, even if cleanup was denied.
        Inventory with `git status --short` and `git diff --check`: staged,
        unstaged, untracked, deletions, and both sides of renames. Account for
        every entry against item 3's baseline. Delivery commits every tracked
        change and every untracked path outside `.orbit/tmp/` (gitignored
        output excepted), so each remaining entry must be deliverable. If you
        updated `context_files`, re-read them and verify prior selectors
        remain. Repeat inventory after cleanup.
        If denied or unsafe cleanup leaves run-owned output outside
        `.orbit/tmp/`, record exact paths and the blocker in an
        `orbit.task.update` comment; do not hand off as success.
    12. Workflow admission already set `in-progress`: do not redundantly set
        that status or move the task to `review`; the pipeline owns that
        transition. REQUIRED: persist a meaningful `execution_summary` with
        `orbit.task.update` (in claimed mode, return it as the output's
        `execution_summary` instead). Return a short result summary; include
        `diff` only when cheap and accurate.

        If this task's or a sibling's merged commit covers the clean checkout,
        verify that commit and current acceptance checks. On first attempt or
        retry, do not manufacture a change: attach `already-landed.json` and
        each validation log through `orbit.task.artifact.put` before success.
        The already-landed report needs schema_version 1, task_id, run_id,
        tested_head, covering_commit, covering_task_id (this task or covering
        sibling), scope (title, description, acceptance_criteria, plan,
        context_files, tags, relations, required_tools, type, comments),
        required_commands, criteria_evidence, validation. Use flat
        validation[] objects with sibling fields command, outcome, role,
        log_artifact. criteria_evidence is an array of non-empty strings, one
        per acceptance criterion in order (never objects). Each required
        command's validation[] entry has outcome "passed" and role
        "required"; the role vocabulary is required, expected_failure,
        excluded, superseded, diagnostic.
        After required checks pass, for a genuine no-op, attach `no-diff.json`
        and validation logs via `orbit.task.artifact.put`, using the schema in
        the Orbit task-execution reference (schema_version 1, task_id, run_id,
        tested_head, reason, validation[command, exit_code, log_artifact]).
        Attach each referenced JSON log with run_id, tested_head, command,
        exit_code, captured output. Old, missing, failed, or unavailable
        checks disqualify this path; report a validation blocker.

        Leave changes uncommitted; the pipeline owns commit, push, PR creation,
        and merge. Follow item 10's scratch policy. Gates read durable artifacts and
        task state, never the execution summary as an oracle. Do not invoke another agent
        or dispatch work. In the execution summary, map criteria to results,
        list validation commands as passed/failed/not run with reasons, record
        the item 11 reconciliation (delivery paths, paths outside the task's
        selectors, cleanup outcome, leftovers), and disclose risks or
        deviations.
        Do not claim skipped checks passed or incomplete work successful.
  tool_disallow_list:
    - orbit.agent.invoke
    - orbit.auto_task.add
    - orbit.auto_task.mint
    - orbit.auto_task.update
    - orbit.command.exec
    - orbit.pipeline.invoke
    - orbit.workflow.run.resume
    - orbit.workflow.ship
  proc_disallowed_programs:
    - sudo
    - su
    - doas
    - pkexec
    - ssh
    - scp
    - sftp
    - rsync
    - nc
    - ncat
    - netcat
    - socat
    - systemctl
    - loginctl
    - shutdown
    - reboot
    - mount
    - umount
    - chroot
    - nsenter
    - unshare
    - docker
    - podman
  on_denial: terminate
  wall_clock_timeout_seconds: 10800
