schemaVersion: 2
kind: Activity
metadata:
  name: agent_implement
spec:
  type: agent_loop
  description: >
    Implement a single Orbit task using the injected task envelope or the
    canonical task record, keeping the task history current as work progresses.
    Deliver clear, usable results with evidence for the acceptance criteria.
  input_schema_json:
    type: object
    required: [task_id]
    properties:
      task_id:
        type: string
      verification_mode:
        type: string
      workspace_path:
        type: string
      repo_root:
        type: string
      # Set by the claimed pipelines only. The runner denies
      # `orbit.task.update` for a claimed invocation, whether or not this is
      # set: a claimed leaf's worker binding is enough. `orbit.task.show` is
      # read-only and scoped by the run broker to the claimed task.
      claimed:
        type: boolean
      # Set by `candidate_resume` when the checkout already holds this
      # task's preserved candidate that needs repair: `trigger`
      # (`implementation`, `conflict`, `validation`, `review`,
      # `continuation` or, for a claimed repair leaf, `landing`), `output`,
      # and `failed_step_id`, `conflicting_paths` or the failing `command`;
      # `interrupted_review` when the earlier run was stopped mid-review.
      resume_candidate:
        type: [object, "null"]
      # Engine-owned context for the phase resumed by final recovery.
      final_recovery_resume:
        type: object
        required: [step_id, failed_step_id, rationale, refusal, refused_output]
        additionalProperties: false
        properties:
          step_id:
            type: string
          failed_step_id:
            type: string
          rationale:
            type: string
          refusal:
            type: string
          refused_output: {}
      # The pinned delivery base: the commit the worktree started on. A
      # deferred sandbox validation names it as its `base`.
      base_sha:
        type: [string, "null"]
      # Set by a delivery pipeline whose deterministic `validate` step runs
      # the required commands on the final candidate after this step. The
      # envelope then lists that captured list as
      # `task.final_validation_commands` (absent when it is empty, or for a
      # claim that captured no owner gates).
      final_validation:
        type: boolean
  output_schema_json:
    type: object
    properties:
      summary:
        type: string
      diff:
        type: string
      skipped_reason:
        type: string
      # Claimed mode: the execution summary the handoff carries to the owner.
      execution_summary:
        type: string
      # Claimed mode: selectors the implementer would have appended (advisory;
      # the owner widens the claim over the candidate's additions).
      context_files_added:
        type: array
        items:
          type: string
      # Claimed mode: a task comment the implementer would have posted.
      comment:
        type: string
      # Claimed mode: culprit task IDs the implementer would have recorded as
      # `regression_from` relations. The handoff carries them and the owner
      # checks and records them when it accepts the handoff. Absent, `null`
      # or `[]` means no relation. The implement step fails an output whose
      # entries are not task IDs before any commit, push or PR.
      regression_from:
        type: [array, "null"]
        items:
          type: string
      # Claimed mode: findings the owner refused to file. The handoff
      # attaches them to the claimed task as `unfiled-findings.json`. The
      # engine does not enforce this schema; the implement step fails an
      # output whose findings are not `{title, description}` objects before
      # any commit, push or PR.
      unfiled_findings:
        type: array
        items:
          type: object
          required: [title, description]
          properties:
            title:
              type: string
            description:
              type: string
      # Claimed mode: required task artifacts for diff and no-diff candidates.
      # Commit validates every bounded scratch file before attaching through
      # the claim; names cannot collide with clean-tree reports or their logs,
      # and cannot use the reserved review- namespace.
      task_artifacts:
        type: array
        items:
          type: object
          required: [path, source_path]
          additionalProperties: false
          properties:
            path:
              type: string
            source_path:
              type: string
      # Claimed no-diff evidence: the deterministic commit step imports only
      # these bounded scratch files and verifies them before delivery.
      # On an unchanged claimed base without the no-diff-expected tag, missing
      # references fail the implement step with response_envelope_error. Other
      # implementations retain the best-effort response-envelope default.
      no_diff_artifacts:
        type: array
        items:
          type: object
          required: [path, source_path]
          additionalProperties: false
          properties:
            path:
              type: string
            source_path:
              type: string
      # A required affected-test gate whose only gap is sandbox deferrals:
      # Bubblewrap on Linux, Seatbelt on macOS, and ps-denied on a macOS
      # claimed leaf (item 7), one kind or several. The implementer names
      # only the validation summary the gate wrote. The
      # step boundary derives the record from it, runs each kind's probe in
      # this lane, refuses anything but the sanctioned case before commit and
      # replaces this field with the derived record; validation replays the
      # gate outside the agent sandbox before delivery.
      deferred_sandbox_validation:
        type: [object, "null"]
        required: [summary]
        additionalProperties: false
        properties:
          summary:
            type: string
            description: Checkout-relative path of the gate's validation summary, under `.orbit/tmp/`.
      # Claimed mode: the unchanged base already resolves the task, shown by
      # tests that run only outside the agent sandbox. The implement step
      # admits each selector; `claim_validate` replays them on the base on
      # the claim host before the NoDiff handoff.
      already_resolved:
        type: [object, "null"]
        required: [selectors]
        additionalProperties: false
        properties:
          selectors:
            type: array
            items:
              type: string
              description: "`cargo test -p <crate> --test <target> [<filter>]`"
      # Criteria the task pilot typed post-deploy, which only the deployed
      # build can evidence (item 7). The implement step admits each against
      # that finding and fails the step for any other; the delivery then
      # settles in review until an operator records the measurement.
      owed_criteria:
        type: array
        items:
          type: object
          required: [criterion, host, command, target]
          additionalProperties: false
          properties:
            criterion:
              type: integer
              minimum: 1
            host:
              type: string
            command:
              type: string
            target:
              type: string
            candidate_evidence:
              type: string
      # A real blocker (item 8). The step boundary records it and stops the run.
      blocker:
        type: object
        required: [kind, evidence]
        properties:
          kind:
            type: string
          evidence:
            type: string
  instruction: |
    Complete the Orbit task: deliver what its acceptance criteria ask for,
    validated, following the workspace guide (AGENTS.md/CLAUDE.md). Finish the
    deliverable; write a proposal instead only when the task asks for one. The
    pipeline commits, pushes and opens the PR; your durable outputs are the
    worktree changes, task updates and artifacts, not your final message.

    If the input carries `final_recovery_resume`, `resume_candidate` or
    `claimed`, read the matching section after the Procedure before step 1.

    Tools

    - Call a granted `orbit.*` tool directly, or run
      `orbit tool run <tool> --input '<json>'` (`--input-file` for large
      input). Both have the same gates; never reach an ungranted tool.
      `orbit tool show <tool>` prints a schema.
    - Argument names: task tools take `id` (never `task_id`/`taskId`), e.g.
      `orbit tool run orbit.task.show --input '{"id":"<task-id>","model":"<agent-family>"}'`;
      GitHub run tools take `run`; `orbit.task.add` takes `type` (feature,
      bug, refactor or chore); search status filters are `task:rejected` or
      `friction:resolved`, never `status:rejected` or a bare status.
    - To attach a file, write it under `.orbit/tmp/` and call
      `orbit.task.artifact.put` with `id`, `source_path` (the local file) and
      `path` (the artifact name). Names starting with `review-` in any case
      are reserved for the review gate, except `review-report.json`; use
      names like `examination-checks.json`.

    Terminal-task guard

    - Before anything else, check the injected task. If `task.terminal` is
      true, do nothing else: return success with
      `skipped_reason: "task_terminal"` and name `task.status` in the summary.
    - Outside claimed mode, re-read status with `orbit.task.show` before the
      first edit and before validation. Stop the same way if the status now
      refuses writes, or if `orbit.task.update` rejects a write because the
      task became terminal. Do not retry, work around it or file friction.

    Procedure

    1. The injected task is authoritative for title, description, acceptance
       criteria, plan and context files; if it is absent or malformed,
       recover it with `orbit.task.show`. Read description, criteria and plan
       first, and persist a concrete plan when the plan is blank. Read
       comments oldest first: later authorized refinements supersede earlier
       ones; report contradictions you cannot resolve. Recover truncated
       comments when you need them to understand the mandate.
    2. Resolve every `context_files` selector. Read `file:` targets with the
       provider's file-read tool. For `dir:`, check it is inside the
       workspace root, list it with `rg --files <dir>` and read the key
       files; never pass a directory to the file-read tool.
    3. `input.workspace_path` and `input.repo_root` override task paths.
       Before any write, both must resolve to the checkout given by `pwd -P`
       and `git rev-parse --show-toplevel`; otherwise write nothing and fail
       with `worktree_mismatch`, naming the requested and resolved roots.
       Read the workspace guide. Record the starting HEAD and full
       `git status --short` as the baseline; preserve pre-existing edits.
       Inspect the materials, consumers and evidence before changing anything.
    4. Scope is the task's intent, not its selectors. Change any path the
       work needs (a new test, a caller, a re-export) and explain why in the
       summary; Orbit widens the task's selectors over every path you change.
       To declare a selector yourself, read the durable `context_files` with
       `orbit.task.show`, then send `orbit.task.update` the deduplicated union
       of ALL existing selectors plus yours (`allow_missing_context: true` for
       a file you will create): the list replaces the old one, so never send
       additions alone. Revert accidental edits. Comment and stop when the
       work turns out broad, ambiguous or out of scope. Never delete
       unrelated material as cleanup.
    5. Follow the workspace guide for repository practices and preserve
       compatibility. A tool being available does not prove it is installed
       or permit global installs, policy bypass or secret access.
    6. Validate (see Validation). Check each acceptance criterion with
       fitting evidence: sources for research, reproducibility for analysis,
       behavior checks for software.
    7. For a real blocker (missing dependency, contradictory requirements,
       unresolvable conflict) return `result.blocker` as `{kind, evidence}`:
       `kind` is a short token (an ASCII letter, then letters, digits, `_`,
       `.`, `:` or `-`, at most 64 bytes); `evidence` is the reason. The run
       stops and keeps the candidate. Never set `blocked` with
       `orbit.task.update`; that write is refused. A criterion that
       contradicts the workspace guide is not a blocker: the guide wins; skip
       it and record the deviation and its source in the execution summary.
    8. File `orbit.friction.add`, with evidence, only for a contradicted
       assumption, a recurring failure, an incident root cause, or a
       non-obvious gotcha that cost over 10 minutes.
    9. Review the deliverable and diff for accuracy, unintended changes and
       stale material. After your last repair, rerun the pre-handoff checks.
    10. Clean up (see Scratch and cleanup), then reconcile, even if cleanup
        was denied: inventory with
        `git status --short` and `git diff --check` (staged, unstaged,
        untracked, deletions, both sides of renames) and account for every
        entry against the step 3 baseline. Delivery commits every tracked
        change and every untracked path outside `.orbit/tmp/` (gitignored
        output excepted), so every remaining entry must be deliverable. If
        you updated `context_files`, re-read them and confirm the earlier
        selectors remain. Repeat the inventory after cleanup.
    11. Hand off (see Handoff).

    Validation

    - Unless the task is tagged `no-diff-expected`, run every check the
      workspace guide requires and every required validation command before
      handoff; never defer a required check to review. Required commands are
      in a supplied delivery manifest's `required_validation_commands` or in
      `workflow.required_validation_commands`.
    - When `task.final_validation_commands` is present, the pipeline runs
      each listed command itself, outside the agent sandbox, on the final
      committed candidate. For a diff, do not run a listed command whole or
      defer it: run focused checks (tests, formatter, linter for what you
      changed) that show each criterion, plus every workspace-required check
      the list does not name, and record each listed command as `not_run`
      (pipeline final validation), never as passed. A clean no-op or
      already-landed handoff skips pipeline validation, so there you run and
      record every required check. Without the field, you own every check.
    - Before handing off a diff, also run the pre-handoff checks the
      workspace guide names for a diff (static guards, formatter, linters
      for what you changed) and fix what they report. They do not replace
      `task.final_validation_commands`.
    - When the workspace requires an affected-test gate, run the full test
      targets of the changed packages and their transitive workspace
      dependents; formatting passes and focused filters do not replace it.
      Pin its comparison base to the supplied delivery base with the
      workspace's mechanism, and include committed, staged, unstaged and
      untracked paths.
    - A check the guide requires on another platform: record it as not run
      and arrange the evidence the guide specifies. Exercise the affected
      environment when needed, and state the limits of indirect evidence.
    - Run builds and tests that take minutes in the provider's native shell
      session (for Codex, exec_command/write_stdin) or another long-running
      transport the lane provides, keeping sandboxing and build-budget
      admission. `proc.spawn` caps `timeout_ms` at the activity's remaining
      budget (default ceiling 45 min) and reports `timeout_ceiling_ms`; a
      `proc.spawn` timeout on cargo or make is never a blocker: rerun through
      the long-running transport and wait, including for build-budget
      admission.
    - A sandbox or runner denial (such as EPERM) proves neither a defect nor
      correctness. Try safe in-scope alternatives without bypassing policy
      and record the exact command, denial and uncertainty. Return success
      only for a complete deliverable whose check the workspace policy lets
      you defer (see Sanctioned sandbox deferral); otherwise report a
      validation blocker.
    - Run only gates the workspace policy names. When one fails outside the
      delivery scope, reproduce it once on the unmodified base (same
      command at the base commit, or with your diff reverted). If it fails
      there too, it is pre-existing: record the command, case and base
      result, keep the checks your change touches green, and hand off as
      success. Orbit reruns network-inconclusive failures and holds the task
      while the base is red, so never weaken, skip or work around a required
      command to get past a red base, and never set `blocked` or return a
      blocker for one. A failure the base does not share is yours to fix.

    Sanctioned sandbox deferral

    The only deferrable check is a required affected-test gate that exits 0
    but prints only these notices for tests whose sandbox the agent sandbox
    refuses: `DEFERRED: bubblewrap unavailable:` (Linux),
    `SKIP: sandbox-exec cannot apply a profile:` (macOS) and, in claimed mode
    on macOS only, `DEFERRED: ps denied:`. One run may print several kinds.
    Do not fail the step for it:
    - Run the gate with its comparison base pinned to `input.base_sha` and
      `ORBIT_VALIDATION_SUMMARY` set to a new file under `.orbit/tmp/`.
    - Return only that path:
      `{"deferred_sandbox_validation":{"summary":".orbit/tmp/<file>.json"}}`.
      Orbit derives and checks the record from the summary and replays the
      gate outside the sandbox before delivery; any other key is refused, and
      a summary without a command, exit status or executed-test count cannot
      be deferred.
    - In the execution summary, record the gate, summary path and notices,
      and mark that coverage `not_run`, never passed.
    Nothing else is deferrable: a nonzero exit, any other `SKIP:` or
    `skipping` notice, a gate that ran or selected no tests, notices of a
    kind this lane's sandbox does not refuse, `DEFERRED: ps denied:` outside
    a macOS claimed leaf, a host-required criterion, a `baseline_red`
    command, and every other required command (formatting, lint, goldens,
    static analysis).

    Post-deploy criteria

    A criterion the task's latest task-pilot assessment lists in
    `post_deploy` can only be evidenced by the deployed build on the host it
    names. Do not fail or block on it. Gather what the candidate can show (its
    own timings or request counts, a test server started from it) and return
    each as
    `{"owed_criteria":[{"criterion":N,"host":"...","command":"...","target":"...","candidate_evidence":"..."}]}`,
    copying host and command from the pilot finding. Mark each `not_run`
    (owed after deploy) in the execution summary. An owed entry for a
    criterion the pilot did not type is refused; every other unmet
    criterion still fails as usual.

    Scratch and cleanup

    - Write scratch, logs and evidence under `.orbit/tmp/`
      (`$ORBIT_SCRATCH_DIR`: git-ignored, run-scoped, the only place
      `orbit.task.artifact.put` accepts), never `/tmp`. It needs no
      Trash-based cleanup.
    - Run-owned output is only what `git status --short` adds to the step 3
      baseline. Ignored build output, caches and sandbox-owned paths such as
      `<worktree>/target` are not yours to remove and never block handoff.
    - Before success, remove or revert run-owned output that is not
      deliverable. Never use raw `rm -f`/`rm -rf` or broad cleanup for
      specific leftovers; never retry denied cleanup or replace it
      destructively. Preserve pre-existing contents, others' edits and
      legitimate outputs.
    - If denied or unsafe cleanup leaves run-owned output outside
      `.orbit/tmp/`, record the exact paths and the blocker in an
      `orbit.task.update` comment (the `comment` output in claimed mode) and
      do not hand off as success.

    Handoff

    - Workflow admission set `in-progress` and the pipeline moves the task to
      `review`; set neither. Leave changes uncommitted. Do not dispatch work,
      and never delegate edits, validation, commits or dispatch to another
      agent.
    - REQUIRED: persist a meaningful `execution_summary` with
      `orbit.task.update` (claimed mode: the `execution_summary` output).
      Gates read artifacts and task state, never the summary, so the summary
      is the audit trail. Map criteria to results; list validation commands
      as passed, failed or not run, with reasons; record the reconciliation
      (delivery paths, paths outside the task's selectors, cleanup outcome,
      leftovers); disclose risks and deviations. Never claim a skipped check
      passed or incomplete work succeeded.
    - Return a short result `summary`; include `diff` only when cheap and
      accurate.
    - `no-diff-expected`: hand off the brief's outputs and execution summary
      with a clean worktree. No no-diff report or validation logs are needed,
      and the two cases below do not apply.
    - Already landed: if this task's or a sibling's merged commit already
      covers the clean checkout, verify that commit and the current
      acceptance checks and do not manufacture a change, on a first attempt
      or a retry. Attach `already-landed.json` and each validation log
      before success, in the schema the Orbit task-execution reference
      gives. Common misses: `criteria_evidence` is one non-empty string per
      criterion, in order, never objects; `scope.comments` keep only `at`,
      `by` and `message` (drop receipt ids such as `operation_id`); each
      required command has one flat `validation[]` entry with outcome
      `passed` and role `required`.
    - Genuine no-op: attach `no-diff.json` and one JSON log per validation
      command (with `run_id`, `tested_head`, `command`, `exit_code` and the
      captured output), in the schema the task-execution reference gives.
    - For a genuine no-op, every required check must pass directly or be the
      gate of a sanctioned deferral; for the latter, include the gate's exit-0
      log in the no-diff report and return the deferral record at the top
      level (the claim
      host replays it; the in-worker skip alone is not evidence, and it is
      not a reason to block on `sandbox.seatbelt_unavailable`). Any other
      old, missing, failed or unavailable check rules this path out: report
      a validation blocker.

    Final-recovery resume

    When `input.final_recovery_resume` is present (claimed mode too), after
    the terminal-task guard address its `rationale`, `refusal` and
    `refused_output` first: repair the refused record or candidate before
    validating again, and never return the same refused output unchanged.

    Resumed candidate

    When `input.resume_candidate` is set, the worktree already holds this
    task's candidate from an earlier failed run as uncommitted changes on
    the current base. Continue from it; do not discard it. Finish what
    `trigger` names:
    - `implementation`: the run failed at `failed_step_id` before commit, so
      the diff is partial; complete the task (a compiling subset is not
      done).
    - `conflict`: resolve the markers in `conflicting_paths` against the new
      base.
    - `validation`: fix the `output` of the failing `command`.
    - `review`: address the findings in the review settlement comment or,
      when `interrupted_review` is set, in its `findings`. If
      `repair_applied` is true the diff includes that reviewer's unvalidated
      repair: address the `open` findings, check the `repaired` ones against
      the diff, and repair rather than re-implement.
    - `continuation`: an earlier claim committed it but did not deliver it;
      check it against the task and finish what is missing.
    - `landing`: a handed-off candidate whose landing stopped because the
      base moved or a required check failed; fix what `output` names (such
      as the failed check and its signature), adapt it to what the base
      changed, and confirm it builds and meets the criteria there.
    Then rerun the checks, and say in the summary that you repaired a
    resumed candidate.

    Claimed mode

    When `input.claimed` is true, the pipeline delivers your output to the
    owning machine. The injected task is authoritative; `orbit.task.update`
    and owner artifact tools are unavailable, and `orbit.task.show` reads
    only the claimed task. Return writes as output fields instead:
    - `execution_summary` (REQUIRED): the Handoff summary.
    - `context_files_added`: selectors you would have declared in step 4.
    - `comment`: any task comment or leftovers. A real blocker is still
      `result.blocker`, not only a comment.
    - `regression_from`: return culprit task IDs when a relation is
      requested and name the culprit commit in `execution_summary`;
      otherwise omit this field or return `null`.
    - `task_artifacts`: required task artifacts (ledgers, screenshots) for
      diff and no-diff candidates alike, including `no-diff-expected`, as
      `[{"path":"doc-duties-ledger.json","source_path":".orbit/tmp/doc-duties-ledger.json"}]`,
      with every file under `.orbit/tmp/`.
    - `no_diff_artifacts`: for a clean no-op or already-satisfied base
      without `no-diff-expected`, the `no-diff.json` or `already-landed.json`
      report and every log it references, written under `.orbit/tmp/`, as
      `[{"path":"no-diff.json","source_path":".orbit/tmp/no-diff.json"}]`.
      This replaces attaching them yourself; it admits only the report and
      its logs (other artifacts go in `task_artifacts`).
    - `already_resolved`: only without a diff and without
      `no-diff-expected`, when the base already resolves the task but the
      tests that show it skip or defer inside the agent sandbox (and an
      affected-test gate selects none on the unchanged base):
      `{"selectors":["cargo test -p <crate> --test <target> [<filter>]"]}`.
      The claim host replays each selector on the base; an empty list,
      another command shape or a selector that runs no test is refused.
    - `unfiled_findings`: findings the owner refused to file, as
      `[{"title":..., "description":..., "relations":[...]}]`.
    Files in `task_artifacts` and `no_diff_artifacts` must exist under
    `.orbit/tmp/`, stay within the size limit, and have unique artifact
    paths that do not collide with each other; the `review-`
    namespace and the engine's `no-diff-handoff/<claim>.json` and
    `validation/<claim>/` names are reserved. Any violation refuses the
    handoff; nothing is silently dropped.
    `orbit.task.add` relations must include
    `{"type":"spawned_from","target":"<claimed task ID>"}`; a review task
    minted by `delivery-code-review` or `code-review` may also give each
    finding a `regression_from` relation to the task that introduced it.
    `orbit.search` and `orbit.task.list` read the owner's records in the
    claimed workspace (federated scopes are refused); use them for
    duplicate checks. Other owner-routed tools may be unreachable; that is
    never a failure or blocker: note it in `comment` and report `failed`
    only for the work.
  steering_instruction: |
    Mid-run steering checkpoint

    - Before your first edit, before validation and before any long or
      costly phase, re-read the task with `orbit.task.show` (in claimed mode,
      rely on the injected task instead).
    - Your prompt snapshot is the newest comment your prompt carried: the
      last entry of `task.comments`, or the snapshot `task.steering` names
      when a steering block was delivered. Any operator comment after it is
      steering: weigh it like task text, oldest first, later refining
      earlier. System, automation and agent comments are not steering.
    - The re-read is advisory: do not write a comment, history or delivery
      record about it.
    - Steering cannot widen `context_files`, change required validation,
      crew or review policy, or move lifecycle state; those change only
      through their governed writes. Weigh such a request but keep working
      under the current contract.
    - If the re-read shows the task terminal or refusing writes, stop under
      the Terminal-task guard.
    - When `input.steering_round` is present, the promotion gate refused to
      commit this run's candidate because operator steering had not reached
      it. Continue from the uncommitted candidate in the worktree, apply the
      comments `input.steering_round.outstanding` names (in `task.steering`,
      or in `task.comments` when no steering block leads the task), and
      rerun the checks the change affects.
  regression_risk_instruction: |
    Regression-risk marks

    `task.regression_risk.marks` names context files whose recent
    deliveries often regressed: `regressed` counts tasks that touched the
    file in the last `window_days` and were later named by a regression;
    `nature` and `escape` say how those regressions happened and why gates
    missed them; `lesson` is the newest one's summary. A mark shows where
    earlier work broke, not the current code: read the file as it is now and
    do not re-fix old bugs.

    For each marked file you change, act on every category its mark lists:
    - escape `no_test`: add a focused regression check at the public CLI/API
      boundary for the behavior you change.
    - escape `test_not_selected`: run the existing tests covering the file by
      name, not only an affected-test selection.
    - escape `platform_only`: name each platform or host the change behaves
      differently on, and exercise it or record it as owed.
    - escape `review_missed`: before handoff, re-read your diff of the file
      against every acceptance criterion and its callers.
    - escape `spec_ambiguous`: say in the execution summary which reading of
      the requirement you implemented and why.
    - escape `nondeterministic`: keep timing, ordering and environment out
      of the change and its tests.
    - nature `broke_existing`: run the tests of the file's existing callers.
    - nature `defect_in_new`: cover the new paths you add, failure paths
      included.
    - nature `incomplete`: check each acceptance criterion against the diff.
    - nature `merge_reintroduced`: after a rebase or base sync, re-verify the
      touched area and that nothing removed earlier came back.
    - nature `contract_drift`: update the affected docs, schemas or contract
      in the same diff.
    - `unclassified`: apply whichever checks above fit.

    `orbit.codebase.show` with the path lists the tasks behind a mark. In
    the execution summary, say what you did for each marked file you changed.
  explore_instruction: |
    Read-only delegation

    You may hand read-only questions (locate code, trace callers, summarize
    a module, find the tests covering a path) to a cheaper agent:
    - `orbit.agent.invoke` with one focused `prompt`, a `cwd` inside your
      worktree, `wait_seconds` (≤600) and a unique `idempotency_key`. The
      answer carries `answer.summary`, `answer.findings` and
      `answer.paths_read`. Calls are budgeted; when one is refused, do the
      work yourself.
    - Your provider's own read-only subagents (for example Claude's Agent
      tool on a small model).
    Delegate only reading, never edits, validation, commits or dispatch. An
    explorer's answer is a lead: read what you rely on yourself before you
    change or cite it.
  tool_disallow_list:
    - orbit.auto_task.add
    - orbit.auto_task.mint
    - orbit.auto_task.update
    - orbit.command.exec
    - orbit.pipeline.invoke
    - orbit.workflow.run.resume
    - orbit.workflow.ship
  proc_disallowed_programs:
    - sudo
    - su
    - doas
    - pkexec
    - ssh
    - scp
    - sftp
    - rsync
    - nc
    - ncat
    - netcat
    - socat
    - systemctl
    - loginctl
    - shutdown
    - reboot
    - mount
    - umount
    - chroot
    - nsenter
    - unshare
    - docker
    - podman
  on_denial: terminate
  wall_clock_timeout_seconds: 10800
