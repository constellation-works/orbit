schemaVersion: 2
kind: Activity
metadata:
  name: resolve_workspace_ship_input
spec:
  type: deterministic
  description: >
    Resolve the active workspace's canonical ship input without consulting
    workflow.auto_ship or dispatching any other registered workspace. Returns
    mode, base_branch, and base_sync; omitted task_ids keeps
    task_auto_pipeline in normal backlog-discovery mode.
  input_schema_json:
    type: object
    additionalProperties: false
  output_schema_json:
    type: object
    required: [mode, base_branch, base_sync]
    additionalProperties: false
    properties:
      mode:
        type: string
        enum: [pr, local]
      base_branch:
        type: string
      base_sync:
        type: string
        enum: [remote, local]
  action: resolve_workspace_ship_input
  config: {}
