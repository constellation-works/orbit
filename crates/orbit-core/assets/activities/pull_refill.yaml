schemaVersion: 2
kind: Activity
metadata:
  name: pull_refill
spec:
  type: deterministic
  description: >
    One iteration of a follower's pull drain. Carries every earlier
    admission for the bound owner forward first — retrying an unanswered
    request, creating and binding the one local leaf per claim, launching it
    under the claim's trusted worker binding, and delivering a finished leaf's
    durable settlement to the owner. Then, while the window is open, no host
    shutdown is pending, sustained host resource pressure is not throttling
    admissions (`resource_throttle`, recorded on the drain's last pass) and the
    owner's probe admits this executor, it tops the free slots up with new
    pull requests, each persisted before it is sent. An owner refusal is
    reconciled against the owner's receipt before the request is closed. An
    unreachable or refusing owner is reported in `error` or `refusal`.
    Type-derived protocol skew immediately records a degraded pass and fails the
    drain with `protocol_skew`; its durable settlement outbox is preserved.
    Other failures: three consecutive failed passes latch `degraded`, stop new admissions
    and preserve `last_pass_error` and `consecutive_pass_failures` on the
    drain's last pass. Settlement retries continue; fix the cause and start
    a new drain. An unreadable or unwritable pass record fails visibly. `unsettled` counts admissions still
    holding a slot; the drain runs past its window until it is zero. There is
    no local fallback: a runtime without a federated owner route refuses.
    After three consecutive claims this drain admitted settle as failures, it
    stops requesting new work (`refusal: circuit_open`) and only keeps
    settling; start a new drain once the cause is fixed. With `for_seconds`
    zero the drain is authorized for one admission pass, which the first pass
    not stopped or cancelled records in run state before it requests; later
    passes, retries and resumed runs only settle, and the drain is done once
    nothing is unsettled. A stop or cancel recorded mid-pass ends it before
    the next request. Requests declare only the crews in the run input's
    `allowed_crews`, when it has one; the owner's before-PR reviewer is
    checked without that restriction.
  input_schema_json:
    type: object
    required: [destination]
    properties:
      destination:
        type: object
        required: [owner_machine_id, owner_workspace_id, selector, execution_machine_id]
        properties:
          owner_machine_id:
            type: string
          owner_workspace_id:
            type: string
          selector:
            type: string
          execution_machine_id:
            type: string
      window_expired: {}
      for_seconds: {}
      max_active_leaf_runs: {}
      poll_sleep_seconds: {}
      idle_sleep_seconds: {}
  output_schema_json:
    type: object
    required: [admitted, unsettled, done, wait, sleep_seconds]
    properties:
      admitted:
        type: integer
      unsettled:
        type: integer
      admitting:
        type: boolean
      refusal: {}
      consecutive_failures:
        type: integer
      error: {}
      last_pass_error: {}
      consecutive_pass_failures:
        type: integer
      degraded:
        type: boolean
      host_shutdown: {}
      resource_throttle: {}
      resource_telemetry_unknown:
        type: array
        items:
          type: string
      done:
        type: boolean
      wait:
        type: boolean
      sleep_seconds:
        type: integer
  action: pull_refill
  config: {}
