schemaVersion: 2
kind: Activity
metadata:
  name: apply_task_pilot_results
spec:
  type: deterministic
  description: >
    Task-isolated, fail-closed task-pilot apply boundary. It validates each
    partition envelope, then each task's exact before snapshot, disposition, in-workspace
    file/dir/symbol selectors, and target existence against the prepared source
    revision when one was pinned. Harmless bare relative file and directory
    targets are normalized from that pinned tree with the original and normalized
    values retained. Stale or malformed tasks are reported without writes while
    independently valid siblings still apply. Each accepted task mutation and
    idempotency receipt commits atomically. Every other task
    field, lifecycle state, dispatch state, and recommendation remains unchanged
    unless explicit promotion authority arrives with one authority record:
    a CI sweep's exact filing record (`ci_sweep_filing`) or an
    `--approve-proposed` drain's `drain_promotion` record. Both modes share
    one finding check: a duplicate, already-landed, conflict, or warning
    finding keeps the task proposed and is classified in the output. Under
    CI-sweep authority only a proposed, selector-backed task advances, inside
    the atomic pilot write (`ci_sweep_admission`). A `drain_promotion` record
    is verified first: it must name a live `workspace_auto_pipeline` run
    started with `approve_proposed` that dispatched this pilot run. Under it
    a proposed task qualifies by its `no-diff-expected` tag, or by non-empty
    selectors and an assessed complexity, and is approved through the
    ordinary approve transition with a note naming the drain run
    (`drain_approval`); a held task's pilot history entry records the hold
    classification so the drain does not pilot it again until it changes.
  input_schema_json:
    type: object
    # No `crew`: this apply step is deterministic and runs no agent, so it has
    # no crew to record. The pilots that fed it name `system` on their own step.
    required: [prepared, results, workspace_path]
    properties:
      prepared:
        type: object
      results:
        type: array
        items:
          type: object
      workspace_path:
        type: string
      promotion_authorized:
        type: boolean
      ci_sweep_filing:
        oneOf:
          - type: object
          - type: "null"
      drain_promotion:
        oneOf:
          - type: object
          - type: "null"
      prior_applied_count:
        type: number
      carried_task_outcomes:
        type: array
        items:
          type: object
  output_schema_json:
    type: object
    required:
      [status, error, mode, workspace_path, source, discovery,
       partition_decisions, partition_count, received_partition_count,
       failed_partitions, skipped_stale_partitions, task_outcomes, applied_count,
       unresolved_count, repair_count, repair_partitions, repair_prepared,
       non_repairable_outcomes, tasks, ci_sweep_admission, drain_approval]
    properties:
      status:
        type: string
        enum: [succeeded, failed]
      error:
        oneOf:
          - type: string
          - type: "null"
      mode:
        type: string
        enum: [automatic, explicit]
      workspace_path:
        type: string
      source:
        oneOf:
          - type: object
          - type: "null"
      discovery:
        type: object
      partition_decisions:
        type: array
        items:
          type: object
      partition_count:
        type: number
      received_partition_count:
        type: number
      failed_partitions:
        type: array
        items:
          type: object
      skipped_stale_partitions:
        type: array
        items:
          type: object
      task_outcomes:
        type: array
        items:
          type: object
      applied_count:
        type: number
      unresolved_count:
        type: number
      repair_count:
        type: number
      repair_partitions:
        type: array
        items:
          type: object
      repair_prepared:
        type: object
      non_repairable_outcomes:
        type: array
        items:
          type: object
      tasks:
        type: array
        items:
          type: object
      ci_sweep_admission:
        type: array
        items:
          type: object
      drain_approval:
        type: array
        items:
          type: object
  action: apply_task_pilot_results
  config: {}
