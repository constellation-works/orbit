schemaVersion: 2
kind: Activity
metadata:
  name: pr_open
spec:
  type: deterministic
  description: >
    Discover an existing pull request for a prepared branch or create it once.
    Commit, base synchronization, push, and task promotion are separate job
    checkpoints.
  input_schema_json:
    type: object
    properties:
      job_run_id:
        type: string
      task_id:
        type: string
      task_ids:
        type: array
        items:
          type: string
      completed_task_ids:
        type: array
        items:
          type: string
      base:
        type: string
      base_ref:
        type: string
      base_sha:
        type: string
      base_sync:
        type: string
        enum: [remote, local]
      landing_branch:
        type: string
        description: >
          The branch this work must ultimately land on. When it differs from
          `base`, the base is a stacked intermediate branch and pr_open refuses
          delivery once that branch has itself landed. Leave empty
          for ordinary delivery, where the base is the landing branch.
      base_obsolescence:
        type: string
        enum: [enforce, ignore]
      head:
        type: string
      workspace_path:
        type: string
      title:
        type: string
      body:
        type: string
      review_fixes:
        type: string
        description: >
          The before-PR review settlement's PR body sections: "Review
          fixes" when the reviewer committed fixes, "Review validation" for
          raw checks, and "Review validation limits" when an out-of-scope
          diagnostic failed. It is appended to the PR body, generated or
          supplied; empty adds nothing.
      candidate_resume:
        type: [object, "null"]
        description: >
          A claimed leaf's `candidate_resume` output. When its
          `prior_pull_request` (the pull request an earlier claim opened for
          the resumed candidate) is not the one this run opened or reused,
          the earlier one is closed with a comment naming it, provided it is
          still open and its head is the output's `source_branch`; a failed
          close is reported in `superseded_pull_request`, not a step failure.
      # A claimed leaf's implement-step output. Under the claim's worker
      # binding the delivery gate judges its summary, not the owner's
      # stored one; any other run ignores it.
      implementation:
        type: [object, "null"]
  output_schema_json:
    type: object
    required: [phase, decision, pr_created, pr_reused, pr_number, base, head]
    properties:
      phase:
        type: string
      decision:
        type: string
      pr_created:
        type: boolean
      pr_reused:
        type: boolean
      pr_number:
        type: string
      pr_url:
        type: [string, "null"]
      superseded_pull_request:
        type: [object, "null"]
        description: >
          What happened to the resumed candidate's `prior_pull_request` when this run published
          through another pull request: its `number`, a `decision`
          (`closed`, `not_open`, `other_branch` or `close_failed`) and a
          `detail`. Null when there was none or this run reused it.
  action: pr_open
  config: {}
