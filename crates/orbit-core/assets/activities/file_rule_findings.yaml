schemaVersion: 2
kind: Activity
metadata:
  name: file_rule_findings
spec:
  type: deterministic
  description: >
    Keep one open task per producer-declared defect group or unannotated rule-result fingerprint from a results document in the
    ux-rules.json schema, written by any workspace script. A new failing
    fingerprint files one proposed bug task carrying the fingerprint in its
    rule_fingerprint field, the measurements, the evidence (validated and attached from declared script
    outputs or a workspace-confined evidence directory) and a reproduce command naming the
    rule and target. An open owner is commented only when its measurements
    changed; a fingerprint that passes again gets exactly one comment and no
    status change. Rule errors file one task per rule, tagged
    ux-rules-error. New tasks per run are capped at ux_rules.max_new_tasks,
    highest severity first; results below ux_rules.file_at and for disabled
    rules are recorded in the output only. The filer is surface-agnostic: it
    reads rule ids, targets, statuses, severities, measurements, evidence
    and fingerprints, and nothing specific to any UI or CLI. Optional defect {version, key} declarations group observations before the cap. Every known member must appear and pass for a repair comment; a missing, skipped or errored member earns none. All member evidence is retained on new and existing open owners. Matching open legacy owners bind deterministically and other open matches are listed as legacy_duplicates; matching terminal tasks are listed read-only as historical_references and never own, reopen or suppress a finding. Workspace-scoped serialization makes repeat and concurrent filing idempotent. Declared raw observation archives are checked against the producer's outputs and summarized, never inflated.
  input_schema_json:
    type: object
    properties:
      results:
        type: object
        description: >
          One rule-results document ({schema_version, surface, commit,
          results: [{rule, target, status, severity, measurements,
          evidence, fingerprint, original_fingerprint?, defect?: {version, key}}],
          summary?: {observations, ...}, archives?: [{surface, encoding,
          observation_count, uncompressed_bytes, uncompressed_sha256,
          gzip_sha256, parts: [{name, bytes, sha256}]}]}). Give this or results_file.
      results_file:
        type: string
        description: Path of a rule-results file, resolved under the workspace root when relative. Evidence paths resolve beside it.
      evidence_step:
        type: string
        description: Unique direct preceding script step whose persisted output set supplies evidence. Requires a host-attested consumer run; loop and parallel producers are refused.
      evidence_files:
        type: array
        description: Bind steps.<producer>.files exactly. Descriptors are checked against the producer checkpoint, stored record, workspace, run lineage and file digests; paths alone grant no read authority.
      evidence_dir:
        type: string
        description: Workspace-confined directory for standalone inline results. Missing, escaped, symlinked or oversized evidence refuses filing before task mutations. Ignored with evidence_step.
      max_new_tasks:
        type: [number, 'null']
        minimum: 1
        maximum: 50
        description: Optional run override for ux_rules.max_new_tasks.
      file_at:
        type: string
        enum: [critical, high, medium, low, nit]
        description: Optional run override for ux_rules.file_at.
      runner:
        type: string
        description: Optional run override for ux_rules.runner, used in filed tasks' reproduce commands.
      disabled:
        type: array
        items:
          type: string
        description: Rule ids to record only, in addition to ux_rules.disabled.
  output_schema_json:
    type: object
    required: [outcome, counts, filed_count, filed, commented, skipped_existing, skipped_over_cap, recorded_only, max_new_tasks, file_at]
    properties:
      outcome:
        type: string
      counts:
        type: object
        description: Reported result counts by status (pass, fail, error, skipped).
      observation_count:
        type: number
        description: Raw producer observations (the document's summary.observations, else the reported results).
      reported_count:
        type: number
        description: Results in the filing report, before grouping.
      defect_group_count:
        type: number
        description: Distinct producer-declared defect groups in this report.
      legacy_duplicates:
        type: array
        description: Matching open legacy tasks retained for operator disposition.
      historical_references:
        type: array
        description: Matching terminal tasks, listed read-only; never owners.
      archives:
        type: array
        description: Each raw observation archive's summary, part names and whether the producer's outputs verified it.
      filed_count:
        type: number
      filed:
        type: array
      commented:
        type: array
      skipped_existing:
        type: array
      skipped_over_cap:
        type: array
      recorded_only:
        type: array
      max_new_tasks:
        type: number
      file_at:
        type: string
  action: file_rule_findings
  config: {}
