schemaVersion: 2
kind: Activity
metadata:
  name: prepare_blocked_task_recovery
spec:
  type: deterministic
  description: >
    Re-checks one blocked task before the final-recovery backstop spends an
    agent on it. The task must still be blocked in the same block episode, at
    the exact status and update time the trigger observed, with no final
    recovery decision for that episode. Otherwise it returns proceed=false and
    the run ends without a decision. When the episode is current it gathers
    the failed run's step and error, and opens a detached checkout of the
    workspace base branch for the agent to inspect. It never fetches, and
    never writes the task.
  input_schema_json:
    type: object
    required: [task_id, episode_key, block_source, observed_status, observed_updated_at]
    properties:
      task_id:
        type: string
        minLength: 1
      episode_key:
        type: string
        minLength: 1
      block_source:
        type: string
        enum: [run_failed, run_interrupted, gate_failed, claim_failed]
      failed_run_id:
        type: string
      observed_status:
        type: string
      observed_updated_at:
        type: string
  output_schema_json:
    type: object
    required: [proceed, episode]
    properties:
      proceed:
        type: boolean
      reason:
        type: string
      # The run input, echoed for the apply step.
      episode:
        type: object
      # The final_recovery activity's input, present when proceed is true.
      recovery:
        type: object
  action: prepare_blocked_task_recovery
  config: {}
