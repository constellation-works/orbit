schemaVersion: 2
kind: Activity
metadata:
  name: pr_failure_handoff
spec:
  type: deterministic
  description: >
    Terminal task-PR recovery hook. Before publication it commits any dirty
    candidate, restores and pushes the pre-rebase branch, and opens or reuses a
    blocked PR after bounded conflict recovery is exhausted. After publication
    it preserves the existing PR and review state with truthful merge
    diagnostics for a safe completion retry. A `validation_environment`
    failure (required validation lacked a tool) blocks the task and keeps the
    unjudged candidate for `orbit job resume`, opening no PR and pushing
    nothing. Every preserved candidate records the task's spec digest, so the
    task's next run can resume it (`candidate_resume`).
  input_schema_json:
    type: object
    additionalProperties: false
    required:
      - failed_step_id
      - activity_name
      - error_code
      - error_message
      - job_input
      - pipeline
      - run_id
    properties:
      failed_step_id:
        type: string
      activity_name:
        type: string
      error_code:
        type: string
      error_message:
        type: string
      job_input:
        type: object
      pipeline:
        type: object
      run_id:
        type: string
  output_schema_json:
    type: object
    required:
      - phase
      - decision
    properties:
      phase:
        type: string
      decision:
        type: string
      task_id:
        type: string
      handoff_run_id:
        type: string
      checkpoint_owner:
        type: string
      preservation_commit_created:
        type: boolean
      branch:
        type: string
      head_sha:
        type: string
      original_base_sha:
        type: string
      target_base_sha:
        type: string
      conflicting_paths:
        type: array
        items:
          type: string
      committed_files:
        type: array
        items:
          type: string
      pr_number:
        type: string
      pr_url:
        type:
          - string
          - "null"
      candidate_preserved:
        type: boolean
      task_status:
        type: string
      task_spec_digest:
        type: string
        description: >
          Digest of the task's description and acceptance criteria
          at handoff. `candidate_resume` resumes the preserved candidate on a
          later run only while the task still matches it.
  action: pr_failure_handoff
