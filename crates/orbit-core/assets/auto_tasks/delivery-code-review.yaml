schemaVersion: 1
name: delivery-code-review
description: Review a frozen delivery batch using typed artifact evidence
enabled: false
schedule:
  deliveries_landed:
    branch: __ORBIT_BASE_BRANCH__
    threshold: 3
    max_wait_minutes: 360
    coverage: landed_code_review_v1
    max_items: 20
    retries: 1
template:
  title: Review a frozen delivery batch
  description: |-
    Review the entire captured code range for correctness, concurrency, error handling and repository standards. Verify findings against the pinned source, search for duplicates and file confirmed findings with precise evidence.
    Use only the frozen automation input appended to this task. Examine every
    captured commit, including unattributed neighbors. Findings may remain open.
    Attribute every finding to the task that introduced it: locate the commit
    that made the code wrong, then read its task from the frozen input — each
    `deliveries[]` entry lists its `commits` and the `task_ids` that landed them.
    File each confirmed finding with
    `orbit tool run orbit.task.add --input '{"title":"<title>","description":"<markdown>","acceptance_criteria":["<observable outcome>"],"complexity":"medium","tags":["delivery-code-review"],"context_files":["file:<evidence source path>","file:<matching test path>"],"priority":"<low|medium|high|critical>","type":"bug","relations":[{"type":"spawned_from","target":"<this task ID>"},{"type":"regression_from","target":"<culprit task ID>","regression":{"nature":"<nature>","escape":"<escape>"}}],"workspace":"<current workspace path>","model":"<agent-family>"}'`.
    A defect in an unattributed neighbor commit, or one that predates the batch
    and was merely exposed by it, is filed without the `regression_from` relation
    and says so — never blame a bystander delivery. Name the culprit task and
    commit in the finding's description and in the evidence finding text.
    Classify every `regression_from` relation you file by adding
    `"regression":{"nature":"<nature>","escape":"<escape>"}` to it.
    Choose `unclassified` rather than guess. `nature` is what kind of regression
    the link records:
    - `broke_existing`: the culprit broke behavior that worked before it landed.
    - `defect_in_new`: the defect is in code the culprit itself introduced.
    - `incomplete`: the culprit shipped without part of what its task required.
    - `merge_reintroduced`: a merge restored code or assets an earlier change had removed.
    - `contract_drift`: docs, schemas or a contract drifted from the behavior the culprit shipped.
    - `unclassified`: the evidence does not settle the nature.
    `escape` is why the delivery gates missed it:
    - `no_test`: no test covered the broken behavior.
    - `test_not_selected`: a covering test existed but the delivery's gates did not run it.
    - `platform_only`: it shows only on a platform or host the gates did not exercise.
    - `review_missed`: it was visible in the diff and review did not flag it.
    - `spec_ambiguous`: the task or spec left the expected behavior open to the shipped reading.
    - `nondeterministic`: it depends on timing, ordering or environment and passed when gated.
    - `unclassified`: the evidence does not settle the escape.
    Derive canonical `file:` selectors from every evidenced source path, removing
    the line suffix, and add the matching regression-test location. Use existing
    paths where possible; for a test file that must be created, set
    `allow_missing_context: true` and identify that intended path. Never file a
    finding without context selectors.
    Search for duplicates with `orbit.search` (`"kind":"task"`) before filing.
    A claimed run reaches the owner's search and task list through its run's
    coordinator, scoped to the claimed workspace. Record the duplicate-check
    evidence. A finding the owner still refuses goes in the step output's
    `unfiled_findings`, which the handoff attaches to this task.
    Complete the supplied evidence template, replace action_id with this task ID,
    write it to `.orbit/tmp/automation-coverage.json`, and attach it in this
    task's assigned executor run with
    `orbit tool run orbit.task.artifact.put --input '{"id":"<this task ID>","source_path":".orbit/tmp/automation-coverage.json","path":"automation-coverage.json","model":"<agent-family>"}'`.
    `orbit tool show <tool.name>` prints the tool's schema.
    Fill one `delivery_examinations` entry per frozen delivery: `examined_paths`
    lists the changed paths you read and `skipped_paths` the ones you did not,
    each with a `reason`; together they must be exactly what
    `git diff --name-only --no-renames <before.commit> <after.commit>` lists for
    that delivery. Set `verdict` to `"clean"` or `{"findings": ["<finding task ID>"]}`
    and write a `rationale` of at least 40 characters, specific to that delivery,
    saying why the verdict holds. Settlement refuses evidence whose paths do not
    match the frozen diff.
    Supply actual checks (subject, method,
    observation); set examination_complete only after all obligations are examined.
    Persist an execution summary of what you examined with `orbit.task.update`:
    a review whose agent records none leaves its batch owed, even with valid
    evidence. Task status and successful process exit do not certify coverage.
  acceptance_criteria:
  - Every captured obligation is examined at the exact supplied revisions.
  - Every frozen delivery has an examination whose examined and skipped paths are exactly its changed paths, with a verdict and a delivery-specific rationale.
  - Concrete checks and findings are attached as valid automation-coverage.json evidence.
  - An execution summary of the examination is persisted.
  - Every filed finding carries a `regression_from` relation targeting the delivery task whose commit introduced the defect, classified with a `regression` nature and escape (`unclassified` when the evidence does not settle one), or states why no captured delivery can be held responsible.
  - Missing or skipped examination remains explicitly incomplete.
  task_type: chore
  tags:
  - delivery-code-review
  - no-diff-expected
  required_tools:
  - orbit.task.add
  - orbit.task.artifact.put
  priority: medium
  complexity: hard
  status: backlog
dedupe: skip_if_open
created_by: system
created_at: 2026-09-06T00:00:00Z
updated_by: system
updated_at: 2026-09-06T00:00:00Z
