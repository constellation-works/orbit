schemaVersion: 1
name: host-health
description: Weekly doctor, service-log, Orbit version and migration findings with owner dedupe, human routing and executable resolution steps
enabled: true
schedule:
  cron: 10 7 * * 1
template:
  title: Track doctor warnings, Orbit updates and migrations, and recurring host service errors
  description: |-
    Read host health without repairing the host. Turn standing doctor findings and recurring
    service errors into actionable, deduplicated tasks. Attach host-health-report.json and
    host-health-cursor.json on every completed pass, including empty and capped passes.

    ## Authority and hosts

    - The shipped pass is the owner aggregator and covers the owner host only.
      Confirm machine identity and checkout role with `orbit config get machine.id`
      and `orbit workspace show --json`. Preparation must record required_machine
      naming the workspace owner before admission. On the wrong machine, record
      wrong_host and stop without filing or advancing a cursor.
    - required_machine accepts only this owner. Preparation refuses an entry that
      names any other machine. An OS tag, a machine ID written only in these
      instructions, and a collector-only role do not pin execution to that machine.
      Do not ask preparation to set required_machine to a follower, and do not
      put that requirement in utility_warnings as a route: a warning routes nothing.
    - Automatically pinned follower collectors are unavailable. Do not add a
      collector definition, and do not expect the owner scheduler to mint a task
      that a pull follower then executes. Naming a follower in the instructions
      is not a route. Doctor is host-local: never run it against a remote
      workspace selector.
    - Every host other than the owner is missing coverage. Report that gap in
      the summary and in the owner's host entry. Do not treat it as healthy, as
      zero findings, or as drift. Do not list host-health-collector tasks, import
      their artifacts, or file from a follower report this pass cannot obtain.
      Followers never file through this pass.
    - Collection is read-only: no doctor repair flags, service restarts, config writes,
      credential reads, installs, dispatch, or status changes. No `orbit migrate --confirm`,
      no `orbit migrate --adopt-authority`, and no acting on `orbit update --preflight`.
      Do not read Orbit databases or state files directly, except the log inputs named
      below and the local-candidate manifests named in the version section. This pass may
      only create finding tasks, comment counts on covering open tasks, and update its own
      summary/artifacts. Read the installed orbit skill's task-authoring reference and
      each tool's schema before filing.

    ## Inputs and service configuration

    - Run `orbit doctor --json` on the execution host, capture its exit status and parse all
      warning/error checks (check, status, message, remediation) even when doctor exits
      nonzero. An execution or parse failure is unavailable coverage, not a clean bill of health.
      Version, update and migration checks are the next section; a version string alone is not that check.
    - Unit names come from the host's installed service configuration, never a baked-in list.
      On Linux enumerate `systemctl --user list-unit-files --type=service --no-legend --no-pager`
      plus loaded services, then inspect only selected properties (Id, FragmentPath, DropInPaths,
      ExecStart, WorkingDirectory, StandardOutput and StandardError) with systemctl show.
      Select Orbit web, run/drain and sweep/clock launchers by executable/subcommand and
      workspace association; include host-wide Orbit services. Do not dump Environment,
      EnvironmentFiles, full units or process environments: launch arguments may also contain
      secrets, so keep only names/paths needed to establish the association.
    - On macOS inspect only Label, Program/ProgramArguments, WorkingDirectory, StandardOutPath
      and StandardErrorPath from installed user LaunchAgents plists; never dump a whole plist
      or its EnvironmentVariables. Labels and output paths are host configuration. Read the
      selected output files since the cursor, or use the platform's bounded log query when
      they log there. Other platforms use their configured service manager's equivalent;
      unsupported or denied access is recorded as a coverage gap. Do not guess service names.
    - Linux logs: `journalctl --user -u <discovered-unit> --since <window-start> --until
      <window-end> --output=json --no-pager`, retaining warning/error priority or explicit
      WARN/ERROR application records. Filter before displaying anything. Also inspect Orbit's
      existing workspace .orbit/state/logs/, the global ~/.orbit/state/logs/orbit.jsonl
      and its rotated archives, and service-configured log paths when present.
      Use file identity plus byte offset and event timestamp for files, and journal cursor
      for journal entries; record rotation/truncation gaps. Deduplicate the same event mirrored
      into a service file and journal rather than counting both as recurrence.
    - Never print the contents of ~/.zprofile, ~/.orbit/clock.env or credential files.
      Never source those files, inspect secret environment values or attach raw doctor/log
      output. Bound collection to 10000 records or 8 MiB per host per pass, whichever comes
      first; stream rather than buffering unbounded logs. A limit produces a partial report
      with the last consumed source position, not a failed pass or a claim of full coverage.

    ## Orbit version and migrations

    Run this on the owner, the only host this pass executes on, before filing. It stays read-only:
    no `orbit update` except `--check` and `--preflight`, no install, no
    `orbit migrate --confirm`, no `orbit migrate --adopt-authority`, no
    `orbit doctor --fix-retired-config-keys`, and no fetch, pull or checkout.
    Record every result below even when a command exits nonzero. A command that
    fails before it prints JSON is unavailable coverage for that check, not a
    clean result and not a guessed finding. Two nonzero exits are the record
    itself, not unavailable coverage: `orbit update --preflight` names what
    would block, and `orbit migrate --dry-run` lists pending migrations on
    stderr without the status JSON.

    - Version. Record `orbit --version`. Record the installed executable from
      `orbit update --check --json`: `executable`, `current_version`,
      `target_version`, `outcome`, `install_channel`, `updatable` and
      `remediation`, plus the process exit code. Exit 3 with `outcome`
      `update_available` means a newer published release. Exit 0 with
      `already_current` means no newer release. SHA-256 the `executable` path
      (`sha256sum` on Linux, `shasum -a 256` on macOS) and read that file only.
      Where Orbit recorded a `--local-candidate` install, the manifest is a
      regular `.json` file inside a directory directly under the global Orbit
      root's `deployments/` (`global_root` from `orbit update --preflight
      --json`). Read only those regular files. Do not follow symlinks and do
      not open anything else. Keep a file whose `kind` is
      `orbit-local-candidate`, whose `schema_version` is 1, and whose
      `executable_sha256` equals that digest. Record that manifest's
      `source_commit` and path. Disagreeing commits are a recorded
      disagreement, not a commit you pick. No match means no recorded source
      commit.
    - Source lag. When a source checkout of Orbit is already on the host and a
      source commit was recorded, count how many commits that commit trails the
      workspace integration branch: `git -C <checkout> rev-list --count
      <source_commit>..origin/<base_branch>`. `<base_branch>` is `base_branch`
      from `orbit workspace show --json` for that checkout, not a fixed name.
      Use the origin ref already present. Do not fetch. A missing ref or commit
      is a coverage gap with a null count. A count above zero is a lagging
      source commit even when no newer release is published.
    - Update readiness. Record `orbit update --preflight --json` with no
      `--candidate`. Exit 0 and `admitted` true means this observation saw no
      blocking process. `handover` is not a blocker, and `reservation` false
      means nothing was held. A nonzero exit names the processes or authority
      that would block. Record them. Do not stop, kill or update anything.
    - Pending migrations. For each workspace `orbit workspace list --all --json`
      returns, record `orbit migrate --dry-run --json --workspace <id>` using
      that record's `id`: stdout, stderr and the exit code. Exit 0 prints JSON
      with `layout.pending`, `schema.pending`, `up_to_date` and
      `forward_compatible`. A nonzero exit prints no status JSON. Its stderr
      lists `Pending migrations:` with `layout vN` and `schema vN` lines and
      the remediation (`orbit migrate --confirm` when that is what it prints).
      Copy those lines into `pending_layout` and `pending_schema`, set
      `up_to_date` false, and quote the remediation. A workspace newer than
      this binary (`forward_compatible` on exit 0, or stderr that says to
      upgrade orbit) is recorded on that entry and follows the update route,
      not `--confirm`. Dry-run does not apply and does not adopt authority.
    - Authority. A generation-authority problem is an `upgrade admission refused`
      or `recorded no generation authority` message from this pass's doctor run
      or from that dry-run's stderr. Record the message and the remedy it
      prints, including `orbit migrate --adopt-authority` when it names that
      command. Do not run the remedy, and do not read authority files. Silence
      is not an authority gap: dry-run lists pending migrations and does not
      itself decide authority.
    - Retired config. Copy doctor checks whose `check` is `retired-config-keys`
      and whose status is warning or error into this section's record (check,
      status, message, remediation). That is the retired-key repair territory.
      Report the checks. Do not fix them.
    - A pending migration, a recorded authority gap, an available update and a
      lagging source commit are standing conditions, eligible on first sight,
      like a doctor warning. They share the filing cap. File doctor errors
      first, then pending migrations and authority gaps, then available
      updates and source lag, then doctor warnings, then eligible logs.
      A `retired-config-keys` row is recorded here and filed
      only as that doctor check, not as a second task.

    Cross-host drift is not established by this pass. Automatically pinned
    follower collectors are unavailable, so no follower version, source commit
    or executable digest is imported. Each host other than the owner is missing
    coverage, not a drift finding and not healthy.

    ## Windows, signatures and recurrence

    - Find the newest completed pass of the same role and machine using orbit.task.list,
      including artifact-complete review tasks if delivery has not closed them yet. Read its
      report/cursor through orbit.task.artifact action get only after orbit.task.show lists them.
      Record scan_start in UTC before collecting; first pass uses the preceding 7 days.
      Missing/corrupt prior artifacts mean a reported baseline reset, not invented history.
    - A fresh window ends at scan_start. A partial resume keeps its original window_start and
      window_end and drains pending groups/source positions before opening a later window.
      Doctor is a current snapshot: retain an eligible doctor's pending finding on resume,
      but check it still exists before filing. Do not count a resumed snapshot as a new pass.
    - Normalize warnings/errors into a stable signature: source kind, doctor check ID or
      service role, leading error code/kind and action/tool. Replace task/run/request IDs,
      UUIDs, SHAs, timestamps, home-directory paths and ports with typed placeholders; strip
      volatile counts. Keep distinct error codes/checks/actions separate. Store machine ID
      separately, so the same code defect can group across hosts without losing attribution.
      An update or source-lag signature keeps its target version or commit
      literal, so a resolved older target is not the same finding. Every other SHA
      still becomes a placeholder.
    - A doctor warning/error is a standing condition: eligible on first sight. A log signature
      is eligible only with at least 3 distinct events across at least 2 non-overlapping
      completed collection windows within 14 days, on the same host. Carry the 14-day per-window
      counts in the cursor; never use cross-host counts or repeated resumes to meet
      the threshold. Below-threshold groups are counted, not filed. Report the threshold.

    ## Dedupe and routing

    - Before every filing search open tasks, tasks closed in the last 30 days (including
      done, archived and rejected), and open frictions. Use orbit.search with all:true and
      corpus-qualified statuses (task:done, task:rejected, friction:open), one distinctive
      signature token per query; inspect plausible hits with the record tools. Also retain
      prior rejected mappings in the cursor so an older rejection is not refiled.
    - A covering open task gets at most one comment per pass with signature, host counts,
      new events and first/last seen. A covering open friction is recorded as covered without
      a duplicate task. A rejected match is recorded and never refiled. A recently closed
      match is inspected for the resolution: old evidence stays covered; a verified new
      occurrence after that resolution may be a new regression task if no open task covers
      it. Do not infer a deployed fix from a version or timestamp alone.
    - Orbit code or config-default defects become type bug tasks for agent crews. Verify the
      mechanism in the source checkout at git rev-parse HEAD: name file/function and quote
      the few relevant lines. No mechanism means unconfirmed, retained for investigation,
      never a guessed code bug. Use non-empty verified context_files for paths the fix changes.
      Example shape (replace placeholders with verified evidence, including the full body):
      `orbit tool run orbit.task.add --input '{"title":"Fix <signature>","description":"<evidence, verified mechanism and Resolve section>","type":"bug","complexity":"medium","tags":["host-health","no-auto-approve"],"context_files":["symbol:<verified-path>#<function>:function"],"relations":[{"type":"spawned_from","target":"<this-task-id>"}],"model":"<agent-family>"}'`
    - Host, credential, service-unit, OS and operator-only conditions become type chore tasks
      assigned explicitly to a configured crew whose kind is human. Inspect crew kinds through
      orbit config; choose the sole human crew or the one matching the affected operator.
      If several are ambiguous, use the fallback rather than guessing an agent crew. A human
      chore body follows the shared human-task format in the installed orbit skill's
      task-authoring reference: a 1-2 line what and why, numbered steps, each command in its
      own fenced shell block, and a closing Verify line with one fenced command, under 2000
      characters. Keep the evidence table in the report artifact, not the body. orbit.task.add
      warns on a human-crew body that misses this; fix it before moving on.
    - An available update (`outcome` `update_available`, or `updatable` false with
      a newer `target_version`) and a lagging source commit are operator chores
      for the human crew, as other host conditions are. The signature is
      `update:<install_channel>:<target version or commit>` and keeps that target
      literal. One open task per signature: a resolved older target does not cover
      a newer one. Resolve steps name one command for the recorded
      `install_channel`, each in its own fenced shell block, and this pass does
      not run it. `managed` uses `orbit update`. A recorded local-candidate source
      commit uses the `--local-candidate` flow: `--write-candidate-manifest` for
      the build, then that candidate with `--candidate-manifest`, `--source-commit`
      and `--install-target` set to the installed executable. `homebrew`, `npm`
      and `cargo` use the `remediation` string from the check, unchanged.
      `local-build` says to update that checkout and rebuild. When `remediation`
      is missing, quote the check and name the recorded channel; do not invent a
      package-manager command.
    - A pending migration or an authority gap is a human chore. Its signature is
      `migrate:<workspace>:<pending layout and schema versions>` or
      `authority:<workspace>:<recorded authority or none>`. Resolve steps say to
      stop Orbit processes that use that workspace first, then quote the
      remediation the dry-run or the refusal printed (`orbit migrate --confirm`,
      or `orbit migrate --adopt-authority <path>` when that is the printed
      remedy). This pass does not run them.
    - Do not file a cross-host drift chore. Follower version, source commit and
      install channel are not available through preparation, so a missing
      follower is missing coverage. Do not guess a follower's channel or version.
    - A defect in `orbit update` or `orbit migrate` (JSON that contradicts the
      text, or a refusal that prints no remediation) is a bug task with the
      verified mechanism, as for any other code defect. A network failure, a
      missing checkout and a preflight that names a blocking process are not
      that defect.
    - With no matching human crew, file a setup chore tagged host-health, setup,
      needs-operator and no-auto-approve. orbit.task.add leaves it proposed: verify that on
      read-back, never approve, promote, dispatch or present it as agent-ready. State that an
      operator must assign a human crew before promotion; tags alone are not an admission
      guard. Absence of a human crew never authorizes an agent repair task.
    - Every new task has a spawned_from relation to this pass, assessed complexity, reachable
      acceptance criteria and verified selectors for files to change. Host-only work has no
      invented repository selectors; name its host configuration target in the body instead.
      Read each filing back and confirm its route, relation and redacted description.

    ## Resolve contract for every filing

    Every filed task, including an agent bug, MUST contain a literal `## Resolve` section. For a
    human chore that section is the short format above: numbered steps, fenced commands, then
    `Verify:` and one fenced command. Keep words plain and few. The rules below apply to all:

    - Exact runnable commands in fenced shell blocks, or a resolve.sh task artifact with
      invocation instructions. A state-changing script must support --dry-run and explain
      its expected changes; commands are instructions for the assignee, never executed by
      this collection pass. Where no command exists, provide numbered concrete UI/operator
      steps with the exact target and expected result. No vague "fix the environment" steps.
    - Name the host (stable machine ID and display name) and shell for EACH block, for example
      bash -lc on Linux or zsh -lc on macOS. Resolve placeholders before filing; quote real
      paths/unit names safely. Refer to secret variables/files by name, never their values.
      Source file names may be given for editing, but never print their secret contents.
    - Include a verification command on that host and in that shell showing the warning gone:
      orbit doctor --json filtered to the actual check ID, or a bounded journal/file query
      for the signature over a fresh window. Give the expected output and exit status, plus
      a symptom-specific check when a clean doctor alone cannot prove the fix.
    - For resolve.sh, attach the script to the NEW task with orbit.task.artifact action put and
      confirm the attachment before marking it filed; otherwise provide full inline commands.
      A code bug may give exact reproduction/build commands and numbered source repair steps
      when the implementation is still to be written; never invent a patch or unsafe command.

    ## Safe evidence

    Build a signature-grouped evidence table: source/check or service role, signature, host,
    current and 14-day counts, distinct windows, first/last seen, route and disposition.
    Excerpts are optional and bounded to 3 lines / 600 characters per signature. Replace
    tokens, passwords, authorization headers, cookies, email addresses and home paths first.
    Send excerpts only through Orbit's existing redaction on orbit.task.add or orbit.task.update
    text. Read the stored text back (including when redactions_applied is true) and copy only
    that redacted excerpt into reports. Artifact upload itself is not a redaction API.
    For report-only excerpts use a comment on this pass and read it back. If that round trip
    is unavailable, omit excerpts with a reason; report only
    allowlisted check/error identifiers, counts and dispositions, with sensitive free text
    omitted. Never persist raw logs in artifacts, scratch evidence, summaries or commands.

    ## Bounded completion, report and cursor

    - File at most 5 new tasks per pass, prioritizing doctor errors, then pending
      migrations and authority gaps, then available updates and source lag, then
      doctor warnings, then eligible recurring logs by count, with signature
      as tie-breaker. Cover every group
      with filed, commented, covered, rejected, counted, unconfirmed or deferred disposition.
      There is no collector pass and no collector filing cap. A cap is successful
      partial completion, never a blocker.
    - Freeze the pending eligible groups with their sanitized evidence and stable ordering.
      Store them in the cursor with resume_after and the original window bounds. Carry all
      unfiled groups forward, not only their keys. A resume rechecks dedupe before filing and
      never increments occurrence counts for the frozen window. Source read limits also keep
      the last read position; advance a source's high-water mark only through consumed records.
      Once pending groups and unread sources are drained, clear resume_after/partial and the
      next pass can start a fresh window. New arrivals wait for that next window.
    - Write under .orbit/tmp/ ($ORBIT_SCRATCH_DIR), then attach both files with
      orbit.task.artifact action put on this pass:

      host-health-report.json:
      {"schema_version":1,"role":"owner","machine_id":"...","scan_start":"RFC3339",
       "window_start":"RFC3339","window_end":"RFC3339","partial":false,"filing_cap":5,
       "log_threshold":{"events":3,"windows":2,"days":14},"groups":[],
       "version":{"orbit_version":"...","executable":{"path":"...","sha256":"...","source_commit":null},
        "update_check":{"exit_code":0,"outcome":"already_current|update_available|unavailable","current_version":"...","target_version":"...","install_channel":"...","updatable":true,"remediation":null},
        "source_lag":{"commits_behind":null,"integration_ref":null,"checkout":null},
        "preflight":{"exit_code":0,"admitted":true,"blocking":[]}},
       "migrations":[{"workspace":"...","exit_code":0,"up_to_date":true,"pending_layout":[],"pending_schema":[],"authority":null,"retired_config":[],"remediation":null}],
       "hosts":[{"machine_id":"...","doctor":"ok|findings|unavailable","records_read":0,
       "services":[],"gaps":[],"version":{},"counts":{"doctor":0,"log":0,"eligible":0,"filed":0}}]}
      Each group carries its signature, per-host/per-window counts, source positions,
      first/last seen, route, disposition, covering record ID, sanitized evidence and any
      omitted-excerpt reason. There is no imported collector evidence.
      `version` is the owner host. `hosts` lists the owner only; its `gaps` name
      follower collection as unavailable. `migrations` has one object per workspace
      from `orbit workspace list --all` on the owner.
      On a nonzero dry-run, `pending_layout` and `pending_schema` are the stderr version
      lines and `up_to_date` is false. `authority` is null when no refusal was printed.
      `retired_config` copies the `retired-config-keys` doctor rows that name that
      workspace, or is empty; a row that names no workspace is copied onto the first
      entry only.

      host-health-cursor.json:
      {"schema_version":1,"role":"owner","machine_id":"...","window_start":"RFC3339",
       "window_end":"RFC3339","partial":false,"resume_after":null,"pending_groups":[],
       "hosts":[],"consumed_collector_windows":[],"rejected_mappings":[]}
      Each host entry carries per-source journal/file positions and 14-day per-window signature
      counts for the owner. Leave `consumed_collector_windows` empty: follower
      collection is unavailable, so there is no window to import. Preserve the
      owner's prior positions and rejected mappings. Keep artifacts under the 1 MiB limit: omit excerpts first, paginate
      pending evidence into named companion artifacts if needed and reference/attach them all.
    - Summary: per-host coverage/counts, grouped dispositions, filed/commented records,
      missing coverage, partial/resume point and both artifact paths. Empty passes still attach
      both artifacts. No host repairs, repository edits, commits or validation gates are needed.
  acceptance_criteria:
    - host-health-report.json and host-health-cursor.json are attached, with per-host doctor/log coverage, grouped counts, routes, dispositions and any partial resume point, including when no finding is eligible.
    - The report version object records orbit --version, the executable path and SHA-256, the source commit when a local-candidate manifest matches, orbit update --check, source-commit lag when a checkout and a recorded commit exist, and orbit update --preflight. Nothing was installed or applied.
    - The migrations array has one entry per workspace with orbit migrate --dry-run, any authority refusal those commands printed, and doctor's retired-config-keys findings. Follower hosts are missing coverage; automatically pinned collectors are unavailable, so the pass does not file a drift finding and does not treat that gap as healthy or as zero findings.
    - Every new finding task has a Resolve section with host/shell-specific commands or an attached resolve.sh (or concrete numbered operator steps), a verification command, the correct human/setup or agent route, and a spawned_from relation; covering tasks and rejected matches are recorded without duplicate filings.
    - Update, source-lag, migration and authority findings are human-crew chores whose signatures include the target version or commit and whose Resolve steps name the install-type command or the printed migrate remediation and say to stop Orbit processes before a migration. A defect in update or migrate, with a verified mechanism, is a bug task. No drift chore is filed.
    - The report records first-sight doctor, migration, authority and update eligibility, the 3-event/2-window log threshold, open/recent-closed task and friction dedupe, bounded redacted evidence, missing follower coverage, and at most 5 filings; capped passes preserve pending evidence in the cursor.
  task_type: chore
  tags:
    - host-health
    - no-diff-expected
  priority: medium
  complexity: low
  required_tools:
    - orbit.task.list
    - orbit.task.show
    - orbit.task.add
    - orbit.task.update
    - orbit.task.artifact:get
    - orbit.task.artifact:put
    - orbit.search
dedupe: skip_if_open
