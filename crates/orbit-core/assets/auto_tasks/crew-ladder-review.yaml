schemaVersion: 1
name: crew-ladder-review
description: Monthly evidence review of crew tier membership and model effort variants; persists comparisons and proposes at most three supported revisions or evaluations without changing live configuration
enabled: false
schedule:
  cron: 0 9 1 * *
template:
  title: Review crew tiers and effort from ladder evidence
  description: |-
    Review this workspace's crew tier membership and model+effort variants.
    This is a monthly analysis and proposed revision cycle, not permission
    to change routing. The durable output is crew-ladder-review.json and
    analysis artifacts on this chore, plus at most 3 proposed tasks.

    ## Authority and complete reads

    Inspect the actual registered owning workspace/checkout before reading
    configuration. Read actual ladder configuration,
    ordered crews (provider, exact model version, effort and configuration
    digest), tier pools and `orbit crew ladder --json` / orbit.crew.ladder.
    Read tool schemas before calls. Enumerate orbit.experiment.list without
    a status filter, oldest first, including concluded and abandoned trials;
    inspect standing system trials and applicable operator experiments with
    orbit.experiment.readout. Check returned totals/truncation/pagination;
    exhaust pages where supported. An incomplete read is a coverage gap,
    never a complete population. Keep full relevant trial denominators.
    Read-only run inspection must use --no-reconcile.

    Find previous completed chores with orbit.task.list (status done, tag
    auto-task:crew-ladder-review); enumerate completely, sort by completion
    evidence rather than list position, and exclude this task. Inspect their
    artifact metadata with orbit.task.show and fetch the newest available
    crew-ladder-review.json through
    orbit.task.artifact.get. Missing/unreadable prior evidence makes this a
    baseline; record why. Analyze newly settled evidence since that review,
    with at least 30 days of context and full relevant trials. A monthly
    window must never truncate follow-up to manufacture maturity or a verdict.

    ## Measure and compare

    For each recorded task complexity and exact model+effort/configuration
    digest, record assigned, actually executed, settled and horizon-mature
    counts; actual versus shadow mode; failures, first-pass acceptance,
    repairs/recoveries, horizon-mature escaped regressions with severity and
    label coverage; supported total delivery cost, tokens and elapsed time
    across implementation, review, repair and recovery. Include readout
    verdict, guardrails, sample-ratio mismatch, exclusions, overlay/config
    drift, denominators and uncertainty. Missing values are unknown, never
    zero. Missing/unadopted quality grades are not passes: use grading only
    where independently enabled and adopted for this purpose.

    Shadow assignments are would-be assignments, not candidate executions;
    never infer candidate quality or a model/effort effect from them. Compare
    effort variants within the same model AND task tier only with actual
    experiment support and matching digests. Never transfer evidence between
    versions, efforts or digests or use mixed-tier raw rates as capability
    evidence. Explain common-support, task-mix, sample and maturity limits.
    Prefer lower total delivery cost/time only subject to configured quality,
    non-inferiority and regression guardrails. Observational summaries can
    identify questions; they cannot replace mature randomized trial evidence.

    ## Prepare bounded supported revisions

    Respect current off/shadow mode, future propose/auto policy and operator
    experiment precedence. This agent never rewrites pools, effort or rung
    order; enables a mode, tier or grading; promotes/demotes; concludes a
    system-owned trial; approves a proposal; dispatches work; or starts a
    paid/live experiment. Phase 1 remains off/shadow. Revisions use existing
    supported task/configuration/operator decision paths. No new optimizer.

    Prepare at most 3 proposed revision/evaluation tasks, prioritizing prior
    overflow after re-verifying evidence. A candidate can revise configured
    tier membership, a crew effort variant or rung order, or request a bounded
    operator-approved experiment when support is insufficient. Off,
    unconfigured, shadow-only or insufficient history is a successful evidenced
    no-op; do not fabricate a revision to meet a quota.

    Before filing each, duplicate-check open and closed tasks with orbit.search
    (kind task, all true, one distinctive token per query), inspect matches,
    and record already-tracked mappings. Use orbit.task.add with type chore,
    assessed complexity, explicit AC, verified context_files modification
    targets, and a spawned_from relation to THIS chore. Tool-created tasks
    remain proposed. Include exact target setting and crew identity, before
    and after recommendation, trial/config digests, readout evidence/verdict,
    expected benefit, uncertainty/risks and required approval/validation.
    Read every filed task back with orbit.task.show; failed/unreadable writes
    are not delivered. Preserve overflow and no-change reasons.

    ## Persist

    Attach .orbit/tmp/crew-ladder-review.json with schema_version: 1,
    cutoff/window/timezone (cron uses host-local first day at 09:00), owning
    workspace, configuration snapshot/digests, experiment IDs/modes/readouts,
    full maturity/coverage/exclusions, per-tier/model/effort comparisons and
    unknowns, evidence references, prior-review reference and
    delta (including newly settled counts), proposals,
    duplicate mappings, overflow and no-op reasons. Fetch previous artifacts
    through tools, never infer a baseline from a final message. Attach it with
    orbit.task.artifact.put (id=this chore, source_path=the scratch file,
    path=crew-ladder-review.json). The execution summary maps evidence to
    criteria and reports gaps, delta, proposals and artifact paths. A run with
    nothing to change still persists the artifact and succeeds.
  acceptance_criteria:
  - Actual ladder configuration and all relevant standing/operator experiment readouts were inspected completely, or exact enumeration gaps and unknowns were recorded with full available denominators
  - Per-tier exact model, effort and configuration-digest evidence separates assignment, actual execution, settlement and horizon maturity, with quality, failures, repairs, regressions, total cost/time and uncertainty; shadow evidence never becomes measured candidate quality
  - crew-ladder-review.json is attached and compared with the prior completed review artifacts fetched through tools, or an evidenced baseline/no-op reason is recorded
  - At most 3 duplicate-checked proposed tasks were filed and read back, each with exact supported targets, before/after, trial/config digests, evidence/verdict, benefit/risks, AC and spawned_from to this chore; overflow and no-change reasons remain in the artifact
  - No routing, configuration, effort, rung order, mode, grading adoption or experiment lifecycle was changed, no live/paid trial launched and no proposal approved or dispatched
  task_type: chore
  tags:
  - crew-ladder-review
  - no-diff-expected
  required_tools:
  - orbit.crew.ladder
  - orbit.experiment.list
  - orbit.experiment.readout
  - orbit.search
  - orbit.task.add
  - orbit.task.artifact.get
  - orbit.task.artifact.put
  - orbit.task.list
  - orbit.task.show
  priority: medium
  complexity: medium
  status: backlog
dedupe: skip_if_open
created_by: system
created_at: 2026-10-30T00:00:00Z
