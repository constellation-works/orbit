schemaVersion: 1
name: run-failure-patterns
description: Weekly rate-driven measurement of this workspace's pipeline failures, with Pareto classes, dispositions and fix-effectiveness checks
enabled: false
schedule:
  cron: 20 7 * * 1
template:
  title: Reduce the pipeline failure rate
  description: |-
    Reduce this workspace's pipeline failure rate. Measure it, find the failure classes that
    drive it, and make sure each significant class has a working fix in flight: file the fix,
    push an existing fix forward with fresh evidence, or file a regression when a landed fix
    did not hold. Success is measured by the failure rate going down pass over pass, not by the
    number of tasks filed. The durable outputs are the `run-failure-report.json` artifact, the
    cursor artifact, and the filed or commented tasks. Narrative-only output does not count.

    ## Rules and command surfaces

    - **Owner host only.** Run history and follower settlements live on the workspace owner.
      Preparation must record `required_machine` for this owner-evidence contract before
      admission, naming the owning machine, so a follower is not offered this scan; the
      owner's own drain may start it, and on the owner those reads stay authorized. Routing
      grants no additional tool scope. Do not use an `os:` tag for placement: it pins an
      operating system, not the owning machine. First confirm this checkout is the owner:
      `orbit run settlements --since <7 days ago> --no-reconcile --json` must not refuse as a
      follower replica, and `orbit run history --limit 50 --no-reconcile --json` must list
      runs executed on this host. If this is a follower replica, stop: record `wrong_host`
      with the evidence in the execution summary, attach no cursor, and finish without filing
      anything.
    - Read-only against run state. Never retry, resume, cancel or edit a run, and never change
      the status of a task a run touched. Read runs only with `orbit run history --since <d>
      --limit <n> --no-reconcile --json`, `orbit run show <run-id> --no-reconcile --json`,
      `orbit run logs <run-id> --no-reconcile [--step <id>]`, `orbit run events <run-id>
      --no-reconcile`, and `orbit run settlements --since <d> --no-reconcile --json`. Never drop
      `--no-reconcile`: without it the reads finalize orphaned runs as `interrupted` and release
      their reservations. Do not read the Orbit database or state files directly.
    - Records go through registered tools: `orbit tool run orbit.task.list --input '{"limit":50}'`
      invokes a tool by name, and `orbit tool show orbit.task.list` prints its schema.
      Available tools include `orbit.task.list`, `orbit.task.show`,
      `orbit.search` (one distinctive token per query: an error code, step or tool name; a
      0-hit multi-word query proves nothing), `orbit.task.add`, `orbit.task.update` (comments
      only), `orbit.task.artifact.get/put`, `orbit.friction.add`. Read the installed `orbit`
      skill's `references/task-authoring.md` before filing.
    - A pass that finds nothing new still succeeds, with the report stored. Don't invent work.

    ## 1. Windows

    - **Cursor.** Find the newest completed prior pass with `orbit.task.list`
      `{"status":["done"],"tag":["run-failure-patterns","no-diff-expected"],"limit":1}` and read
      its `run-failure-cursor.json` and `run-failure-report.json`. The new cursor is the moment
      this scan starts; record it before reading any run. A prior pass whose artifacts can't be
      read is reported, and this pass uses the 7-day window alone.
    - **Analysis window: the 7 days before scan start**, always, regardless of the cursor.
      Recurring failures spread over days; clustering only the hours since the last pass hides
      them. Also compute the 30-day rates for trend.
    - **New since cursor:** occurrences that finished after the prior cursor. Report them
      separately; they decide whether a tracked class is still firing.

    Page `orbit run history --since 30d --no-reconcile --json` with a large enough `--limit`
    that the oldest returned run predates the 30-day start.

    ## 2. Measure the rate

    For every job with runs in the window, compute runs, failed (`failed` or `interrupted`, and
    `cancelled` runs that recorded an error), and failure rate, for 7 days and 30 days. Add
    follower leaf failures from `orbit run settlements`: each settlement whose `settled_at`
    falls in the window is one occurrence in its `leaf_run_id` on its host, attributed to the
    claimed pipeline job. `evidence_hold` releases, `operator_cancel`, and settlements with
    `review_decision_pending: true` are designed outcomes, not failures. Report pending-decision
    review refusals separately even though their `kind` stays `fail` and `failure_class` stays
    `candidate`; a missing flag on an older record reads as false. A follower settlement
    duplicates an owner history run only when all three match: the settlement's `machine_id`
    equals the history row's `executed_on.machine_id`, the settlement's `leaf_run_id` equals
    the history row's `run_id`, and the history row's `task_ids` lists the settlement's
    `task_id`. A bare `leaf_run_id` match without the machine and task match is an id
    collision across hosts, not a duplicate: count it. A history row with null `executed_on`
    cannot match on machine id, so it never dedupes a settlement.

    Fold cascades by recorded cause, never by matching text: read `root_cause` with
    `orbit run show <run-id> --no-reconcile --json` for every failed run. A run whose
    `root_cause.run_id` names another run is an echo of
    it; count the occurrence once, at the root. A `pipeline_success_guard` root whose child
    dispatch is `held` is a designed hold: neither it nor the parents folded into it count.
    Report raw and folded counts per job, so the dashboard's raw rate can be reconciled with
    the folded one.

    Compare with the prior pass's report: per-job rate delta, 7-day and 30-day.

    ## 3. Find the classes that drive it

    For each job whose folded 7-day failure rate is at least 2% or that had at least 5 folded
    failures, cluster its failures by normalized signature: error class (the bracketed code
    such as `[provider_capacity]`, an `error_code`, the guard name, a settlement's `evidence`
    and `failure_class`, or the leading error kind), failing step or deterministic action, and
    tool. Strip ids, SHAs, paths, PR numbers, timestamps, hosts and counts. Split review
    refusals by escalation category as before (`base_red`, `external_evidence`,
    `report_revision`, `scope_or_criteria`, `timeout`, `other`), reading `review-gate.json` and
    `review-report.json` with `orbit.task.artifact.get` for the task's latest attempt:

    - `base_red`: a `[baseline_red]` refusal, or an escalation saying a required check fails on
      the base, is pre-existing, or needs a green base.
    - `external_evidence`: a non-empty `external_evidence`, or an escalation asking for evidence
      the reviewer's host cannot produce: a native OS (`native_os`), a hosted CI result
      (`hosted_ci`), or CodeQL (`codeql`).
    - `report_revision`: the gate refused the reviewer's report or its revisions, such as
      `validation_incomplete` for a required check an earlier revision recorded and the final
      one omits, a superseded attempt with no replacing pass, or a report or certificate mismatch.
    - `scope_or_criteria`: a `reject` whose escalation says the task's scope, acceptance criteria
      or approach must change.
    - `timeout`: the reviewer exceeded its wall clock or review budget.
    - `other`: anything else.

    Rank the classes by folded occurrences and take the **Pareto set**: the top classes that
    together cover at least 80% of that job's folded failures, plus every class with at least 3
    occurrences across 2 runs in the 7 days. These are the classes this pass must account for.

    **No class is dismissed by its kind.** "Designed refusal", "provider", "agent-declared",
    "CI flake" and "operator resume" are causes, not exemptions: each still counts in the rate
    the operator sees. For every Pareto class decide which of these it is, with evidence:

    - **Product defect:** Orbit raised or permitted a failure it could have prevented. File a
      fix.
    - **Misclassified hold:** the outcome is a correct, designed refusal or wait that is
      recorded as a run *failure* (for example a review gate that held a task for evidence, a
      red base, a draft awaiting a section). File a task that records it as a held/blocked
      outcome rather than a failed run, or that excludes it from the failure rate with its own
      counter, so the metric means "something broke".
    - **Provider or capacity:** capacity, rate limit, usage limit, outage. File the resilience
      fix that would have avoided the failed run (fall back to another crew or model, hold and
      retry admission later, back off), not the provider itself. Pure network one-offs stay
      counted only.
    - **Upstream task quality:** agent-declared blocks, scope or criteria rejects, validation
      that a leaf can't reach. File the fix where the bad input came from (task-pilot checks,
      authoring guidance, an auto-task template that writes unreachable criteria), naming the
      tasks.
    - **Environment or flake:** host tooling, sandbox, CI flake. File the host or test fix, or
      attach to the open flake task.
    - **True one-off:** a single occurrence that the code shows will not recur. Counted only.

    ## 4. Check coverage and effectiveness

    For each Pareto class, search tasks and frictions (one token at a time from its signature)
    and inspect plausible hits.

    - **Open task covers it** (any status before done): don't file. Comment on it once per
      pass with this pass's counts (7-day occurrences, new since cursor, share of the job's
      failures, representative run ids). If it is `proposed` and its class is in the top three
      for its job, say so in the comment: that is the operator's cue to promote it.
    - **Done task covers it:** find the commit it landed in and whether that commit is
      deployed on the host the failures ran on (the installed binary's source commit in
      `~/.orbit/deploy-*.log` or the run's recorded build, if present; when it can't be
      established, say so). Occurrences on a binary that predates the fix are "fix not yet
      deployed": report, don't refile. Occurrences on a binary that includes the fix are a
      regression: file a new task that names the done task.
    - **Rejected task decided it is not to be fixed:** record the mapping and don't file, but
      list it in the report with its share of failures, so the decision can be revisited.
    - **Untracked:** verify the mechanism in this checkout (record `git rev-parse HEAD`): name
      the file and function that raise or permit the failure and quote the guard, comment or
      constant (a few lines). File one record per class: a fix task, or a friction only when
      evidence and code cannot establish the cause. Never both.

    **Effectiveness of earlier fixes.** For every task this auto-task filed (tag
    `run-failure-patterns`) that reached done in the last 30 days, compare its class's weekly
    occurrences before its landing with the period after it was deployed. Report each as
    `effective`, `not effective`, `not yet deployed` or `too early` (under 3 days deployed).
    A `not effective` fix gets a regression task as above.

    ## 5. Filing

    - File at most 5 new tasks per pass, ranked by folded failures per week they would
      prevent. List the rest in the report as deferred.
    - Each fix task: `type` `bug`, tags `["run-failure-patterns", "no-auto-approve"]` plus the
      job's area (`delivery`, `review`, `providers`, `pilot`, `landing`), `complexity` assessed
      honestly (never `xhard`), `context_files` with verified selectors for what the fix will
      modify — `symbol:<path>#<name>:<kind>` for each existing function or
      type, `file:` when the change is file-wide (never `docs/CONFIG.md`) — and a `spawned_from` relation to this task. Read
      every created task back and confirm that edge.
    - Body: the problem in a sentence or two; an evidence table (signature, 7-day and 30-day
      occurrences, distinct runs, share of the job's folded failures, hosts, first and last
      seen, up to three run ids, one short redacted excerpt); the verified mechanism; the
      decision category from section 3 and why; the proposed change; and the expected effect on
      the job's failure rate.
    - Acceptance criteria are reachable inside one leaf on its own host: a deterministic
      reproduction of the signature through the same code path, the fix, and proof that the
      reproduction now passes. Never "after deploy", never numbers from another host.
    - When a landed task's change caused the class, add
      `{"type":"regression_from","target":"<culprit>","regression":{"nature":"<nature>","escape":"<escape>","severity":"<severity>"}}`
      (natures: broke_existing, defect_in_new, incomplete, merge_reintroduced,
      contract_drift, unclassified; escapes: no_test, test_not_selected, platform_only,
      review_missed, spec_ambiguous, nondeterministic, unclassified). Never blame a bystander;
      choose `unclassified` rather than guess. `severity` is required on a new link; rate the
      worst real impact, not the size of the fix, taking the lower level when torn:
      - `critical`: data loss or corruption, a security hole, every drain halted, or silently wrong results (a migration drops task history).
      - `high`: a core workflow broken with no workaround (every `ui` delivery fails at handoff).
      - `medium`: a feature broken or wrong in a real path, with a workaround (`--json` drops a field the plain output shows).
      - `low`: an edge case, a misleading message or a minor UX defect (an error names the wrong flag).
      - `nit`: wording or doc drift, cosmetic, no behavior impact (a stale sentence in a reference doc).
    - Redact excerpts: at most a few lines, with tokens, credentials, authorization headers,
      cookies, email addresses and home paths replaced. Put excerpts only in text sent through
      `orbit.task.add`, `orbit.task.update` or `orbit.friction.add`; when a response reports
      `redactions_applied: true`, read the record back. Never attach raw logs.

    ## 6. Report and cursor

    Write `.orbit/tmp/run-failure-report.json` (`$ORBIT_SCRATCH_DIR`) and attach it as
    `run-failure-report.json`:

    ```json
    {"schema_version": 2, "scan_start": "<RFC 3339>", "head": "<sha>",
     "jobs": [{"job": "...", "runs_7d": 0, "failed_raw_7d": 0, "failed_folded_7d": 0,
               "rate_7d": 0.0, "rate_30d": 0.0, "rate_7d_prev": 0.0}],
     "classes": [{"job": "...", "signature": "...", "occurrences_7d": 0, "new_since_cursor": 0,
                  "share": 0.0, "category": "product_defect|misclassified_hold|provider|upstream_quality|environment|one_off",
                  "disposition": "filed:<id>|commented:<id>|not_yet_deployed:<id>|regression:<id>|rejected:<id>|deferred|counted"}],
     "fix_effectiveness": [{"task": "...", "landed": "...", "deployed": "...", "before_per_week": 0, "after_per_week": 0, "verdict": "..."}]}
    ```

    Write `{"schema_version":1,"cursor":"<scan start>","runs_scanned":<n>}` to
    `.orbit/tmp/run-failure-cursor.json` and attach it as `run-failure-cursor.json`, on every
    completed owner pass including an empty one.

    Execution summary: the per-job rate table with deltas against the prior pass, the Pareto
    classes with their disposition, the fix-effectiveness verdicts, filed and commented ids,
    deferred classes, and anything unreadable.
  acceptance_criteria:
  - The scan used the 7 days before scan start as its analysis window, computed per-job runs, raw and folded failed counts and failure rates for 7 days and 30 days, and reported new-since-cursor occurrences separately in `run-failure-report.json` with `schema_version` 2.
  - Follower leaf settlements from `orbit run settlements --no-reconcile` were deduped against this host's runs only when machine id, leaf run id and task id all match (the settlement's `machine_id` equals the history row's `executed_on.machine_id`, its `leaf_run_id` equals the history row's `run_id`, and the history row's `task_ids` lists its `task_id`); a bare `leaf_run_id` match is a collision and counts, a null `executed_on` never dedupes, and failed parents were folded by their recorded `root_cause`, with a held child's parents not counted as failures.
  - Failures were clustered by normalized signature with review refusals split by escalation category, and the Pareto set covers at least 80% of each qualifying job's folded failures plus every class with at least 3 occurrences across 2 runs in 7 days.
  - Every Pareto class carries a category and a disposition in the report, and no class was dismissed by kind alone as designed refusal, provider, agent-declared, CI flake or operator resume.
  - Open tasks covering a Pareto class received one comment with 7-day counts and new-since-cursor counts, and at most 5 new tasks were filed, ranked by folded failures per week they would prevent.
  - For every done covering task, the report states the landed commit and whether it was deployed on each failing host, with pre-deploy occurrences reported as not yet deployed and post-deploy occurrences filed as regressions.
  - Every fix this auto-task filed that reached done in the last 30 days has a fix-effectiveness verdict of effective, not effective, not yet deployed or too early in the report.
  - The pass ran on the owning machine under a `required_machine` owner-evidence contract, or stopped with `wrong_host` in the execution summary without filing and without attaching a cursor.
  - No run was retried, resumed, cancelled, or edited, and no run state was mutated.
  - The execution summary reports the per-job rate table with deltas, Pareto dispositions, effectiveness verdicts, filed and commented ids and deferred classes, and `run-failure-cursor.json` is attached on every completed owner pass.
  task_type: chore
  tags:
  - run-failure-patterns
  - no-diff-expected
  required_tools:
  - orbit.friction.add
  - orbit.search
  - orbit.task.add
  - orbit.task.artifact.get
  - orbit.task.artifact.put
  - orbit.task.list
  - orbit.task.show
  - orbit.task.update
  priority: medium
  complexity: medium
  status: backlog
