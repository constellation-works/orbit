schemaVersion: 1
name: regression-label-audit
description: Weekly blind re-judgement of ten regression labels from the last seven days by a different model family; reports the sample's disagreement rate for escape, nature and severity without changing any link
enabled: false
schedule:
  cron: 30 7 * * 1
template:
  title: Audit regression labels
  description: |-
    Re-judge a sample of regression labels and report how often an
    independent judge disagrees. A regression_from link's escape, nature
    and severity decide which role is charged and how much, and the agent
    that files the link sets all three. The durable output is
    regression-label-audit.json on this chore. Recorded links, scorecards
    and ranks stay as they are.

    ## Definition fields

    Read the draw and the window from these fields. Do not replace them
    with other numbers.

    - sample_size: 10
    - period_days: 7

    ## Stay blind

    The filer's labels must not reach your context before your own second
    labels are saved. A tool response that carries them is already in your
    context, however little of it you copy, so the sample is drawn by the
    helper script below, not by you. It calls the read tools itself and
    prints only link identity and the allowed evidence packet.

    - Never call `orbit.task.list` or `orbit.task.show` yourself with the
      `relations`, `created_by` or `created_by_model` fields, and never
      open the helper's `regression-label-audit-draw.json` or
      `regression-label-audit.json` before `compare` has run.
    - Use `orbit.task.list` and `orbit.task.show` yourself only for the
      prior-audit lookup below, with `fields` limited to `id`, `status`
      and `artifacts`.
    - Never put a model, provider or crew name into the packet: not the
      filer's, and not the culprit's implementer or reviewer. Do not read,
      for either task, crew, resolved_crew, crew_model, crew_unresolved,
      implemented_by, planned_by, orchestrator, orchestrator_model,
      orchestrator_model_source, comments, history, execution_summary,
      final_recovery, job_run_id or artifacts. Do not open a run, its logs
      or an experiment readout, and do not search for a crew.
    - If a packet field names a model, provider or crew, or states the
      filer's recorded nature, escape or severity, exclude that link,
      record a blindness breach and draw a replacement with `replace`. A
      description of the defect is evidence. A line that sets the
      classification is not.

    ## Helper

    Write this script verbatim to `.orbit/tmp/regression-label-audit.py`
    and run it from the workspace root with `python3 -I`. Pass
    `--model <agent-family>` before the subcommand. It needs only Python 3
    and the `orbit` CLI. Its subcommands are the only place the filer's
    labels are read.

    - `sample` enumerates, filters and draws. It reads `created_by` and
      `created_by_model` only to skip your own family and never prints
      them. It prints the seed, window, eligible population, exclusion
      counts, gaps, the sampled links as filing task id, culprit task id
      and whether the filer is unknown, and how many reserve links remain.
    - `packet` fetches the evidence packet of each sampled link through
      `orbit.task.show` with `fields` limited to the allowed ones, prints
      it and saves it.
    - `replace <filing> <culprit> --reason <why>` records a blindness
      breach and swaps in the next reserve link.
    - `compare` refuses to run until `.orbit/tmp/regression-label-audit-second.json`
      holds every sampled link's second labels. Only then does it read the
      recorded labels, score agreement and write
      `.orbit/tmp/regression-label-audit.json`.

    ```python
    #!/usr/bin/env python3
    """Blind regression-label audit helper: sample, packet, replace, compare."""
    import argparse, datetime as dt, json, os, random, re, subprocess, sys

    T = ".orbit/tmp/"
    DRAW, PACKETS, SECOND = (T + "regression-label-audit-" + n + ".json" for n in ("draw", "packets", "second"))
    FINAL = T + "regression-label-audit.json"
    STATUSES = ["proposed", "backlog", "in-progress", "review", "blocked", "someday", "done", "rejected", "archived"]
    LABELS = ("nature", "escape", "severity")

    def tool(a, name, **payload):
        p = subprocess.run(["orbit", "tool", "run", name, "--input", json.dumps({**payload, "model": a.model})], capture_output=True, text=True)
        if p.returncode:
            sys.exit(f"{name} failed: {p.stderr.strip()[:300]}")
        return json.loads(p.stdout)

    def when(text):
        text = re.sub(r"(\.\d{6})\d+", r"\1", text.replace("Z", "+00:00"))
        return dt.datetime.fromisoformat(text)

    def load(path):
        with open(path) as f:
            return json.load(f)

    def save(path, value):
        with open(path, "w") as f:
            json.dump(value, f, indent=2)

    def prior_keys(path):
        """Judged link keys from a fetched prior artifact; nothing else is read."""
        try:
            doc = load(path)
            doc = json.loads(doc["content"]) if "content" in doc else doc
            return {str(k) for k in doc.get("judged_link_keys", [])}
        except (OSError, ValueError, KeyError, AttributeError):
            return None

    def link_json(d, keys):
        return [{"filing_task": k.split("|")[0], "culprit_task": k.split("|")[1], "filer_unknown": d["links"][k]} for k in keys]

    def sample(a):
        now = dt.datetime.now(dt.timezone.utc)
        start = now - dt.timedelta(days=a.period_days)
        judged = prior_keys(a.prior) if a.prior else None
        terms = [t.strip().lower() for t in a.family.split(",") if t.strip()]
        pool, excl, gaps = {}, {"own_family": 0, "already_judged": 0}, []
        for status in STATUSES:
            limit = 200
            while True:
                r = tool(a, "orbit.task.list", status=[status], limit=limit, fields=["id", "created_at", "created_by", "created_by_model", "relations"])
                rows = r["tasks"]
                open_end = r.get("truncated") and rows and when(rows[-1]["created_at"]) >= start
                if not open_end:
                    break
                if limit >= 20000:
                    gaps.append(status)
                    break
                limit *= 4
            for row in rows:
                if when(row["created_at"]) < start:
                    continue
                who = " ".join(str(row.get(f) or "") for f in ("created_by", "created_by_model")).lower()
                for rel in row["relations"]:
                    if rel.get("type") != "regression_from":
                        continue
                    key = f"{row['id']}|{rel['target']}"
                    if judged and key in judged:
                        excl["already_judged"] += 1
                    elif any(t in who for t in terms):
                        excl["own_family"] += 1
                    else:
                        pool[key] = not who.strip()
        seed = a.seed or os.urandom(8).hex()
        order = sorted(pool)
        random.Random(seed).shuffle(order)
        d = dict(seed=seed, drawn=order[:a.sample_size], reserve=order[a.sample_size:], window_start=start.isoformat(), window_end=now.isoformat(), sample_size=a.sample_size, period_days=a.period_days,
                 family=a.family, eligible_population=len(pool), exclusions=excl, gaps=gaps, links=pool, breaches=[],
                 prior_found=judged is not None, prior_keys=sorted(judged or []))
        save(DRAW, d)
        show(d)

    def show(d):
        print(json.dumps({k: d[k] for k in ("seed", "window_start", "window_end", "eligible_population", "exclusions", "gaps", "prior_found")}
                         | {"sampled": link_json(d, d["drawn"]), "reserve": len(d["reserve"])}, indent=2))

    def packet(a):
        d, packets = load(DRAW), {}
        def read(task_id, fields):
            r = tool(a, "orbit.task.show", id=task_id, fields=fields)
            return {f: r.get(f) for f in fields}
        for key in d["drawn"]:
            filing, culprit = key.split("|")
            packets[key] = {"filing_task": {"id": filing, **read(filing, ["title", "description", "acceptance_criteria", "context_files", "type"])},
                            "culprit_task": {"id": culprit, **read(culprit, ["title", "description", "acceptance_criteria", "context_files"])}}
        save(PACKETS, packets)
        print(json.dumps(packets, indent=2))

    def replace(a):
        d = load(DRAW)
        key = f"{a.filing}|{a.culprit}"
        if key not in d["drawn"]:
            sys.exit("not an active sampled link")
        d["breaches"].append({"link": key, "reason": a.reason})
        d["drawn"].remove(key)
        if d["reserve"]:
            d["drawn"].append(d["reserve"].pop(0))
        save(DRAW, d)
        show(d)

    def compare(a):
        d = load(DRAW)
        if not os.path.exists(SECOND):
            sys.exit(f"refusing: {SECOND} (second labels) is not recorded yet")
        second = {f"{s['filing_task']}|{s['culprit_task']}": s for s in load(SECOND)}
        keys = d["drawn"]
        missing = [k for k in keys if k not in second or any(not second[k].get(f) for f in LABELS)]
        if missing:
            sys.exit(f"refusing: second labels missing for {missing}")
        packets, links, tally = load(PACKETS), [], {f: [0, 0] for f in LABELS}
        if any(k not in packets for k in keys):
            sys.exit("refusing: run packet again after a replacement")
        for key in keys:
            filing, culprit = key.split("|")
            relations = tool(a, "orbit.task.show", id=filing, fields=["id", "relations"]).get("relations", [])
            rec = next((r for r in relations if r.get("type") == "regression_from" and r.get("target") == culprit), {}).get("regression") or {}
            agree = {}
            for f in LABELS:
                if f == "severity" and (not rec or rec.get("severity_source") == "default" or not rec.get("severity")):
                    agree[f] = None
                    continue
                agree[f] = bool(rec.get(f)) and rec[f] == second[key][f]
                tally[f][0] += not agree[f]
                tally[f][1] += 1
            links.append({"filing_task": filing, "culprit_task": culprit, "filer_unknown": d["links"][key], "evidence_packet": packets[key],
                          "second": {f: second[key][f] for f in LABELS} | {"reason": second[key].get("reason", "")}, "recorded": rec or None, "agreement": agree})
        report = dict(schema_version=1, audited_at=dt.datetime.now(dt.timezone.utc).isoformat(), auditor_family=d["family"], sample_size=d["sample_size"],
                      period_days=d["period_days"], window_start=d["window_start"], window_end=d["window_end"], eligible_population=d["eligible_population"],
                      seed=d["seed"], exclusions=d["exclusions"] | {"blindness_breach": d["breaches"]}, gaps=d["gaps"], links=links,
                      disagreement_rates={f: {"disagreed": n, "judged": m, "rate": (n / m if m else None)} for f, (n, m) in tally.items()},
                      prior_artifact=a.prior_ref or None, baseline_reason=None if d["prior_found"] else (a.baseline_reason or "no prior artifact"),
                      judged_link_keys=sorted(set(d["prior_keys"]) | set(keys)))
        save(FINAL, report)
        print(json.dumps({k: report[k] for k in ("eligible_population", "disagreement_rates")} | {"links": [{k: l[k] for k in ("filing_task", "culprit_task", "recorded", "agreement")} for l in links]}, indent=2))

    p = argparse.ArgumentParser()
    p.add_argument("--model", default="claude")
    sub = p.add_subparsers(dest="cmd", required=True)
    s = sub.add_parser("sample")
    s.add_argument("--family", required=True)
    s.add_argument("--sample-size", type=int, required=True)
    s.add_argument("--period-days", type=int, required=True)
    s.add_argument("--seed")
    s.add_argument("--prior")
    sub.add_parser("packet")
    r = sub.add_parser("replace")
    r.add_argument("filing"), r.add_argument("culprit"), r.add_argument("--reason", required=True)
    c = sub.add_parser("compare")
    c.add_argument("--prior-ref"), c.add_argument("--baseline-reason")
    a = p.parse_args()
    {"sample": sample, "packet": packet, "replace": replace, "compare": compare}[a.cmd](a)
    ```

    ## Sample

    The window is the period_days before this run starts, in UTC. A link
    is inside it when the task that carries the regression_from relation
    has `created_at` in that window. A relation added later to an older
    task is outside the window.

    Find the previous completed audit first. List done chores with
    `orbit.task.list` (tag auto-task:regression-label-audit, `fields`
    `id`, `status`), exclude this task, list artifacts of the newest with
    `orbit.task.show` field `artifacts`, and only when
    regression-label-audit.json is listed, save it without reading it:
    `orbit tool run orbit.task.artifact --input '{"action":"get","id":"<prior task ID>","path":"regression-label-audit.json","model":"<agent-family>"}' > .orbit/tmp/regression-label-audit-prior.json`.
    Missing prior evidence makes this a baseline; record why. Never open
    that file: the helper takes only its judged link keys from it, so a
    later run does not redraw those links.

    Then run `sample` with the sample_size and period_days definition
    fields above and, as `--family`, a comma list naming your own model
    family (`claude`; `gpt,codex,openai`; `gemini`; `grok` and so on), the
    same family test `recovery-fault-audit` applies to `fault_judged_by`.
    Your family is the family of the model this run dispatched. Add
    `--prior .orbit/tmp/regression-label-audit-prior.json` when you saved
    it. The helper lists each status (proposed, backlog, in-progress,
    review, blocked, someday, done, rejected, archived) newest first,
    repeats a truncated status with a higher limit while its oldest row is
    still inside the window, keeps regression_from relations, drops links a
    previous audit judged and links filed under your own family, and draws
    sample_size at random with a recorded seed. A status it could not cover
    is a recorded gap, not a reason to pad the sample. A link with neither
    field is eligible only when you record that its filer is unknown.
    Fewer than sample_size eligible links is an evidenced short sample,
    never padding.

    ## Re-label

    For each sampled link, write the evidence packet, then judge escape,
    nature and severity from that packet only. Use this rubric. When the
    evidence does not settle a field, label it unclassified.

    Nature:

    - broke_existing: the culprit broke behavior that worked before it landed.
    - defect_in_new: the defect is in code the culprit itself introduced.
    - incomplete: the culprit shipped without part of what its task required.
    - merge_reintroduced: a merge restored code or assets an earlier change had removed.
    - contract_drift: docs, schemas or a contract drifted from the behavior the culprit shipped.
    - unclassified: the evidence does not settle the nature.

    Escape, from the tests and gate selection the evidence shows:

    - no_test: no test exercised the broken behavior.
    - test_not_selected: a covering test existed but the delivery's gates did not run it.
    - platform_only: it shows only on a platform or host the gates did not exercise.
    - review_missed: it was visible in the diff and review did not flag it. Visibility alone is not enough when no test exercises the behavior.
    - spec_ambiguous: the task or spec left the expected behavior open to the shipped reading.
    - nondeterministic: it depends on timing, ordering or environment and passed when gated.
    - unclassified: the evidence does not settle the escape.

    Severity, by the worst impact the evidence shows. When torn between
    two levels, take the lower.

    - critical: data loss or corruption, a security hole, every drain halted, or silently wrong results.
    - high: a core workflow broken with no workaround.
    - medium: a feature broken or wrong in a real path, with a workaround.
    - low: an edge case, a misleading message or a minor defect.
    - nit: wording or doc drift, cosmetic, no behavior impact.

    Record your escape, nature and severity and a one-line reason before
    you compare them with the recorded labels.

    ## Agreement

    Record your escape, nature and severity and a one-line reason for
    every sampled link before `compare` runs: write
    `.orbit/tmp/regression-label-audit-second.json` as an array of
    `{"filing_task","culprit_task","escape","nature","severity","reason"}`,
    one object per sampled link, then run `compare` with
    `--prior-ref <prior task ID>/regression-label-audit.json` (or
    `--baseline-reason <why>`). Do not read the recorded labels any other
    way. The helper scores agreement: a field agrees when both sides name
    the same value. A missing recorded nature or escape disagrees with
    every second label, including unclassified. Both unclassified agree.
    Severity agrees when the recorded severity equals the second severity.
    When the payload is absent, or `severity_source` is `default`, there
    is no filer severity: that link's severity agreement is null and it is
    left out of the severity rate. The disagreement rate for a field is
    the disagreements divided by the sampled links judged on that field,
    reported with its numerator and denominator.

    ## Persist

    `compare` writes `.orbit/tmp/regression-label-audit.json` with
    schema_version: 1, the audit time, your own model family, sample_size,
    period_days, the eligible population size, the seed, exclusions with
    reasons (own family, already judged, blindness breach), each sampled
    link (filing task id, culprit task id, the evidence packet, the second
    escape, nature and severity and the one-line reason, the recorded
    labels, and agreement per field), the three disagreement rates with
    numerators and denominators, the prior artifact reference and every
    judged link key. The evidence packet on each link contains neither the
    filer's labels nor any model, provider or crew name. Attach it with
    `orbit.task.artifact` action `put` (id this chore, source_path the
    scratch file, path regression-label-audit.json). The execution summary
    reports the sample size, the eligible population, and the
    disagreement rate for escape, nature and severity. A short sample or a
    baseline still persists the artifact and succeeds. Write only this
    chore's artifact and its summary or comment. Do not edit a regression
    link, a scorecard or a rank.
  acceptance_criteria:
  - Up to sample_size (10) regression_from links from the last period_days (7), not judged by a previous audit and not filed by the auditor's own model family, were sampled with a recorded seed, or a short sample was evidenced with the eligible population size
  - Each sampled link was re-labeled from an evidence packet of task title, description, acceptance criteria and context files that contains neither the filer's labels nor any model, provider or crew name of the filer or the culprit's implementer or reviewer, no sampling response reached the judge with either before its second labels were saved, and a blindness breach was excluded and replaced
  - regression-label-audit.json records, per sampled link, the second escape, nature and severity and agreement on each of those fields
  - The execution summary reports this sample's disagreement rate for escape, nature and severity, each with its denominator
  - No regression link, scorecard number or rank number was changed
  task_type: chore
  tags:
  - regression-label-audit
  - no-diff-expected
  required_tools:
  - orbit.task.artifact:get
  - orbit.task.artifact:put
  - orbit.task.list
  - orbit.task.show
  priority: medium
  complexity: medium
  status: backlog
dedupe: skip_if_open
