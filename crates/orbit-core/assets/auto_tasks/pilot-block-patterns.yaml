schemaVersion: 1
name: pilot-block-patterns
description: Daily review of recurring task-pilot warnings and blocks left after final recovery; files one fix per cause at its source and checks whether earlier fixes reduced it
enabled: false
schedule:
  cron: 40 6 * * *
template:
  title: Fix recurring pilot warnings and post-recovery blocks at their source
  description: |-
    Find why task-pilot keeps warning about or holding tasks, and why tasks stay blocked
    after final recovery, then make sure each recurring cause has a fix in flight where the
    cause starts. Success is the same cause recurring less pass over pass, not the number of
    tasks filed. The durable outputs are the `pilot-block-report.json` artifact, the
    `pilot-block-cursor.json` artifact, filed or commented fix tasks, and a reviewed
    corpus change containing every observed group. Narrative-only output does not count.

    This pass studies causes, not individual tasks. Resolving one blocked or held task is
    `escalation_triage_pipeline`'s job: never edit, requeue, comment on or triage a blocked
    or pilot-held task, even when its fix is obvious. Its occurrence is evidence for a group.

    ## Rules and command surfaces

    - **Owner host only.** Task history, pilot assessments and run records live on the
      workspace owner. Preparation must record `required_machine` for this owner-evidence
      contract before admission, naming the owning machine. First confirm this checkout is the
      owner: `orbit run history --limit 50 --no-reconcile --json` must list runs executed on
      this host. If it is a follower replica, stop: record `wrong_host` with the evidence in
      the execution summary, attach no cursor, and file nothing.
    - **Durable records only.** Read pilot and recovery outcomes from task records and run
      records, never from an agent's chat output or a run's free-text log alone.
      Currently proposed and blocked tasks:
      `orbit tool run orbit.task.list --input '{"status":["proposed","blocked"],"limit":10000,"model":"<agent-family>"}'`
      When that response lists no tasks and does not report a cut-off page, those
      statuses are empty. Do not drop the status filter, and do not page every task
      in the workspace. One task's records:
      `orbit tool run orbit.task.show --input '{"id":"<task-id>","model":"<agent-family>","fields":["pilot_warnings","history","comments","relations","job_run_id","job_run_machine","artifacts"]}'`.
      Those are the only `orbit.task.show` fields this pass requests. Run records:
      `orbit run show <run-id> --no-reconcile --json` and
      `orbit run history -j <job> --since <window start> --limit 200 --no-reconcile --json`.
      Never drop `--no-reconcile`. Do not read the Orbit database or state files directly.
    - **Writes are limited to these calls.** `orbit.task.add` files a fix;
      `orbit.task.update` adds a comment to an open fix task that covers a group and nothing
      else (only `id`, `comment` and `model`; your own task's `execution_summary` excepted);
      `orbit.friction.add` records a host or Orbit defect with no supported fix. Never change
      another task's status, fields, crew or tags, never call `orbit.task.block_triage`,
      `orbit.task.requeue`, a run resume, `--force` or any other operator-only tool, and never
      complete, reject, archive or approve a task.
    - Search with `orbit tool run orbit.search --input '{"query":"<one distinctive token>","all":true,"model":"<agent-family>"}'`:
      one error code, guard name, finding kind or file name per query. A 0-hit multi-word
      query proves nothing. Read the installed `orbit` skill's `references/task-authoring.md`
      before filing.
    - A pass that finds nothing new still succeeds, with the report and cursor stored. Don't
      invent work.

    ## 1. Windows

    - **Cursor.** Find the newest completed prior pass with `orbit.task.list`
      `{"status":["done"],"tag":["pilot-block-patterns"],"limit":1}` and
      read its `pilot-block-cursor.json` and `pilot-block-report.json` with
      `orbit.task.artifact.get` only after `artifacts` from `orbit.task.show` lists those
      paths. Record the new scan start, the moment this scan starts, before reading any
      task. That instant is this pass's report `scan_start`. It becomes the cursor's
      `cursor` only when section 6 says so. A resume pass does not write it as
      `cursor`. A prior pass whose artifacts can't be read is reported, and this pass
      compares against nothing and is a first pass.
    - **First pass (no prior cursor): the 3 days before scan start.** A pass with no
      readable cursor uses this shorter window, not 14 days, so an existing backlog drains
      over a few passes.
    - **Steady pass (a prior cursor with no `resume_after`): the 14 days before scan
      start.** Report occurrences since the prior cursor separately; they decide whether a
      cause is still firing.
    - **Resume pass (the prior cursor has `resume_after`).** Do not advance the window.
      The window end is the prior cursor's `cursor` value. Write that same value as this
      pass's `cursor`, not this pass's scan start. The window start is the prior pass's
      `pilot-block-report.json` field `window_start`: read it from that artifact in the
      cursor step above, and write that same value as the window start this pass
      continued (the report's `window_start`, and the cursor's `window_start` when this
      pass is still capped). Do not recompute the start from this scan. Continue with
      events strictly after `resume_after`, oldest first, and not past that window end.
      Each later capped resume reads the window start from the prior report's
      `window_start` and again writes the same `cursor`, so the chain keeps one fixed
      window. A later pass advances the window only after a pass finishes it (`partial`
      false and no `resume_after`).

    ## 2. Collect

    No list or search call selects tasks by history-event kind inside a time window. Do not
    scan the task corpus to find events. Build a candidate set, then read at most 60 tasks
    this pass, oldest occurrence first. That cap is the whole collection, including triage
    markers and raw pilot and recovery reads.

    - **Candidates.** Runs of `escalation_triage_pipeline` and
      `blocked_task_recovery_pipeline` since the window start:
      `orbit run history -j <job> --since <window start> --limit 200 --no-reconcile --json`.
      Each run's `task_ids` is a candidate. Those triage runs are the primary input.
      Add the proposed and blocked tasks from the list in Rules when a run did not already
      name them.
    - **Order and cap.** Sort by the earliest time you can see without a per-task read
      (the run's `created_at`, else the task's `updated_at`). Show the first 60 with the
      fields in Rules. When candidates remain, the pass is partial: stop reading, finish
      sections 3–6 for what you read, and still succeed. Set `partial` to true and set
      `resume_after` to the time of the last occurrence you processed. The next pass
      continues from that `resume_after` inside this same window. It does not move the
      window end or the window start.

    For every task you read, record each in-window occurrence with its task id, time and
    source record. Start from the records `escalation_triage_pipeline` already left: its
    disposition is the primary input. Read the raw pilot and recovery records for what it
    did not cover.

    - **Escalation triage dispositions (primary).** Each `pilot_warning_triaged` and
      `blocked_task_triaged` history marker in the window, with its comment
      (`pilot_warning_triage disposition=... outcome=...` or
      `blocked_task_triage disposition=... outcome=...`): the disposition (`human_only`,
      `decision`, `mechanical`), the quoted holding findings or blocker, and the named
      `human_action` or the proposal's options. The human actions recur nearly verbatim
      across tasks (a run resume, a hosted CI rerun of failed jobs, a rebase onto a moved
      base, an Orbit-defect friction), so the normalized human action is the first grouping
      key. Never record a decision of your own on these tasks.
    - **Pilot warnings and holds.** For held tasks without a triage marker, each applied pilot
      assessment (`task_pilot_applied` in history) and the task's `pilot_warnings`: every
      `utility_warnings` and `surface_warnings` finding with its `holds_promotion` flag. Note
      how a hold was later resolved: an operator's `task-pilot-admission:` comment or
      `pilot_admission_decided` decision, a material edit that re-piloted clean, promotion, or
      rejection.
    - **Escalations after final recovery.** For episodes without a triage marker, each
      `final_recovery_decided` history entry and its `final_recovery` comment
      (`outcome=escalated` and the diagnosis). The episode starts at the history entry
      whose `to_status` is `blocked`. The run id is `decision.run_id` on that history
      entry when it is present, otherwise a `run_id=` token in the entry `note`, otherwise
      the task's `job_run_id`. Read that run with
      `orbit run show <run-id> --no-reconcile --json`. For every such episode, note what
      ended it: a later requeue that delivered, an operator applying a proposed option, a
      human edit, a rejection, or nothing yet.

    ## 3. Group by cause and route to the source

    Normalize each occurrence to a signature: the triage disposition and normalized human
    action when one was recorded, then the finding kind or guard name, the failing step, and
    the cause in a few words, with ids, SHAs, paths, PR numbers, run ids, hosts and
    timestamps stripped. A group recurs when it has at least 3 occurrences across 2 distinct
    tasks in the window. Give every recurring group exactly one route:

    - **Authoring:** criteria no lane can verify, missing or wrong `context_files`, a wrong
      `os:` tag, a required contract or tool that does not exist. Find the filer: the
      auto-task definition (its `auto-task:<name>` provenance tag), skill or routine that
      wrote those tasks. The fix changes that filer.
    - **Pilot misjudgment:** holds that later proved harmless, because the operator cleared
      them, a re-pilot passed without a material change, or the task delivered as written.
      The fix changes the task-pilot activity, citing each false hold.
    - **Final recovery gives up too early:** escalated blocks that a later run, escalation
      triage or a human resolved with a cheap mechanical step (a requeue, a refreshed base, a
      rerun). The fix
      changes the final-recovery activity, citing each block and what resolved it.
    - **Orbit run failure:** the block's root cause is a failed or interrupted run.
      `run-failure-patterns` owns these. Only make sure a fix is in flight there: search for
      an open task tagged `run-failure-patterns` that covers the signature and comment on it
      with this pass's occurrences. When none exists, file one bug tagged
      `run-failure-patterns`, linked with `regression_from` to the landed task whose change
      caused it when the evidence names one. Never file a failure-rate measurement task.
    - **Host or setup:** missing tools, credentials, browser kit, sandbox or OS. Record it with
      `orbit tool run orbit.friction.add` (search first), or file a setup chore for the
      operator when it needs a configuration change.

    Groups below the recurrence threshold are listed in the report as `counted`.

    ## 4. Dedupe and file

    For each routed group, search open tasks and tasks closed in the last 30 days for the
    signature and inspect plausible hits:

    - **Open task covers it:** comment once with this pass's counts (window occurrences, new
      since cursor, representative task ids). Don't file.
    - **Done task covers it:** go to section 5.
    - **Rejected task decided not to fix it:** record the mapping and don't file.
    - **Untracked:** verify the mechanism in this checkout (record `git rev-parse HEAD`): name
      the file and the instruction or guard that produces the warning or the escalation, and
      quote a few lines. File one task per group:

      `orbit tool run orbit.task.add --input '{"title":"<fix at the source, naming the cause>","description":"<problem; evidence table: signature, occurrences, distinct tasks, first and last seen, up to three task ids; verified mechanism with file and quoted lines; route and why; proposed change; expected effect>","acceptance_criteria":["<a deterministic check in one leaf showing the source no longer produces the cause>"],"context_files":["file:<verified path of the filer, activity or code to change>"],"complexity":"<assessed, never xhard>","tags":["pilot-block-patterns","no-auto-approve","<authoring|pilot|recovery|run-failure-patterns|setup>"],"type":"bug","relations":[{"type":"spawned_from","target":"<this task ID>"}],"priority":"<low|medium>","workspace":"<current workspace path>","model":"<agent-family>"}'`

      Read each created task back and confirm the `spawned_from` edge.

    File at most 5 new tasks per pass, ranked by occurrences per week they would prevent; list
    the rest in the report as `deferred`.

    ## 5. Check earlier fixes

    For every task this auto-task filed (tag `pilot-block-patterns`) that reached done in the
    last 30 days, compare its group's weekly occurrences before it landed with the weeks after,
    using the prior report for the earlier counts. Report each as `effective`, `not effective`,
    `too early` (under 3 days since landing) or `unknown` (the prior report can't be read). For
    a `not effective` fix, file a regression task as in section 4, naming the done task with
    `{"type":"regression_from","target":"<done task>","regression":{"nature":"incomplete","escape":"unclassified","severity":"<low|medium|high>"}}`
    in `relations`. Compare every group with the prior pass too, and say whether it grew,
    shrank, held or is new.

    ## 6. Corpus proposal, report and cursor

    Before handoff, propose every group observed in this pass in `docs/agents/corpus/`.
    This includes filed and commented groups, groups deferred by the five-fix-task cap,
    and groups below the recurrence threshold. The cap limits fix tasks, never corpus
    records. Follow `docs/design/workspace-agent-corpus/1_scope.md`: one issue document per
    mechanism, with Signature, Mechanism, Resolution, Fix task and Occurrences sections,
    and frontmatter `type`, `applies_to`, `status` and `links`. Link durable source
    evidence and record date, task, run, matched signature and outcome for each occurrence.
    Append evidence-backed occurrences to an existing mechanism instead of duplicating it.
    Never invent unknown causes or resolutions: mark the uncertainty explicitly.

    These worktree changes are a reviewed corpus proposal delivered by this pass's PR,
    not automatic appends from your narrative. This pass is intentionally not tagged
    `no-diff-expected`: a corpus delta follows ordinary validation and review. With no
    new occurrence or mechanism, retain the existing corpus and explain the clean result.
    Where task histories contain system `agent_corpus_append` entries, export those
    histories under `.orbit/tmp/` and run `python3 scripts/agent-corpus.py --records
    <export.json>` to materialize them deterministically. Create a missing topic document
    in this same proposal before materializing its appends. Never fabricate system outbox
    records. Regenerate the index with `python3 scripts/agent-corpus.py`; include all
    corpus changes in the delivery. No group may live only in the report artifact.

    The writes limit above governs other task records; it permits these corpus worktree
    changes on your own managed branch. It does not authorize commits or merges.

    Write `.orbit/tmp/pilot-block-report.json` (`$ORBIT_SCRATCH_DIR`) and attach it as
    `pilot-block-report.json` with `orbit.task.artifact.put`:

    ```json
    {"schema_version": 1, "partial": false, "scan_start": "<RFC 3339>", "head": "<sha>",
     "window_start": "<RFC 3339>", "resume_after": null,
     "groups": [{"signature": "...", "route": "authoring|pilot|recovery|run_failure|setup",
                 "occurrences": 0, "new_since_cursor": 0, "previous": 0, "tasks": ["..."],
                 "disposition": "filed:<id>|commented:<id>|rejected:<id>|regression:<id>|deferred|counted"}],
     "fix_effectiveness": [{"task": "...", "landed": "...", "before_per_week": 0, "after_per_week": 0, "verdict": "..."}]}
    ```

    A capped pass sets `"partial": true` and `resume_after` to the last processed event
    time. Counts cover only the tasks this pass read. A finished window sets `"partial":
    false` and `resume_after` to null. A first or steady pass sets `window_start` from
    section 1 (3 days or 14 days before this scan start). A resume pass sets
    `window_start` to the window start it continued: the prior report's `window_start`,
    read from that prior `pilot-block-report.json`. It sets `scan_start` to the moment
    this scan starts and does not recompute `window_start` from that instant.

    Write the cursor to `.orbit/tmp/pilot-block-cursor.json` and attach it as
    `pilot-block-cursor.json` on every completed owner pass, including an empty one and a
    partial one. A finished first or steady pass is
    `{"schema_version":1,"cursor":"<scan start>"}`. A finished resume pass is
    `{"schema_version":1,"cursor":"<prior cursor's cursor>"}`: `cursor` is the prior
    cursor's `cursor` value, not this pass's scan start. A capped first or steady pass is
    `{"schema_version":1,"cursor":"<scan start>","resume_after":"<last processed event time>"}`.
    A capped resume pass is
    `{"schema_version":1,"cursor":"<prior cursor's cursor>","resume_after":"<last processed event time>","window_start":"<prior report's window_start>"}`.
    That `cursor` is the prior cursor's `cursor` value, not this pass's scan start, and
    that `window_start` is the window start read from the prior pass's
    `pilot-block-report.json`. The next capped resume reads the window start from the
    prior report's `window_start` (this cursor stores the same value) and writes that
    same `cursor` again, so a chain of capped resume passes keeps one fixed window.
    Hitting the collection cap completes the pass: attach both artifacts. An unfinished
    window is not a reason to end without them.

    Execution summary: the groups with route, counts and change against the prior pass; the
    fix-effectiveness verdicts; filed, commented and deferred ids; every tool refusal
    verbatim; and anything unreadable.
  acceptance_criteria:
  - Escalation-triage dispositions (`pilot_warning_triaged` and `blocked_task_triaged` markers and their comments) in this pass's window were collected first from run history, untriaged pilot holds and final-recovery escalations were added from at most 60 task reads of `history`, `comments`, `pilot_warnings` and run records, and `pilot-block-report.json` lists every group from that read with its signature, route, counts and disposition, with `partial` true when the candidate set was capped.
  - Every recurring group (at least 3 occurrences across 2 tasks) has one route (authoring, pilot, recovery, run_failure or setup) and was commented on an open covering task, mapped to a rejected one, or filed, with at most 5 new tasks filed and the rest listed as deferred.
  - Run-failure groups were only commented on an open `run-failure-patterns` task or filed as one tagged `run-failure-patterns`; no failure-rate measurement task was filed.
  - No blocked or pilot-held task was edited, requeued, commented on or triaged; the only writes on other tasks were comments on open fix tasks covering a group.
  - Every group carries its change against the prior pass, and every fix this auto-task filed that reached done in the last 30 days has an effectiveness verdict, with a regression task filed for each `not effective` fix.
  - The pass ran on the owning machine and attached `pilot-block-report.json` and `pilot-block-cursor.json`, including `resume_after` when `partial` is true. When this pass resumed, the attached cursor's `cursor` is the prior cursor's `cursor` (not this scan start) and the report's `window_start` is the window start read from the prior report's `window_start`. Or the pass stopped with `wrong_host` in the execution summary without filing and without attaching a cursor.
  - Every observed group, including deferred and below-threshold groups, is proposed as a mechanism document or appended occurrences in the corpus worktree changes, with a fresh generated index; no group lives only in the report.
  context_files:
  - dir:docs/agents/corpus
  - file:docs/design/workspace-agent-corpus/1_scope.md
  task_type: chore
  tags:
  - pilot-block-patterns
  required_tools:
  - orbit.friction.add
  - orbit.search
  - orbit.task.add
  - orbit.task.artifact.get
  - orbit.task.artifact.put
  - orbit.task.list
  - orbit.task.show
  - orbit.task.update
  priority: medium
  complexity: medium
  status: backlog
