# Claimed owner-local leaf [ORB-12616].
#
# The executable owner-local half of pull-mode drain. A bound claim selects
# this definition; nothing else can run it, because every step below reads the
# trusted worker binding and the durable pull admission that created the run,
# and `execute_pipeline_run_worker` refuses a claimed leaf whose binding does
# not match its claim.
#
# What it deliberately does not contain:
# - No `reserve_locks` / `release_locks`: the owner froze this task's footprint
#   inside the admission transaction, and settlement — not this run — releases
#   it. Re-reserving here would be a second, competing claim.
# - No backlog rediscovery: the owner already chose the task.
# - No `git_merge`, `git_push`, `pr_*` or `task_complete`: the run stops at the
#   typed handoff. Landing is the owner's, behind explicit completion
#   authority (`task_landing_pipeline`).
#
# Failure semantics:
# - A failed step leaves the worktree for inspection and terminalizes the run.
#   The drain's settlement then records the failure against the claim and
#   releases only this claim's reservation.
# - An implementer-declared blocker (`task_blocked_by_agent`) stops the leaf
#   before the next step and before final recovery. Pending changes stay.
# - `claim_validate` fails the run when a required command does not pass on the
#   exact candidate, so no handoff is ever recorded for unvalidated work. A
#   failure the base shares (`baseline_red`) releases the claim with a hold
#   instead, so the owner keeps the task in its backlog until the required
#   command passes on a new base tip.
# - A leaf that ends after `commit` names its committed worktree branch in its
#   failure settlement, and the owner keeps it [ORB-14338]. The task's next
#   claim carries it as `resume_candidate`, and the `resume_candidate` step
#   applies it onto the new base so the implementer continues it, as the
#   claimed PR leaf does. The candidate is already in the owner's own
#   repository, so nothing is pushed.
#
# ORB-14261: a repair claim — admitted after the owner's landing of an earlier
# handoff stopped on a base conflict or stale base — runs this same leaf with
# `claim_repair` set. `resume_candidate` re-applies that handoff's candidate
# onto the current base before the implementer, so the attempt rebases and
# revalidates the preserved work instead of starting over.
#
schemaVersion: 2
kind: Job
metadata:
  name: task_claimed_local_pipeline
spec:
  state: enabled
  # Holds the claimed task's delivery slot while live. No mode: only a claim
  # binding selects this leaf, never a task tag.
  task_delivery: {}
  kind: workflow
  # No job-level ceiling: the drain's own worker limit (`--concurrency`, retuned
  # live by `orbit run concurrency`) bounds how many of these run at once.
  max_active_runs: 0
  default_input:
    task_ids: []
    base_branch: main
    # An owner-local claim delivers into the owner's own checkout: there is no
    # origin to synchronize against and none is required.
    base_sync: local
    landing_mode: local
    allowed_crews: []
    # [ORB-14338] The candidate the owner kept from the task's last claim,
    # set by the claim; `null` implements fresh.
    resume_candidate: null
    # The repair a claim carries when it re-runs a handoff whose landing
    # stopped on its base [ORB-14261]; null for a first attempt.
    claim_repair: null

  steps:
    - id: worktree
      target: activity:worktree_setup
      retry:
        max_attempts: 4
        initial_backoff_ms: 200
        backoff_cap_ms: 2000
        backoff_strategy: exponential
      default_input:
        task_ids: "{{ input.task_ids }}"
        base: "{{ input.base_branch }}"
        base_sync: "{{ input.base_sync }}"
        landing_mode: "{{ input.landing_mode }}"

    # [ORB-14338] Carry the candidate the task's last claim committed onto
    # this base as uncommitted changes, as the claimed PR leaf does. The owner
    # already retired one an operator discarded or whose spec changed.
    # [ORB-14261] A repair claim instead carries the candidate its stopped
    # landing preserved, handed to the implementer as a `conflict` or
    # `landing` repair; the leaf then commits, rebases, revalidates and hands
    # off again under the same task. The implementer always runs: the handoff
    # carries its summary, and `validate` judges the result.
    - id: resume_candidate
      target: activity:candidate_resume
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        task_ids: "{{ input.task_ids }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        base_sha: "{{ steps.worktree.output.base_sha }}"
        candidate: "{{ input.resume_candidate }}"
        claimed: true
        claim_repair: "{{ input.claim_repair }}"

    - id: implement_bundle
      loop:
        items: "{{ input.task_ids }}"
        max_iterations: 256
        steps:
          - id: implement_one
            recovery_activity: step_failure_recovery
            target: activity:agent_implement
            default_input:
              task_id: "{{ item }}"
              workspace_path: "{{ steps.worktree.output.workspace_path }}"
              repo_root: "{{ steps.worktree.output.workspace_path }}"
              # ORB-15287: the pinned delivery base a deferred sandbox
              # validation must name.
              base_sha: "{{ steps.worktree.output.base_sha }}"
              # Claimed mode: the injected envelope is the task, the agent
              # writes no owner task state, and it returns its execution
              # summary in its output for the handoff to carry.
              claimed: true
              resume_candidate: "{{ steps.resume_candidate.output.repair }}"

    - id: commit
      recovery_activity: step_failure_recovery
      target: activity:git_commit
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        scope: all
        verify_already_landed: true
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        base_ref: "{{ steps.worktree.output.base_ref }}"
        base_sha: "{{ steps.worktree.output.base_sha }}"
        # This attempt's implementer output: the delivery gate judges its
        # summary rather than one a previous attempt left on the owner.
        implementation: "{{ steps.implement_one.output }}"

    # Required validation runs on the committed candidate, before any handoff
    # exists. There is nothing to publish first: the local candidate is the
    # delivery.
    - id: validate
      target: activity:claim_validate
      default_input:
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        base_sync: "{{ input.base_sync }}"
        base_sha: "{{ steps.worktree.output.base_sha }}"
        skipped_no_diff_expected: "{{ steps.commit.output.skipped_no_diff_expected }}"
        already_landed_checkpoint: "{{ steps.commit.output }}"
        # ORB-15287: replays a gate the implementer's sandbox deferred.
        implementation: "{{ steps.implement_one.output }}"

    - id: handoff
      target: activity:claim_handoff
      default_input:
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        base_sync: "{{ input.base_sync }}"
        base_sha: "{{ steps.worktree.output.base_sha }}"
        no_diff_evidence: "{{ steps.validate.output.no_diff_evidence }}"
        candidate: "{{ steps.validate.output.candidate }}"
        validation: "{{ steps.validate.output.validation }}"
        # A claim binds exactly one task, so the loop ran once and this is
        # that task's implementer output; its summary becomes the owner's.
        implementation: "{{ steps.implement_one.output }}"
