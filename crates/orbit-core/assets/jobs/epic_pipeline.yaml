# Epic branch assembly and delivery [ORB-10816 / ORB-10818].
#
# One epic owns one stable worktree and branch. Unfinished descendants land
# into that branch through serial local pipelines; the worktree finisher then
# validates and completes the combined result. If the finisher authors a new
# child, the assemble loop re-lists descendants and drains again.
#
# Completion is epic-scoped: leftover descendants at the iteration ceiling
# fail the run closed. Delivery is inlined against the epic worktree — never
# via `task_pr_pipeline`, which would open a second worktree.

schemaVersion: 2
kind: Job
metadata:
  name: epic_pipeline
spec:
  state: enabled
  kind: workflow
  max_active_runs: 1
  default_input:
    epic_task_id: ""
    # ORB-11187: local mode has always completed the epic root itself (the
    # `mark_done` step below), so this governs PR-mode delivery: `done`
    # authorizes merging the epic PR and completing the root.
    completion: review
    # ORB-11242: opt-in, run-scoped crew restriction. Empty means unrestricted,
    # which is the behavior of every caller that does not pass it. Forwarded
    # unchanged so the leaf/epic jobs this run admits inherit the same window.
    allowed_crews: []

  steps:
    - id: resolve_ship_input
      target: activity:resolve_workspace_ship_input
      default_input: {}

    - id: worktree
      target: activity:worktree_setup
      retry:
        max_attempts: 4
        initial_backoff_ms: 200
        backoff_cap_ms: 2000
        backoff_strategy: exponential
      default_input:
        task_ids:
          - "{{ input.epic_task_id }}"
        # Stable checkout token only. Dispatcher still injects the admitted
        # job as `job_run_id`; setup stamps tasks and returns that run so
        # the review gate and later delivery steps look up the captured
        # policy, not this worktree identity [ORB-11520].
        run_id: "epic-{{ input.epic_task_id }}"
        branch_prefix: epic
        base: "{{ steps.resolve_ship_input.output.base_branch }}"
        base_sync: remote

    - id: assemble
      loop:
        max_iterations: 8
        break_when: "{{ steps.remaining.output.empty }} == true"
        steps:
          - id: descendants
            spec:
              type: deterministic
              action: list_epic_descendants
              config: {}
            default_input:
              epic_task_id: "{{ input.epic_task_id }}"

          - id: drain
            loop:
              items: "{{ steps.descendants.output.task_ids }}"
              max_iterations: 256
              steps:
                # Intermediate assembly onto the epic branch, not local-only
                # final delivery. A before-pr snapshot is inherited and the
                # combined candidate is gated later [ORB-11521].
                - id: land_child
                  target: activity:invoke_and_wait
                  timeout_seconds: 7200
                  default_input:
                    job_name: task_local_pipeline
                    run_input:
                      task_ids:
                        - "{{ item }}"
                      base_branch: "{{ steps.worktree.output.head_ref }}"
                      base_sync: local
                      auto_push: false
                      landing_branch: "{{ steps.resolve_ship_input.output.base_branch }}"
                      terminal_status: done
                      allowed_crews: "{{ input.allowed_crews }}"
                    timeout_seconds: 7200

                - id: require_child_success
                  target: activity:pipeline_success_guard
                  default_input:
                    context: epic child local pipeline
                    result: "{{ steps.land_child.output }}"

          - id: finish
            target: activity:epic_orchestrator
            default_input:
              task_id: "{{ input.epic_task_id }}"
              workspace_path: "{{ steps.worktree.output.workspace_path }}"
              repo_root: "{{ steps.worktree.output.workspace_path }}"

          - id: commit_finish
            when: "{{ steps.descendants.output.empty }} == true"
            target: activity:git_commit
            default_input:
              job_run_id: "{{ steps.worktree.output.job_run_id }}"
              scope: all
              workspace_path: "{{ steps.worktree.output.workspace_path }}"
              base_ref: "{{ steps.worktree.output.base_ref }}"
              base_sha: "{{ steps.worktree.output.base_sha }}"

          - id: remaining
            spec:
              type: deterministic
              action: list_epic_descendants
              config: {}
            default_input:
              epic_task_id: "{{ input.epic_task_id }}"

    - id: require_empty
      spec:
        type: deterministic
        action: list_epic_descendants
        config: {}
      default_input:
        epic_task_id: "{{ input.epic_task_id }}"
        fail_if_nonempty: true

    - id: commit_delivery
      target: activity:git_commit
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        scope: all
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        base_ref: "{{ steps.worktree.output.base_ref }}"
        base_sha: "{{ steps.worktree.output.base_sha }}"
        allow_empty: true
        allow_moved_head: true

    - id: prepare_branch
      when: "{{ steps.resolve_ship_input.output.mode }} == pr && {{ steps.commit_delivery.output.skipped_no_diff_expected }} != true"
      target: activity:pr_prepare
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        base: "{{ steps.resolve_ship_input.output.base_branch }}"
        base_sync: remote
        completed_task_ids:
          - "{{ input.epic_task_id }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"

    - id: sync_base
      when: "{{ steps.resolve_ship_input.output.mode }} == pr && {{ steps.commit_delivery.output.skipped_no_diff_expected }} != true"
      target: activity:git_rebase
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        completed_task_ids:
          - "{{ input.epic_task_id }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        head: "{{ steps.prepare_branch.output.head }}"
        head_sha: "{{ steps.prepare_branch.output.head_sha }}"
        base: "{{ steps.prepare_branch.output.base }}"
        base_ref: "{{ steps.prepare_branch.output.base_ref }}"
        base_sha: "{{ steps.prepare_branch.output.base_sha }}"
        remote_sha: "{{ steps.prepare_branch.output.remote_sha }}"
        commits_behind: "{{ steps.prepare_branch.output.commits_behind }}"
        sync_required: "{{ steps.prepare_branch.output.sync_required }}"

    # ORB-11333 / ORB-11520: the before-PR review gate examines the epic's
    # final combined diff after base synchronization and before publication.
    # `job_run_id` is the admitted job (setup output), not the epic worktree
    # token. Both gate steps always run; the local route and no-diff outcomes
    # report `applies: false` or refuse, and a non-pass verdict stops delivery
    # without a PR.
    - id: review_gate_admit
      target: activity:review_gate_admit
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        completed_task_ids:
          - "{{ input.epic_task_id }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        base: "{{ steps.resolve_ship_input.output.base_branch }}"
        base_sync: remote
        mode: "{{ steps.resolve_ship_input.output.mode }}"
        skipped_no_diff_expected: "{{ steps.commit_delivery.output.skipped_no_diff_expected }}"

    - id: review
      when: "{{ steps.review_gate_admit.output.applies }} == true"
      target: activity:agent_review_repair
      default_input:
        task_id: "{{ input.epic_task_id }}"
        task_ids:
          - "{{ input.epic_task_id }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        repo_root: "{{ steps.worktree.output.workspace_path }}"
        attempt_id: "{{ steps.review_gate_admit.output.attempt_id }}"
        manifest_artifact: "{{ steps.review_gate_admit.output.manifest_artifact }}"
        report_artifact: "{{ steps.review_gate_admit.output.report_artifact }}"
        crew: "{{ steps.review_gate_admit.output.reviewer.crew }}"
        remaining_seconds: "{{ steps.review_gate_admit.output.remaining.seconds }}"

    - id: review_gate_settle
      target: activity:review_gate_settle
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        completed_task_ids:
          - "{{ input.epic_task_id }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        base: "{{ steps.resolve_ship_input.output.base_branch }}"
        base_sync: remote
        admission: "{{ steps.review_gate_admit.output }}"

    - id: push
      when: "{{ steps.resolve_ship_input.output.mode }} == pr && {{ steps.commit_delivery.output.skipped_no_diff_expected }} != true"
      target: activity:git_push
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        completed_task_ids:
          - "{{ input.epic_task_id }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        branch: "{{ steps.sync_base.output.head }}"
        base: "{{ steps.sync_base.output.base }}"
        base_ref: "{{ steps.sync_base.output.base_ref }}"
        rewrite_performed: "{{ steps.sync_base.output.rewritten }}"
        rewrite_head_before: "{{ steps.sync_base.output.head_sha_before }}"
        expected_remote_sha: "{{ steps.sync_base.output.remote_sha_before }}"

    - id: pr_open
      when: "{{ steps.resolve_ship_input.output.mode }} == pr && {{ steps.commit_delivery.output.skipped_no_diff_expected }} != true"
      target: activity:pr_open
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        completed_task_ids:
          - "{{ input.epic_task_id }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        base: "{{ steps.sync_base.output.base }}"
        base_ref: "{{ steps.sync_base.output.base_ref }}"
        base_sha: "{{ steps.sync_base.output.base_sha }}"
        base_sync: remote
        head: "{{ steps.sync_base.output.head }}"
        reviewed_head_sha: "{{ steps.review_gate_settle.output.reviewed_head_sha }}"
        reviewed_base_sha: "{{ steps.review_gate_settle.output.reviewed_base_sha }}"

    - id: promote_pr
      when: "{{ steps.resolve_ship_input.output.mode }} == pr && {{ steps.commit_delivery.output.skipped_no_diff_expected }} != true"
      target: activity:pr_promote
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        completed_task_ids:
          - "{{ input.epic_task_id }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        head: "{{ steps.sync_base.output.head }}"
        base: "{{ steps.sync_base.output.base }}"
        base_ref: "{{ steps.sync_base.output.base_ref }}"
        base_sha: "{{ steps.sync_base.output.base_sha }}"
        base_sync: remote
        pr_number: "{{ steps.pr_open.output.pr_number }}"
        pr_url: "{{ steps.pr_open.output.pr_url }}"

    - id: promote_pr_no_diff
      when: "{{ steps.resolve_ship_input.output.mode }} == pr && {{ steps.commit_delivery.output.skipped_no_diff_expected }} == true"
      target: activity:update_task
      default_input:
        task_id: "{{ input.epic_task_id }}"
        status: review

    - id: complete_pr
      when: "{{ steps.resolve_ship_input.output.mode }} == pr && {{ input.completion }} == done && {{ steps.commit_delivery.output.skipped_no_diff_expected }} != true"
      target: activity:pr_complete
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        completed_task_ids:
          - "{{ input.epic_task_id }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        pr_number: "{{ steps.pr_open.output.pr_number }}"
        reviewed_head_sha: "{{ steps.review_gate_settle.output.reviewed_head_sha }}"

    - id: complete_pr_no_diff
      when: "{{ steps.resolve_ship_input.output.mode }} == pr && {{ input.completion }} == done && {{ steps.commit_delivery.output.skipped_no_diff_expected }} == true"
      # `pr_complete`'s no_diff_expected branch asserts the no-diff-expected tag
      # on every task, which is correct for task_pr_pipeline (where the tag is
      # what implied skipped_no_diff_expected in the first place) but wrong
      # here: `commit_delivery` above sets allow_empty: true unconditionally,
      # so an ordinary untagged epic root can land this branch too. `promote_pr_no_diff`
      # already routes around pr_promote's equivalent guard for the same
      # reason; task_complete is the tag-agnostic status-only transition that
      # matches it.
      target: activity:task_complete
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        task_id: "{{ input.epic_task_id }}"

    - id: merge
      when: "{{ steps.resolve_ship_input.output.mode }} == local"
      target: activity:git_merge
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        base: "{{ steps.resolve_ship_input.output.base_branch }}"
        base_sync: local
        strategy: fast_forward
        workspace_path: "{{ steps.worktree.output.workspace_path }}"

    - id: mark_done
      when: "{{ steps.resolve_ship_input.output.mode }} == local"
      target: activity:update_task
      default_input:
        task_id: "{{ input.epic_task_id }}"
        status: done
