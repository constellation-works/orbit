# Owner fulfilment of a review evidence hold whose every requirement is a
# Linux CodeQL run, so a candidate reviewed on a host that cannot complete
# `scripts/codeql-rust-local.sh` (a Mac pull leaf) lands without an operator.
#
# Trigger
# - A Linux owner's sweep tick submits one run per in-progress task whose
#   latest decision is an evidence hold with only `codeql` requirements and
#   no matching result yet. It defers when Bubblewrap namespaces are
#   unavailable. Followers, worker processes and other platforms never submit.
# - Admission is keyed by `attempt_key` (the hold's attempt, candidate and
#   attempt number), and at most one run is active at once. A hold gets one
#   run, plus up to two more only after a refusal that can clear on its own
#   (`disk_insufficient`, `candidate_unreachable`) or a run that ended without
#   an outcome.
#
# Step
# - `fulfil` re-checks the hold, the host and free disk, fetches the held
#   commit from origin when needed, and runs each named command at it in a
#   detached checkout confined by Bubblewrap. The host filesystem is
#   read-only and the checkout is the only writable task-controlled path. It
#   attaches each run's log, and the `codeql` results only when every run
#   completed with no findings; receipt of every result queues a fresh review.
#   A refusal leaves the hold in place with a typed reason. Every attempt is audited as
#   `review.evidence_fulfilment` and commented on the task.
#
# Disk: `min_free_mib` is the free space the state directory's filesystem
# needs (a CodeQL database, toolchain and build). The tick defers while it is
# short, and the step refuses `disk_insufficient`. Override it in a workspace
# copy of this job.

schemaVersion: 2
kind: Job
metadata:
  name: review_evidence_fulfilment_pipeline
spec:
  state: enabled
  kind: workflow
  max_active_runs: 1
  default_input:
    task_id: ""
    hold_key: ""
    attempt_key: ""
    min_free_mib: 30720

  steps:
    - id: fulfil
      target: activity:fulfil_review_evidence
      default_input:
        task_id: "{{ input.task_id }}"
        hold_key: "{{ input.hold_key }}"
        attempt_key: "{{ input.attempt_key }}"
        min_free_mib: "{{ input.min_free_mib }}"
