schemaVersion: 2
kind: Job
metadata:
  name: evolution_pass_pipeline
spec:
  state: enabled
  kind: workflow
  max_active_runs: 1
  steps:
    - id: rank
      target: activity:evolution_rank
    - id: draft
      when: "{{ steps.rank.output.record_count }} != 0"
      target: activity:evolution_draft
      default_input:
        ranking: "{{ steps.rank.output }}"
    - id: apply
      when: "{{ steps.rank.output.record_count }} != 0"
      target: activity:evolution_apply
      default_input:
        proposals: "{{ steps.draft.output.proposals }}"
