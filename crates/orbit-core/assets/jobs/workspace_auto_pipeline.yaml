# Workspace logistics sequencer [ORB-10788 / ORB-10819].
#
# Drains the workspace for a caller-supplied window instead of taking one
# action and exiting. Each iteration re-lists the admissible work, so a task
# that entered `backlog` after the run started still ships.
#
# Throughput model
# - Leaves are dispatched *detached*, and the number of live
#   `task_auto_pipeline` runs is the concurrency ceiling.
#   `classify_workspace_auto_tasks` counts those runs, offers only as many
#   leaves as there are free slots, and excludes tasks that a live child is
#   already carrying — a detached leaf stays `backlog` until its child moves
#   it to `in-progress`, so the child's run input is the only claim record in
#   between.
# - The drain therefore tops the slots up from the whole backlog as each
#   individual child finishes. It used to wait on the entire fan-out before
#   re-listing, which meant one slow leaf held every other slot closed for as
#   long as it ran, and nothing that arrived in the meantime could start.
# - The cost of detaching is that this run no longer observes its leaves'
#   outcomes and no longer cascades cancellation to them; each child records
#   its own result and is durably linked either way. A terminal leaf was
#   already explicitly not a failure of this sequencer
#   (`allow_non_success: true`).
#
# `--approve-proposed` [ORB-14117]
# - Opt-in through `approve_proposed`. Each iteration first selects the
#   qualifying `proposed` tasks (`no-diff-expected`, or context selectors plus
#   an assessed complexity), pilots them with `task_pilot_pipeline` under this
#   drain's own promotion authority, and records what was approved. The
#   admission step that follows the same iteration can then admit them, so a
#   task filed while the window is open is approved and shipped by this drain.
# - Approval is the task-pilot apply boundary's decision, not this file's:
#   it verifies the authority record against this run, refuses any
#   duplicate, already-landed, conflict or warning finding, and approves
#   through the ordinary approve transition. Held tasks stay proposed and are
#   not piloted again until they change. `allowed_crews` and the complexity
#   pools still decide what gets admitted.
# - Without the flag the selection step returns no candidates and the pilot
#   and record steps are skipped.
#
# `for_seconds` gates *starting* the next iteration. It never cancels or
# shortens a child that has already begun. A zero or absent window is expired
# on its first answer, and `break_when` runs after the body, so the default is
# exactly one tick — the behavior every pre-window caller of `orbit run auto`
# has.
#
# `max_iterations` is the fail-closed ceiling, not the intended exit. A
# saturated or empty drain waits at least `poll_sleep_seconds` (30s) per
# iteration, so 4000 outlasts the 24h maximum window with room for the fast
# iterations that only dispatch. An expired window with nothing left is a plain
# success.

schemaVersion: 2
kind: Job
metadata:
  name: workspace_auto_pipeline
spec:
  state: enabled
  kind: workflow
  max_active_runs: 1
  default_input:
    max_tasks: 50
    for_seconds: 0
    # Live `task_auto_pipeline` runs allowed at once. The leaf jobs declare no
    # active-run ceiling of their own, so this is the only bound.
    #
    # ORB-11253: this is the ceiling the run *starts* with, not a fixed one.
    # `orbit run concurrency <run_id> --set N` records a live ceiling on this
    # run's own state, and `classify_workspace_auto_tasks` prefers it on the
    # next admission pass — same run id, same deadline, same completion
    # authorization, same children. Lowering it stops new admissions until
    # enough children finish; it cancels nothing.
    #
    # ORB-11283: `orbit run auto --stop` records `drain_admissions_stop` on
    # this same state. Classify then offers nothing and `drain_window` expires
    # for the stop rather than the deadline. ORB-11310 makes the final check,
    # child insert, and parent link one cross-process SQLite transaction, so a
    # child offered before stop is either already linked or is skipped.
    # Children already submitted keep running; this is not `orbit run cancel`.
    max_active_leaf_runs: 5
    # Waited when the backlog has work but no slot is free: the latency a
    # freed slot sits idle before it is refilled.
    poll_sleep_seconds: 30
    # Waited when nothing is admissible at all.
    idle_sleep_seconds: 60
    # ORB-11187: read from `input` inside the drain loop, so every iteration
    # forwards it — work that entered the backlog after a windowed
    # `orbit run auto --complete` started inherits the same authorization.
    completion: review
    # ORB-11242: opt-in, run-scoped crew restriction. Empty means unrestricted,
    # which is the behavior of every caller that does not pass it. Forwarded
    # unchanged so the leaf jobs this run admits inherit the same window.
    allowed_crews: []
    # ORB-14117: opt-in approval of qualifying proposed tasks each pass.
    approve_proposed: false
    # Complexity pools are captured by Core at coordinator admission from
    # workflow configuration and low/medium/hard/xhard_complexity_crews run
    # overrides.
    # Omit defaults here: an omitted override inherits configuration, while []
    # explicitly disables a pool. Child admission inherits auto_crew_pools and
    # freezes crew_selection per task; templates must not reroll selections.

  steps:
    - id: resolve_ship_input
      target: activity:resolve_workspace_ship_input
      default_input: {}

    - id: open_window
      target: activity:drain_window
      default_input:
        for_seconds: "{{ input.for_seconds }}"

    - id: drain
      loop:
        max_iterations: 4000
        break_when: "{{ steps.window.output.expired }} == true"
        steps:
          - id: approvals
            target: activity:select_proposed_approvals
            default_input:
              approve_proposed: "{{ input.approve_proposed }}"

          # Blocking, so the admission step below sees what this pass
          # approved. A failed pilot is data here, not a drain failure: its
          # tasks stay proposed and the record step reports them.
          - id: approve_proposed
            when: "{{ steps.approvals.output.candidate_count }} != 0"
            target: activity:invoke_and_wait
            default_input:
              job_name: task_pilot_pipeline
              run_input:
                task_ids: "{{ steps.approvals.output.task_ids }}"
                base_branch: "{{ steps.resolve_ship_input.output.base_branch }}"
                promotion_authorized: true
                drain_promotion: "{{ steps.approvals.output.drain_promotion }}"

          - id: approval_report
            when: "{{ steps.approvals.output.candidate_count }} != 0"
            target: activity:record_proposed_approvals
            default_input:
              task_ids: "{{ steps.approvals.output.task_ids }}"
              pilot: "{{ steps.approve_proposed.output }}"

          - id: admissible
            target: activity:classify_workspace_auto_tasks
            default_input:
              max_tasks: "{{ input.max_tasks }}"
              max_active_leaf_runs: "{{ input.max_active_leaf_runs }}"
              poll_sleep_seconds: "{{ input.poll_sleep_seconds }}"
              idle_sleep_seconds: "{{ input.idle_sleep_seconds }}"
              allowed_crews: "{{ input.allowed_crews }}"

          # Detached: the next iteration re-lists immediately and refills any
          # slot that has since freed. The fan-out is over submissions, not
          # over the work itself, so its join costs nothing — it collects the
          # child run IDs, which is the handle this run keeps on them.
          - id: ship_leaves
            when: "{{ steps.admissible.output.has_leaves }} == true"
            fan_out:
              items: "{{ steps.admissible.output.loose_task_dispatches }}"
              max_workers: 5
              worker:
                id: leaf_invoke
                target: activity:invoke_detached
                default_input:
                  job_name: task_auto_pipeline
                  run_input:
                    task_ids: "{{ item.task_ids }}"
                    mode: "{{ steps.resolve_ship_input.output.mode }}"
                    base_branch: "{{ steps.resolve_ship_input.output.base_branch }}"
                    base_sync: "{{ steps.resolve_ship_input.output.base_sync }}"
                    completion: "{{ input.completion }}"
                    allowed_crews: "{{ input.allowed_crews }}"
            fan_in:
              join:
                mode: all
              collect: leaf_dispatches

          - id: window
            target: activity:drain_window
            default_input:
              deadline: "{{ steps.open_window.output.deadline }}"

          # Only when the iteration started nothing. An iteration that
          # dispatched re-lists immediately, because a slot may still be free.
          # The classifier picks the duration: the short poll when the backlog
          # is waiting on a slot, the long one when it is genuinely empty.
          - id: idle_wait
            when: "{{ steps.admissible.output.idle }} == true && {{ steps.window.output.expired }} == false"
            target: activity:sleep
            default_input:
              seconds: "{{ steps.admissible.output.sleep_seconds }}"
