# Single-task PR pipeline.
#
# Failure semantics:
# - Admission accepts one distinct task before creating a run or worktree.
#   Use separate singleton PR runs, or local delivery for a multi-task bundle.
# - `implement_bundle` retains its checkpoint shape but implements only that task.
# - While the run is still alive, the task stays `in-progress`: a step
#   failure that the run recovers from does not block anything. Commit, branch
#   preparation, base synchronization, required validation, push, PR
#   creation/reuse, and promotion are independent durable steps, so recovery
#   resumes at the failed phase.
# - The before-PR reviewer fixes its findings in one reviewer commit on top of
#   the implementation; `review_validate` attributes its paths (widening
#   selectors) and reruns owner validation on that head. A `reject` verdict, or fixes that fail
#   there, stop delivery through the failure handoff with the findings on the
#   task. Final recovery may append a repair commit once; that new candidate
#   reruns commit, owner validation and fresh before-PR review before delivery.
# - An evidence-only verdict ends the run as `held`, before recovery or the
#   failure handoff. The task stays in-progress awaiting named artifacts;
#   matching evidence queues a fresh review rather than approving delivery.
#   The next run resumes the held candidate without implementing it again
#   (ORB-14450); the review gate counts that evidence on the resumed tree, or
#   on a rebase of it whose patch is unchanged. When the hold named only
#   evidence a host-evidence rule owed and the resumed tree is unchanged,
#   admission decides `evidence_received`: the review step is skipped and
#   settlement passes the held review on the arrived evidence.
# - When the run itself terminalizes before PR completion, its recoverable
#   candidate is published and the task is blocked for reconciliation. A
#   required command its base fails the same way (`baseline_red`) is one
#   exception: the candidate is kept unpublished and the task is held in the
#   backlog until the required command passes on a new base tip. An
#   implementer-declared blocker (`task_blocked_by_agent`) is the other: the
#   worktree is left as the implementer left it, nothing is committed or
#   pushed, no `[BLOCKED]` PR is opened, and the task is blocked under that
#   event with the blocker kind. Resume does not move that task back. Once a
#   PR was published and the task promoted to review, a completion-stage merge
#   failure preserves that exact candidate and review state for a safe retry.
# - ORB-14849: with `review.timing = before_landing` captured instead, the pre-push
#   gate does not apply and the PR opens at once; the `landing_review*` steps
#   then review the published head while hosted CI runs on it, and
#   completion merges only the head they settled. When that admission decides
#   `evidence_received` — the held review's owed evidence arrived for the
#   unchanged candidate — `landing_review` is skipped and settlement reuses
#   the held certificate. A fresh `admitted` or `resumed` decision still
#   starts the reviewer. Any outcome but an approve
#   leaves the PR open and unmerged and the task in review with the failed
#   step's typed reason; no outcome closes the PR.
# - A reviewed PR that conflicts at completion is rebased (conflict recovery
#   repairing each stop), re-reviewed and republished, for at most two rounds;
#   a conflict after the second keeps the PR and the task in review. A base
#   that advances again after a completion step's recovery is followed a
#   bounded number of times before failing as base_chase_exhausted.
# - `auto_fix: true` (`orbit run auto --auto-fix`) runs `complete_pr` even
#   without `completion: done`, as a watcher that never merges and ends once
#   the PR is mergeable. With it, a required check that fails on the PR's
#   head is handed to `step_failure_recovery` (the completion step's conflict
#   leaf cannot repair it) and a conflicting head takes the conflict path
#   above. Both draw their crew from `workflow.purpose_crews.auto_fix` (the
#   low complexity pool while that purpose is unset), are
#   admitted against the PR's durable repair ledger (one repair per head and
#   blocker, a bounded budget per PR), and publish the repaired head only
#   after required validation passes on it; a reviewed head is re-reviewed
#   through the rounds below first. Review gates, unreadable checks and other
#   administrative blockers stop without an agent.
# - A final-recovery `requeue` whose run had pushed or opened its PR preserves
#   that publication; the next run's `resume_candidate` adopts the same branch
#   and PR, at the head Orbit's own auto-fix last recorded publishing on it
#   (`pr_auto_fix_pushed`), and refuses a branch moved any other way. Such a
#   run is admitted without waiting on other tasks' context locks
#   (`footprint_deferred`), and takes them before its first agent that may
#   edit; re-applying the unchanged published patch is not an edit.
#
schemaVersion: 2
kind: Job
metadata:
  name: task_pr_pipeline
spec:
  state: enabled
  owns_task_worktree: true
  # Holds each task's delivery slot while live; a task may also select this
  # job for PR shipping with a `delivery:task_pr_pipeline` tag.
  task_delivery:
    modes: [pr]
  kind: workflow
  # No job-level ceiling: the drain's own worker limit (`--concurrency`, retuned
  # live by `orbit run concurrency`) bounds how many of these run at once.
  max_active_runs: 0
  # ORB-13907: once step recovery is spent, a crew from
  # `workflow.purpose_crews.final_recovery` gets one last look and returns a typed
  # decision. `resume` reruns from the failed step or an earlier one of its
  # phase; `escalate` blocks the task and still runs `failure_activity`; any
  # other decision is applied by Orbit's deterministic applier and the run ends
  # without a blocked PR. An empty crew pool skips it.
  final_recovery_activity: final_recovery
  # Mid-run steering's promotion gate (docs/design/mid-run-steering/2_design.md
  # §3). With `workflow.mid_run_steering.enabled`, the run does not reach
  # `commit` while an operator comment past its steering watermark is
  # undelivered. Each refusal spends one of `workflow.mid_run_steering.max_rounds`
  # steering rounds: `implement_bundle` runs again, even for a carried
  # candidate, so the implementer's next prompt carries the steering block onto
  # the candidate still uncommitted in this worktree. When no round is left, or
  # the last one delivered nothing, the task is blocked as `steering_unconsumed`
  # naming the outstanding comments. An unreadable gate or a task gone terminal
  # stops the run before `commit` as well. Steering off, nothing is read.
  # A candidate `resume_candidate` carries past `implement_bundle` was built by
  # the run it names as `source_run_id`, so the gate judges from that run's
  # watermark, never from this run's start.
  steering_gate:
    before: commit
    round: implement_bundle
    candidate: resume_candidate
  # Preserve recoverable work after terminal failures while keeping the
  # original error authoritative. Completion-stage failures retain the
  # already-published PR instead of fabricating a conflict handoff.
  failure_activity: pr_failure_handoff
  default_input:
    task_ids: []
    base_branch: main
    base_sync: remote
    # ORB-10644: the branch this work must ultimately land on. Empty means the
    # base *is* the landing branch — the ordinary, non-stacked case, where the
    # obsolescence gate only checks that the base still exists on `origin`. A
    # dispatcher stacking onto an intermediate branch sets this to the real
    # landing branch so delivery fails closed once that branch has landed.
    landing_branch: ""
    # ORB-11187: `review` (default) ends the run at the PR handoff. `done` is
    # explicit per-invocation operator authorization to also merge the PR and
    # complete the tasks, which only happens after the merge is verified.
    completion: review
    # `--auto-fix`: repair authority, never merge authority, over this run's
    # PR (see the header and `pr_complete`). Requires the PR route below.
    auto_fix: false
    # ORB-11242: the run-scoped crew restriction the auto-drain admitting this
    # run applied. Empty means unrestricted. This is the innermost carrier: the
    # agent activities below resolve their crew against this run input, so the
    # dispatch gate refuses a crew the window excluded before a provider starts.
    allowed_crews: []
    # Set by the gate when it admitted a resumed published delivery without
    # its context locks. Before an agent that may edit the worktree runs, the
    # run then takes them like any reservation, polling every
    # `footprint_poll_seconds` for at most `footprint_wait_seconds` while
    # other tasks hold them; still held, the dispatch is refused.
    footprint_deferred: false
    footprint_wait_seconds: 3600
    footprint_poll_seconds: 30
    title: null
    body: null

  steps:
    - id: worktree
      stage: { id: setup, label: Setup }
      target: activity:worktree_setup
      retry:
        max_attempts: 4
        initial_backoff_ms: 200
        backoff_cap_ms: 2000
        backoff_strategy: exponential
      default_input:
        task_ids: "{{ input.task_ids }}"
        base: "{{ input.base_branch }}"
        base_sync: "{{ input.base_sync }}"

    # Refuse exhausted resumed lineages before spending implementer time.
    - id: review_preflight
      target: activity:review_gate_admit
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        completed_task_ids: "{{ input.task_ids }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        base: "{{ input.base_branch }}"
        base_sync: "{{ input.base_sync }}"
        preflight: true

    # ORB-13985: a task whose last failed run preserved a candidate resumes
    # it rather than re-implementing: the candidate is squash-merged onto
    # this base. A completed owner-local candidate that failed at `commit`
    # or later is carried unvalidated and skips `implement_bundle`; the final
    # gate judges its committed candidate. A conflict or review refusal hands
    # the implementer the applied candidate and that output to repair. Work
    # preserved from `implement_bundle` or before `commit` is unfinished
    # (ORB-14024): the implementer always runs on it. A discarded candidate,
    # a changed spec or a bundle implements fresh. ORB-14450: a candidate held
    # on named evidence whose receipt arrived resumes as `resumed_held`,
    # skipping `implement_bundle`; selector edits keep any candidate.
    # ORB-14603: after a failed claim, the candidate the owner kept from it
    # is continued, never a local run that shares the leaf's id.
    - id: resume_candidate
      target: activity:candidate_resume
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        task_ids: "{{ input.task_ids }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        base_sha: "{{ steps.worktree.output.base_sha }}"
        prior_job_run_id: "{{ steps.worktree.output.prior_job_run_id }}"
        prior_foreign_run: "{{ steps.worktree.output.prior_foreign_run }}"

    - id: implement_bundle
      stage: { id: implement, label: Implement }
      when: "{{ steps.resume_candidate.output.implement }} == true"
      loop:
        items: "{{ input.task_ids }}"
        max_iterations: 1
        steps:
          # The engine injects typed final_recovery_resume into every nested
          # target of a resumed phase. agent_implement addresses its rationale
          # and refused output first, including for a claimed invocation.
          - id: implement_one
            recovery_activity: step_failure_recovery
            target: activity:agent_implement
            default_input:
              task_id: "{{ item }}"
              workspace_path: "{{ steps.worktree.output.workspace_path }}"
              repo_root: "{{ steps.worktree.output.workspace_path }}"
              # ORB-15287: the pinned delivery base a deferred sandbox
              # validation must name.
              base_sha: "{{ steps.worktree.output.base_sha }}"
              # ORB-15963: `validate` runs the required commands on the final
              # candidate, so the envelope lists them for the implementer to
              # leave to it.
              final_validation: true
              resume_candidate: "{{ steps.resume_candidate.output.repair }}"

    - id: commit
      stage: { id: validate, label: Validate }
      recovery_activity: step_failure_recovery
      target: activity:git_commit
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        scope: all
        # This pipeline rechecks accepted landing evidence at both handoffs.
        verify_already_landed: true
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        base_ref: "{{ steps.worktree.output.base_ref }}"
        base_sha: "{{ steps.worktree.output.base_sha }}"

    - id: prepare_branch
      when: "{{ steps.commit.output.skipped_no_diff_expected }} != true"
      recovery_activity: step_failure_recovery
      target: activity:pr_prepare
      default_input:
        authenticate_preparation: true
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        base: "{{ input.base_branch }}"
        base_sync: "{{ input.base_sync }}"
        completed_task_ids: "{{ input.task_ids }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"

    - id: sync_base
      when: "{{ steps.commit.output.skipped_no_diff_expected }} != true"
      # Only the typed unmerged-index conflict emitted by git_rebase may
      # dispatch this leaf. Other VCS failures preserve the original error and
      # fall through to the terminal candidate handoff without an agent.
      # A clean rebase or conflict recovery that leaves the branch on its base,
      # because a base commit already carries the candidate's change, fails
      # the step as `[candidate_absorbed]`. Final recovery re-verifies the
      # certified evidence and settles it as `complete_no_diff` for that
      # commit without dispatching its agent; any refusal reaches the agent
      # as `absorbed_refusal`.
      recovery_activity: pr_conflict_recovery
      # A certified stale preparation is refreshed by the host at most twice
      # within one 120-second budget; only real conflicts dispatch recovery.
      target: activity:git_rebase
      default_input:
        step_id: sync_base
        preparation: "{{ steps.prepare_branch.output }}"
        final_validation: true
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        completed_task_ids: "{{ input.task_ids }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        head: "{{ steps.prepare_branch.output.head }}"
        head_sha: "{{ steps.prepare_branch.output.head_sha }}"
        base: "{{ steps.prepare_branch.output.base }}"
        base_ref: "{{ steps.prepare_branch.output.base_ref }}"
        base_sha: "{{ steps.prepare_branch.output.base_sha }}"
        remote_sha: "{{ steps.prepare_branch.output.remote_sha }}"
        commits_behind: "{{ steps.prepare_branch.output.commits_behind }}"
        sync_required: "{{ steps.prepare_branch.output.sync_required }}"

    # ORB-13915: `workflow.required_validation_commands` run deterministically
    # on the exact synchronized candidate, before review and publication. An
    # agent's report that it ran them is not evidence; this step's attached
    # logs are. A failing command fails here, so step recovery can repair the
    # candidate and the post-recovery attempt reruns the whole suite on the
    # new head. ORB-14822: the recovery sandbox keeps Git metadata read-only,
    # so the agent leaves its repair uncommitted and Orbit commits it, with
    # recovery provenance, before that attempt. A repair touching Git or
    # `.orbit` metadata, an environment file, a symlink or a gitlink is
    # refused with a typed `recovery_commit_refused` reason and nothing is
    # committed. It precedes the review gate so such a repair is reviewed and
    # pinned like any other candidate change. An empty list is a no-op.
    # ORB-14258: a network-inconclusive failure is rerun first, and one that
    # survives is rerun on `base_sha`. A failure the base shares fails as a
    # typed `baseline_red`: no recovery runs, and the failure handoff keeps
    # the candidate without a PR and holds the task in the backlog until
    # `base_ref` moves to a commit where the command passes.
    - id: validate
      when: "{{ steps.commit.output.skipped_no_diff_expected }} != true"
      recovery_activity: step_failure_recovery
      target: activity:candidate_validate
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        completed_task_ids: "{{ input.task_ids }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        base_sha: "{{ steps.sync_base.output.base_sha }}"
        base_ref: "{{ steps.sync_base.output.base_ref }}"

    # Visual review (capture of record and checks): for a `verify-mock-ui`
    # task whose `visual_review.mode` is not `off`, capture the final
    # candidate in a detached checkout once per mock at the digests frozen
    # at admission, attach the side-by-side images and the system-written
    # `visual/capture.json`, record the deterministic checks, and settle the
    # capture against the head and the frozen mocks (`stale_capture`,
    # `mock_changed`). Every other delivery reports `applies: false` and
    # writes nothing. In shadow nothing blocks; only
    # `visual_review.require_established` holds a capture that is not
    # established.
    # It always runs, so the later steps' conditions may read its output;
    # a `no-diff-expected` skip has no candidate and reports `applies: false`.
    - id: visual_capture
      target: activity:visual_capture
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        completed_task_ids: "{{ input.task_ids }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        skipped_no_diff_expected: "{{ steps.commit.output.skipped_no_diff_expected }}"

    - id: visual_checks
      when: "{{ steps.visual_capture.output.applies }} == true"
      target: activity:visual_checks
      default_input:
        capture: "{{ steps.visual_capture.output }}"

    # Mock comparison review and in-line verification, in shadow: prepare
    # assembles each shown mock with its capture under the image budgets
    # and draws an image-capable reviewer, verifier and escalation crew;
    # the reviewer answers the eight comparison questions; verify-prepare
    # drops invalid evidence and partitions the findings (check findings
    # included) five per verifier invocation; one escalation round
    # re-verifies low-confidence verdicts. `visual_settle` records the
    # outcome in `visual/review.json` under purpose `visual_review`.
    # Shadow only: nothing here is filed, blocks, or reaches the code
    # reviewer below, whose inputs do not name any visual step.
    # Preparers always run and return empty collections when capture does not
    # apply. Conditions may only read outputs whose producer always runs;
    # empty fan-outs establish the collected aliases without invoking agents.
    - id: visual_review_prepare
      target: activity:visual_review_prepare
      default_input:
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        capture: "{{ steps.visual_capture.output }}"

    - id: visual_review_empty
      when: "{{ steps.visual_review_prepare.output.review_count }} == 0"
      fan_out:
        items: "[]"
        max_workers: 1
        worker:
          id: empty_visual_reviewer
          target: activity:visual_review
      fan_in:
        join: { mode: all }
        collect: visual_review_results
        errors: visual_review_errors

    - id: visual_reviewers
      when: "{{ steps.visual_review_prepare.output.review_count }} != 0"
      fan_out:
        items: "{{ steps.visual_review_prepare.output.reviews }}"
        max_workers: 3
        worker:
          id: visual_reviewer
          target: activity:visual_review
          default_input:
            task_id: "{{ item.task_id }}"
            candidate_sha: "{{ item.candidate_sha }}"
            workspace_path: "{{ item.workspace_path }}"
            crew: "{{ item.crew }}"
            image_input: "{{ item.image_input }}"
            staged_images: "{{ item.staged_images }}"
            shown: "{{ item.shown }}"
            not_shown: "{{ item.not_shown }}"
            max_findings: "{{ item.max_findings }}"
            task: "{{ item.task }}"
            deviations: "{{ item.deviations }}"
            check_findings: "{{ item.check_findings }}"
            design_rules: "{{ item.design_rules }}"
            catalog: "{{ item.catalog }}"
      fan_in:
        join: { mode: any }
        collect: visual_review_results
        errors: visual_review_errors

    - id: visual_verify_prepare
      target: activity:visual_verify_prepare
      default_input:
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        prepared: "{{ steps.visual_review_prepare.output }}"
        review_results: "{{ steps.visual_review_results.output }}"

    - id: visual_verify_empty
      when: "{{ steps.visual_verify_prepare.output.partition_count }} == 0"
      fan_out:
        items: "[]"
        max_workers: 1
        worker:
          id: empty_visual_verifier
          target: activity:visual_verify
      fan_in:
        join: { mode: all }
        collect: visual_verify_results
        errors: visual_verify_errors

    - id: visual_verifiers
      when: "{{ steps.visual_verify_prepare.output.partition_count }} != 0"
      fan_out:
        items: "{{ steps.visual_verify_prepare.output.partitions }}"
        max_workers: 5
        worker:
          id: visual_verifier
          target: activity:visual_verify
          default_input:
            task_id: "{{ item.task_id }}"
            partition_index: "{{ item.partition_index }}"
            escalation: "{{ item.escalation }}"
            workspace_path: "{{ item.workspace_path }}"
            crew: "{{ item.crew }}"
            image_input: "{{ item.image_input }}"
            staged_images: "{{ item.staged_images }}"
            findings: "{{ item.findings }}"
            catalog: "{{ item.catalog }}"
      fan_in:
        join: { mode: any }
        collect: visual_verify_results
        errors: visual_verify_errors

    - id: visual_verify_escalations
      target: activity:visual_verify_prepare
      default_input:
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        prepared: "{{ steps.visual_verify_prepare.output }}"
        verify_results: "{{ steps.visual_verify_results.output }}"
        round: escalation

    - id: visual_verify_escalation_empty
      when: "{{ steps.visual_verify_escalations.output.partition_count }} == 0"
      fan_out:
        items: "[]"
        max_workers: 1
        worker:
          id: empty_visual_escalation_verifier
          target: activity:visual_verify
      fan_in:
        join: { mode: all }
        collect: visual_escalation_results
        errors: visual_escalation_errors

    - id: visual_escalation_verifiers
      when: "{{ steps.visual_verify_escalations.output.partition_count }} != 0"
      fan_out:
        items: "{{ steps.visual_verify_escalations.output.partitions }}"
        max_workers: 5
        worker:
          id: visual_escalation_verifier
          target: activity:visual_verify
          default_input:
            task_id: "{{ item.task_id }}"
            partition_index: "{{ item.partition_index }}"
            escalation: "{{ item.escalation }}"
            workspace_path: "{{ item.workspace_path }}"
            crew: "{{ item.crew }}"
            image_input: "{{ item.image_input }}"
            staged_images: "{{ item.staged_images }}"
            findings: "{{ item.findings }}"
            catalog: "{{ item.catalog }}"
      fan_in:
        join: { mode: any }
        collect: visual_escalation_results
        errors: visual_escalation_errors

    - id: visual_settle
      when: "{{ steps.visual_capture.output.applies }} == true"
      target: activity:visual_settle
      default_input:
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        capture: "{{ steps.visual_capture.output }}"
        checks: "{{ steps.visual_checks.output }}"
        verified: "{{ steps.visual_verify_prepare.output }}"
        verify_results: "{{ steps.visual_verify_results.output }}"
        escalation_prepared: "{{ steps.visual_verify_escalations.output }}"
        escalation_results: "{{ steps.visual_escalation_results.output }}"

    # ORB-11333: the before-PR review gate sits after the final planned base
    # synchronization and before push/PR creation. `review_gate_admit` and
    # `review_gate_settle` always run so later steps can read their output;
    # they report `applies: false` when the run captured no
    # `review.timing = before_pr` (`before_landing` reviews after `pr_open` instead), and for
    # a checked no-diff exemption. Transient gate and reviewer failures retry,
    # then get one diagnosed recovery before the run fails.
    #
    # ORB-13989: one fresh reviewer per candidate fixes what it finds. The
    # settlement commits its changes as the candidate's reviewer commit
    # (`review: <summary>`) over the untouched implementation commit and posts
    # the findings on the task. `reject` or `incomplete` refuses
    # `review_gate_settle` (no retry): substantive failures preserve the
    # candidate and block the task; evidence-only gaps hold it in progress.
    # A reviewer timeout preserves partial work and allows one automatic
    # backlog requeue per task/implementation tree (the candidate tree beneath
    # the reviewer's partial-repair commits); another timeout on that tree
    # blocks with review_timeout_requeue_exhausted. Fresh runs have new review
    # lineages and budgets, but neither rewriting the commit nor the reviewer's
    # partial work resets this bound.
    # None of these outcomes opens a PR.
    - id: review_gate_admit
      stage: { id: review, label: Review }
      retry:
        max_attempts: 3
        initial_backoff_ms: 1000
        backoff_cap_ms: 10000
        backoff_strategy: exponential
      recovery_activity: step_failure_recovery
      target: activity:review_gate_admit
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        completed_task_ids: "{{ input.task_ids }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        base: "{{ input.base_branch }}"
        base_sync: "{{ input.base_sync }}"
        mode: pr
        skipped_no_diff_expected: "{{ steps.commit.output.skipped_no_diff_expected }}"

    - id: review
      when: "{{ steps.review_gate_admit.output.applies }} == true && {{ steps.review_gate_admit.output.decision }} != evidence_received"
      retry:
        max_attempts: 2
        initial_backoff_ms: 5000
        backoff_cap_ms: 5000
        backoff_strategy: linear
      recovery_activity: step_failure_recovery
      target: activity:agent_review_repair
      default_input:
        task_id: "{{ steps.review_gate_admit.output.first_task_id }}"
        task_ids: "{{ input.task_ids }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        repo_root: "{{ steps.worktree.output.workspace_path }}"
        attempt_id: "{{ steps.review_gate_admit.output.attempt_id }}"
        lineage_key: "{{ steps.review_gate_admit.output.lineage_key }}"
        manifest_artifact: "{{ steps.review_gate_admit.output.manifest_artifact }}"
        report_artifact: "{{ steps.review_gate_admit.output.report_artifact }}"
        crew: "{{ steps.review_gate_admit.output.reviewer.crew }}"

    - id: review_gate_settle
      retry:
        max_attempts: 3
        initial_backoff_ms: 1000
        backoff_cap_ms: 10000
        backoff_strategy: exponential
      recovery_activity: step_failure_recovery
      target: activity:review_gate_settle
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        completed_task_ids: "{{ input.task_ids }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        base: "{{ input.base_branch }}"
        base_sync: "{{ input.base_sync }}"
        admission: "{{ steps.review_gate_admit.output }}"

    # ORB-13989: the owner revalidates a reviewer commit before publishing it:
    # the required validation commands on the new head, and task ownership of
    # every path the reviewer changed since the implementation head. A failure
    # is the review's `reject`: no step recovery and no second review round;
    # the failure handoff blocks the task with the candidate preserved.
    - id: review_validate
      when: "{{ steps.review_gate_settle.output.reviewer_fixed }} == true"
      target: activity:candidate_validate
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        completed_task_ids: "{{ input.task_ids }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        base_sha: "{{ steps.sync_base.output.base_sha }}"
        base_ref: "{{ steps.sync_base.output.base_ref }}"
        ownership_base_sha: "{{ steps.review_gate_settle.output.implementation_head_sha }}"

    - id: push
      stage: { id: publish, label: Publish }
      when: "{{ steps.commit.output.skipped_no_diff_expected }} != true"
      recovery_activity: step_failure_recovery
      target: activity:git_push
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        completed_task_ids: "{{ input.task_ids }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        branch: "{{ steps.sync_base.output.head }}"
        base: "{{ steps.sync_base.output.base }}"
        base_ref: "{{ steps.sync_base.output.base_ref }}"
        rewrite_performed: "{{ steps.sync_base.output.rewritten }}"
        rewrite_head_before: "{{ steps.sync_base.output.head_sha_before }}"
        expected_remote_sha: "{{ steps.sync_base.output.remote_sha_before }}"

    - id: pr_open
      when: "{{ steps.commit.output.skipped_no_diff_expected }} != true"
      recovery_activity: step_failure_recovery
      target: activity:pr_open
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        completed_task_ids: "{{ input.task_ids }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        base: "{{ steps.sync_base.output.base }}"
        base_ref: "{{ steps.sync_base.output.base_ref }}"
        base_sha: "{{ steps.sync_base.output.base_sha }}"
        base_sync: "{{ input.base_sync }}"
        landing_branch: "{{ input.landing_branch }}"
        head: "{{ steps.sync_base.output.head }}"
        reviewed_head_sha: "{{ steps.review_gate_settle.output.reviewed_head_sha }}"
        reviewed_base_sha: "{{ steps.review_gate_settle.output.reviewed_base_sha }}"
        review_fixes: "{{ steps.review_gate_settle.output.review_fixes }}"
        body: "{{ input.body }}"
        title: "{{ input.title }}"
        # [ORB-15570] Its `prior_pull_request` is the one the claim whose
        # candidate this run resumed opened (a before-landing evidence hold
        # leaves it open): closed with a comment naming this run's.
        candidate_resume: "{{ steps.resume_candidate.output }}"

    - id: promote_tasks
      when: "{{ steps.commit.output.skipped_no_diff_expected }} != true"
      recovery_activity: step_failure_recovery
      target: activity:pr_promote
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        completed_task_ids: "{{ input.task_ids }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        head: "{{ steps.sync_base.output.head }}"
        base: "{{ steps.sync_base.output.base }}"
        base_ref: "{{ steps.sync_base.output.base_ref }}"
        base_sha: "{{ steps.sync_base.output.base_sha }}"
        base_sync: "{{ input.base_sync }}"
        landing_branch: "{{ input.landing_branch }}"
        pr_number: "{{ steps.pr_open.output.pr_number }}"
        pr_url: "{{ steps.pr_open.output.pr_url }}"

    # A verified finding-invalid report already rejected its task at
    # `commit`, so nothing is promoted for it.
    - id: promote_no_diff
      when: "{{ steps.commit.output.skipped_no_diff_expected }} == true && {{ steps.commit.output.decision }} != verified_finding_invalid"
      recovery_activity: step_failure_recovery
      target: activity:pr_promote
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        completed_task_ids: "{{ input.task_ids }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        no_diff_expected: true
        already_landed_checkpoint: "{{ steps.commit.output }}"

    # ORB-14849: the before-landing review of the published PR, while hosted
    # CI runs on its head. The gate steps always run and report `applies:
    # false` unless the run captured `review.timing = before_landing`, and for a
    # checked no-diff exemption; they run whatever `completion` is, so a
    # review-only run hands off a reviewed PR. One fresh reviewer from the
    # run's lineage and budget fixes what it finds as one reviewer commit
    # (ORB-13989). `landing_review_validate` reruns owner validation and the
    # ownership check on that commit, and `landing_push` pushes it to the PR
    # branch under a lease on the published head, which restarts hosted CI.
    # `complete_pr` merges only the head this settle reviewed. Every step
    # here is completion-stage: a reject, incomplete, timeout, lost lease or
    # settle error keeps the PR open and unmerged and the task in review with
    # that step's typed reason.
    - id: landing_review_gate_admit
      stage: { id: landing_review, label: Review }
      retry:
        max_attempts: 3
        initial_backoff_ms: 1000
        backoff_cap_ms: 10000
        backoff_strategy: exponential
      recovery_activity: step_failure_recovery
      target: activity:review_gate_admit
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        completed_task_ids: "{{ input.task_ids }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        base: "{{ input.base_branch }}"
        base_sync: "{{ input.base_sync }}"
        mode: pr
        skipped_no_diff_expected: "{{ steps.commit.output.skipped_no_diff_expected }}"
        before_landing: true

    # Same exclusion as `review`: an owed hold whose evidence arrived settles
    # on the held certificate and must not start another reviewer.
    - id: landing_review
      when: "{{ steps.landing_review_gate_admit.output.applies }} == true && {{ steps.landing_review_gate_admit.output.decision }} != evidence_received"
      retry:
        max_attempts: 2
        initial_backoff_ms: 5000
        backoff_cap_ms: 5000
        backoff_strategy: linear
      recovery_activity: step_failure_recovery
      target: activity:agent_review_repair
      default_input:
        task_id: "{{ steps.landing_review_gate_admit.output.first_task_id }}"
        task_ids: "{{ input.task_ids }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        repo_root: "{{ steps.worktree.output.workspace_path }}"
        attempt_id: "{{ steps.landing_review_gate_admit.output.attempt_id }}"
        lineage_key: "{{ steps.landing_review_gate_admit.output.lineage_key }}"
        manifest_artifact: "{{ steps.landing_review_gate_admit.output.manifest_artifact }}"
        report_artifact: "{{ steps.landing_review_gate_admit.output.report_artifact }}"
        crew: "{{ steps.landing_review_gate_admit.output.reviewer.crew }}"

    - id: landing_review_gate_settle
      retry:
        max_attempts: 3
        initial_backoff_ms: 1000
        backoff_cap_ms: 10000
        backoff_strategy: exponential
      recovery_activity: step_failure_recovery
      target: activity:review_gate_settle
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        completed_task_ids: "{{ input.task_ids }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        base: "{{ input.base_branch }}"
        base_sync: "{{ input.base_sync }}"
        admission: "{{ steps.landing_review_gate_admit.output }}"

    - id: landing_review_validate
      when: "{{ steps.landing_review_gate_settle.output.reviewer_fixed }} == true"
      target: activity:candidate_validate
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        completed_task_ids: "{{ input.task_ids }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        base_sha: "{{ steps.sync_base.output.base_sha }}"
        base_ref: "{{ steps.sync_base.output.base_ref }}"
        ownership_base_sha: "{{ steps.landing_review_gate_settle.output.implementation_head_sha }}"

    - id: landing_push
      when: "{{ steps.landing_review_gate_settle.output.reviewer_fixed }} == true"
      target: activity:git_push
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        completed_task_ids: "{{ input.task_ids }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        branch: "{{ steps.sync_base.output.head }}"
        base: "{{ steps.sync_base.output.base }}"
        base_ref: "{{ steps.sync_base.output.base_ref }}"
        lease_remote_sha: "{{ steps.push.output.local_sha }}"
        pr_number: "{{ steps.pr_open.output.pr_number }}"

    - id: complete_pr
      stage: { id: merge, label: Merge }
      when: "{{ input.completion }} == done && {{ steps.commit.output.skipped_no_diff_expected }} != true || {{ input.auto_fix }} == true && {{ steps.commit.output.skipped_no_diff_expected }} != true"
      # A DIRTY PR is repaired only after pr_complete reuses git_rebase to
      # prove real unmerged entries. Protection, review, check, auth, stale
      # ownership, and lease failures remain ineligible for agent recovery.
      # ORB-13890: a DIRTY PR whose head the gate reviewed is rebased locally
      # but not published; `re_review_required` routes it through the steps
      # below instead of leaving the task in review as review_gate_stale.
      # ORB-14393: the retry after conflict recovery re-pins to the base it
      # fetches. A base that advanced past the certified recovery is chased:
      # a clean rebase of the recovered head is certified for the new base, a
      # conflicting one is redone from the published head for another bounded
      # recovery, and a step that keeps chasing fails as base_chase_exhausted.
      recovery_activity: pr_conflict_recovery
      target: activity:pr_complete
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        completed_task_ids: "{{ input.task_ids }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        pr_number: "{{ steps.pr_open.output.pr_number }}"
        completion: "{{ input.completion }}"
        # Completion receives the new execution run_id from the dispatcher.
        # Its durable retry ancestors authorize prior auto-fix ledger entries;
        # the successful push checkpoint below deliberately retains its SHA.
        auto_fix: "{{ input.auto_fix }}"
        allowed_crews: "{{ input.allowed_crews }}"
        head: "{{ steps.sync_base.output.head }}"
        published_head_sha: "{{ steps.push.output.local_sha }}"
        previous_published_head_sha: "{{ steps.push.output.remote_sha_before }}"
        reviewed_head_sha: "{{ steps.review_gate_settle.output.reviewed_head_sha }}"
        # ORB-14849: set only when the before-landing review settled; it then
        # is the head to merge, and the published head after a reviewer fix.
        landing_reviewed_head_sha: "{{ steps.landing_review_gate_settle.output.reviewed_head_sha }}"
        # Selective before-landing review: the head the landing gate's
        # selection receipt evaluated, or empty when no selective policy
        # was captured. Completion refuses a live head it does not pin.
        selective_selection_head_sha: "{{ steps.landing_review_gate_settle.output.selective_selection_head_sha }}"
        re_review_on_conflict: true
        base: "{{ steps.sync_base.output.base }}"
        base_sync: "{{ input.base_sync }}"

    # ORB-13890: review the rebased head with a fresh reviewer start from the
    # same lineage, republish it under the rebase lease, then complete it.
    # Any failure here keeps the published PR and the task in review.
    # `complete_pr` may be skipped, so no `when:` reads its output:
    # `re_review_gate_admit` always runs, reads the run's recorded
    # `complete_pr` checkpoint itself, and its `applies` gates the rest.
    - id: re_review_gate_admit
      stage: { id: re_review, label: Re-review }
      retry:
        max_attempts: 3
        initial_backoff_ms: 1000
        backoff_cap_ms: 10000
        backoff_strategy: exponential
      recovery_activity: step_failure_recovery
      target: activity:review_gate_admit
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        completed_task_ids: "{{ input.task_ids }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        base: "{{ input.base_branch }}"
        base_sync: "{{ input.base_sync }}"
        mode: pr
        completion: "{{ input.completion }}"
        auto_fix: "{{ input.auto_fix }}"
        skipped_no_diff_expected: "{{ steps.commit.output.skipped_no_diff_expected }}"
        re_review_after: complete_pr

    - id: re_review
      when: "{{ steps.re_review_gate_admit.output.applies }} == true"
      retry:
        max_attempts: 2
        initial_backoff_ms: 5000
        backoff_cap_ms: 5000
        backoff_strategy: linear
      recovery_activity: step_failure_recovery
      target: activity:agent_review_repair
      default_input:
        task_id: "{{ steps.re_review_gate_admit.output.first_task_id }}"
        task_ids: "{{ input.task_ids }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        repo_root: "{{ steps.worktree.output.workspace_path }}"
        attempt_id: "{{ steps.re_review_gate_admit.output.attempt_id }}"
        lineage_key: "{{ steps.re_review_gate_admit.output.lineage_key }}"
        manifest_artifact: "{{ steps.re_review_gate_admit.output.manifest_artifact }}"
        report_artifact: "{{ steps.re_review_gate_admit.output.report_artifact }}"
        crew: "{{ steps.re_review_gate_admit.output.reviewer.crew }}"

    - id: re_review_gate_settle
      retry:
        max_attempts: 3
        initial_backoff_ms: 1000
        backoff_cap_ms: 10000
        backoff_strategy: exponential
      recovery_activity: step_failure_recovery
      target: activity:review_gate_settle
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        completed_task_ids: "{{ input.task_ids }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        base: "{{ input.base_branch }}"
        base_sync: "{{ input.base_sync }}"
        admission: "{{ steps.re_review_gate_admit.output }}"

    # ORB-13989: a reviewer commit on the rebased head is revalidated exactly
    # like `review_validate` before it is republished. A baseline-red failure
    # holds the task in backlog with the old published PR unchanged; the
    # failing rebased head is not pushed.
    - id: re_review_validate
      when: "{{ steps.re_review_gate_settle.output.reviewer_fixed }} == true"
      target: activity:candidate_validate
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        completed_task_ids: "{{ input.task_ids }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        base_sha: "{{ steps.complete_pr.output.rebased.base_sha }}"
        base_ref: "{{ steps.complete_pr.output.rebased.base_ref }}"
        ownership_base_sha: "{{ steps.re_review_gate_settle.output.implementation_head_sha }}"

    - id: re_push
      when: "{{ steps.re_review_gate_admit.output.applies }} == true"
      target: activity:git_push
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        completed_task_ids: "{{ input.task_ids }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        branch: "{{ steps.complete_pr.output.rebased.head }}"
        base: "{{ steps.complete_pr.output.rebased.base }}"
        base_ref: "{{ steps.complete_pr.output.rebased.base_ref }}"
        rewrite_performed: "{{ steps.complete_pr.output.rebased.rewritten }}"
        rewrite_head_before: "{{ steps.complete_pr.output.rebased.head_sha_before }}"
        expected_remote_sha: "{{ steps.complete_pr.output.rebased.remote_sha_before }}"

    # ORB-14332: the base can move again while the rebased head is under
    # re-review. A conflict here rebases and recovers exactly like
    # `complete_pr` and asks for one more re-review round below, instead of
    # stopping an accepted candidate as review_gate_stale.
    - id: complete_reviewed_pr
      when: "{{ steps.re_review_gate_admit.output.applies }} == true"
      recovery_activity: pr_conflict_recovery
      target: activity:pr_complete
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        completed_task_ids: "{{ input.task_ids }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        pr_number: "{{ steps.pr_open.output.pr_number }}"
        completion: "{{ input.completion }}"
        auto_fix: "{{ input.auto_fix }}"
        allowed_crews: "{{ input.allowed_crews }}"
        head: "{{ steps.complete_pr.output.rebased.head }}"
        published_head_sha: "{{ steps.re_push.output.local_sha }}"
        previous_published_head_sha: "{{ steps.re_push.output.remote_sha_before }}"
        reviewed_head_sha: "{{ steps.re_review_gate_settle.output.reviewed_head_sha }}"
        re_review_on_conflict: true
        base: "{{ steps.sync_base.output.base }}"
        base_sync: "{{ input.base_sync }}"

    # ORB-14332: the bounded second re-review round, the same steps over the
    # head `complete_reviewed_pr` rebased. `complete_reviewed_pr` is skipped
    # unless the first round applied, so `re_review_gate_admit_2` always runs
    # and reads its recorded checkpoint. A third conflict is
    # review_gate_stale: the published PR and the task stay in review.
    - id: re_review_gate_admit_2
      retry:
        max_attempts: 3
        initial_backoff_ms: 1000
        backoff_cap_ms: 10000
        backoff_strategy: exponential
      recovery_activity: step_failure_recovery
      target: activity:review_gate_admit
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        completed_task_ids: "{{ input.task_ids }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        base: "{{ input.base_branch }}"
        base_sync: "{{ input.base_sync }}"
        mode: pr
        completion: "{{ input.completion }}"
        auto_fix: "{{ input.auto_fix }}"
        skipped_no_diff_expected: "{{ steps.commit.output.skipped_no_diff_expected }}"
        re_review_after: complete_reviewed_pr

    - id: re_review_2
      when: "{{ steps.re_review_gate_admit_2.output.applies }} == true"
      retry:
        max_attempts: 2
        initial_backoff_ms: 5000
        backoff_cap_ms: 5000
        backoff_strategy: linear
      recovery_activity: step_failure_recovery
      target: activity:agent_review_repair
      default_input:
        task_id: "{{ steps.re_review_gate_admit_2.output.first_task_id }}"
        task_ids: "{{ input.task_ids }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        repo_root: "{{ steps.worktree.output.workspace_path }}"
        attempt_id: "{{ steps.re_review_gate_admit_2.output.attempt_id }}"
        lineage_key: "{{ steps.re_review_gate_admit_2.output.lineage_key }}"
        manifest_artifact: "{{ steps.re_review_gate_admit_2.output.manifest_artifact }}"
        report_artifact: "{{ steps.re_review_gate_admit_2.output.report_artifact }}"
        crew: "{{ steps.re_review_gate_admit_2.output.reviewer.crew }}"

    - id: re_review_gate_settle_2
      retry:
        max_attempts: 3
        initial_backoff_ms: 1000
        backoff_cap_ms: 10000
        backoff_strategy: exponential
      recovery_activity: step_failure_recovery
      target: activity:review_gate_settle
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        completed_task_ids: "{{ input.task_ids }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        base: "{{ input.base_branch }}"
        base_sync: "{{ input.base_sync }}"
        admission: "{{ steps.re_review_gate_admit_2.output }}"

    - id: re_review_validate_2
      when: "{{ steps.re_review_gate_settle_2.output.reviewer_fixed }} == true"
      target: activity:candidate_validate
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        completed_task_ids: "{{ input.task_ids }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        base_sha: "{{ steps.complete_reviewed_pr.output.rebased.base_sha }}"
        base_ref: "{{ steps.complete_reviewed_pr.output.rebased.base_ref }}"
        ownership_base_sha: "{{ steps.re_review_gate_settle_2.output.implementation_head_sha }}"

    - id: re_push_2
      when: "{{ steps.re_review_gate_admit_2.output.applies }} == true"
      target: activity:git_push
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        completed_task_ids: "{{ input.task_ids }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        branch: "{{ steps.complete_reviewed_pr.output.rebased.head }}"
        base: "{{ steps.complete_reviewed_pr.output.rebased.base }}"
        base_ref: "{{ steps.complete_reviewed_pr.output.rebased.base_ref }}"
        rewrite_performed: "{{ steps.complete_reviewed_pr.output.rebased.rewritten }}"
        rewrite_head_before: "{{ steps.complete_reviewed_pr.output.rebased.head_sha_before }}"
        expected_remote_sha: "{{ steps.complete_reviewed_pr.output.rebased.remote_sha_before }}"

    - id: complete_reviewed_pr_2
      when: "{{ steps.re_review_gate_admit_2.output.applies }} == true"
      target: activity:pr_complete
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        completed_task_ids: "{{ input.task_ids }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        pr_number: "{{ steps.pr_open.output.pr_number }}"
        completion: "{{ input.completion }}"
        auto_fix: "{{ input.auto_fix }}"
        allowed_crews: "{{ input.allowed_crews }}"
        head: "{{ steps.complete_reviewed_pr.output.rebased.head }}"
        published_head_sha: "{{ steps.re_push_2.output.local_sha }}"
        previous_published_head_sha: "{{ steps.re_push_2.output.remote_sha_before }}"
        reviewed_head_sha: "{{ steps.re_review_gate_settle_2.output.reviewed_head_sha }}"
        base: "{{ steps.sync_base.output.base }}"
        base_sync: "{{ input.base_sync }}"

    # A no-diff bundle delivered nothing to merge; its validation is the
    # delivery, so completion needs no PR. Verified no-diff and already-landed
    # runs take this route with their full evidence checkpoint; they create no
    # new code delivery and do not acquire the side-effect-only task tag. A
    # verified finding-invalid run already rejected its task at `commit`.
    - id: complete_no_diff
      stage: { id: publish, label: Publish }
      when: "{{ input.completion }} == done && {{ steps.commit.output.skipped_no_diff_expected }} == true && {{ steps.commit.output.decision }} != verified_finding_invalid"
      recovery_activity: step_failure_recovery
      target: activity:pr_complete
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        completed_task_ids: "{{ input.task_ids }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        no_diff_expected: true
        already_landed_checkpoint: "{{ steps.commit.output }}"
