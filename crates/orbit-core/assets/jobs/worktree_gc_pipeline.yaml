# Non-interactive worktree reap target [ORB-10374].
schemaVersion: 2
kind: Job
metadata:
  name: worktree_gc_pipeline
spec:
  state: enabled
  kind: workflow
  max_active_runs: 1
  default_input:
    # Every retained terminal worktree also reclaims worktree.reclaim paths,
    # regardless of this whole-worktree removal age floor.
    # Delivery reaps successful task worktrees immediately. Keep one hour as
    # the bounded backstop for a cleanup report that could not be persisted or
    # an interrupted delivery path; this is no longer the normal lifetime.
    older_than_hours: 1
    # The owning checkout's `.orbit/tmp` (operator and artifact staging) is
    # pruned in the same sweep: a top-level entry goes once nothing inside it
    # has changed for this many hours. Override per run with
    # `--input scratch_older_than_hours=<hours>`.
    scratch_older_than_hours: 24
  steps:
    - id: reap
      target: activity:worktree_gc
      default_input:
        older_than_hours: "{{ input.older_than_hours }}"
        scratch_older_than_hours: "{{ input.scratch_older_than_hours }}"
