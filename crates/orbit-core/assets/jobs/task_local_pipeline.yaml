# Single-task local delivery pipeline.
#
# Admission rejects more than one distinct task before creating a run or worktree.
# `orbit run ship` and `task_auto_pipeline` coordinate multi-selection as separate
# singleton leaves. Custom multi-task local jobs must use git_commit scope: per_task.
#
# Failure semantics:
# - `implement_bundle` implements the one admitted task.
# - If `implement_one` fails, pending changes remain in the shared worktree for inspection.
# - An implementer-declared blocker (`task_blocked_by_agent`) stops the leaf
#   before the next step. Step and final recovery do not run, and pending
#   changes stay in the worktree.
# - If implementation succeeds, `commit` snapshots the task branch before merge.
# - `validate` runs `workflow.required_validation_commands` on that committed
#   candidate; a failing command stops the run before anything is merged.
# - The task moves to `terminal_status` only after its candidate commits and merges cleanly.
# - ORB-11187: when the submitting operator authorized completion
#   (`completion: done`), `complete_tasks` runs *after* `push`, so a failed merge
#   or a failed push fails the run with the tasks still in `review`. Completion is
#   never reached by a leaf whose publication did not succeed.
#
schemaVersion: 2
kind: Job
metadata:
  name: task_local_pipeline
spec:
  state: enabled
  owns_task_worktree: true
  # Holds each task's delivery slot while live; a task may also select this
  # job for local shipping with a `delivery:task_local_pipeline` tag, which a
  # PR-mode workspace honours too (the per-task local override).
  task_delivery:
    modes: [local]
  kind: workflow
  # No job-level ceiling: the drain's own worker limit (`--concurrency`, retuned
  # live by `orbit run concurrency`) bounds how many of these run at once.
  max_active_runs: 0
  # ORB-13907: once step recovery is spent, a crew from
  # `workflow.final_recovery_crews` gets one last look and returns a typed
  # decision. `resume` reruns from the failed step or an earlier one of its
  # phase; any other decision is applied by Orbit's deterministic applier.
  # An empty crew pool skips it.
  final_recovery_activity: final_recovery
  # Mid-run steering's promotion gate (docs/design/mid-run-steering/2_design.md
  # §3). With `workflow.mid_run_steering.enabled`, the run does not reach
  # `commit` while an operator comment past its steering watermark is
  # undelivered. Each refusal spends one of `workflow.mid_run_steering.max_rounds`
  # steering rounds: `implement_bundle` runs again, even for a carried
  # candidate, so the implementer's next prompt carries the steering block onto
  # the candidate still uncommitted in this worktree. When no round is left, or
  # the last one delivered nothing, the task is blocked as `steering_unconsumed`
  # naming the outstanding comments. An unreadable gate or a task gone terminal
  # stops the run before `commit` as well. Steering off, nothing is read.
  steering_gate:
    before: commit
    round: implement_bundle
  default_input:
    task_ids: []
    auto_push: false
    base_branch: main
    base_sync: remote
    landing_branch: ""
    landing_mode: local
    terminal_status: review
    # `review` (default) ends successful tasks at review. `done` is explicit
    # per-invocation operator authorization to finish delivery.
    completion: review
    # ORB-11242: the run-scoped crew restriction the auto-drain admitting this
    # run applied. Empty means unrestricted. This is the innermost carrier: the
    # agent activities below resolve their crew against this run input, so the
    # dispatch gate refuses a crew the window excluded before a provider starts.
    allowed_crews: []
  
  steps:
    - id: worktree
      target: activity:worktree_setup
      retry:
        max_attempts: 4
        initial_backoff_ms: 200
        backoff_cap_ms: 2000
        backoff_strategy: exponential
      default_input:
        task_ids: "{{ input.task_ids }}"
        base: "{{ input.base_branch }}"
        base_sync: "{{ input.base_sync }}"
        landing_mode: "{{ input.landing_mode }}"

    # ORB-13985: a task whose last failed run preserved a candidate resumes
    # it rather than re-implementing: the candidate is squash-merged onto
    # this base. A completed owner-local candidate that failed at `commit`
    # or later is carried unvalidated and skips `implement_bundle`; the final
    # gate judges its committed candidate. A conflict or review refusal hands
    # the implementer the applied candidate and that output to repair. Work
    # preserved from `implement_bundle` or before `commit` is unfinished
    # (ORB-14024): the implementer always runs on it. A discarded candidate,
    # a changed spec or a bundle implements fresh. ORB-14603: after a failed
    # claim, the candidate the owner kept from it is continued, never a local
    # run that shares the leaf's id.
    - id: resume_candidate
      target: activity:candidate_resume
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        task_ids: "{{ input.task_ids }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        base_sha: "{{ steps.worktree.output.base_sha }}"
        prior_job_run_id: "{{ steps.worktree.output.prior_job_run_id }}"
        prior_foreign_run: "{{ steps.worktree.output.prior_foreign_run }}"

    - id: implement_bundle
      when: "{{ steps.resume_candidate.output.implement }} == true"
      loop:
        items: "{{ input.task_ids }}"
        max_iterations: 1
        steps:
          - id: implement_one
            recovery_activity: step_failure_recovery
            target: activity:agent_implement
            default_input:
              task_id: "{{ item }}"
              workspace_path: "{{ steps.worktree.output.workspace_path }}"
              repo_root: "{{ steps.worktree.output.workspace_path }}"
              # ORB-15287: the pinned delivery base a deferred sandbox
              # validation must name.
              base_sha: "{{ steps.worktree.output.base_sha }}"
              # ORB-15963: `validate` runs the required commands on the final
              # candidate, so the envelope lists them for the implementer to
              # leave to it.
              final_validation: true
              resume_candidate: "{{ steps.resume_candidate.output.repair }}"

    - id: commit
      recovery_activity: step_failure_recovery
      target: activity:git_commit
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        scope: all
        verify_already_landed: true
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        base_ref: "{{ steps.worktree.output.base_ref }}"
        base_sha: "{{ steps.worktree.output.base_sha }}"

    # ORB-13915: `workflow.required_validation_commands` run deterministically
    # on the committed candidate before it lands on the base. A failing
    # command fails here, so step recovery can repair the candidate
    # (committing the fix) and the post-recovery attempt reruns the whole
    # suite. An empty list is a no-op.
    # ORB-14258: a failure the base shares fails as a typed `baseline_red`
    # with no recovery; run finalization holds the tasks in the backlog until
    # `base_ref` moves to a commit where the command passes, instead of
    # blocking them.
    - id: validate
      when: "{{ steps.commit.output.skipped_no_diff_expected }} != true"
      recovery_activity: step_failure_recovery
      target: activity:candidate_validate
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        completed_task_ids: "{{ input.task_ids }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        base_sha: "{{ steps.worktree.output.base_sha }}"
        base_ref: "{{ steps.worktree.output.base_ref }}"

    - id: merge
      recovery_activity: step_failure_recovery
      target: activity:git_merge
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        base: "{{ input.base_branch }}"
        # Setup honors input.base_sync when choosing the immutable starting
        # point. By merge time, an earlier local run may legitimately have
        # advanced this same base before its later checkpoints completed, so
        # reconcile against the current local base and preserve that history.
        base_sync: local
        strategy: fast_forward
        workspace_path: "{{ steps.worktree.output.workspace_path }}"

    - id: mark_review
      loop:
        items: "{{ input.task_ids }}"
        max_iterations: 1
        steps:
          - id: mark_review_one
            target: activity:update_task
            default_input:
              task_id: "{{ item }}"
              status: "{{ input.terminal_status }}"

    - id: push
      when: "{{ input.auto_push }} == true"
      recovery_activity: step_failure_recovery
      target: activity:git_push
      default_input:
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        branch: "{{ input.base_branch }}"

    # Last: every publication step this invocation required has succeeded by
    # here, which is the precondition the completion authorization was granted
    # against.
    - id: complete_tasks
      when: "{{ input.completion }} == done"
      loop:
        items: "{{ input.task_ids }}"
        max_iterations: 1
        steps:
          - id: complete_one
            target: activity:task_complete
            default_input:
              job_run_id: "{{ steps.worktree.output.job_run_id }}"
              task_id: "{{ item }}"
