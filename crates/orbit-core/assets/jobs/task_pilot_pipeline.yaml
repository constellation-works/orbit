# Schedulable task-pilot pipeline [ORB-10510, ORB-10739, ORB-10877].
#
# Scheduled and other zero-input runs leave discovery entirely to
# `prepare_task_pilot`: automatic mode (task_ids empty) discovers only
# proposed/backlog tasks in the active workspace with empty context_files or
# unassessed complexity, excluding no-diff tasks. A task whose description or
# acceptance criteria changed after its applied assessment is discovered
# again for a fresh pilot, unless a live execution claim holds it or a
# repilot already failed against unchanged requirements. Apply records failed
# stale repilots for proposed and backlog tasks even without a drain; a later
# description/criteria edit or explicit request can retry. Provider outages and
# missing inspection crews leave the task retryable. Explicit mode audits named
# proposed/backlog tasks, including non-empty selectors. A child pilot, such
# as one an approve-proposed drain dispatched, is not that request: when an
# explicit or routine pilot already certified an assessment, the child does
# not call the provider for that task again. Any unsupported
# explicit status refuses the whole selection before agent work or task
# reservation; the refusal names every unsupported task and its current status.
# The CLI preflights before submission; prepare checks again for direct callers
# and intervening status moves. Status races after valid preparation retain
# the apply/supersession behavior below.
# Preparation never promotes or dispatches a task. In a Git workspace it
# fetches the landing branch and pins one source revision without changing
# primary HEAD, index, or working files. An unfetchable remote fails before
# any agent call. Each read-only pilot receives at most five tasks and runs
# in an invocation-owned checkout at that pinned revision.
# Prepare resolves an omitted base branch through the owning workspace's
# `workflow.base_branch`; a non-empty run input remains an explicit override.
# Any successful partition reaches apply even if another agent failed.
# With no partitions, an explicit empty all join records both collection
# outputs and reaches apply without dispatching a pilot; any joins run only
# when preparation selected work.
# Apply rejects untrusted partition envelopes, then isolates stale or malformed
# assessments by task and applies every independently valid sibling. An apply
# that applied at least one task while leaving others unresolved still
# reports `failed` with its applied and unresolved counts, but the guard
# passes it as held: the applied tasks' receipts stand, and each unresolved
# task is held for the operator (apply records failed stale repilots, and a
# drain also records unresolved children as `pilot_unresolved`) instead of
# being piloted again on the next pass against unchanged requirements. An apply
# that applied nothing fails the guard. Targets admitted to
# execution, claimed by a follower, or retired during preparation settle as
# superseded without pilot writes. Durable material edits by an operator or
# another writer likewise refuse the stale write and settle as superseded.
# Prepare reads each task's history boundary no later than the snapshot apply
# compares against; an automatically selected task moved out of selection
# before its hydration settles superseded in prepare, and apply carries it.
# Under a routine claim, a task whose selector material the branch head changed
# since the claim froze its source settles superseded_by_source: prepare sets
# it aside, apply skips it, and its member is claimed afresh at the head.
# Superseded members are observed and prepared afresh without failure records
# or retrying the stale snapshot. A run with applied and superseded tasks succeeds.
# The host-prepared before list is authoritative; legacy agent echoes are ignored.
# Prepare reserves its final selection for this run inside the commit
# boundary, checking live holders in the same critical section, so of two runs
# preparing one task at once only one keeps it; an explicit loser settles that
# task as superseded `piloted_elsewhere`. Reservations and successful
# preparation checkpoints withhold their tasks from other pilots, local
# delivery selection and owner pull admission until the pilot run terminates.
# A claimed task edited between its claim and prepare settles superseded alone.
# Bare relative file and
# directory targets are normalized only from the pinned source tree. Selector
# existence is validated against the prepared source revision, not a later
# checkout; only a selector the task's durable creation grant names (recorded
# by an operator `allow_missing_context` write) may be missing there, and apply
# keeps every such target the assessment omits. Apply atomically persists context_files, assessed complexity, its
# audit rationale/evidence, and a replay receipt.
# A CI sweep may pass its
# exact filing record plus literal promotion authority; only then can apply
# promote a warning-free, selector-backed proposed repair to backlog. A filed
# task another writer already promoted settles superseded `promoted_elsewhere`. An
# `orbit run auto --approve-proposed` drain passes `drain_promotion` (its own
# run ID) plus the same literal authority instead; apply verifies that the
# drain is live, opted in, and dispatched this run before it approves any
# qualifying, warning-free proposed task.
#
# Re-check mode [ORB-21124]
# - An explicit selection whose task's latest assessment holds promotion is
#   re-checked, not piloted in full: prepare records `pilot_mode: recheck` on
#   the task and passes the prior assessment, its holding findings and a
#   field-level task diff in the partition's `rechecks`. The pilot judges each
#   holding finding and the fields the diff invalidates; apply keeps every
#   other prior field and validates the result like a full assessment.
# - Prepare pilots in full, recording `pilot_mode_reason`, when the run sets
#   `full_pilot` (`orbit task repilot --full`), the prior assessment is not
#   held, was itself a re-check, predates the recorded basis or is older than
#   `recheck_max_age_hours` (0 disables re-checks), its footprint paths
#   changed since its source revision, or the title or description was
#   rewritten or new context_files were added.
#
# Crew resolution
# - The pilot steps name `workflow.purpose_crews.task_pilot` as their
#   `crew_config_key`. The run draws one crew from that pool on the first pilot
#   dispatch, keeping the pool's weights and only the crews that can inspect
#   source natively, skipping disabled and provider-limited crews, and every
#   pilot and repair pilot of the run reuses it; `orbit run show` records the
#   draw and the pool it came from.
# - When that pool has `<crew>@auto` members, prepare also splits partitions
#   by the effort each task's filed complexity resolves to under
#   `workflow.auto_effort.bands`, and each partition's first dispatch freezes
#   its own `<crew>@<effort>` (`workflow.purpose_crews.task_pilot#pilots:<n>`).
#   A valid assessment from a lower-effort `@auto` pilot that raised the
#   task's tier to a higher-effort band, or reported confidence medium or
#   low, settles `escalated`: the repair round re-pilots it once at the
#   higher effort and applies that assessment. Repair rounds never escalate.
# - While that purpose is unset, the pilot draws from
#   `workflow.low_complexity_crews` instead: piloting reads tasks and writes a
#   bounded proposal, so it is low work. An empty low pool falls back to
#   `workflow.default_crew`, and the recorded draw says so.
# - Crews under a host `provider_unavailable` or `provider_capacity` hold are
#   skipped while any other member remains. When that hold covers every crew
#   the draw would use, the task-pilot routine does not start this job. See
#   "Routines" under Provider failure holds in docs/CONFIG.md.
# - Change the model behind these pilots by setting the task-pilot purpose
#   pool, or by editing the low pool while it is unset.
# - There is deliberately no per-run `crew` job input: the step-level pool key
#   below already wins over run input during dispatch, so such an input could
#   never take effect.
# - A preparation claim may name tasks whose stored crews differ. Prepare
#   partitions that claim by `task.crew` before the size cap, so each pilot
#   worker sees one crew, and run start keeps the first task's crew instead
#   of refusing the pass. Only the run the live claim admitted gets this:
#   run start checks the claim against the routine's live attempt and its
#   action key. Any other run whose task ids mix crews is still refused,
#   including an explicit run and one whose input merely carries a claim.
# - A drain pilot whose tasks' crews changed after the drain selected a
#   homogeneous bundle gets the same repartitioning [ORB-21839]: run start
#   verifies the named drain is a live `--approve-proposed` drain that
#   dispatched this exact run, then prepare partitions by live crew. A
#   forged or ended drain's record, or a run it never dispatched, is
#   refused like any other mixed bundle.
# - A human task crew is operator work. Run start does not take that crew
#   as this run's agent crew and does not fail the run. Prepare excludes
#   those tasks, and the run keeps an agent crew (the first non-human task
#   crew in a partition, otherwise `workflow.default_crew`). An explicit
#   human crew on the run input is still refused. An approve-proposed drain
#   does not select those tasks, so it never dispatches a pilot for them.

schemaVersion: 2
kind: Job
metadata:
  name: task_pilot_pipeline
spec:
  state: enabled
  kind: workflow
  max_active_runs: 3
  default_input:
    task_ids: []
    workspace_path: .
    max_tasks: 50
    max_partition_size: 5
    promotion_authorized: false
    ci_sweep_filing: null
    drain_promotion: null
    state_automation: null
    source_revision: ""
    full_pilot: false
    recheck_max_age_hours: 72

  steps:
    - id: prepare
      target: activity:prepare_task_pilot
      default_input:
        state_automation: "{{ input.state_automation }}"
        source_revision: "{{ input.source_revision }}"
        task_ids: "{{ input.task_ids }}"
        workspace_path: "{{ input.workspace_path }}"
        base_branch: "{{ input.base_branch }}"
        max_tasks: "{{ input.max_tasks }}"
        max_partition_size: "{{ input.max_partition_size }}"
        full_pilot: "{{ input.full_pilot }}"
        recheck_max_age_hours: "{{ input.recheck_max_age_hours }}"

    - id: pilot_results
      when: "{{ steps.prepare.output.partition_count }} == 0"
      fan_out:
        items: "[]"
        max_workers: 1
        worker:
          id: empty_pilot
          target: activity:task_pilot
      fan_in:
        join: { mode: all }
        collect: pilots

    - id: pilots
      when: "{{ steps.prepare.output.partition_count }} != 0"
      fan_out:
        items: "{{ steps.prepare.output.partitions }}"
        max_workers: 5
        worker:
          id: pilot
          target: activity:task_pilot
          default_input:
            task_ids: "{{ item.task_ids }}"
            partition_index: "{{ item.partition_index }}"
            # The whole item, so a partition without its optional fields
            # (`rechecks`, `auto_effort_escalation`) still dispatches.
            partition: "{{ item }}"
            workspace_path: "{{ steps.prepare.output.workspace_path }}"
            owner_machine: "{{ steps.prepare.output.owner_machine }}"
            implementation_lane: "{{ steps.prepare.output.implementation_lane }}"
            base_branch: "{{ steps.prepare.output.source.base_branch }}"
            source_revision: "{{ steps.prepare.output.source.source_revision }}"
            inspection_revision: "{{ steps.prepare.output.source.source_revision }}"
            # See the crew-resolution note at the top of this file.
            crew_config_key: workflow.purpose_crews.task_pilot
      fan_in:
        join:
          mode: any
        collect: pilot_results

    - id: apply
      target: activity:apply_task_pilot_results
      default_input:
        prepared: "{{ steps.prepare.output }}"
        results: "{{ steps.pilot_results.output }}"
        workspace_path: "{{ steps.prepare.output.workspace_path }}"
        promotion_authorized: "{{ input.promotion_authorized }}"
        ci_sweep_filing: "{{ input.ci_sweep_filing }}"
        drain_promotion: "{{ input.drain_promotion }}"

    - id: repair_pilots
      when: "{{ steps.apply.output.repair_count }} != 0"
      fan_out:
        items: "{{ steps.apply.output.repair_partitions }}"
        max_workers: 5
        worker:
          id: repair_pilot
          target: activity:task_pilot
          default_input:
            task_ids: "{{ item.task_ids }}"
            partition_index: "{{ item.partition_index }}"
            validation_errors: "{{ item.validation_errors }}"
            partition: "{{ item }}"
            repair_attempt: true
            workspace_path: "{{ steps.prepare.output.workspace_path }}"
            owner_machine: "{{ steps.prepare.output.owner_machine }}"
            implementation_lane: "{{ steps.prepare.output.implementation_lane }}"
            base_branch: "{{ steps.prepare.output.source.base_branch }}"
            source_revision: "{{ steps.prepare.output.source.source_revision }}"
            inspection_revision: "{{ steps.prepare.output.source.source_revision }}"
            crew_config_key: workflow.purpose_crews.task_pilot
      fan_in:
        join:
          mode: any
        collect: repair_results

    - id: apply_repairs
      when: "{{ steps.apply.output.repair_count }} != 0"
      target: activity:apply_task_pilot_results
      default_input:
        prepared: "{{ steps.apply.output.repair_prepared }}"
        results: "{{ steps.repair_results.output }}"
        workspace_path: "{{ steps.prepare.output.workspace_path }}"
        promotion_authorized: "{{ input.promotion_authorized }}"
        ci_sweep_filing: "{{ input.ci_sweep_filing }}"
        drain_promotion: "{{ input.drain_promotion }}"
        prior_applied_count: "{{ steps.apply.output.applied_count }}"
        carried_task_outcomes: "{{ steps.apply.output.non_repairable_outcomes }}"

    - id: require_initial_apply_success
      when: "{{ steps.apply.output.repair_count }} == 0"
      target: activity:pipeline_success_guard
      default_input:
        context: task-pilot partition apply
        result: "{{ steps.apply.output }}"

    - id: require_repair_apply_success
      when: "{{ steps.apply.output.repair_count }} != 0"
      target: activity:pipeline_success_guard
      default_input:
        context: task-pilot targeted repair apply
        result: "{{ steps.apply_repairs.output }}"
