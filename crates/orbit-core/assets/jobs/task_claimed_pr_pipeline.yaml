# Claimed pull-request leaf [ORB-12616].
#
# The publishing half of pull-mode drain: a bound claim implements, commits,
# synchronizes onto its base, publishes a branch and opens a pull request, and
# then stops. It never merges and never completes its task — the owner's
# landing consumer does that behind explicit completion authority.
#
# It shares the claimed local leaf's omissions (no reservation steps, no
# rediscovery, no `task_complete`) and adds one ordering rule of its own:
# required validation runs *after* the pull request exists, because the typed
# handoff pins the delivery identity and every captured log must name the exact
# candidate and delivery the owner will act on.
#
# ORB-13908: when the claim captured the owner's `review.before_pr`, the leaf
# runs the same before-PR gate as `task_pr_pipeline` between base
# synchronization and push. One fresh reviewer, with the claim's captured crew,
# fixes what it finds as the candidate's second commit and comments a summary;
# there is no second round. Its manifest, report, certificate and comment
# cross the worker binding to the owner's task, the attempt ledger stays on
# this executor keyed to the claim, and the handoff carries the passed verdict
# as typed evidence the owner checks against its own copies at acceptance.
# A `reject` or `incomplete` verdict refuses `review_gate_settle`: the leaf
# fails, and its failure settlement blocks the task on the owner with the
# findings already there. Required validation (`validate`) runs on the final,
# reviewed head, and the owner attributes the reviewer's paths when it widens
# the footprint at acceptance, so there is no separate `review_validate`.
#
schemaVersion: 2
kind: Job
metadata:
  name: task_claimed_pr_pipeline
spec:
  state: enabled
  # Holds the claimed task's delivery slot while live. No mode: only a claim
  # binding selects this leaf, never a task tag.
  task_delivery: {}
  kind: workflow
  # No job-level ceiling: the drain's own worker limit (`--concurrency`, retuned
  # live by `orbit run concurrency`) bounds how many of these run at once.
  max_active_runs: 0
  # ORB-13907: once step recovery is spent, a crew from
  # `workflow.final_recovery_crews` gets one last look and returns a typed
  # decision. `resume` reruns from the failed step or an earlier one of its
  # phase; any other decision is applied by Orbit's deterministic applier on the
  # owner, carried by the claim's failure settlement — never written here.
  # An empty crew pool skips it.
  final_recovery_activity: final_recovery
  default_input:
    task_ids: []
    base_branch: main
    base_sync: remote
    landing_branch: ""
    allowed_crews: []
    title: null
    body: null

  steps:
    - id: worktree
      target: activity:worktree_setup
      retry:
        max_attempts: 4
        initial_backoff_ms: 200
        backoff_cap_ms: 2000
        backoff_strategy: exponential
      default_input:
        task_ids: "{{ input.task_ids }}"
        base: "{{ input.base_branch }}"
        base_sync: "{{ input.base_sync }}"

    - id: implement_bundle
      loop:
        items: "{{ input.task_ids }}"
        max_iterations: 256
        steps:
          - id: implement_one
            recovery_activity: step_failure_recovery
            target: activity:agent_implement
            default_input:
              task_id: "{{ item }}"
              workspace_path: "{{ steps.worktree.output.workspace_path }}"
              repo_root: "{{ steps.worktree.output.workspace_path }}"
              # Claimed mode: the injected envelope is the task, the agent
              # writes no owner task state, and it returns its execution
              # summary in its output for the handoff to carry.
              claimed: true

    - id: commit
      recovery_activity: step_failure_recovery
      target: activity:git_commit
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        scope: all
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        base_ref: "{{ steps.worktree.output.base_ref }}"
        base_sha: "{{ steps.worktree.output.base_sha }}"
        # This attempt's implementer output: the delivery gate judges its
        # summary rather than one a previous attempt left on the owner.
        implementation: "{{ steps.implement_one.output }}"

    - id: prepare_branch
      recovery_activity: step_failure_recovery
      target: activity:pr_prepare
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        base: "{{ input.base_branch }}"
        base_sync: "{{ input.base_sync }}"
        completed_task_ids: "{{ input.task_ids }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        # Same attempt-scoped delivery gate as `commit`.
        implementation: "{{ steps.implement_one.output }}"

    - id: sync_base
      recovery_activity: pr_conflict_recovery
      target: activity:git_rebase
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        completed_task_ids: "{{ input.task_ids }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        head: "{{ steps.prepare_branch.output.head }}"
        head_sha: "{{ steps.prepare_branch.output.head_sha }}"
        base: "{{ steps.prepare_branch.output.base }}"
        base_ref: "{{ steps.prepare_branch.output.base_ref }}"
        base_sha: "{{ steps.prepare_branch.output.base_sha }}"
        remote_sha: "{{ steps.prepare_branch.output.remote_sha }}"
        commits_behind: "{{ steps.prepare_branch.output.commits_behind }}"
        sync_required: "{{ steps.prepare_branch.output.sync_required }}"
        # Same attempt-scoped delivery gate as `commit`.
        implementation: "{{ steps.implement_one.output }}"

    # `review_gate_admit` and `review_gate_settle` always run so later steps
    # can read their output; they report `applies: false` when the claim
    # captured `review.before_pr` off. Transient gate and reviewer failures
    # retry, then get one diagnosed recovery before the leaf fails.
    - id: review_gate_admit
      retry:
        max_attempts: 3
        initial_backoff_ms: 1000
        backoff_cap_ms: 10000
        backoff_strategy: exponential
      recovery_activity: step_failure_recovery
      target: activity:review_gate_admit
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        completed_task_ids: "{{ input.task_ids }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        base: "{{ input.base_branch }}"
        base_sync: "{{ input.base_sync }}"
        mode: pr
        skipped_no_diff_expected: "{{ steps.commit.output.skipped_no_diff_expected }}"

    - id: review
      when: "{{ steps.review_gate_admit.output.applies }} == true"
      retry:
        max_attempts: 2
        initial_backoff_ms: 5000
        backoff_cap_ms: 5000
        backoff_strategy: linear
      recovery_activity: step_failure_recovery
      target: activity:agent_review_repair
      default_input:
        task_id: "{{ steps.review_gate_admit.output.first_task_id }}"
        task_ids: "{{ input.task_ids }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        repo_root: "{{ steps.worktree.output.workspace_path }}"
        attempt_id: "{{ steps.review_gate_admit.output.attempt_id }}"
        lineage_key: "{{ steps.review_gate_admit.output.lineage_key }}"
        manifest_artifact: "{{ steps.review_gate_admit.output.manifest_artifact }}"
        report_artifact: "{{ steps.review_gate_admit.output.report_artifact }}"
        crew: "{{ steps.review_gate_admit.output.reviewer.crew }}"

    - id: review_gate_settle
      retry:
        max_attempts: 3
        initial_backoff_ms: 1000
        backoff_cap_ms: 10000
        backoff_strategy: exponential
      recovery_activity: step_failure_recovery
      target: activity:review_gate_settle
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        completed_task_ids: "{{ input.task_ids }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        base: "{{ input.base_branch }}"
        base_sync: "{{ input.base_sync }}"
        admission: "{{ steps.review_gate_admit.output }}"

    - id: push
      recovery_activity: step_failure_recovery
      target: activity:git_push
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        completed_task_ids: "{{ input.task_ids }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        branch: "{{ steps.sync_base.output.head }}"
        base: "{{ steps.sync_base.output.base }}"
        base_ref: "{{ steps.sync_base.output.base_ref }}"
        rewrite_performed: "{{ steps.sync_base.output.rewritten }}"
        rewrite_head_before: "{{ steps.sync_base.output.head_sha_before }}"
        expected_remote_sha: "{{ steps.sync_base.output.remote_sha_before }}"
        # Same attempt-scoped delivery gate as `commit`.
        implementation: "{{ steps.implement_one.output }}"

    - id: pr_open
      recovery_activity: step_failure_recovery
      target: activity:pr_open
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        completed_task_ids: "{{ input.task_ids }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        base: "{{ steps.sync_base.output.base }}"
        base_ref: "{{ steps.sync_base.output.base_ref }}"
        base_sha: "{{ steps.sync_base.output.base_sha }}"
        base_sync: "{{ input.base_sync }}"
        landing_branch: "{{ input.landing_branch }}"
        head: "{{ steps.sync_base.output.head }}"
        reviewed_head_sha: "{{ steps.review_gate_settle.output.reviewed_head_sha }}"
        reviewed_base_sha: "{{ steps.review_gate_settle.output.reviewed_base_sha }}"
        review_fixes: "{{ steps.review_gate_settle.output.review_fixes }}"
        body: "{{ input.body }}"
        title: "{{ input.title }}"
        # Same attempt-scoped delivery gate as `commit`.
        implementation: "{{ steps.implement_one.output }}"

    - id: validate
      target: activity:claim_validate
      default_input:
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        base_sync: "{{ input.base_sync }}"
        base_sha: "{{ steps.sync_base.output.base_sha }}"
        pull_request: "{{ steps.pr_open.output.pr_number }}"

    - id: handoff
      target: activity:claim_handoff
      default_input:
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        base_sync: "{{ input.base_sync }}"
        base_sha: "{{ steps.sync_base.output.base_sha }}"
        pull_request: "{{ steps.pr_open.output.pr_number }}"
        candidate: "{{ steps.validate.output.candidate }}"
        validation: "{{ steps.validate.output.validation }}"
        # The settled before-PR verdict, or null when the claim captured no
        # review: the owner judges it against the claim's review contract.
        review_evidence: "{{ steps.review_gate_settle.output.handoff_evidence }}"
        # A claim binds exactly one task, so the loop ran once and this is
        # that task's implementer output; its summary becomes the owner's.
        implementation: "{{ steps.implement_one.output }}"
