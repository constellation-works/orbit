[package]
name = "orbit-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.orbit]
stability = "internal"

[lints]
workspace = true

# Credential code only: no HTTP framework, runtime handle or Orbit store. The
# only internal dependencies are the foundation crates (see ARCHITECTURE.md).
[dependencies]
orbit-common = { path = "../orbit-common", features = ["sqlite"] }
orbit-types = { path = "../orbit-types" }
chrono.workspace = true
getrandom.workspace = true
rusqlite.workspace = true
serde.workspace = true
sha2.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
