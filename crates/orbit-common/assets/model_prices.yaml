# Versioned model price table (ORB-10338, ADR-0245).
#
# ─── READ BEFORE EDITING (lesson from the first seed, 2026-07-20) ───────────
# This table was first seeded (ORB-10338 / PR #676) from an executor's TRAINING
# PRIOR and shipped missing every model the fleet actually ran (no opus-4-8,
# sonnet-5, gpt-5.6, gemini-3.5-flash) with several stale rates. Before you
# touch a row:
#   1. Check the LATEST models and prices against each provider's OFFICIAL
#      pricing page — never your own prior. Your training data is stale by
#      construction; a model or price you "remember" is probably wrong.
#   2. Cross-check model STRINGS against observed reality — recent worker/ledger
#      invocation records (agentbase/worker/server run records `modelUsage`
#      keys; orbit `invocations.model`), not documentation alone. Key by the
#      exact string that lands in `InvocationRecord.model`.
#   3. Validate derived costs against provider-reported `total_cost_usd` from
#      real runs (see the ground-truth tests in
#      crates/orbit-common/src/types/tests/pricing.rs).
# Rows are APPEND-ONLY with effective date ranges: for a real price CHANGE, add
# a new row (close the old one with `effective_until`) — never rewrite history.
# (This whole file is the initial seed being corrected in-place pre-merge, which
# is fixing a bad seed, not rewriting a shipped price.)
# ────────────────────────────────────────────────────────────────────────────
#
# Keyed by exact model string (the value that ends up in
# `InvocationRecord.model` — never a crew name or unversioned CLI alias like
# `opus`/`sonnet`/`fable`) plus an effective date range.
# `orbit_common::model::pricing` looks up the row whose range covers an
# invocation's timestamp and derives USD cost from the token splits at query
# time; nothing here is baked into Rust.
#
# A context-window suffix like `claude-opus-4-8[1m]` is NOT keyed separately —
# it bills at the base model's rates, and the lookup strips a trailing `[...]`
# to fall back to the base row (see `pricing::strip_context_suffix`). Add a
# distinct `model[1m]` row only if a provider charges a long-context premium.
#
# Rates are USD per 1,000,000 tokens. `input_token_basis` defaults to
# `exclusive`; `gross_includes_cache` marks provider input totals that already
# include cached reads and writes. Anthropic prompt-cache economics:
# cache_read ≈ 0.1x input, cache_create (5m TTL) = 1.25x input,
# cache_create_1h (1h TTL) = 2x input. Providers with no 1h-TTL tier
# (OpenAI/Gemini/xAI) report no 1h count. Their explicit nonzero fallback rate
# prevents malformed nonzero data from being priced as free. `effective_until`
# is exclusive; omit (or `null`) for the current open-ended rate.
prices:
  # ── Anthropic / Claude (crews: opus, sonnet, fable) ──────────────────────
  # Opus 5 launched 2026-07-24 at the same rates as Opus 4.8 (verified against
  # the official platform.claude.com/docs pricing table). No `-fast` row: fast
  # mode is a `speed: "fast"` request parameter on the *same* `claude-opus-5`
  # model id, not a distinct string that would ever appear in
  # `InvocationRecord.model`, and neither crew config nor the ledger reference
  # a `-fast` string.
  - model: "claude-opus-5"
    effective_from: "2026-07-24T00:00:00Z"
    effective_until: null
    input_per_million_usd: 5.0
    cache_read_per_million_usd: 0.5
    cache_create_per_million_usd: 6.25
    cache_create_1h_per_million_usd: 10.0
    output_per_million_usd: 25.0

  - model: "claude-opus-4-8"
    effective_from: "2026-07-17T00:00:00Z"
    effective_until: null
    input_per_million_usd: 5.0
    cache_read_per_million_usd: 0.5
    cache_create_per_million_usd: 6.25
    cache_create_1h_per_million_usd: 10.0
    output_per_million_usd: 25.0

  # Previous-generation Opus, still observed in the ledger. Standard Opus rate
  # (5/25) has held since launch — corrected here from the stale 15/75 seed
  # (that was Opus-3-era pricing, a training-prior artifact).
  - model: "claude-opus-4-7"
    effective_from: "2026-01-01T00:00:00Z"
    effective_until: null
    input_per_million_usd: 5.0
    cache_read_per_million_usd: 0.5
    cache_create_per_million_usd: 6.25
    cache_create_1h_per_million_usd: 10.0
    output_per_million_usd: 25.0

