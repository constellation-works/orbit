# ─── Prompt-size tiers (ORB-19680) ──────────────────────────────────────────
# A tier prices ONE model request whose own prompt reaches
# `min_prompt_tokens`, every bucket of that whole request at the tier rates;
# requests below it keep the base `prices` row's rates. Threshold is
# inclusive ("over 100,000" = 100001; "200,000 or more" = 200000). A request's
# prompt counts every input-side token after the base row's
# `input_token_basis`: uncached input, cache reads and both cache writes.
#
# The key is per-request prompt size, never the invocation totals: an
# invocation sums many requests. Invocation traces keep each request at or
# over 100,000 prompt tokens (`LONG_PROMPT_CAPTURE_FLOOR_TOKENS`; the table
# refuses a lower tier) from Codex's session rollout. Claude's message stream
# shows only that no request reached the floor: it carries no request's final
# output, so a long Claude request leaves per-request usage uncaptured.
# Without per-request usage the derived cost is exact only when the totals
# stay below the threshold; otherwise it is unknown (null), never estimated.
# Grok output reports totals only.
#
# `effective_from` is this table's first verified observation of each tier
# (2026-10-29T04:23:10Z), not the provider's effective instant. Earlier
# invocations carry no per-request usage and keep their base-row pricing;
# no shipped `prices` row or period is rewritten.
#
# Sources, retrieved 2026-10-29 from 04:23Z (UTC):
# - Haiku 5.5: https://platform.claude.com/docs/en/models/haiku-5-5/overview
#   prices every bucket, output included, "for prompts over 100,000 tokens".
#   https://platform.claude.com/docs/en/about-claude/pricing#long-context-pricing
#   confirms whole-request semantics: "A request's prompt length counts all of
#   its input tokens, including cache reads and cache writes. Each request is
#   priced on its own: a request over the threshold pays the higher prices".
# - OpenAI: https://developers.openai.com/api/docs/pricing ("Long context:
#   >272K input tokens"; long-context input, cached input, 30m write and
#   output columns). The 1h field repeats the long 30m write rate as the
#   nonzero fallback, as in the base rows; the 12h tier has no bucket here.
#   gpt-5.6-luna and gpt-5.5 have no open base row, so no tier.
# - xAI: https://docs.x.ai/developers/pricing ("requests whose prompt reaches
#   the listed token threshold are billed at the higher rate for all tokens in
#   the request"; ≥200k) and
#   https://docs.x.ai/developers/advanced-api-usage/prompt-caching/usage-and-pricing
#   ("total prompt tokens (including cached tokens)"). Cache writes keep the
#   input-rate convention of the base rows.
