    cache_create_1h_per_million_usd: 20.0
    output_per_million_usd: 50.0

  # ── OpenAI / Codex (crews: sol, terra, luna) ─────────────────────────────
  # Standard short-context API-equivalent rates. OpenAI input totals are gross:
  # cached reads and writes are included and are subtracted before the full
  # input rate is applied. OpenAI reports no 1h tier; the nonzero 5m fallback
  # rate prevents malformed nonzero 1h data from being treated as free.
  # GPT-6 Astra launched 2026-09-03. Official API pricing is $10/M input,
  # $1/M cached input, $12.50/M cache writes, and $50/M output. Like the
  # existing Codex rows, the 1h field uses the documented cache-write rate as
  # a nonzero fallback because OpenAI publishes no separate 1h cache tier.
  - model: "gpt-6-astra"
    effective_from: "2026-09-03T00:00:00Z"
    effective_until: null
    input_token_basis: gross_includes_cache
    input_per_million_usd: 10.0
    cache_read_per_million_usd: 1.0
    cache_create_per_million_usd: 12.5
    cache_create_1h_per_million_usd: 12.5
    output_per_million_usd: 50.0

