[package]
name = "orbit-common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.orbit]
stability = "stable"

[lints]
workspace = true

[features]
clap = ["orbit-types/clap"]
# Shared SQLite connection defaults (utility::sqlite). Optional so that
# non-SQLite consumers (orbit-policy, orbit-exec, ...) do not pull rusqlite.
sqlite = ["dep:rusqlite"]
# Exposes `test_fixtures` (frozen model-name constants) and `test_env` (scoped
# environment guards) to integration tests in sibling crates, which cannot see
# this crate's `#[cfg(test)]` items.
test-util = []

[dependencies]
orbit-types = { path = "../orbit-types" }
chrono.workspace = true
rusqlite = { workspace = true, optional = true }
fs2.workspace = true
getrandom.workspace = true
regex.workspace = true
rsa.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
unicode-normalization.workspace = true
url.workspace = true

# Unix-only: resolve the OS login name (getpwuid_r) to backfill USER/LOGNAME
# in provider subprocess environments. See `redaction::backfill_login_identity`.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
