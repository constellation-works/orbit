[package]
name = "orbit-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.orbit]
stability = "internal"

[lints]
workspace = true

[features]
test-support = []

[dependencies]
chrono.workspace = true
libc = { workspace = true }
jsonschema.workspace = true
orbit-agent = { path = "../orbit-agent" }
orbit-common = { path = "../orbit-common" }
orbit-types = { path = "../orbit-types" }
orbit-exec = { path = "../orbit-exec" }
orbit-store = { path = "../orbit-store" }
orbit-tools = { path = "../orbit-tools" }
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
tempfile = "3"
thiserror.workspace = true
tiktoken-rs.workspace = true
tracing.workspace = true

[dev-dependencies]
orbit-common = { path = "../orbit-common", features = ["test-util"] }
tracing-subscriber.workspace = true

[[test]]
name = "v2_cli_agent"
required-features = ["test-support"]
