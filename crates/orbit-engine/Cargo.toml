[package]
name = "orbit-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.orbit]
stability = "internal"

[lints]
workspace = true

[features]
# Scoped deadline clocks and the null `RuntimeHost` base for test fixtures only.
# Enable it only from `[dev-dependencies]`, never in a shipped build.
test-support = []

[dependencies]
chrono.workspace = true
libc = { workspace = true }
orbit-agent = { path = "../orbit-agent" }
orbit-common = { path = "../orbit-common" }
orbit-types = { path = "../orbit-types" }
orbit-exec = { path = "../orbit-exec" }
orbit-store = { path = "../orbit-store" }
orbit-tools = { path = "../orbit-tools" }
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
chrono-tz.workspace = true
# The crate's own tests build their host doubles on `test_support::NullRuntimeHost`.
orbit-engine = { path = ".", features = ["test-support"] }
jsonschema.workspace = true
tracing-subscriber.workspace = true
