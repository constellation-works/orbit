schema_version = 1

[app.dashboard]
setup = ["scripts/visual-fixture-server.sh", "{fixture}"]
setup_timeout_s = 180
themes = ["dark"]
color_scheme_invariant = true
design_rules = ["docs/design/user-interface/specs/theme.md"]
tokens = ["crates/orbit-web/assets/dashboard/css/base.css"]

[[view]]
id = "tasks-list"
app = "dashboard"
title = "Tasks list"
route = "#tasks"
fixture = "busy-workspace"
ready = "#tasks-main"
responsive = true
states = ["default", "empty", "loading", "error"]
mask = []

[[view]]
id = "task-detail"
app = "dashboard"
title = "Task detail"
route = "#tasks/{task}"
fixture = "busy-workspace"
ready = "#tasks-main"
responsive = true
states = ["default", "loading", "error"]
mask = []

[[view]]
id = "run-detail"
app = "dashboard"
title = "Run detail"
route = "#runs/{run}"
fixture = "busy-workspace"
ready = "#run-detail-panel"
responsive = true
states = ["default", "error"]
mask = []

[[view]]
id = "jobs-live"
app = "dashboard"
title = "Jobs live"
