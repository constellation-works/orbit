[package]
name = "orbit-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.orbit]
stability = "internal"

[lints]
workspace = true

[dependencies]
axum.workspace = true
base64.workspace = true
blake3.workspace = true
chrono.workspace = true
clap.workspace = true
futures-core.workspace = true
orbit-cmd = { path = "../orbit-cmd" }
orbit-automation = { path = "../orbit-automation" }
orbit-common = { path = "../orbit-common" }
orbit-types = { path = "../orbit-types" }
orbit-core = { path = "../orbit-core" }
orbit-registry = { path = "../orbit-registry" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
orbit-common = { path = "../orbit-common", features = ["test-util"] }
serde_yaml.workspace = true
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
tracing-subscriber.workspace = true
