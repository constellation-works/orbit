[package]
name = "orbit-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.orbit]
stability = "internal"

[lints]
workspace = true

[dependencies]
axum.workspace = true
base64.workspace = true
blake3.workspace = true
chrono.workspace = true
clap.workspace = true
flate2.workspace = true
futures-core.workspace = true
hyper.workspace = true
hyper-util.workspace = true
orbit-cmd = { path = "../orbit-cmd" }
orbit-common = { path = "../orbit-common" }
orbit-types = { path = "../orbit-types" }
orbit-core = { path = "../orbit-core" }
orbit-registry = { path = "../orbit-registry" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
# Answers `/api/on/<serving host>/…` by dispatching into the local router.
tower.workspace = true
tracing.workspace = true
url.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
orbit-store = { path = "../orbit-store" }
reqwest.workspace = true
# Substitute pipeline worker for tests that submit runs [ORB-12902].
orbit-core = { path = "../orbit-core", features = ["test-support"] }
serde_yaml.workspace = true
tempfile.workspace = true
# Paused virtual time for the shutdown grace-period tests.
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true
