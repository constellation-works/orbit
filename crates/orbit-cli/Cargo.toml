[package]
name = "orbit-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.orbit]
stability = "internal"

[lints]
workspace = true

[[bin]]
name = "orbit"
path = "src/main.rs"

[dependencies]
chrono.workspace = true
clap.workspace = true
colored = "2"
comfy-table = "7"
csv = "1"
orbit-cmd = { path = "../orbit-cmd" }
orbit-common = { path = "../orbit-common" }
orbit-config = { path = "../orbit-config" }
orbit-types = { path = "../orbit-types" }
orbit-core = { path = "../orbit-core", features = ["clap"] }
orbit-mcp = { path = "../orbit-mcp" }
orbit-registry = { path = "../orbit-registry" }
orbit-web = { path = "../orbit-web" }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
toml.workspace = true
toml_edit.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# Real sandbox broker integration against the built CLI and MCP transport.
orbit-engine = { path = "../orbit-engine" }
orbit-exec = { path = "../orbit-exec" }
orbit-tools = { path = "../orbit-tools" }
# Substitute pipeline worker for tests that submit runs [ORB-12902].
orbit-core = { path = "../orbit-core", features = ["test-support"] }
assert_cmd.workspace = true
predicates.workspace = true
regex.workspace = true
# Settings › Hosts HTTP API against a served dashboard [ORB-14451].
reqwest.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
flate2.workspace = true
sha2.workspace = true
tar.workspace = true
tempfile.workspace = true
toml.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
