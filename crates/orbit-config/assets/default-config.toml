[execution.env]
# Ordinary workspace settings inherit from the global config per key. The
# environment allowlist and the Codex sandbox/approval keys below are the
# security exceptions: when a workspace config exists, omitted values use
# built-in defaults instead of inheriting the global file.
# Agent subprocesses start from a cleared environment and receive only: a
# built-in baseline (HOME, LANG, LC_ALL, LOGNAME, PATH, SHELL, TERM, TMPDIR, TZ,
# USER), the `pass` names below, the variables the selected provider declares it
# requires, and Orbit's own ORBIT_* execution envelope. The orbit process's full
# environment is never inherited (not configurable, by design).
# This is an allowlist, not a secret filter: a variable that is not named here
# does not reach an agent whatever it is called, so a benignly named credential
# such as DATABASE_URL stays out unless you add it.
# User-specific vars (GITHUB_TOKEN, ANTHROPIC_API_KEY, DATABASE_URL, etc.) are opt-in — add them as needed.
pass = [
    "HOME",
    "PATH",
    "CODEX_HOME",
    "TMPDIR",
    "USER",
    "__CF_USER_TEXT_ENCODING",  # macOS: required by CoreFoundation
]

[execution.codex]
sandbox = "danger-full-access"
# Optional: enable escalation requests for workflows that legitimately need approval.
# approval_policy = "on-request"

[scoring]
enabled = true

[workflow]
# Config fallback for ship/auto/pilot when no registered workspace
# base_branch is bound. Override per-invocation with `--base <branch>`.
base_branch = "main"
# `orbit init` writes `default_crew`, `system_crew`, and the four
# `*_complexity_crews` pools at the top of this table when it detects a
# supported agent CLI, each naming a real crew from the crew tables it seeds.
# Without those keys Orbit uses the built-in crew registry: `opus` for tasks
# and its built-in `system` crew for system work.

[runtime]
# Rotation + retention for the global JSONL log (~/.orbit/state/logs/orbit.jsonl).
# Applied opportunistically at process start. All optional; the conservative
# defaults below are used when a key is omitted. Invalid values
# (0, or log_max_file_mb > log_max_total_mb) are rejected at config load.
# log_retention_days = 7    # delete archives older than N days (>= 1)
# log_max_total_mb   = 500  # total MiB budget across archives; oldest pruned first (>= 1)
# log_max_file_mb    = 100  # roll the active log once it exceeds N MiB (>= 1, <= log_max_total_mb)

# [operation]
# Automatic review policy. `before-pr` holds PR creation for a fresh reviewer
# from `review_crew` on the PR route; `after-landing` schedules review of
# landed deliveries. The lineage budget keys (review_reviewer_starts,
# review_repair_cycles, review_minutes) bound one delivery candidate.
# review_policy = "none"       # or "before-pr", "after-landing"
# review_crew = "sol"          # reviewer crew for before-pr
