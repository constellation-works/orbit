[execution.env]
# Ordinary workspace settings inherit from the global config per key. The
# environment allowlist and the Codex sandbox/approval keys below are the
# security exceptions: when a workspace config exists, omitted values use
# built-in defaults instead of inheriting the global file.
# Agent subprocesses start from a cleared environment and receive only: a
# built-in baseline (HOME, LANG, LC_ALL, LOGNAME, PATH, SHELL, TERM, TMPDIR, TZ,
# USER), the `pass` names below, the variables the selected provider declares it
# requires, and Orbit's own ORBIT_* execution envelope. The orbit process's full
# environment is never inherited (not configurable, by design).
# This is an allowlist, not a secret filter: a variable that is not named here
# does not reach an agent whatever it is called, so a benignly named credential
# such as DATABASE_URL stays out unless you add it.
# User-specific vars (GITHUB_TOKEN, ANTHROPIC_API_KEY, DATABASE_URL, etc.) are opt-in — add them as needed.
pass = [
    "HOME",
    "PATH",
    "CODEX_HOME",
    "TMPDIR",
    "USER",
    "__CF_USER_TEXT_ENCODING",  # macOS: required by CoreFoundation
]

[execution.codex]
sandbox = "danger-full-access"
# Optional: enable escalation requests for workflows that legitimately need approval.
# approval_policy = "on-request"

[scoring]
enabled = true

[workflow]
# Config fallback for ship/auto/pilot when no registered workspace
# base_branch is bound. Override per-invocation with `--base <branch>`.
base_branch = "main"
# `orbit init` writes `default_crew`, `system_crew`, and the four
# `*_complexity_crews` pools at the top of this table when it detects a
# supported agent CLI, each naming a real crew from the crew tables it seeds.
# Without those keys Orbit uses the built-in crew registry: `opus` for tasks
# and its built-in `system` crew for system work.
#
# Final recovery takes one last look at a task whose run failed after step
# recovery, using one crew drawn per run from this weighted pool (`name` or
# `name:weight`, all bare or all weighted). Unset, the pool below applies and
# keeps only the crews your registry defines; `[]` turns final recovery off.
# final_recovery_crews = ["sol:100", "opus:20"]

# [workflow.task_pilot_freshness]
# Which changes make an accepted task-pilot assessment stale, so the task is
# piloted again. The built-in defaults below apply when a key is omitted; a
# routine's `trigger.state.freshness` overrides them.
# `material_fields` names at least one of: title, description, criteria, plan,
# selectors, tags, crew, tools, type, complexity, relations, dependencies,
# instructions. `source_sensitivity` is one of: ignore (a branch-head move
# invalidates nothing), context_files (only when the head changed a path the
# task's selectors name), any (every head move).
# material_fields = ["title", "description", "criteria", "plan", "selectors"]
# source_sensitivity = "ignore"

[workflow.resource_throttle]
# Host pressure verdict: high readings sustained for 10 seconds, held until
# below resume. Unknown/stale readings fail open and are shown distinctly.
enabled = true
cpu_high_percent = 90
cpu_resume_percent = 85
# While only CPU holds admissions, up to this many `no-diff-expected`
# auto-task leaves (reviews, curation) still start; memory and disk pressure
# hold them too. 0 holds them with everything else.
cpu_light_leaves = 2
memory_high_percent = 90
memory_resume_percent = 85
disk_high_percent = 90
disk_resume_percent = 85

[runtime]
# Rotation + retention for the global JSONL log (~/.orbit/state/logs/orbit.jsonl).
# Applied opportunistically at process start. All optional; the conservative
# defaults below are used when a key is omitted. Invalid values
# (0, or log_max_file_mb > log_max_total_mb) are rejected at config load.
# log_retention_days = 7    # delete archives older than N days (>= 1)
# log_max_total_mb   = 500  # total MiB budget across archives; oldest pruned first (>= 1)
# log_max_file_mb    = 100  # roll the active log once it exceeds N MiB (>= 1, <= log_max_total_mb)

# [review]
# Before-PR review: hold PR creation for a fresh reviewer from
# operation.review_crew on the PR route. The reviewer fixes what it finds in
# its own commit on the candidate; findings it cannot fix block the task. A
# drain or ship captures before_pr at submission, so a run in flight keeps it.
# Each candidate gets one review, bounded by `minutes` (its fix commit and
# final validation included).
# before_pr = false
#
# Before-landing review: open the PR first, then have the same kind of
# reviewer review the open PR while hosted CI runs on it. A reviewer fix is
# validated and pushed to the PR; the PR lands only at the head the review
# settled, and any other outcome leaves it open with the task in review.
# Loading fails while before_pr and before_landing are both on: there is one
# review layer before landing.
# before_landing = false
# minutes = 30
#
# After-landing review has no key here: it is the `delivery-code-review`
# auto-task, switched with `orbit auto-task toggle delivery-code-review on`.
# It freezes landed deliveries into batches and mints one review task per
# batch on the machine that owns the workspace; `orbit doctor` fails while it
# is enabled but cannot run.

# [operation]
# review_crew = "sol"          # crew for before-PR, before-landing and after-landing review
# review_crew = ["sol", "grok"] # or a pool (`name` or `name:weight`, like the complexity
#                               # pools): each review draws one crew by weight, preferring one
#                               # that did not implement the reviewed work and skipping
#                               # disabled or provider-limited crews; [] unsets it
