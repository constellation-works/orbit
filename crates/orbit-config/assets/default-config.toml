# Orbit configuration. Omitted keys use their built-in defaults:
# `orbit config keys` lists every key with its default and description, and
# https://orbit-cli.com/reference/config/ explains them.

[execution.env]
# Agent subprocesses start from a cleared environment and receive only these
# names, a fixed baseline and what their provider requires. Add credentials
# such as GITHUB_TOKEN here only when an agent needs them.
pass = [
    "HOME",
    "PATH",
    "CODEX_HOME",
    "TMPDIR",
    "USER",
    "__CF_USER_TEXT_ENCODING",  # macOS: required by CoreFoundation
]

[execution.codex]
sandbox = "danger-full-access"

[workflow]

# Footprint lock modes. Any overlap between two tasks' context selectors keeps
# the second task waiting. A path in `shared` mode lets overlapping tasks run
# together, and a conflict between them is resolved when the second one lands.
# Each `pattern` is a regex searched for in the workspace-relative path, so
# anchor it with ^ and $. The first matching entry wins, and an unmatched path
# is `exclusive`. Example: share every append-only `mod.rs`.
#
# [[workflow.lock_modes]]
# pattern = '(^|/)mod\.rs$'
# mode = "shared"

# Review skips apply only to the minted auto-task carrying each provenance
# tag, and only for documentation/CI paths. Keep finding tags such as
# code-review, delivery-code-review, security-review and qa-sweep unmapped so
# code fixes filed by those reviews still receive agent review.
[workflow.review_skip_tags."auto-task:auto-task-yield-review"]
paths = ["docs/**", "**/*.md", "!crates/**", "!plugin/**", ".github/**", "scripts/ci-*", "scripts/test-*-workflow*.py"]

