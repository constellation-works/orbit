[package]
name = "orbit-search"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.orbit]
stability = "internal"

[lints]
workspace = true

[features]
companion = ["dep:clap", "dep:fastembed"]

[[bin]]
name = "orbit-search-companion"
path = "src/bin/orbit-search-companion.rs"
required-features = ["companion"]

[dependencies]
blake3.workspace = true
chrono.workspace = true
clap = { workspace = true, optional = true }
fastembed = { workspace = true, optional = true }
libc.workspace = true
orbit-common = { path = "../orbit-common", features = ["sqlite"] }
orbit-types = { path = "../orbit-types" }
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tracing.workspace = true

[dev-dependencies]
orbit-common = { path = "../orbit-common", features = ["sqlite", "test-util"] }
tempfile = "3"
