[package]
name = "orbit-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.orbit]
stability = "internal"

[lints]
workspace = true

[dependencies]
base64.workspace = true
getrandom.workspace = true
# The callers-file trust check compares the file owner to the effective uid.
libc.workspace = true
orbit-common = { path = "../orbit-common" }
orbit-types = { path = "../orbit-types" }
orbit-registry = { path = "../orbit-registry" }
orbit-tools = { path = "../orbit-tools" }
rmcp = { version = "1.5", default-features = false, features = ["server", "transport-io"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["io-std", "net", "rt", "sync", "time"] }
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
chrono.workspace = true
rmcp = { version = "1.5", default-features = false, features = ["client", "transport-io"] }
tempfile.workspace = true
# `io-util` supplies the in-memory duplex transport used by the wire test.
tokio = { workspace = true, features = ["io-util"] }
tracing-subscriber.workspace = true
