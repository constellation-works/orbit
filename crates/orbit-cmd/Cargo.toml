[package]
name = "orbit-cmd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.orbit]
stability = "internal"

[features]
# The CLI process-test harness enables this only through orbit-cli's
# dev-dependency. Release builds omit dev-dependencies and debug-only seams.
test-release-api-base = ["orbit-common/test-support"]
# Per-thread seams for failure paths that need no host load, and the
# registered opens downstream tests seed through (`test_support`); enabled
# only from dev-dependencies.
test-support = ["orbit-common/test-support"]

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
chrono.workspace = true
flate2.workspace = true
orbit-common = { path = "../orbit-common" }
orbit-config = { path = "../orbit-config" }
orbit-types = { path = "../orbit-types" }
orbit-core = { path = "../orbit-core" }
orbit-mcp = { path = "../orbit-mcp" }
orbit-tools = { path = "../orbit-tools" }
orbit-registry = { path = "../orbit-registry" }
# Implements the runtime kernel's workspace-catalog and owner-route traits.
orbit-runtime = { path = "../orbit-runtime" }
orbit-store = { path = "../orbit-store" }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tar.workspace = true
tempfile.workspace = true
toml.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
orbit-common = { path = "../orbit-common", features = ["test-support"] }
